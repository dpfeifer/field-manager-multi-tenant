function DangerZone({ session, orgSlug, orgName }) {
  const [open, setOpen] = useState(false);
  const [confirmSlug, setConfirmSlug] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  async function destroy() {
    setBusy(true); setError(null);
    try {
      await apiRequest('/api/billing/cancel-account', {
        method: 'POST', slug: session.slug, token: session.token,
        body: { confirm_slug: confirmSlug },
      });
      clearSession();
      window.location.href = '/?account_deleted=1';
    } catch (err) {
      setError(err.message);
      setBusy(false);
    }
  }

  return (
    <div className="danger-zone">
      <div className="section-heading" style={{ marginTop: 0, color: 'var(--danger)' }}>Danger zone</div>
      {!open ? (
        <div className="danger-zone-summary">
          <div>
            <strong>Close this account</strong>
            <p>Cancels the Stripe subscription and permanently deletes <strong>{orgName}</strong> and all its data. This cannot be undone.</p>
          </div>
          <button className="danger" onClick={() => { setOpen(true); setError(null); setConfirmSlug(''); }}>
            Delete account…
          </button>
        </div>
      ) : (
        <div className="danger-zone-confirm">
          <p>
            Type <code>{orgSlug}</code> below to confirm permanent deletion. All customers, jobs, invoices, quotes, settings, and teammates will be removed. Your Stripe subscription (if any) will be canceled.
          </p>
          <input
            value={confirmSlug}
            onChange={(e) => setConfirmSlug(e.target.value)}
            placeholder={orgSlug}
            autoFocus
          />
          {error && <div className="error">{error}</div>}
          <div className="form-actions">
            <button className="danger" disabled={busy || confirmSlug !== orgSlug} onClick={destroy}>
              {busy ? 'Deleting...' : 'Permanently delete account'}
            </button>
            <button className="secondary" disabled={busy} onClick={() => { setOpen(false); setConfirmSlug(''); setError(null); }}>
              Cancel
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function badgeForStatus(s) {
  if (s === 'free' || s === 'active') return 'paid';
  if (s === 'trialing') return 'sent';
  if (s === 'past_due' || s === 'canceled') return 'declined';
  return 'draft';
}

function statusLabel(s, trialEnds) {
  if (s === 'free') return 'Free';
  if (s === 'trialing') {
    const d = daysUntil(trialEnds);
    return d !== null && d <= 0 ? 'Trial expired' : 'Free trial';
  }
  if (s === 'active') return 'Active';
  if (s === 'past_due') return 'Past due';
  if (s === 'canceled') return 'Canceled';
  return s;
}

// Matches a CSS media query in JS, so a component can render a different
// control at a breakpoint rather than shipping both and hiding one — two
// tablists in the DOM would be duplicate landmarks for a screen reader.
function useMediaQuery(query) {
  const [matches, setMatches] = useState(
    () => typeof window.matchMedia === 'function' && window.matchMedia(query).matches
  );
  useEffect(() => {
    if (typeof window.matchMedia !== 'function') return undefined;
    const mq = window.matchMedia(query);
    const onChange = (e) => setMatches(e.matches);
    setMatches(mq.matches);
    mq.addEventListener('change', onChange);
    return () => mq.removeEventListener('change', onChange);
  }, [query]);
  return matches;
}

// Collapses a flat section list into consecutive runs that share a `group`,
// so the narrow layout can put each run in its own card. Sections without a
// group come back as a single unnamed run.
function groupSections(sections) {
  const out = [];
  sections.forEach((s) => {
    const last = out[out.length - 1];
    if (last && last.name === (s.group || null)) last.items.push(s);
    else out.push({ name: s.group || null, items: [s] });
  });
  return out;
}

// A rail of destinations beside their content. `sections` is
// [{ key, label, count }]; `aside` is optional content pinned above the rail
// (customer detail puts the phone and address there so they stay on screen).
//
// Below the breakpoint a 232px rail can't sit beside anything, so the pattern
// changes shape rather than shrinking: the sections become a full-width list,
// and choosing one opens it with a link back out. `backLabel` names what you
// return to, so the way back reads as a place and not just "Back".
// The shell hands this down so an area can put its own sections in the rail
// instead of drawing a second one beside it.
const AreaRailContext = React.createContext(null);

function TwoPane({ sections, active, onSelect, ariaLabel, backLabel, deepLinked = false, children }) {
  const wide = useMediaQuery('(min-width: 721px)');
  // Only take the rail over when there is a rail to take: between 721 and
  // 1000 the shell is already down to a drawer, so this pane keeps its own
  // column rather than leaving the area with no navigation at all.
  const canTakeOver = useMediaQuery('(min-width: 1001px)');
  const setAreaRail = React.useContext(AreaRailContext);
  const takeover = canTakeOver && !!setAreaRail;
  // A URL that already names a section should open that section, not the menu
  // of sections. The getting-started checklist links straight to
  // /settings/payments, and on a phone that landed on the index instead.
  const [drilled, setDrilled] = useState(deepLinked);
  useEffect(() => { if (deepLinked) setDrilled(true); }, [deepLinked]);

  // Keyed on what actually changes. sections and onSelect get a new identity
  // every render, so depending on them directly would re-register in a loop.
  const sectionKeys = sections.map((x) => x.key).join('|');
  useEffect(() => {
    if (!setAreaRail) return undefined;
    if (!takeover) { setAreaRail(null); return undefined; }
    setAreaRail({ sections, active, onSelect, ariaLabel });
    return () => setAreaRail(null);
  }, [takeover, sectionKeys, active, ariaLabel]);

  // The rail is showing these sections, so drawing them here too would be the
  // two columns this whole arrangement exists to avoid.
  if (takeover) return <>{children}</>;

  if (wide) {
    return (
      <div className="two-pane">
        <div className="two-pane-rail">
          <div role="tablist" aria-label={ariaLabel} aria-orientation="vertical">
            {sections.map((s, i) => (
              <React.Fragment key={s.key}>
                {/* A heading whenever the group changes, so related
                    destinations read as belonging together — the thing a
                    single row of chips could never express. */}
                {s.group && s.group !== (sections[i - 1] || {}).group && (
                  <p className="two-pane-group">{s.group}</p>
                )}
                <button
                  type="button"
                  role="tab"
                  aria-selected={active === s.key}
                  className={`two-pane-btn${active === s.key ? ' active' : ''}`}
                  onClick={() => onSelect(s.key)}
                >
                  <span className="two-pane-label">
                    {s.icon && <Icon name={s.icon} />}
                    <span>{s.label}</span>
                  </span>
                  {s.count != null && s.count !== '' && (
                    <span className="two-pane-count">{s.count}</span>
                  )}
                </button>
              </React.Fragment>
            ))}
          </div>
        </div>
        <div className="two-pane-body">{children}</div>
      </div>
    );
  }

  if (!drilled) {
    return (
      <div className="two-pane-narrow">
        <nav aria-label={ariaLabel}>
          {groupSections(sections).map((g, gi) => (
            <React.Fragment key={g.name || gi}>
              {g.name && <p className="drill-group">{g.name}</p>}
              <div className="drill-list">
                {g.items.map((s) => (
                  <button
                    key={s.key}
                    type="button"
                    className="drill-row"
                    onClick={() => { onSelect(s.key); setDrilled(true); }}
                  >
                    <span className="drill-name">
                      {s.icon && <Icon name={s.icon} />}
                      <span>{s.label}</span>
                    </span>
                    {s.count != null && s.count !== '' && (
                      <span className="drill-count">{s.count}</span>
                    )}
                    <span className="drill-chev" aria-hidden="true">›</span>
                  </button>
                ))}
              </div>
            </React.Fragment>
          ))}
        </nav>
      </div>
    );
  }

  const current = sections.find((s) => s.key === active);
  return (
    <div className="two-pane-narrow">
      {/* Title left, way out right — the same shape as the page header above
          it, so the two rows read as one pattern rather than two. */}
      <div className="drill-head">
        {current && <h3 className="drill-title">{current.label}</h3>}
        <button
          type="button"
          className="secondary drill-back"
          onClick={() => setDrilled(false)}
        >{backLabel || 'Back'}</button>
      </div>
      <div className="two-pane-body">{children}</div>
    </div>
  );
}

// Reports whether a horizontal scroller has content past either edge, so the
// mobile nav can fade an edge only when there is somewhere to scroll to — a
// permanent fade would imply tabs that aren't there. Remeasures when
// `signature` changes, because the tab list is built from data (role, plan,
// enabled modules) that arrives after the first render.

function AppShell({ session: realSession, onLogout, onSessionUpdate }) {
  // Preview the app as a less-privileged role. Everything below reads
  // `session`, so swapping it here re-renders the whole shell — nav, gating
  // and views — without touching a single call site.
  //
  // This is presentation only. The token is the real one, so the server still
  // decides what is actually permitted; and because only an admin can start a
  // preview, and the roles it offers are strictly narrower, it can only ever
  // hide things, never reveal them.
  const [viewAsRole, setViewAsRole] = useState(null);
  const session = viewAsRole
    ? { ...realSession, user: { ...realSession.user, role: viewAsRole } }
    : realSession;

  const path = useLocation();
  const view = APP_ROUTES[path] || (path.startsWith('/system/') ? 'system' : 'dashboard');
  const [billing, setBilling] = useState(null);
  const [me, setMe] = useState(null);
  const [resentVerify, setResentVerify] = useState(false);
  const isAdmin = session.user.role === 'admin';

  const reloadMe = useCallback(async () => {
    try {
      const m = await apiRequest('/api/auth/me', { slug: session.slug, token: session.token });
      setMe(m);
    } catch (err) { console.error('me reload failed', err); }
  }, [session.slug, session.token]);

  const [pendingRequestsCount, setPendingRequestsCount] = useState(0);
  const [draftQuotesCount, setDraftQuotesCount] = useState(0);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const [b, m, c, q] = await Promise.all([
          apiRequest('/api/billing/status', { slug: session.slug, token: session.token }),
          apiRequest('/api/auth/me', { slug: session.slug, token: session.token }),
          apiRequest('/api/booking-requests/count', { slug: session.slug, token: session.token })
            .catch(() => ({ pending: 0 })),
          apiRequest('/api/quotes/count', { slug: session.slug, token: session.token })
            .catch(() => ({ draft: 0 })),
        ]);
        if (!cancelled) {
          setBilling(b); setMe(m);
          setPendingRequestsCount(c.pending || 0);
          setDraftQuotesCount(q.draft || 0);
        }
      } catch (err) {
        console.error('appshell load failed', err);
      }
    })();
    return () => { cancelled = true; };
  }, [session.slug, session.token, path]);

  const features = (me && me.features) || { invoices: true, quotes: true, reports: true, team: true, requests: true };
  if (me && me.features && me.features.team === undefined) features.team = true;
  if (me && me.features && me.features.requests === undefined) features.requests = true;
  const terms = getTerms(me);
  const plan = (me && me.plan) || 'pro';
  const isFree = plan === 'free';
  const limits = (me && me.limits) || { customers: 5, jobs: 20 };
  const counts = {
    customers: (me && me.customer_count) || 0,
    jobs: (me && me.job_count) || 0,
  };
  const customersAtCap = isFree && counts.customers >= limits.customers;
  const jobsAtCap = isFree && counts.jobs >= limits.jobs;

  // Two flags, because a panel cannot animate its own exit once React has
  // unmounted it: `mounted` keeps it in the tree, `closing` picks the exit.
  // The entry is a CSS animation rather than a transition into a flipped
  // class — a class flip needs a frame to land between the closed and open
  // states, and requestAnimationFrame does not fire in a hidden tab, so the
  // panel would mount closed and never open. An animation just runs.
  const [drawerMounted, setDrawerMounted] = useState(false);
  const [drawerClosing, setDrawerClosing] = useState(false);
  // Reopening a panel that is still on screen leaving. A keyframe entry always
  // restarts from off-canvas, so it would snap backwards before sliding in;
  // dropping the animation lets it stay where it is instead.
  const [drawerResumed, setDrawerResumed] = useState(false);
  const drawerOpen = drawerMounted && !drawerClosing;

  function openDrawer() {
    setDrawerResumed(drawerMounted);
    setDrawerClosing(false);
    setDrawerMounted(true);
  }
  function closeDrawer() { if (drawerMounted) setDrawerClosing(true); }

  useEffect(() => {
    if (!drawerClosing) return undefined;
    const t = setTimeout(() => {
      setDrawerMounted(false);
      setDrawerClosing(false);
      setDrawerResumed(false);
    }, 360);
    return () => clearTimeout(t);
  }, [drawerClosing]);
  // Set by an area (Settings, System) that wants the rail for its own sections.
  const [areaRail, setAreaRail] = useState(null);
  const canBill = ['admin', 'lead'].includes(session.user.role);

  // The glass's highlight follows the phone, where the browser hands out
  // orientation without asking. iOS gates it behind a prompt that would have
  // to interrupt a tap on the bar, so there the highlight stays put.
  useEffect(() => {
    if (!window.DeviceOrientationEvent) return undefined;
    if (typeof DeviceOrientationEvent.requestPermission === 'function') return undefined;
    const onTilt = (ev) => {
      if (ev.gamma == null) return;
      const st = document.documentElement.style;
      st.setProperty('--glass-hx', Math.max(0, Math.min(100, 50 + ev.gamma * 1.6)) + '%');
      st.setProperty('--glass-hy', Math.max(-40, Math.min(100, (ev.beta - 45) * 1.2)) + '%');
    };
    window.addEventListener('deviceorientation', onTilt);
    return () => window.removeEventListener('deviceorientation', onTilt);
  }, []);

  // Escape closes the drawer, and the page behind it stops scrolling while it
  // is open — otherwise a flick aimed at the menu scrolls the list underneath.
  useEffect(() => {
    if (!drawerOpen) return undefined;
    const onKey = (e) => { if (e.key === 'Escape') closeDrawer(); };
    document.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = prev;
    };
  }, [drawerOpen]);

  // The destinations, as data. The rail and the drawer render the same list,
  // so the two can't drift, and gating lives in one place instead of being
  // spread across nine pieces of markup.
  const railGroups = [
    {
      name: 'Work',
      items: [
        { key: 'dashboard', label: 'Dashboard', icon: 'dashboard', to: '/dashboard' },
        {
          key: 'jobs', label: terms.jobs, icon: 'jobs', to: '/jobs',
          quota: isFree && me ? `${counts.jobs}/${limits.jobs}` : null, quotaOver: jobsAtCap,
        },
        {
          key: 'customers', label: terms.customers, icon: 'customers', to: '/customers',
          quota: isFree && me ? `${counts.customers}/${limits.customers}` : null, quotaOver: customersAtCap,
        },
        features.requests && {
          key: 'requests', label: 'Requests', icon: 'requests', to: '/requests',
          badge: pendingRequestsCount,
        },
      ],
    },
    {
      name: 'Money',
      items: [
        canBill && (isFree || features.invoices) && {
          key: 'invoices', label: 'Invoices', icon: 'invoices', to: '/invoices', locked: isFree,
        },
        canBill && features.quotes && {
          key: 'quotes', label: 'Quotes', icon: 'quotes', to: '/quotes', badge: draftQuotesCount,
        },
        isAdmin && (isFree || features.reports) && {
          key: 'reports', label: 'Reports', icon: 'reports', to: '/reports', locked: isFree,
        },
        // Off by default (Settings → Sections) — an owner who never uses it never sees it.
        isAdmin && features.referrals && {
          key: 'referrals', label: 'Referrals', icon: 'gift', to: '/referrals',
        },
      ],
    },
    {
      name: 'Business',
      items: [
        isAdmin && (isFree || features.team) && {
          key: 'team', label: 'Team', icon: 'team', to: '/team', locked: isFree,
        },
        isAdmin && { key: 'settings', label: 'Settings', icon: 'settings', to: '/settings' },
        // No plan gate: this is where a free account goes to stop being one.
        isAdmin && { key: 'billing', label: 'Billing', icon: 'billing', to: '/billing' },
      ],
    },
  ]
    .map((g) => ({ ...g, items: g.items.filter(Boolean) }))
    .filter((g) => g.items.length > 0);

  // The phone gets a tab bar instead of a menu button: the bottom of the
  // screen is where a thumb already is, and the top-left corner is the one
  // place on a phone it cannot reach. Built from the same railGroups, so role
  // and plan gating is not written down twice.
  const flatNav = railGroups.flatMap((g) => g.items);
  const TAB_PREFERENCE = ['dashboard', 'jobs', 'customers', 'invoices', 'requests', 'quotes', 'reports'];
  // An employee has four destinations in total, so a "More" holding the same
  // four is a button that goes nowhere. Five fit; past that it is 4 + More.
  const tabsFitAll = flatNav.length <= 5;
  const tabItems = tabsFitAll
    ? flatNav
    : TAB_PREFERENCE.map((k) => flatNav.find((i) => i.key === k)).filter(Boolean).slice(0, 4);
  const tabKeys = new Set(tabItems.map((i) => i.key));
  // Whatever did not fit still has to be able to shout — a pending request
  // buried under "More" with its badge left behind is worse than no badge.
  const moreBadge = flatNav
    .filter((i) => !tabKeys.has(i.key))
    .reduce((n, i) => n + (i.badge || 0), 0);

  const needsOnboarding = me && !me.onboarding_completed_at && isAdmin;

  if (needsOnboarding) {
    return <OnboardingPage session={session} onDone={reloadMe} />;
  }

  async function resendVerification() {
    try {
      await apiRequest('/api/auth/resend-verification', {
        method: 'POST', slug: session.slug, token: session.token,
      });
      setResentVerify(true);
    } catch (err) {
      alert(err.message);
    }
  }

  const showVerifyBanner = me && !me.email_verified_at;

  const trialDaysLeft = billing && billing.trial_ends_at ? daysUntil(billing.trial_ends_at) : null;

  return (
    <SmsTemplatesContext.Provider value={(me && me.sms_templates) || []}>
    <TermsContext.Provider value={terms}>
    <AreaRailContext.Provider value={setAreaRail}>
    <div className="app-frame">
      <div className="topbar">
        <button
          type="button"
          className="railtoggle"
          onClick={openDrawer}
          aria-label="Open menu"
          aria-expanded={drawerOpen}
        >
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
        <Brand
          orgName={(me && me.display_name) || session.organization.name}
          logo={me && me.logo_url}
          onClick={() => window.location.reload()}
        />
        <div className="right">
          <ScreenHelp view={view} userId={realSession.user.id} />
          {me && (
            <span className={`plan-pill plan-${plan}`} onClick={isFree && isAdmin ? () => startUpgrade(session) : undefined}>
              {isFree ? 'Free' : 'Pro'}{isFree && isAdmin && ' · Upgrade'}
            </span>
          )}
          {/* The menu is driven by who you really are, not who you are
              previewing — otherwise previewing as an employee would hide the
              control you need to stop previewing. */}
          <UserMenu
            session={realSession}
            onLogout={onLogout}
            onSwitch={(s) => { saveSession(s); window.location.reload(); }}
            onViewAs={realSession.user.role === 'admin' ? setViewAsRole : undefined}
          />
        </div>
      </div>
      {showVerifyBanner && (
        <div style={{
          background: '#fff5e6', color: '#8c5a00', padding: '10px 24px',
          textAlign: 'center', fontSize: 13, fontWeight: 500,
          borderBottom: '1px solid var(--border)',
        }}>
          {resentVerify
            ? <>Verification email sent. Check your inbox.</>
            : <>Please verify your email address. <button className="link-button" style={{ color: 'inherit', textDecoration: 'underline' }} onClick={resendVerification}>Resend verification email</button></>
          }
        </div>
      )}
      {isAdmin && billing && <BillingBanner status={billing.status} trialDaysLeft={trialDaysLeft} isAdmin={isAdmin} orgId={me && me.organization_id} session={session} />}
      {me && me.is_demo && <DemoBanner />}
      {viewAsRole && (
        <div className="viewas-banner">
          <span className="viewas-dot" aria-hidden="true" />
          <span>
            Viewing as <strong>{ROLE_OPTIONS.find((r) => r.value === viewAsRole).label}</strong>
            {' '}&mdash; this is what your team sees. Nothing you do here is restricted.
          </span>
          <button type="button" onClick={() => setViewAsRole(null)}>Back to my view</button>
        </div>
      )}
      <TeamNotesBanner session={session} />
      <div className="shell">
          <nav className="rail" aria-label={areaRail ? areaRail.ariaLabel : 'Main'}>
            <div className="rail-inner">
            {areaRail ? (
              <>
                {/* The rail looking different is the signal that you left the
                    app for an area, so say which one and make the way out a
                    button rather than a line of small print. */}
                <div className="rail-area">
                  <button type="button" className="rail-back" onClick={() => navigate('/dashboard')}>
                    <Icon name="arrow" />
                    <span>Back to app</span>
                  </button>
                </div>
                {areaRail.sections.map((sec, i) => (
                  <React.Fragment key={sec.key}>
                    {sec.group && sec.group !== (areaRail.sections[i - 1] || {}).group && (
                      <p className="rail-group">{sec.group}</p>
                    )}
                    <button
                      type="button"
                      className={`rail-item${areaRail.active === sec.key ? ' active' : ''}`}
                      aria-current={areaRail.active === sec.key ? 'page' : undefined}
                      onClick={() => areaRail.onSelect(sec.key)}
                    >
                      {sec.icon && <Icon name={sec.icon} />}
                      <span>{sec.label}</span>
                    </button>
                  </React.Fragment>
                ))}
              </>
            ) : railGroups.map((g) => (
              <React.Fragment key={g.name}>
                <p className="rail-group">{g.name}</p>
                {g.items.map((it) => (
                  <button
                    key={it.key}
                    type="button"
                    className={`rail-item${view === it.key ? ' active' : ''}`}
                    aria-current={view === it.key ? 'page' : undefined}
                    onClick={() => navigate(it.to)}
                  >
                    <Icon name={it.icon} />
                    <span>{it.label}</span>
                    <span className="rail-fill"></span>
                    {it.badge > 0 && <span className="rail-badge">{it.badge}</span>}
                    {it.locked && <span className="rail-note">Pro</span>}
                    {it.quota && <span className={`rail-note${it.quotaOver ? ' over' : ''}`}>{it.quota}</span>}
                  </button>
                ))}
              </React.Fragment>
            ))}
            </div>
          </nav>
        <div className={`content${NARROW_VIEWS.has(view) ? ' content-narrow' : ''}`}>
        {view === 'dashboard' && <DashboardView session={session} features={features} me={me} pendingRequestsCount={pendingRequestsCount} draftQuotesCount={draftQuotesCount} />}
        {view === 'jobs' && <JobsView session={session} features={features} smsTemplates={(me && me.sms_templates) || []} defaultAddToDraft={!!(me && me.auto_append_to_draft)} planContext={{ isFree, atCap: jobsAtCap, used: counts.jobs, limit: limits.jobs }} />}
        {view === 'customers' && <CustomersView session={session} features={features} planContext={{ isFree, atCap: customersAtCap, used: counts.customers, limit: limits.customers }} />}
        {view === 'requests' && features.requests && <RequestsView session={session} />}
        {view === 'invoices' && ['admin', 'lead'].includes(session.user.role) && (isFree
          ? <LockedFeature feature="invoices" session={session} />
          : (features.invoices && <InvoicesView session={session} />))}
        {view === 'quotes' && ['admin', 'lead'].includes(session.user.role) && features.quotes && <QuotesView session={session} features={features} />}
        {view === 'reports' && (isFree
          ? <LockedFeature feature="reports" session={session} />
          : (features.reports && session.user.role === 'admin' && <ReportsView session={session} />))}
        {view === 'referrals' && session.user.role === 'admin' && features.referrals && <ReferralsView session={session} />}
        {view === 'team' && (isFree
          ? <LockedFeature feature="team" session={session} />
          : (session.user.role === 'admin' && features.team && <TeamView session={session} />))}
        {view === 'billing' && session.user.role === 'admin' && <BillingView session={session} me={me} />}
        {view === 'settings' && session.user.role === 'admin' && <SettingsView session={session} features={features} onFeaturesChange={reloadMe} />}
        {view === 'system' && session.user.is_system_admin && <SystemView session={session} />}
        {view === 'profile' && <ProfileView session={session} onSessionUpdate={onSessionUpdate} />}
        {view === 'support' && <SupportView session={session} />}
        </div>
      </div>
      {/* Stowed while the drawer is out: the drawer only covers the left of the
          screen, so the bar would otherwise sit there beside it under the
          scrim, still lit. */}
      <nav className={`tabbar${drawerOpen ? ' is-stowed' : ''}`} aria-label="Main" aria-hidden={drawerOpen}>
        {/* The bubble is one element that slides to the tab you are on rather
            than a state on each button — --tab is its cell, --tabs the count.
            A screen that is neither a tab nor under More (an employee on their
            profile, say) has nowhere for it to sit, so it fades out. */}
        <div
          className="tabbar-inner"
          style={{
            '--tabs': tabItems.length + (tabsFitAll ? 0 : 1),
            '--tab': Math.max(0, tabItems.findIndex((it) => it.key === view) >= 0
              ? tabItems.findIndex((it) => it.key === view)
              : (tabsFitAll ? -1 : tabItems.length)),
          }}
        >
          <span
            className={`tab-pill${tabsFitAll && !tabKeys.has(view) ? ' is-off' : ''}`}
            aria-hidden="true"
          />
          {tabItems.map((it) => (
            <button
              key={it.key}
              type="button"
              className={view === it.key ? 'active' : ''}
              aria-current={view === it.key ? 'page' : undefined}
              onClick={() => navigate(it.to)}
            >
              <span className="tab-ic">
                <Icon name={it.icon} />
                {it.badge > 0 && <span className="tab-badge">{it.badge}</span>}
              </span>
              <span className="tab-label">{it.label}</span>
            </button>
          ))}
          {!tabsFitAll && (
          <button
            type="button"
            className={tabKeys.has(view) ? '' : 'active'}
            aria-expanded={drawerOpen}
            onClick={openDrawer}
          >
            <span className="tab-ic">
              <svg className="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
                <path d="M4 7h16M4 12h16M4 17h16" />
              </svg>
              {moreBadge > 0 && <span className="tab-badge">{moreBadge}</span>}
            </span>
            <span className="tab-label">More</span>
          </button>
          )}
        </div>
      </nav>
      {drawerMounted && (
        <>
          <button
            type="button"
            className={`drawer-scrim${drawerClosing ? ' is-closing' : ''}`}
            aria-label="Close menu"
            onClick={closeDrawer}
          />
          <nav
            className={`drawer${drawerClosing ? ' is-closing' : ''}${drawerResumed && !drawerClosing ? ' is-resumed' : ''}`}
            aria-label="Main"
          >
            {/* On the panel's edge rather than floating over the page, so it
                arrives with the drawer and reads as part of it. */}
            <button
              type="button"
              className="drawer-tab"
              onClick={closeDrawer}
              aria-label="Close menu"
            >
              {/* Drawn, not typed: a rotated "+" glyph sits where the font
                  puts a plus — above the centre of its box — so it never
                  centred in the circle. Two strokes through the middle do. */}
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round">
                <path d="M6 6l12 12M18 6L6 18" />
              </svg>
            </button>
            <div className="drawer-scroll">
            <div className="drawer-head">
              <span className="drawer-org">{(me && me.display_name) || session.organization.name}</span>
            </div>
            {railGroups.map((g) => (
              <React.Fragment key={g.name}>
                <p className="rail-group">{g.name}</p>
                {g.items.map((it) => (
                  <button
                    key={it.key}
                    type="button"
                    className={`rail-item${view === it.key ? ' active' : ''}`}
                    aria-current={view === it.key ? 'page' : undefined}
                    onClick={() => { closeDrawer(); navigate(it.to); }}
                  >
                    <Icon name={it.icon} />
                    <span>{it.label}</span>
                    <span className="rail-fill"></span>
                    {it.badge > 0 && <span className="rail-badge">{it.badge}</span>}
                    {it.locked && <span className="rail-note">Pro</span>}
                    {it.quota && <span className={`rail-note${it.quotaOver ? ' over' : ''}`}>{it.quota}</span>}
                  </button>
                ))}
              </React.Fragment>
            ))}
            </div>
          </nav>
        </>
      )}
    </div>
    </AreaRailContext.Provider>
    </TermsContext.Provider>
    </SmsTemplatesContext.Provider>
  );
}

function timeOfDayGreeting() {
  const h = new Date().getHours();
  if (h < 12) return 'Good morning';
  if (h < 18) return 'Good afternoon';
  return 'Good evening';
}

function DashboardWidgetGreeting({ ctx }) {
  const { session, terms, teamNotes, refreshTeamNotes } = ctx;
  const [composing, setComposing] = useState(false);
  const firstName = (session.user.name || session.user.email || '').split(' ')[0].split('@')[0];
  const userId = session.user.id;
  const isAdmin = session.user.role === 'admin';

  const allNotes = teamNotes || [];
  const unreadCount = allNotes.filter((n) => !n.is_read && n.author_user_id !== userId).length;
  const recent = allNotes.slice(0, 4);

  // On a phone the subtitle has to fit one line beside nothing: a short
  // date, and "today" rather than "on the schedule".
  const compact = useMediaQuery('(max-width: 720px)');
  const dateStr = ctx.today.toLocaleDateString(undefined, compact
    ? { weekday: 'short', month: 'short', day: 'numeric' }
    : { weekday: 'long', month: 'long', day: 'numeric' });
  const jobsCount = ctx.todayOccurrences.length;
  const jobsLabel = jobsCount === 1 ? terms.jobLower : terms.jobsLower;

  async function markRead(id) {
    try {
      await apiRequest(`/api/team-messages/${id}/read`, {
        method: 'POST', slug: session.slug, token: session.token,
      });
      refreshTeamNotes && refreshTeamNotes();
    } catch (e) { /* swallow */ }
  }
  async function deleteNote(id) {
    if (!confirm('Delete this team note? Anyone who hasn\'t opened it will lose it.')) return;
    try {
      await apiRequest(`/api/team-messages/${id}`, {
        method: 'DELETE', slug: session.slug, token: session.token,
      });
      refreshTeamNotes && refreshTeamNotes();
    } catch (e) { /* swallow */ }
  }

  return (
    <div className="dash-greeting">
      {/* The same shape as every list's toolbar — title left, the actions
          right — so on a phone the greeting gets the glass "+" and "⋯" the
          lists have, instead of a wide button squeezing the words. */}
      <div className="dash-greeting-head toolbar">
        <div className="dash-greeting-text tb-title">
          <h2>{timeOfDayGreeting()}{firstName ? `, ${firstName}` : ''}.</h2>
          <p>
            {dateStr} · {jobsCount} {jobsLabel} {compact ? 'today' : 'on the schedule'} · {allNotes.length} {allNotes.length === 1 ? 'note' : 'notes'}
            {unreadCount > 0 && <> (<strong style={{ color: 'var(--accent)' }}>{unreadCount} new</strong>)</>}
          </p>
        </div>
        <span className="tb-actions">
          <button type="button" className="primary dash-greeting-action" onClick={() => setComposing(true)}>
            +<span className="btn-label"> Send a note</span>
          </button>
          {isAdmin && ctx.onEditLayout && (
            <RowMenu label="Dashboard options" items={[{ label: 'Edit layout', onClick: ctx.onEditLayout }]} />
          )}
        </span>
      </div>

      {recent.length > 0 && (
        <div className="team-notes-list" style={{ marginTop: 16 }}>
          {recent.map((n) => {
            const isMine = n.author_user_id === userId;
            const isUnread = !n.is_read && !isMine;
            return (
              <div
                key={n.id}
                className={`team-note-card${isUnread ? '' : ' read'}${isMine ? ' mine' : ''}`}
              >
                {n.subject && <div className="team-note-subject">{n.subject}</div>}
                <div className="team-note-body">{n.body}</div>
                <div className="team-note-foot">
                  <span>
                    {isMine ? 'You' : (n.author_name || n.author_email)}
                    {' · '}{timeAgo(n.created_at)}
                  </span>
                  <span style={{ display: 'inline-flex', gap: 12, alignItems: 'center' }}>
                    {isUnread && (
                      <button type="button" className="link-button" onClick={() => markRead(n.id)}>Got it</button>
                    )}
                    {(isMine || isAdmin) && (
                      <button
                        type="button"
                        className="link-button"
                        onClick={() => deleteNote(n.id)}
                        style={{ color: 'var(--danger)' }}
                      >Delete</button>
                    )}
                  </span>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <TeamNoteCompose session={session} open={composing} onClose={() => setComposing(false)} onSent={refreshTeamNotes} />
    </div>
  );
}

  const { invoices, terms, invoicesUsable } = ctx;

  const byCustomer = {};
  invoices.filter((i) => i.status === 'paid').forEach((inv) => {
    const name = customerDisplayName({
      first_name: inv.customer_first_name,
      last_name: inv.customer_last_name,
      business_name: inv.customer_business_name,
    }) || 'Unknown';
    const cid = inv.customer_id || name;
    if (!byCustomer[cid]) byCustomer[cid] = { name, total: 0, count: 0 };
    byCustomer[cid].total += invoiceMath(inv).total;
    byCustomer[cid].count++;
  });
  const sorted = Object.values(byCustomer).sort((a, b) => b.total - a.total).slice(0, 5);
  if (sorted.length === 0) return null;
  return (
    <>
      <div className="section-heading">Top {terms.customersLower}</div>
      <div className="list">
        {sorted.map((c, i) => (
          <div key={i} className="compact-row">
            <div className="info">

              <div className="meta">{c.count} paid {c.count === 1 ? 'invoice' : 'invoices'}</div>

        ))}

// Edit mode for the dashboard: the real widgets stay on screen and gain a
// handle to drag and a control to hide. A list of widget names would have
// been the settings page again, just relocated — the point of moving it here
// is that you rearrange the thing while looking at the thing.
//
// Widget bodies are inert while editing (pointer-events: none) so a drag or a
// click lands on the card being arranged rather than on a button inside it.
function DashboardLayoutMode({ session, ctx, widgets, isVisibleForRole, onSaved, onCancel }) {
  const [draft, setDraft] = useState(() => widgets.map((w) => ({ ...w })));
  const [dragId, setDragId] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  const known = (w) => DASHBOARD_WIDGET_REGISTRY[w.id] && isVisibleForRole(w.id);
  const shown = draft.filter((w) => w.enabled && known(w));
  const hidden = draft.filter((w) => !w.enabled && known(w));

  function setEnabled(id, enabled) {
    setDraft((list) => list.map((w) => (w.id === id ? { ...w, enabled } : w)));
  }

  // Drag is mouse-only — HTML5 drag-and-drop does not fire for touch — so
  // reordering also gets buttons, which work on a phone and from a keyboard.
  function step(id, delta) {
    const order = shown.map((w) => w.id);
    const at = order.indexOf(id);
    const to = at + delta;
    if (at === -1 || to < 0 || to >= order.length) return;
    move(id, order[to]);
  }

  function move(fromId, toId) {
    setDraft((list) => {
      const next = list.slice();
      const from = next.findIndex((w) => w.id === fromId);
      const to = next.findIndex((w) => w.id === toId);
      if (from === -1 || to === -1 || from === to) return list;
      const [moved] = next.splice(from, 1);
      next.splice(to, 0, moved);
      return next;
    });
  }

  async function save() {
    setBusy(true); setError(null);
    try {
      // Only this key is sent; the settings endpoint builds its SET from
      // whatever it receives, so no other setting is touched.
      await apiRequest('/api/settings', {
        method: 'PUT', slug: session.slug, token: session.token,
        body: { dashboard_widgets: draft },
      });
      onSaved(draft);
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  return (
    <div className="dash-editing">
      <div className="dash-edit-bar">
        {/* Says arrows rather than drag: dragging is mouse-only, so promising
            it would be wrong on the device where this text is most likely
            being read. On a mouse you can drag as well. */}
        <span className="dash-edit-hint">
          Use the arrows to reorder, and hide the cards you don&rsquo;t use.
        </span>
        <button className="secondary" disabled={busy} onClick={onCancel}>Cancel</button>
        <button className="primary" disabled={busy} onClick={save}>
          {busy ? 'Saving...' : 'Done'}
        </button>
      </div>
      {error && <div className="error">{error}</div>}

      {shown.map((w, i) => {
        const meta = DASHBOARD_WIDGET_REGISTRY[w.id];
        const W = meta.render;
        return (
          <div
            key={w.id}
            className={`dash-edit-card${dragId === w.id ? ' dragging' : ''}`}
            draggable
            onDragStart={(e) => {
              setDragId(w.id);
              e.dataTransfer.setData('text/plain', w.id);
              e.dataTransfer.effectAllowed = 'move';
            }}
            onDragEnd={() => setDragId(null)}
            onDragOver={(e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }}
            onDrop={(e) => {
              e.preventDefault();
              const fromId = e.dataTransfer.getData('text/plain');
              if (fromId && fromId !== w.id) move(fromId, w.id);
              setDragId(null);
            }}
          >
            <div className="dash-edit-head">
              <span className="dash-edit-grip" aria-hidden="true">⋮⋮</span>
              <span className="dash-edit-name">{meta.label}</span>
              <button
                type="button"
                className="dash-edit-step"
                disabled={i === 0}
                aria-label={`Move ${meta.label} up`}
                onClick={() => step(w.id, -1)}
              >↑</button>
              <button
                type="button"
                className="dash-edit-step"
                disabled={i === shown.length - 1}
                aria-label={`Move ${meta.label} down`}
                onClick={() => step(w.id, 1)}
              >↓</button>
              <button
                type="button"
                className="dash-edit-hide"
                onClick={() => setEnabled(w.id, false)}
              >Hide</button>
            </div>
            <div className="dash-edit-body" aria-hidden="true"><W ctx={ctx} /></div>
          </div>
        );
      })}

      {hidden.length > 0 && (
        <div className="dash-hidden">
          <p className="dash-hidden-label">Hidden</p>
          <div className="dash-hidden-row">
            {hidden.map((w) => {
              const meta = DASHBOARD_WIDGET_REGISTRY[w.id];
              return (
                <button
                  key={w.id}
                  type="button"
                  className="dash-hidden-chip"
                  onClick={() => setEnabled(w.id, true)}
                  title={meta.help}
                >
                  {meta.label}<span aria-hidden="true"> +</span>
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function DashboardView({ session, me, pendingRequestsCount, draftQuotesCount, features = {} }) {
  const terms = useTerms();
  const [jobs, setJobs] = useState([]);
  const [customers, setCustomers] = useState([]);
  const [invoices, setInvoices] = useState([]);
  const [settings, setSettings] = useState(null);
  const [teamNotes, setTeamNotes] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [completing, setCompleting] = useState(null);
  const [busy, setBusy] = useState(false);

  const refreshTeamNotes = useCallback(async () => {
    try {
      const data = await apiRequest('/api/team-messages', {
        slug: session.slug, token: session.token,
      });
      setTeamNotes(data || []);
    } catch (e) { /* swallow — widget will just be empty */ }
  }, [session.slug, session.token]);

  const refresh = useCallback(async () => {
    setLoading(true); setError(null);
    try {
      const [jobsData, invoicesData, customersData, settingsData, notesData] = await Promise.all([
        apiRequest('/api/jobs', { slug: session.slug, token: session.token }),
        apiRequest('/api/invoices', { slug: session.slug, token: session.token }),
        apiRequest('/api/customers', { slug: session.slug, token: session.token }),
        apiRequest('/api/settings', { slug: session.slug, token: session.token }).catch(() => null),
        apiRequest('/api/team-messages', { slug: session.slug, token: session.token }).catch(() => []),
      ]);
      setJobs(jobsData);
      setInvoices(invoicesData);
      setCustomers(customersData);
      setSettings(settingsData);
      setTeamNotes(notesData || []);
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  }, [session.slug, session.token]);

  useEffect(() => { refresh(); }, [refresh]);

  async function completeJob(values) {
    setBusy(true); setError(null);
    try {
      await apiRequest(`/api/jobs/${completing.job.id}/complete`, {
        method: 'POST', slug: session.slug, token: session.token, body: values,
      });
      setCompleting(null);
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  async function uncompleteOccurrence(job, date) {
    const completed = Array.isArray(job.completed_dates) ? job.completed_dates : [];
    if (!completed.includes(date)) return;
    if (!confirm(`Undo the completion on ${formatDateString(date)}? If it was added to a draft invoice, the matching line is pulled.`)) return;
    setBusy(true); setError(null);
    try {
      await apiRequest(`/api/jobs/${job.id}/completions/by-date/${date}`, {
        method: 'DELETE', slug: session.slug, token: session.token,
      });
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  async function markInvoicePaid(id) {
    setError(null);
    try {
      await apiRequest(`/api/invoices/${id}/mark-paid`, {
        method: 'POST', slug: session.slug, token: session.token,
      });
      await refresh();
    } catch (err) { setError(err.message); }
  }

  const today = todayStart();
  const todayStr = formatYMD(today);
  const tomorrowStr = formatYMD(addDays(today, 1));
  const weekAgoStr = formatYMD(addDays(today, -6));
  const overdueStart = formatYMD(addDays(today, -90));
  const yesterdayStr = formatYMD(addDays(today, -1));

  const todayOccurrences = jobs.flatMap((j) => jobOccurrencesInRange(j, todayStr, todayStr));
  const tomorrowOccurrences = jobs
    .flatMap((j) => jobOccurrencesInRange(j, tomorrowStr, tomorrowStr))
    .sort((a, b) => (a.job.start_time || '99:99').localeCompare(b.job.start_time || '99:99'));
  const overdueOccurrences = jobs
    .flatMap((j) => jobOccurrencesInRange(j, overdueStart, yesterdayStr))
    .filter((o) => !o.completed)
    .sort((a, b) => b.date.localeCompare(a.date));
  const outstandingInvoices = invoices.filter((i) => i.status === 'sent');

  const outstandingTotal = outstandingInvoices.reduce((sum, i) => sum + invoiceMath(i).balanceDue, 0);
  const weekRevenue = invoices
    .filter((i) => i.status === 'paid' && i.paid_date && i.paid_date.split('T')[0] >= weekAgoStr && i.paid_date.split('T')[0] <= todayStr)
    .reduce((sum, i) => sum + invoiceMath(i).total, 0);
  const next7DaysProjected = computeProjectedIncome(jobs, todayStr, formatYMD(addDays(today, 6)));

  if (completing) {
    return (
      <div>
        <div className="page-header"><h2>Mark complete: {completing.job.title}</h2></div>
        {error && <div className="error">{error}</div>}
        <div className="form-card">
          <CompletionForm
            job={completing.job}
            initialDate={completing.date}
            onSubmit={completeJob}
            defaultAddToDraft={!!(me && me.auto_append_to_draft)}
            onCancel={() => { setError(null); setCompleting(null); }}
            busy={busy}
          />
        </div>
      </div>
    );
  }

  const newCustomersThisWeek = customers.filter((c) => {
    if (!c.created_at) return false;
    return c.created_at.split('T')[0] >= weekAgoStr;
  }).length;

  const plan = (me && me.plan) || 'pro';
  const isFree = plan === 'free';
  // Local copy so a saved layout takes effect immediately, without waiting
  // for `me` to be refetched by the shell. Declared ahead of ctx, which
  // hands the edit action to the greeting widget.
  const [layoutOverride, setLayoutOverride] = useState(null);
  const [editingLayout, setEditingLayout] = useState(false);

  const ctx = {
    session, terms, today,
    jobs, invoices, customers,
    todayOccurrences, tomorrowOccurrences, overdueOccurrences,
    outstandingInvoices, outstandingTotal, weekRevenue, next7DaysProjected,
    newCustomersThisWeek,
    pendingRequestsCount: pendingRequestsCount || 0,
    draftQuotesCount: draftQuotesCount || 0,
    teamNotes, refreshTeamNotes,
    features, isFree,
    invoicesUsable: !isFree && features.invoices,
    quotesUsable: features.quotes,
    onMarkComplete: (job, date) => setCompleting({ job, date }),
    onUncomplete: uncompleteOccurrence,
    onMarkPaid: markInvoicePaid,
    // The greeting's ⋯ carries "Edit layout", so the dashboard no longer
    // spends a line of its own on it — unless the greeting is switched off.
    onEditLayout: () => setEditingLayout(true),
  };

  const widgets = layoutOverride
    || ((me && Array.isArray(me.dashboard_widgets) && me.dashboard_widgets.length > 0)
      ? me.dashboard_widgets
      : DEFAULT_DASHBOARD_WIDGETS);

  // Employees don't see money widgets (stats, outstanding invoices, top customers
  // by revenue, quick actions — most quick actions create things they can't).
  const role = session.user.role;
  const employeeAllowed = new Set([
    'greeting', 'team_notes', 'today', 'tomorrow', 'overdue', 'pending_requests',
  ]);
  const isVisibleForRole = (id) => role === 'employee' ? employeeAllowed.has(id) : true;

  return (
    <div>
      {error && <div className="error">{error}</div>}

      {loading ? (
        <div className="list-empty">Loading...</div>
      ) : editingLayout ? (
        <DashboardLayoutMode
          session={session}
          ctx={ctx}
          widgets={widgets}
          isVisibleForRole={isVisibleForRole}
          onSaved={(next) => { setLayoutOverride(next); setEditingLayout(false); }}
          onCancel={() => setEditingLayout(false)}
        />
      ) : (
        <>
          {/* Above the widgets, not below them — you decide to rearrange when
              you look at the thing, not after scrolling past all of it. */}
          {role === 'admin' && !widgets.some((w) => w.id === 'greeting' && w.enabled) && (
            <div className="dash-top">
              <button className="link-button" onClick={() => setEditingLayout(true)}>
                Edit layout
              </button>
            </div>
          )}
          {role === 'admin' && !(me && me.is_demo) && (
            <GettingStartedChecklist
              session={session}
              features={features}
              settings={settings}
              customers={customers}
              jobs={jobs}
            />
          )}
          {/* Each widget in a box of its own, spaced by the column rather
              than by whatever margin the widget happened to end with. The
              stats grid carried a bottom margin and the schedule card did
              not, so Today followed by Outstanding touched, while the other
              way round they did not — the gap depended on the order the
              owner had chosen. A widget that renders nothing leaves an
              empty box, which :empty hides so it costs no gap either. */}
          <div className="dash-widgets">
            {widgets
              .filter((w) => w.enabled && DASHBOARD_WIDGET_REGISTRY[w.id] && isVisibleForRole(w.id) && w.id !== 'team_notes')
              .map((w) => {
                const W = DASHBOARD_WIDGET_REGISTRY[w.id].render;
                return <div className="dash-widget" key={w.id}><W ctx={ctx} /></div>;
              })}
          </div>
        </>
      )}
    </div>
  );
}

function GettingStartedChecklist({ session, features, settings, customers, jobs }) {
  const terms = useTerms();
  const orgId = session.organization && session.organization.id;
  const storageKey = `fm_getting_started_dismissed_${orgId}`;
  const [dismissed, setDismissed] = useState(() => {
    try { return localStorage.getItem(storageKey) === '1'; } catch (e) { return false; }
  });

  function dismiss() {
    try { localStorage.setItem(storageKey, '1'); } catch (e) {}
    setDismissed(true);
  }

  const s = settings || {};
  const companyDone = !!(s.company_name && (s.logo_url || s.address || s.phone || s.email));
  const paymentsDone = !!(s.payment_link_url || s.venmo_handle);
  const customerDone = (customers || []).length > 0;
  const jobDone = (jobs || []).length > 0;

  const items = [
    {
      id: 'company',
      label: 'Add your company info and logo',
      hint: 'Shows up on every invoice and your public booking page.',
      done: companyDone,
      to: '/settings',
    },
  ];
  if (features.invoices) {
    items.push({
      id: 'payments',
      label: 'Set up how customers pay you',
      hint: 'Pay-now link (Stripe / PayPal / Square) or Venmo handle.',
      done: paymentsDone,
      to: '/settings/payments',
    });
  }
  items.push({
    id: 'customer',
    label: `Add your first ${terms.customerLower}`,
    hint: 'Or import a list from CSV.',
    done: customerDone,
    to: '/customers',
  });
  items.push({
    id: 'job',
    label: `Schedule your first ${terms.jobLower}`,
    hint: 'One-off or recurring — pick a day, hit save.',
    done: jobDone,
    to: '/jobs',
  });

  const allDone = items.every((i) => i.done);
  if (dismissed || allDone) return null;

  const doneCount = items.filter((i) => i.done).length;

  return (
    <div className="gs-card">
      <div className="gs-head">
        <div>
          <div className="gs-title">Get set up</div>
          <div className="gs-sub">{doneCount} of {items.length} done · {items.length - doneCount} to go</div>
        </div>
        <button
          className="link-button"
          onClick={dismiss}
          aria-label="Hide getting started checklist"
          style={{ fontSize: 12 }}
        >Hide</button>
      </div>
      <div className="gs-list">
        {items.map((item) => (
          <button
            key={item.id}
            className={`gs-item${item.done ? ' done' : ''}`}
            onClick={() => navigate(item.to)}
            type="button"
          >
            <span className={`gs-check${item.done ? ' done' : ''}`} aria-hidden="true">
              {item.done ? '✓' : ''}
            </span>
            <span className="gs-body">
              <span className="gs-label">{item.label}</span>
              <span className="gs-hint">{item.hint}</span>
            </span>
            <span className="gs-arrow" aria-hidden="true">→</span>
          </button>
        ))}
      </div>
    </div>
  );
}

const REPORT_PRESETS = {
  '7days': '7 days',
  'month': 'This month',
  'quarter': 'This quarter',
  'year': 'This year',
  'all': 'Last 24 months',
  'custom': 'Custom',
};

function getReportRange(preset, customFrom, customTo) {
  const today = todayStart();
  const todayStr = formatYMD(today);
  const y = today.getFullYear();
  const mo = today.getMonth();
  if (preset === '7days') return { from: formatYMD(addDays(today, -6)), to: todayStr };
  // "This month/quarter/year" span the WHOLE period (through its last day), not
  // just up to today — so projected income covers the rest of the period. Past
  // revenue is unaffected: it can only fall on/before today anyway.
  if (preset === 'month') {
    return { from: formatYMD(new Date(y, mo, 1)), to: formatYMD(new Date(y, mo + 1, 0)) };
  }
  if (preset === 'quarter') {
    const q = Math.floor(mo / 3);
    return { from: formatYMD(new Date(y, q * 3, 1)), to: formatYMD(new Date(y, q * 3 + 3, 0)) };
  }
  if (preset === 'year') {
    return { from: formatYMD(new Date(y, 0, 1)), to: formatYMD(new Date(y, 11, 31)) };
  }
  if (preset === 'all') {
    // Effectively "last 24 months" — covers any realistic Field Manager
    // history and keeps the chart legible. Pick Custom for longer ranges.
    const start = new Date(today.getFullYear(), today.getMonth() - 23, 1);
    return { from: formatYMD(start), to: todayStr };
  }
  return { from: customFrom || todayStr, to: customTo || todayStr };
}

// Adaptive bucket size: daily for ≤31 days, weekly for ≤100 days,
// monthly otherwise. Returns the bucket list with each item as
// { start, end, label }.
function buildReportBuckets(fromStr, toStr) {
  const start = new Date(fromStr + 'T00:00:00');
  const end = new Date(toStr + 'T00:00:00');
  const days = Math.round((end - start) / 86400000) + 1;
  const mode = days <= 31 ? 'daily' : days <= 100 ? 'weekly' : 'monthly';
  const out = [];
  const cursor = new Date(start);
  while (cursor <= end) {
    let bucketEnd;
    let label;
    if (mode === 'monthly') {
      bucketEnd = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0);
      label = cursor.toLocaleDateString(undefined, { month: 'short', year: '2-digit' });
    } else if (mode === 'daily') {
      bucketEnd = new Date(cursor);
      label = cursor.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    } else {
      bucketEnd = new Date(cursor);
      bucketEnd.setDate(bucketEnd.getDate() + 6);
      label = cursor.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }
    if (bucketEnd > end) bucketEnd = new Date(end);
    out.push({ start: formatYMD(cursor), end: formatYMD(bucketEnd), label });
    if (mode === 'monthly') {
      cursor.setFullYear(cursor.getFullYear(), cursor.getMonth() + 1, 1);
    } else if (mode === 'daily') {
      cursor.setDate(cursor.getDate() + 1);
    } else {
      cursor.setDate(cursor.getDate() + 7);
    }
  }
  return out;
}

// Who has sent you whom, and what it has earned them.
function ReferralsView({ session }) {
  const terms = useTerms();
  const [data, setData] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => {
    let cancelled = false;
    apiRequest('/api/customers/referral-summary', { slug: session.slug, token: session.token })
      .then((d) => { if (!cancelled) setData(d); })
      .catch((err) => { if (!cancelled) setError(err.message); });
    return () => { cancelled = true; };
  }, [session.slug, session.token]);

  const referrers = (data && data.referrers) || [];
  const program = data && data.program;
  const referredTotal = referrers.reduce((n, r) => n + r.referred.length, 0);
  const earnedTotal = referrers.reduce((n, r) => n + (parseFloat(r.earned) || 0), 0);
  const terms_ = program
    ? `${parseFloat(program.referral_percent)}% of each ${terms.jobLower}${program.referral_cap_jobs != null ? `, first ${program.referral_cap_jobs} per referred ${terms.customerLower}` : ''}`
    : '';

  return (
    <div>
      <div className="toolbar">
        <span className="tb-title">
          <h2>Referrals</h2>
          <span className="tb-count">
            {data ? <>{referredTotal} referred{earnedTotal > 0 && <> &middot; <b>{formatPrice(earnedTotal)}</b> earned</>}</> : ''}
          </span>
        </span>
        <span className="tb-gap"></span>
        <span className="tb-actions">
          <button className="secondary" onClick={() => navigate('/settings/referrals')}>Reward settings</button>
        </span>
      </div>
      {program && <p className="hint" style={{ margin: '0 0 12px' }}>Referrers earn {terms_}.</p>}
      {error && <div className="error">{error}</div>}
      <div className="list">
        {!data && !error ? (
          <div className="list-empty">Loading...</div>
        ) : referrers.length === 0 ? (
          <div className="list-empty">
            No referrals yet. When a {terms.customerLower} sends you someone, open the new {terms.customerLower}, choose Edit, and set "Referred by".
          </div>
        ) : referrers.map((r) => (
          <div
            key={r.id} className="row row-link" role="button" tabIndex={0}
            onClick={() => navigate(`/customers?open=${r.id}`)}
            onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navigate(`/customers?open=${r.id}`); } }}
          >
            <div className="info">
              <div className="name">{customerDisplayName(r)}</div>
              <div className="meta">
                Referred {r.referred.map((c) => customerDisplayName(c)).join(', ')}
                {parseFloat(r.credit_balance) > 0 && <> &middot; {formatPrice(parseFloat(r.credit_balance))} credit available</>}
              </div>
            </div>
            {parseFloat(r.earned) > 0
              ? <div className="actions" style={{ fontWeight: 600, color: 'var(--success)' }}>+{formatPrice(parseFloat(r.earned))}</div>
              : <div className="actions hint" style={{ margin: 0 }}>No rewards yet</div>}
          </div>
        ))}
      </div>
    </div>
  );
}

function ReportsView({ session }) {
  const terms = useTerms();
  const [preset, setPreset] = useState('month');
  const [customFrom, setCustomFrom] = useState(formatYMD(todayStart()));
  const [customTo, setCustomTo] = useState(formatYMD(todayStart()));
  const [report, setReport] = useState(null);
  const [jobs, setJobs] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const range = getReportRange(preset, customFrom, customTo);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      setLoading(true); setError(null);
      try {
        const params = new URLSearchParams({ from: range.from, to: range.to });
        const [reportData, jobsData] = await Promise.all([
          apiRequest(`/api/reports?${params}`, { slug: session.slug, token: session.token }),
          apiRequest('/api/jobs', { slug: session.slug, token: session.token }),
        ]);
        if (!cancelled) { setReport(reportData); setJobs(jobsData); }
      } catch (err) {
        if (!cancelled) setError(err.message);
      } finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [session.slug, session.token, range.from, range.to]);

  const projectedIncome = computeProjectedIncome(jobs, range.from, range.to);

  // Avg paid per invoice in range (KPI ish)
  const avgPerInvoice = report && report.invoices.paid_count > 0
    ? report.invoices.paid_total / report.invoices.paid_count
    : 0;

  // Bucket the daily collected payments returned by the API.
  const chartBuckets = report ? buildReportBuckets(report.range.from, report.range.to) : [];
  const dailyCollected = (report && Array.isArray(report.collected_by_day)) ? report.collected_by_day : [];
  const chartRows = chartBuckets.map((b) => {
    let amount = 0;
    for (const row of dailyCollected) {
      const day = row.day && row.day.split('T')[0];
      if (day && day >= b.start && day <= b.end) amount += parseFloat(row.total) || 0;
    }
    return { ...b, amount };
  });
  const chartMax = chartRows.reduce((m, r) => Math.max(m, r.amount), 0);

  return (
    <div>
      <div className="reports-hero">
        <div className="reports-hero-eyebrow">Reports</div>
        <h2 className="reports-hero-title">
          {REPORT_PRESETS[preset] || 'Custom range'}
        </h2>
        <p className="reports-hero-sub">
          {formatDateString(range.from)} <span style={{ opacity: 0.5 }}>→</span> {formatDateString(range.to)}
        </p>
        <div className="reports-range-chips">
          {Object.entries(REPORT_PRESETS).map(([key, label]) => (
            <button
              key={key}
              className={`chip ${preset === key ? 'active' : ''}`}
              onClick={() => setPreset(key)}
            >
              {label}
            </button>
          ))}
        </div>
      </div>
      {preset === 'custom' && (
        <div className="form-card" style={{ marginBottom: 20 }}>
          <div className="form-grid">
            <div>
              <label>From</label>
              <input type="date" value={customFrom} onChange={(e) => setCustomFrom(e.target.value)} />
            </div>
            <div>
              <label>To</label>
              <input type="date" value={customTo} onChange={(e) => setCustomTo(e.target.value)} />
            </div>
          </div>
        </div>
      )}

      {error && <div className="error">{error}</div>}
      {loading ? (
        <div className="list-empty">Loading...</div>
      ) : report ? (
        <>
          <div className="stats-grid row-fixed-3">
            <div className="stat-card accent">
              <div className="label">Paid revenue</div>
              <div className="value">{formatPrice(report.invoices.paid_total)}</div>
              <div className="subvalue">{report.invoices.paid_count} {report.invoices.paid_count === 1 ? 'invoice' : 'invoices'}</div>
            </div>
            <div className="stat-card">
              <div className="label">Outstanding</div>
              <div className="value">{formatPrice(report.invoices.outstanding_total)}</div>
              <div className="subvalue">{report.invoices.outstanding_count} unpaid (all time)</div>
            </div>
            <div className="stat-card">
              <div className="label">Projected income</div>
              <div className="value">{formatPrice(projectedIncome)}</div>
              <div className="subvalue">from upcoming work in range</div>
            </div>
          </div>
          <div className="stats-grid row-fixed-3">
            <div className="stat-card">
              <div className="label">{terms.jobs} completed</div>
              <div className="value">{report.completed_work}</div>
              <div className="subvalue">in selected range</div>
            </div>
            <div className="stat-card">
              <div className="label">New {terms.customersLower}</div>
              <div className="value">{report.new_customers}</div>
              <div className="subvalue">in selected range</div>
            </div>
            <div className="stat-card">
              <div className="label">Avg per invoice</div>
              <div className="value">{formatPrice(avgPerInvoice)}</div>
              <div className="subvalue">paid invoices, range</div>
            </div>
          </div>

          <div className="reports-panel">
            <div className="reports-panel-head">
              <h3>Collected over time</h3>
              <span>paid invoices, grouped by date</span>
            </div>
            {chartRows.length === 0 || chartMax === 0 ? (
              <div className="line-items-empty">No payments recorded in this range.</div>
            ) : (
              <div className="rv-chart">
                {chartRows.map((r) => {
                  const pct = chartMax > 0 ? (r.amount / chartMax) * 100 : 0;
                  return (
                    <div key={r.start} className="rv-col" title={`${r.label}: ${formatPrice(r.amount)}`}>
                      <div className="rv-col-track">
                        <div className="rv-col-bar" style={{ height: `${pct}%` }} />
                      </div>
                      <div className="rv-col-label">{r.label}</div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <div className="reports-panel">
            <div className="reports-panel-head">
              <h3>Top {terms.customersLower}</h3>
              <span>by paid revenue</span>
            </div>
            {report.top_customers.length === 0 ? (
              <div className="line-items-empty">No paid invoices in this range.</div>
            ) : (
              <div className="reports-top-customers">
                {report.top_customers.map((c, i) => {
                  const max = parseFloat(report.top_customers[0].paid_total) || 0;
                  const pct = max > 0 ? ((parseFloat(c.paid_total) || 0) / max) * 100 : 0;
                  return (
                    <div key={c.id} className="reports-tc-row">
                      <div className="reports-tc-rank">{i + 1}</div>
                      <div className="reports-tc-body">
                        <div className="reports-tc-name">{customerDisplayName(c)}</div>
                        <div className="reports-tc-bar"><span style={{ width: `${pct}%` }} /></div>
                      </div>
                      <div className="reports-tc-amount">{formatPrice(c.paid_total)}</div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </>
      ) : null}
    </div>
  );
}

function ScreenHelp({ view, userId }) {
  const terms = useTerms();
  const [open, setOpen] = useState(false);
  const help = screenHelp(view, terms);
  // The one time help announces itself: the first time a person reaches the
  // app, the page dims for a moment and the "?" pulses. Once per person per
  // device, never per screen — after that it is only ever there when asked.
  const btnRef = useRef(null);
  const [spot, setSpot] = useState(null); // null | { top, left, size }
  const introKey = `fm_help_intro_${userId || 'anon'}`;
  useEffect(() => {
    let seen = true;
    try { seen = !!localStorage.getItem(introKey); } catch (e) { /* storage blocked: skip the intro */ }
    if (seen || !help) return undefined;
    const show = setTimeout(() => {
      const el = btnRef.current;
      // Not over a dialog, and not if the button is not on screen.
      if (!el || document.querySelector('.modal-overlay')) return;
      const r = el.getBoundingClientRect();
      if (!r.width) return;
      try { localStorage.setItem(introKey, '1'); } catch (e) { /* fine */ }
      setSpot({ top: r.top, left: r.left, size: r.width });
    }, 1200);
    return () => clearTimeout(show);
  }, [introKey, !!help]);
  useEffect(() => {
    if (!spot) return undefined;
    const end = setTimeout(() => setSpot(null), 2800);
    return () => clearTimeout(end);
  }, [spot]);
  // A different screen is a different question.
  useEffect(() => { setOpen(false); }, [view]);
  useEffect(() => {
    if (!open) return undefined;
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open]);
  if (!help) return null;
  return (
    <>
      <button ref={btnRef} type="button" className="helpbtn" onClick={() => setOpen(true)} aria-label={`Help with ${help.title}`} aria-haspopup="dialog">?</button>
      {spot && (
        <div className="helpspot" onClick={() => setSpot(null)} role="presentation">
          <button
            type="button" className="helpbtn helpspot-btn" aria-label={`Help with ${help.title}`}
            style={{ top: spot.top, left: spot.left, width: spot.size, height: spot.size }}
            onClick={(e) => { e.stopPropagation(); setSpot(null); setOpen(true); }}
          >?</button>
          <div className="helpspot-label" style={{ top: spot.top + spot.size + 12, right: Math.max(12, window.innerWidth - spot.left - spot.size) }}>
            Stuck? Tap <b>?</b> on any screen.
          </div>
        </div>
      )}
      {open && (
        <div className="modal-overlay helpsheet-overlay" onClick={() => setOpen(false)}>
          <div className="modal-card helpsheet" role="dialog" aria-modal="true" aria-label={`Help with ${help.title}`} onClick={(e) => e.stopPropagation()}>
            <div className="modal-head" style={{ marginBottom: 10 }}>
              <div>
                <div className="helpsheet-eyebrow">How this screen works</div>
                <h3 style={{ margin: 0 }}>{help.title}</h3>
              </div>
              <button type="button" className="modal-close" onClick={() => setOpen(false)} aria-label="Close">×</button>
            </div>
            <p className="helpsheet-intro">{help.intro}</p>
            <dl className="helpsheet-tips">
              {help.tips.map(([h, p]) => (
                <div key={h}><dt>{h}</dt><dd>{p}</dd></div>
              ))}
            </dl>
            <div className="helpsheet-foot">
              Still stuck?{' '}
              <button type="button" className="link-btn" onClick={() => { setOpen(false); navigate('/support'); }}>Ask us</button>
              {' '}— a person answers, usually within a day.
            </div>
          </div>
        </div>
      )}
    </>
  );
}
