function OccurrenceRow({ occurrence, onMarkComplete, onUncomplete, onEdit }) {
  // On a phone three controls did not fit the row: the text-template picker
  // was truncated to "Text…" beside Mark complete and Open. One button and a
  // menu instead — the templates become items under a heading. Ahead of any
  // early return, as hooks must be.
  const compact = useMediaQuery('(max-width: 720px)');
  const smsTemplates = useSmsTemplates();
  const d = parseDate(occurrence.date);
  const dayName = d.toLocaleDateString(undefined, { weekday: 'short' });
  const monthName = d.toLocaleDateString(undefined, { month: 'short' });
  const isToday = occurrence.date === formatYMD(todayStart());
  const isOverdue = !occurrence.completed && occurrence.date < formatYMD(todayStart());
  const phone = occurrence.job.customer_phone;
  const showSms = phone && smsTemplates.length > 0 && !occurrence.completed;
  const classes = ['occurrence-row'];
  if (occurrence.completed) classes.push('completed');
  if (isToday) classes.push('today');

  return (
    <div className={classes.join(' ')}>
      <div className="date">
        <div className="day">{dayName} {monthName}</div>
        <div className="num">{d.getDate()}</div>
      </div>
      <div className="body">
        <div className="title">
          {occurrence.job.title}
          {occurrence.job.default_price != null && <span className="price">{formatPrice(occurrence.job.default_price)}</span>}
        </div>
        <div className="meta">
          {jobCustomerName(occurrence.job)}
          {formatTimeRange(occurrence.job.start_time, occurrence.job.duration_minutes) && (
            <> · {formatTimeRange(occurrence.job.start_time, occurrence.job.duration_minutes)}</>
          )}
          {isOverdue && <> · <span style={{ color: 'var(--danger)', fontWeight: 500 }}>Overdue</span></>}
          {occurrence.completed && <> · Completed</>}
          {occurrence.rescheduledFrom && <> · Rescheduled from {formatDateString(occurrence.rescheduledFrom)}</>}
        </div>
      </div>
      <div className="actions">
        {showSms && !compact && (
          <select
            className="row-sms"
            onClick={(e) => e.stopPropagation()}
            onChange={(e) => {
              const tpl = smsTemplates.find((t) => t.id === e.target.value);
              if (tpl) sendSmsTemplate(phone, tpl, occurrence.job);
              e.target.value = '';
            }}
            defaultValue=""
          >
            <option value="" disabled>💬 Text…</option>
            {smsTemplates.map((t) => (
              <option key={t.id} value={t.id}>{t.label}</option>
            ))}
          </select>
        )}
        {!occurrence.completed && (
          <button className="primary" onClick={() => onMarkComplete(occurrence.job, occurrence.date)}>Mark complete</button>
        )}
        {occurrence.completed && onUncomplete && (
          <button className="secondary" onClick={() => onUncomplete(occurrence.job, occurrence.date)}>Undo</button>
        )}
        {compact ? (
          <RowMenu
            label="More actions"
            items={[
              { label: 'Open', onClick: () => onEdit(occurrence.job) },
              ...(showSms && smsTemplates.length > 0
                ? [{ section: 'Text' }, ...smsTemplates.map((t) => ({ label: t.label, onClick: () => sendSmsTemplate(phone, t, occurrence.job) }))]
                : []),
            ]}
          />
        ) : (
          <button className="secondary" onClick={() => onEdit(occurrence.job)}>Open</button>
        )}
      </div>
    </div>
  );
}

// Does a candidate single-date appointment overlap an existing one in time?
// Returns the first conflicting { job, date } or null. Untimed and recurring
// candidates are skipped (no single time to compare).
function findJobTimeConflict(jobs, candidate, excludeId) {
  if (candidate.type !== 'single' || !candidate.date || !candidate.start_time) return null;
  const toMin = (t) => { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; };
  const cs = toMin(candidate.start_time);
  const ce = cs + (Number(candidate.duration_minutes) || 60);
  for (const j of jobs) {
    if (j.id === excludeId) continue;
    for (const o of jobOccurrencesInRange(j, candidate.date, candidate.date)) {
      if (o.completed || !o.job.start_time) continue;
      const os = toMin(o.job.start_time);
      const oe = os + (Number(o.job.duration_minutes) || 60);
      if (cs < oe && os < ce) return { job: j, date: o.date };
    }
  }
  return null;
}

function CalendarView({ jobs, onChipClick, jobMenuItems, onMarkComplete, onUncomplete, onCreateAt, smsTemplates = [], view, setView, selectedDate, setSelectedDate, monthOffset, setMonthOffset }) {
  const terms = useTerms();
  const today = todayStart();
  const todayStr = formatYMD(today);

  function shiftDay(delta) {
    const cur = new Date(selectedDate + 'T00:00:00');
    cur.setDate(cur.getDate() + delta);
    setSelectedDate(formatYMD(cur));
  }
  function shiftWeek(delta) { shiftDay(delta * 7); }
  function jumpToToday() {
    setSelectedDate(todayStr);
    setMonthOffset(0);
  }

  // Compute week start (Sunday) for the selected date.
  const weekStartDate = (() => {
    const d = new Date(selectedDate + 'T00:00:00');
    d.setDate(d.getDate() - d.getDay());
    return d;
  })();
  const weekDays = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStartDate);
    d.setDate(d.getDate() + i);
    weekDays.push(d);
  }
  const weekStartStr = formatYMD(weekStartDate);
  const weekEndStr = formatYMD(weekDays[6]);

  // Month range for the month view.
  const viewMonth = addMonths(today, monthOffset);
  const monthStart = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1);
  const monthEnd = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0);
  const monthStartStr = formatYMD(monthStart);
  const monthEndStr = formatYMD(monthEnd);
  const monthByDate = {};
  jobs.forEach((j) => {
    jobOccurrencesInRange(j, monthStartStr, monthEndStr).forEach((o) => {
      (monthByDate[o.date] = monthByDate[o.date] || []).push(o);
    });
  });
  // Order each day's occurrences by time so the chips and the selected-day
  // list below the calendar read chronologically (untimed sort last).
  Object.keys(monthByDate).forEach((k) => {
    monthByDate[k].sort((a, b) => (a.job.start_time || '99:99').localeCompare(b.job.start_time || '99:99'));
  });

  const dayOccurrences = (() => {
    if (view !== 'day') return [];
    const out = [];
    jobs.forEach((j) => {
      jobOccurrencesInRange(j, selectedDate, selectedDate).forEach((o) => out.push(o));
    });
    return out.sort((a, b) => {
      const ta = a.job.start_time || '99:99';
      const tb = b.job.start_time || '99:99';
      return ta.localeCompare(tb);
    });
  })();

  // Everything on the day's schedule, completed or not — this is what the day
  // is worth, not what has been collected. default_price arrives as a string
  // from Postgres numeric, so parse before adding.
  const dayRevenue = dayOccurrences.reduce(
    (sum, o) => sum + (parseFloat(o.job.default_price) || 0), 0
  );
  // "No price set" means the field is empty, not that the price is zero — a
  // deliberate $0 visit is priced, and shouldn't make the total look partial.
  const dayUnpriced = dayOccurrences.filter(
    (o) => o.job.default_price == null || o.job.default_price === ''
  ).length;

  const weekByDate = (() => {
    if (view !== 'week') return {};
    const map = {};
    jobs.forEach((j) => {
      jobOccurrencesInRange(j, weekStartStr, weekEndStr).forEach((o) => {
        (map[o.date] = map[o.date] || []).push(o);
      });
    });
    Object.keys(map).forEach((k) => {
      map[k].sort((a, b) => (a.job.start_time || '99:99').localeCompare(b.job.start_time || '99:99'));
    });
    return map;
  })();

  const selectedDateLabel = (() => {
    const d = new Date(selectedDate + 'T00:00:00');
    return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  })();
  const weekRangeLabel = (() => {
    const s = weekDays[0], e = weekDays[6];
    const sameMonth = s.getMonth() === e.getMonth();
    const sMo = s.toLocaleDateString(undefined, { month: 'short' });
    const eMo = e.toLocaleDateString(undefined, { month: 'short' });
    return sameMonth
      ? `${sMo} ${s.getDate()} – ${e.getDate()}, ${e.getFullYear()}`
      : `${sMo} ${s.getDate()} – ${eMo} ${e.getDate()}, ${e.getFullYear()}`;
  })();

  return (
    <div>
      {/* Day / Week / Month moved up into the one view control in the toolbar,
          beside List. What stays here is moving through time, which is a
          different job from choosing how to look. */}
      <div className="cal-mode-row">
        {view === 'day' && (
          <div className="cal-day-nav">
            <button className="secondary" onClick={() => shiftDay(-1)} aria-label="Previous day">←</button>
            <input
              type="date" value={selectedDate}
              onChange={(e) => setSelectedDate(e.target.value)}
              className="cal-day-picker"
            />
            <button className="secondary" onClick={() => shiftDay(1)} aria-label="Next day">→</button>
            {selectedDate !== todayStr && (
              <button className="secondary" onClick={jumpToToday}>Today</button>
            )}
          </div>
        )}
        {view === 'week' && (
          <div className="cal-day-nav">
            <button className="secondary" onClick={() => shiftWeek(-1)} aria-label="Previous week">←</button>
            <span className="cal-week-label">{weekRangeLabel}</span>
            <button className="secondary" onClick={() => shiftWeek(1)} aria-label="Next week">→</button>
            {selectedDate !== todayStr && (
              <button className="secondary" onClick={jumpToToday}>Today</button>
            )}
          </div>
        )}
      </div>

      {view === 'day' && (
        <>
          <div className="cal-day-header">
            <h3>{selectedDateLabel}</h3>
            <span className="cal-day-count">
              {dayOccurrences.length} {dayOccurrences.length === 1 ? terms.jobLower : terms.jobsLower}
              {dayRevenue > 0 && (
                <span
                  className="cal-day-revenue"
                  title={dayUnpriced > 0
                    ? `${dayUnpriced} ${dayUnpriced === 1 ? `${terms.jobLower} has` : `${terms.jobsLower} have`} no price set, so the total covers the rest.`
                    : undefined}
                ><span className="cal-day-sep">·</span>{formatPrice(dayRevenue)}{dayUnpriced > 0 ? '+' : ''}</span>
              )}
            </span>
          </div>
          <DayTimeGrid
            occurrences={dayOccurrences}
            isToday={selectedDate === todayStr}
            onOpen={onChipClick}
          jobMenuItems={jobMenuItems}
            jobMenuItems={jobMenuItems}
            onMarkComplete={onMarkComplete}
            onUncomplete={onUncomplete}
            onCreateAt={onCreateAt ? (time) => onCreateAt(selectedDate, time) : undefined}
            smsTemplates={smsTemplates}
          />
        </>
      )}

      {view === 'week' && (
        <CalendarWeekGrid
          weekDays={weekDays}
          weekByDate={weekByDate}
          todayStr={todayStr}
          selectedDate={selectedDate}
          onSelectDate={(d) => { setSelectedDate(d); setView('day'); }}
          onOpen={onChipClick}
        />
      )}

      {view === 'month' && (
        <CalendarMonthGrid
          today={today}
          todayStr={todayStr}
          viewMonth={viewMonth}
          monthByDate={monthByDate}
          selectedDate={selectedDate}
          setSelectedDate={setSelectedDate}
          monthOffset={monthOffset}
          setMonthOffset={setMonthOffset}
          onChipClick={onChipClick}
          onMarkComplete={onMarkComplete}
          onUncomplete={onUncomplete}
        />
      )}
    </div>
  );
}

function formatHourLabel(h) {
  if (h === 0) return '12 AM';
  if (h === 12) return 'Noon';
  if (h < 12) return `${h} AM`;
  return `${h - 12} PM`;
}

function customerFirstName(c) {
  if (!c) return '';
  if (c.customer_first_name) return c.customer_first_name;
  if (c.customer_business_name) return c.customer_business_name;
  return 'there';
}

function sendSmsTemplate(phone, template, customer) {
  if (!phone || !template) return;
  const cleanPhone = String(phone).replace(/\D/g, '');
  const msg = String(template.message || '').replace(/\{name\}/g, customerFirstName(customer));
  // iOS uses ?body=, Android wants &body=. Most platforms accept both.
  const url = `sms:${cleanPhone}?body=${encodeURIComponent(msg)}`;
  // window.open() with the sms: scheme fails silently inside an iOS
  // standalone PWA (home-screen install). A programmatic anchor click is
  // treated as a normal link tap, which iOS routes to the Messages app
  // correctly in both browser tabs AND standalone mode.
  const a = document.createElement('a');
  a.href = url;
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function DayTimeGrid({ occurrences, isToday, onOpen, jobMenuItems, onMarkComplete, onUncomplete, onCreateAt, smsTemplates = [] }) {
  const terms = useTerms();
  const jobsLowerLabel = terms.jobsLower;
  const untimed = occurrences.filter((o) => !o.job.start_time);
  const timed = occurrences.filter((o) => o.job.start_time);

  let startHour = 7;
  let endHour = 19;
  timed.forEach((o) => {
    const [h] = o.job.start_time.split(':').map(Number);
    if (h < startHour) startHour = Math.max(0, h);
    const durMin = o.job.duration_minutes || 60;
    const endH = h + Math.ceil(durMin / 60);
    if (endH > endHour) endHour = Math.min(24, endH);
  });
  const hours = [];
  for (let h = startHour; h <= endHour; h++) hours.push(h);
  // Tall enough that a 30-min block (two 15-min rows) fits its content.
  const PX_PER_HOUR = 168;

  function timeToY(timeStr) {
    const [h, m] = timeStr.split(':').map(Number);
    return (h - startHour) * PX_PER_HOUR + (m / 60) * PX_PER_HOUR;
  }

  // "Now" line for today.
  let nowY = null;
  if (isToday) {
    const now = new Date();
    const hh = now.getHours();
    if (hh >= startHour && hh <= endHour) {
      nowY = (hh - startHour) * PX_PER_HOUR + (now.getMinutes() / 60) * PX_PER_HOUR;
    }
  }

  // Each block has a min height so its details/actions always fit. Blocks whose
  // rendered rectangles overlap are split into side-by-side columns so nothing
  // stacks on top of anything else.
  const GAP = 2;
  const laidOut = timed
    .map((o, i) => {
      const showSms = o.job.customer_phone && smsTemplates.length > 0 && !o.completed;
      const durMin = Number(o.job.duration_minutes) || 60;
      const top = timeToY(o.job.start_time);
      // Strictly time-proportional: a 30-min visit is exactly two 15-min rows.
      const height = Math.max(30, (durMin / 60) * PX_PER_HOUR - GAP);
      return { o, i, showSms, top, height, bottom: top + height, col: 0, nCols: 1 };
    })
    .sort((a, b) => a.top - b.top || a.i - b.i);
  {
    const assignCols = (start, end) => {
      const colBottoms = [];
      for (let k = start; k < end; k++) {
        const b = laidOut[k];
        let col = colBottoms.findIndex((bot) => b.top >= bot);
        if (col === -1) { col = colBottoms.length; colBottoms.push(b.bottom); }
        else colBottoms[col] = b.bottom;
        b.col = col;
      }
      for (let k = start; k < end; k++) laidOut[k].nCols = colBottoms.length;
    };
    let clusterStart = 0;
    let clusterMaxBottom = -Infinity;
    for (let k = 0; k < laidOut.length; k++) {
      if (k > clusterStart && laidOut[k].top >= clusterMaxBottom) {
        assignCols(clusterStart, k);
        clusterStart = k;
        clusterMaxBottom = -Infinity;
      }
      clusterMaxBottom = Math.max(clusterMaxBottom, laidOut[k].bottom);
    }
    assignCols(clusterStart, laidOut.length);
  }

  return (
    <div className="day-grid">
      {untimed.length > 0 && (
        <div className="day-untimed-section">
          <div className="day-untimed-header">No time set · {untimed.length} {untimed.length === 1 ? terms.jobLower : terms.jobsLower}</div>
          <div className="day-untimed-list">
            {untimed.map((o, i) => {
              const phone = o.job.customer_phone;
              const showSms = phone && smsTemplates.length > 0 && !o.completed;
              return (
                <div key={i} className={`day-untimed-block${o.completed ? ' completed' : ''}`} onClick={() => onOpen(o.job)}>
                  <div className="day-untimed-main">
                    <div className="day-untimed-title">{o.job.title}</div>
                    <div className="day-untimed-customer">{jobCustomerName(o.job)}</div>
                  </div>
                  <div className="day-untimed-meta">
                    {o.job.default_price != null && (
                      <div className="day-untimed-price">{formatPrice(o.job.default_price)}</div>
                    )}
                    <div className="day-untimed-actions">
                      {showSms && (
                        <select
                          className="day-untimed-sms"
                          onClick={(e) => e.stopPropagation()}
                          onChange={(e) => {
                            const tpl = smsTemplates.find((t) => t.id === e.target.value);
                            if (tpl) sendSmsTemplate(phone, tpl, o.job);
                            e.target.value = '';
                          }}
                          defaultValue=""
                        >
                          <option value="" disabled>💬 Text…</option>
                          {smsTemplates.map((t) => (
                            <option key={t.id} value={t.id}>{t.label}</option>
                          ))}
                        </select>
                      )}
                      {!o.completed && (
                        <button
                          className="day-untimed-complete"
                          onClick={(e) => { e.stopPropagation(); onMarkComplete(o.job, o.date); }}
                        >Mark complete</button>
                      )}
                      {jobMenuItems && jobMenuItems(o.job).filter(Boolean).length > 0 && (
                        <span onClick={(e) => e.stopPropagation()}>
                          <RowMenu label={`Actions for ${o.job.title}`} items={jobMenuItems(o.job)} />
                        </span>
                      )}
                      {o.completed && (
                        <>
                          <span className="day-untimed-done-pill">Completed</span>
                          {onUncomplete && (
                            <button
                              className="day-untimed-uncomplete"
                              onClick={(e) => { e.stopPropagation(); onUncomplete(o.job, o.date); }}
                            >Undo</button>
                          )}
                        </>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
      {timed.length === 0 && untimed.length === 0 ? (
        <div className="list-empty" style={{ borderRadius: 0 }}>No {jobsLowerLabel} scheduled for this day.</div>
      ) : (
        <div className="day-grid-body">
          <div className="day-grid-hours" style={{ height: hours.length * PX_PER_HOUR }}>
            {hours.map((h) => (
              <div key={h} className="day-grid-hour" style={{ height: PX_PER_HOUR }}>
                <span className="day-grid-hour-label">{formatHourLabel(h)}</span>
              </div>
            ))}
          </div>
          <div
            className="day-grid-blocks"
            style={{
              height: hours.length * PX_PER_HOUR,
              backgroundImage: `repeating-linear-gradient(to bottom, transparent 0, transparent ${PX_PER_HOUR / 4 - 1}px, rgba(120,110,95,0.12) ${PX_PER_HOUR / 4 - 1}px, rgba(120,110,95,0.12) ${PX_PER_HOUR / 4}px)`,
              cursor: onCreateAt ? 'copy' : 'default',
            }}
            onClick={onCreateAt ? (e) => {
              if (e.target.closest('.day-block')) return; // clicked an appointment
              const rect = e.currentTarget.getBoundingClientRect();
              const y = e.clientY - rect.top;
              const raw = startHour * 60 + (y / PX_PER_HOUR) * 60;
              const mins = Math.max(0, Math.min(24 * 60 - 15, Math.round(raw / 15) * 15));
              const hh = String(Math.floor(mins / 60)).padStart(2, '0');
              const mm = String(mins % 60).padStart(2, '0');
              onCreateAt(`${hh}:${mm}`);
            } : undefined}
          >
            {hours.map((h) => (
              <div key={h} className="day-grid-lane" style={{ height: PX_PER_HOUR }} />
            ))}
            {nowY !== null && (
              <div className="day-grid-now" style={{ top: nowY }}>
                <span className="day-grid-now-dot" />
                <span className="day-grid-now-line" />
              </div>
            )}
            {laidOut.map((b) => {
              const o = b.o;
              const phone = o.job.customer_phone;
              const showSms = b.showSms;
              const height = b.height;
              const nCols = b.nCols || 1;
              const leftPct = (b.col || 0) * (100 / nCols);
              return (
                <div
                  key={b.i}
                  className={`day-block${o.completed ? ' completed' : ''}`}
                  style={{ top: b.top, height, left: `calc(${leftPct}% + 4px)`, width: `calc(${100 / nCols}% - 8px)`, right: 'auto' }}
                  onClick={() => onOpen(o.job)}
                >
                  <div className="day-block-head">
                    <span className="day-block-time">{formatTimeOfDay(o.job.start_time)}</span>
                    {o.job.default_price != null && <span className="day-block-price">{formatPrice(o.job.default_price)}</span>}
                  </div>
                  <div className="day-block-title">{o.job.title}</div>
                  <div className="day-block-bottom">
                    <div className="day-block-customer">{jobCustomerName(o.job)}</div>
                    {(showSms || !o.completed || (o.completed && onUncomplete)) && (
                      <div className="day-block-actions">
                        {showSms && (
                          <select
                            className="day-block-sms"
                            onClick={(e) => e.stopPropagation()}
                            onChange={(e) => {
                              const tpl = smsTemplates.find((t) => t.id === e.target.value);
                              if (tpl) sendSmsTemplate(phone, tpl, o.job);
                              e.target.value = '';
                            }}
                            defaultValue=""
                          >
                            <option value="" disabled>💬 Text…</option>
                            {smsTemplates.map((t) => (
                              <option key={t.id} value={t.id}>{t.label}</option>
                            ))}
                          </select>
                        )}
                        {!o.completed && (
                          <button
                            className="day-block-complete"
                            onClick={(e) => { e.stopPropagation(); onMarkComplete(o.job, o.date); }}
                          >Mark complete</button>
                        )}
                        {o.completed && onUncomplete && (
                          <button
                            className="day-block-uncomplete"
                            onClick={(e) => { e.stopPropagation(); onUncomplete(o.job, o.date); }}
                          >Undo</button>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

function CalendarWeekGrid({ weekDays, weekByDate, todayStr, selectedDate, onSelectDate, onOpen }) {
  return (
    <div className="week-grid">
      {weekDays.map((d) => {
        const dateStr = formatYMD(d);
        const occs = weekByDate[dateStr] || [];
        const isToday = dateStr === todayStr;
        const isSelected = dateStr === selectedDate;
        return (
          <div key={dateStr} className={`week-col${isToday ? ' today' : ''}${isSelected ? ' selected' : ''}`}>
            <button className="week-col-head" onClick={() => onSelectDate(dateStr)}>
              <span className="week-col-dow">{d.toLocaleDateString(undefined, { weekday: 'short' })}</span>
              <span className="week-col-num">{d.getDate()}</span>
            </button>
            <div className="week-col-body">
              {occs.length === 0 ? (
                <div className="week-col-empty">—</div>
              ) : (
                occs.map((o, i) => (
                  <button
                    key={i}
                    className={`week-pill${o.completed ? ' done' : ''}`}
                    onClick={() => onOpen(o.job)}
                  >
                    <span className="week-pill-time">
                      {o.job.start_time ? formatTimeOfDay(o.job.start_time) : 'Anytime'}
                    </span>
                    <span className="week-pill-title">{o.job.title}</span>
                    <span className="week-pill-customer">{jobCustomerName(o.job)}</span>
                  </button>
                ))
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function CalendarMonthGrid({ today, todayStr, viewMonth, monthByDate, selectedDate, setSelectedDate, monthOffset, setMonthOffset, onChipClick, onMarkComplete, onUncomplete }) {
  const terms = useTerms();
  const monthStart = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1);
  const monthEnd = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 0);
  const firstDayOfWeek = monthStart.getDay();
  const daysInMonth = monthEnd.getDate();
  const cells = [];
  for (let i = 0; i < firstDayOfWeek; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);
  const monthLabel = viewMonth.toLocaleString(undefined, { month: 'long', year: 'numeric' });
  const dows = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const selectedOccurrences = selectedDate ? (monthByDate[selectedDate] || []) : [];

  return (
    <>
      <div className="calendar">
        <div className="cal-nav">
          <button className="secondary" onClick={() => setMonthOffset(monthOffset - 1)}>← Prev</button>
          <span className="cal-month">{monthLabel}</span>
          <button className="secondary" onClick={() => setMonthOffset(monthOffset + 1)}>Next →</button>
        </div>
        <div className="cal-grid">
          {dows.map((dow) => <div key={dow} className="cal-dow">{dow}</div>)}
          {cells.map((d, i) => {
            if (d === null) return <div key={i} className="cal-cell empty"></div>;
            const dateStr = `${viewMonth.getFullYear()}-${String(viewMonth.getMonth() + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            const occs = monthByDate[dateStr] || [];
            const isToday = dateStr === todayStr;
            const isSelected = dateStr === selectedDate;
            const classes = ['cal-cell'];
            if (isToday) classes.push('today');
            if (isSelected) classes.push('selected');
            return (
              <div key={i} className={classes.join(' ')} onClick={() => setSelectedDate(dateStr)}>
                <div className="cal-date">{d}</div>
                {occs.slice(0, 3).map((o, j) => (
                  <div
                    key={j}
                    className={`cal-chip ${o.completed ? 'done' : ''}`}
                    title={`${o.job.title} — ${jobCustomerName(o.job)}`}
                    onClick={(e) => { e.stopPropagation(); onChipClick(o.job); }}
                  >
                    {o.job.title}
                  </div>
                ))}
                {occs.length > 3 && <div className="cal-more">+{occs.length - 3} more</div>}
              </div>
            );
          })}
        </div>
      </div>

      {selectedDate && (
        <>
          <div className="section-heading">
            {formatDateString(selectedDate)}
            <span style={{ color: 'var(--text-muted)', fontWeight: 400, marginLeft: 8 }}>
              ({selectedOccurrences.length} {selectedOccurrences.length === 1 ? terms.jobLower : terms.jobsLower})
            </span>
          </div>
          <div className="list">
            {selectedOccurrences.length === 0 ? (
              <div className="list-empty">No {terms.jobsLower} scheduled.</div>
            ) : (
              selectedOccurrences.map((o, i) => (
                <OccurrenceRow
                  key={`${o.job.id}-${o.date}-${i}`}
                  occurrence={o}
                  onMarkComplete={onMarkComplete}
                  onUncomplete={onUncomplete}
                  onEdit={onChipClick}
                />
              ))
            )}
          </div>
        </>
      )}
    </>
  );
}

function ScheduleOccurrenceRow({ occurrence, busy, onMarkComplete, onSkip, onReschedule, onCancelReschedule, canMutate = true, allowShift = true }) {
  const [editing, setEditing] = useState(false);
  const [newDate, setNewDate] = useState(occurrence.date);

  if (editing) {
    return (
      <div className="row">
        <div className="info">
          <div className="name">Reschedule {formatDateString(occurrence.date)}</div>
          <div className="meta">Pick a new date</div>
        </div>
        <div className="actions inline-form">
          <input type="date" value={newDate} onChange={(e) => setNewDate(e.target.value)} />
          <button
            className="primary"
            disabled={busy || newDate === occurrence.date || !newDate}
            onClick={async () => {
              await onReschedule(occurrence.date, newDate);
              setEditing(false);
            }}
          >Save</button>
          <button className="secondary" onClick={() => setEditing(false)} disabled={busy}>Cancel</button>
        </div>
      </div>
    );
  }

  return (
    <div className="row">
      <div className="info">
        <div className="name">{formatDateString(occurrence.date)}</div>
        {occurrence.rescheduledFrom && (
          <div className="meta">Rescheduled from {formatDateString(occurrence.rescheduledFrom)}</div>
        )}
      </div>
      <div className="actions schedule-actions">
        <button className="primary" disabled={busy} onClick={() => onMarkComplete(occurrence.date)}>
          Mark complete
        </button>
        {canMutate && allowShift && (
          <>
            <button className="secondary" disabled={busy} onClick={() => onSkip(occurrence.date)}>Skip</button>
            {occurrence.rescheduledFrom ? (
              <button className="secondary" disabled={busy} onClick={() => onCancelReschedule(occurrence.rescheduledFrom)}>
                Undo reschedule
              </button>
            ) : (
              <button className="secondary" disabled={busy} onClick={() => setEditing(true)}>Reschedule</button>
            )}
          </>
        )}
      </div>
    </div>
  );
}

function JobScheduleView({ session, job, onBack, onMarkComplete, onChange, onEditDetails, features = { invoices: true } }) {
  const terms = useTerms();
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [page, setPage] = useState(0);
  const [showInvoiceForm, setShowInvoiceForm] = useState(false);
  const [invoiceFrom, setInvoiceFrom] = useState(formatYMD(new Date(todayStart().getFullYear(), todayStart().getMonth(), 1)));
  const [invoiceTo, setInvoiceTo] = useState(formatYMD(todayStart()));
  const [generateBusy, setGenerateBusy] = useState(false);
  const [generateResult, setGenerateResult] = useState(null);
  const PAGE_SIZE = 8;

  const canMutate = ['admin', 'lead'].includes(session.user.role);

  const isRecurring = job.type === 'recurring';
  const allUpcoming = (isRecurring
    ? computeOccurrences(job, todayStart(), 730)
    : (job.date ? [{ date: job.date, completed: job.status === 'completed', rescheduledFrom: null }] : [])
  ).filter((o) => !o.completed);
  const totalPages = Math.max(1, Math.ceil(allUpcoming.length / PAGE_SIZE));
  const safePage = Math.min(page, totalPages - 1);
  const upcoming = allUpcoming.slice(safePage * PAGE_SIZE, (safePage + 1) * PAGE_SIZE);
  const firstIndex = allUpcoming.length === 0 ? 0 : safePage * PAGE_SIZE + 1;
  const lastIndex = Math.min(allUpcoming.length, (safePage + 1) * PAGE_SIZE);

  useEffect(() => {
    if (page > 0 && page > totalPages - 1) setPage(Math.max(0, totalPages - 1));
  }, [page, totalPages]);

  const todayStr = formatYMD(todayStart());
  const futureSkipped = (job.skipped_dates || []).filter((d) => d >= todayStr).sort();
  // Completion history is the union of completed_dates (the source of truth for
  // "what got done") and completion_notes (richer per-visit metadata). Older /
  // migrated completions live only in completed_dates and have no note entry;
  // surface those as bare rows (_idx null) so nothing goes missing.
  const completionNotes = (job.completion_notes || []).map((c, idx) => ({ ...c, _idx: idx }));
  const notedDates = new Set(completionNotes.map((n) => n.date));
  const bareCompletions = (job.completed_dates || [])
    .filter((d) => !notedDates.has(d))
    .map((date) => ({ date, note: null, completedByName: null, _idx: null }));
  const completionHistory = [...completionNotes, ...bareCompletions]
    .sort((a, b) => b.date.localeCompare(a.date));
  const [editingCompletionDate, setEditingCompletionDate] = useState(null);
  const [editedNote, setEditedNote] = useState('');

  async function call(fn) {
    setBusy(true); setError(null);
    try {
      const updated = await fn();
      await onChange(updated);
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  const skip = (date) => call(() => apiRequest(`/api/jobs/${job.id}/skip`, {
    method: 'POST', slug: session.slug, token: session.token, body: { date },
  }));
  const unskip = (date) => call(() => apiRequest(`/api/jobs/${job.id}/skip/${date}`, {
    method: 'DELETE', slug: session.slug, token: session.token,
  }));
  const reschedule = (date, new_date) => call(() => apiRequest(`/api/jobs/${job.id}/reschedule`, {
    method: 'POST', slug: session.slug, token: session.token, body: { date, new_date },
  }));
  const cancelReschedule = (date) => call(() => apiRequest(`/api/jobs/${job.id}/reschedule/${date}`, {
    method: 'DELETE', slug: session.slug, token: session.token,
  }));

  function saveCompletionEdit(date) {
    return call(() => apiRequest(`/api/jobs/${job.id}/completions/by-date/${date}`, {
      method: 'PUT', slug: session.slug, token: session.token,
      body: { note: editedNote },
    })).then(() => { setEditingCompletionDate(null); setEditedNote(''); });
  }

  function deleteCompletion(date) {
    if (!confirm(`Undo the completion on ${formatDateString(date)}? The visit moves back to upcoming and any matching line item is pulled from the open draft invoice.`)) return;
    return call(() => apiRequest(`/api/jobs/${job.id}/completions/by-date/${date}`, {
      method: 'DELETE', slug: session.slug, token: session.token,
    }));
  }

  async function generateInvoice() {
    setGenerateBusy(true); setError(null); setGenerateResult(null);
    try {
      const inv = await apiRequest(`/api/jobs/${job.id}/generate-invoice`, {
        method: 'POST', slug: session.slug, token: session.token,
        body: { from: invoiceFrom, to: invoiceTo },
      });
      setGenerateResult(inv);
      setShowInvoiceForm(false);
    } catch (err) { setError(err.message); }
    finally { setGenerateBusy(false); }
  }

  const completionsInRange = (job.completed_dates || []).filter((d) => d >= invoiceFrom && d <= invoiceTo);
  const projectedTotal = completionsInRange.length * (parseFloat(job.default_price) || 0);

  return (
    <div>
      <BackLink onClick={onBack}>All {terms.jobsLower}</BackLink>
      <div className="page-header">
        <h2>Schedule</h2>
        {onEditDetails && (
          <button className="secondary" onClick={onEditDetails}>Edit {terms.jobLower} →</button>
        )}
      </div>
      <div className="schedule-summary">
        <strong style={{ color: 'var(--text)' }}>{job.title}</strong> — {jobCustomerName(job)} · {formatSchedule(job)}
        {canMutate && features.invoices && (
          <div style={{ marginTop: 10 }}>
            <button className="secondary" onClick={() => { setShowInvoiceForm((v) => !v); setGenerateResult(null); }}>
              {showInvoiceForm ? 'Hide invoice generator' : 'Generate invoice from completions'}
            </button>
          </div>
        )}
      </div>

      {showInvoiceForm && (
        <div className="form-card">
          <div className="section-heading" style={{ marginTop: 0 }}>Bill completed visits</div>
          <div className="form-grid">
            <div>
              <label>From</label>
              <input type="date" value={invoiceFrom} onChange={(e) => setInvoiceFrom(e.target.value)} />
            </div>
            <div>
              <label>To</label>
              <input type="date" value={invoiceTo} onChange={(e) => setInvoiceTo(e.target.value)} />
            </div>
          </div>
          <p className="subtitle" style={{ marginTop: 14, marginBottom: 0 }}>
            {completionsInRange.length === 0 ? (
              <>No completed visits in this range.</>
            ) : (
              <>{completionsInRange.length} completed visit{completionsInRange.length === 1 ? '' : 's'} @ {formatPrice(parseFloat(job.default_price) || 0)} = <strong style={{ color: 'var(--text)' }}>{formatPrice(projectedTotal)}</strong></>
            )}
          </p>
          <div className="form-actions">
            <button
              className="primary"
              disabled={generateBusy || completionsInRange.length === 0}
              onClick={generateInvoice}
            >
              {generateBusy ? 'Generating...' : `Create draft invoice`}
            </button>
            <button className="secondary" onClick={() => setShowInvoiceForm(false)} disabled={generateBusy}>Cancel</button>
          </div>
        </div>
      )}

      {generateResult && (
        <div className="error" style={{ background: '#e8f1ec', color: '#1f6f4a' }}>
          Created invoice #{generateResult.invoice_number} with {generateResult.line_items.length} line items. Switch to the Invoices tab to review and send.
        </div>
      )}

      {error && <div className="error">{error}</div>}

      <div className="section-heading">Upcoming</div>
      <div className="list">
        {upcoming.length === 0 ? (
          <div className="list-empty">
            {isRecurring
              ? 'No upcoming occurrences. The series may be fully completed or past its end date.'
              : `This ${terms.jobLower} is done — see the history below.`}
          </div>
        ) : (
          upcoming.map((o) => (
            <ScheduleOccurrenceRow
              key={o.date}
              occurrence={o}
              busy={busy}
              canMutate={canMutate}
              onMarkComplete={onMarkComplete}
              onSkip={skip}
              onReschedule={reschedule}
              onCancelReschedule={cancelReschedule}
              allowShift={isRecurring}
            />
          ))
        )}
      </div>
      {allUpcoming.length > PAGE_SIZE && (
        <div className="pager">
          <button className="secondary" onClick={() => setPage(safePage - 1)} disabled={safePage === 0}>← Prev</button>
          <span className="info">Showing {firstIndex}–{lastIndex} of {allUpcoming.length}</span>
          <button className="secondary" onClick={() => setPage(safePage + 1)} disabled={safePage >= totalPages - 1}>Next →</button>
        </div>
      )}

      {futureSkipped.length > 0 && (
        <>
          <div className="section-heading">Skipped</div>
          <div className="list">
            {futureSkipped.map((d) => (
              <div key={d} className="row">
                <div className="info"><div className="name">{formatDateString(d)}</div></div>
                <div className="actions">
                  <button className="secondary" disabled={busy} onClick={() => unskip(d)}>Restore</button>
                </div>
              </div>
            ))}
          </div>
        </>
      )}

      {completionHistory.length > 0 && (
        <>
          <div className="section-heading">Completion history</div>
          <div className="list">
            {completionHistory.map((c) => {
              const isEditing = editingCompletionDate === c.date;
              return (
                <div key={c.date} className="row">
                  <div className="info">
                    <div className="name">{formatDateString(c.date)}</div>
                    {isEditing ? (
                      <div className="meta" style={{ marginTop: 6, display: 'flex', gap: 8 }}>
                        <input
                          value={editedNote}
                          onChange={(e) => setEditedNote(e.target.value)}
                          placeholder="Note (or leave empty to clear)"
                          style={{ flex: 1 }}
                        />
                      </div>
                    ) : c.completedByName ? (
                      <div className="meta">by {c.completedByName}{c.note && <> — “{c.note}”</>}</div>
                    ) : c.note ? (
                      <div className="meta">“{c.note}”</div>
                    ) : (
                      <div className="meta">Completed</div>
                    )}
                  </div>
                  {canMutate && (
                    <div className="actions">
                      {isEditing ? (
                        <>
                          <button className="primary" disabled={busy} onClick={() => saveCompletionEdit(c.date)}>Save</button>
                          <button className="secondary" disabled={busy} onClick={() => { setEditingCompletionDate(null); setEditedNote(''); }}>Cancel</button>
                        </>
                      ) : (
                        <>
                          <button className="secondary" onClick={() => { setEditingCompletionDate(c.date); setEditedNote(c.note || ''); }}>{c.note ? 'Edit note' : 'Add note'}</button>
                          <button className="danger" disabled={busy} onClick={() => deleteCompletion(c.date)}>Undo</button>
                        </>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </>
      )}
    </div>
  );
}

function JobsImportView({ session, onDone, onCancel }) {
  const terms = useTerms();
  const [text, setText] = useState('');
  const [parsed, setParsed] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [result, setResult] = useState(null);

  const VALID_COLS = new Set(['customer', 'customer_phone', 'title', 'date', 'start_time', 'duration_minutes', 'default_price', 'description']);
  const SAMPLE = 'customer,title,date,start_time,duration_minutes,default_price\nNeil Liley,Standard Cut,2026-07-27,15:00,60,100\nMark Leach,Enhanced Cut,2026-07-27,12:00,45,150';

  function handleParse() {
    setError(null); setResult(null);
    try {
      const out = parseCSV(text);
      if (out.rows.length === 0) {
        setError('No rows to import. Include a header row plus at least one data row.');
        setParsed(null); return;
      }
      const unknown = out.headers.filter((h) => !VALID_COLS.has(h));
      if (unknown.length > 0) {
        setError(`Unknown columns: ${unknown.join(', ')}. Allowed: ${[...VALID_COLS].join(', ')}.`);
        setParsed(null); return;
      }
      if (!out.headers.includes('title') || !out.headers.includes('date')) {
        setError('CSV must include at least a title and a date column.');
        setParsed(null); return;
      }
      if (!out.headers.includes('customer') && !out.headers.includes('customer_phone')) {
        setError(`CSV must include a customer or customer_phone column so each ${terms.jobLower} can be matched to a ${terms.customerLower}.`);
        setParsed(null); return;
      }
      setParsed(out);
    } catch (err) { setError(err.message); }
  }

  async function handleImport() {
    if (!parsed) return;
    setBusy(true); setError(null); setResult(null);
    try {
      const data = await apiRequest('/api/jobs/import', {
        method: 'POST', slug: session.slug, token: session.token,
        body: { rows: parsed.rows },
      });
      setResult(data);
      if (data.inserted_count > 0) onDone();
    } catch (err) {
      const un = err.data && Array.isArray(err.data.unmatched) && err.data.unmatched.length
        ? ` Unmatched ${terms.customersLower}: ${err.data.unmatched.join(', ')}.` : '';
      setError(err.message + un);
    }
    finally { setBusy(false); }
  }

  return (
    <div>
      <div className="page-header"><h2>Import {terms.jobsLower} from CSV</h2></div>
      {error && <div className="error">{error}</div>}
      {result && (
        <div className="error" style={{ background: '#e8f1ec', color: '#1f6f4a' }}>
          Imported {result.inserted_count} {terms.jobsLower} ({result.skipped_count} skipped).
          {Array.isArray(result.unmatched) && result.unmatched.length > 0 && (
            <div style={{ marginTop: 6 }}>
              Skipped — no matching {terms.customerLower}: {result.unmatched.join(', ')}
            </div>
          )}
        </div>
      )}
      <div className="form-card">
        <label>CSV <span className="hint">(header row required; columns: {[...VALID_COLS].join(', ')}. Each row is matched to an existing {terms.customerLower} by name or phone — import {terms.customersLower} first.)</span></label>
        <textarea
          rows={10}
          value={text}
          onChange={(e) => setText(e.target.value)}
          placeholder={SAMPLE}
          style={{ fontFamily: 'ui-monospace, Menlo, monospace', fontSize: 13 }}
        />
        <div className="form-actions">
          <button type="button" className="secondary" onClick={handleParse} disabled={busy || !text.trim()}>Preview</button>
          {parsed && (
            <button type="button" className="primary" onClick={handleImport} disabled={busy}>
              {busy ? 'Importing...' : `Import ${parsed.rows.length} ${parsed.rows.length === 1 ? terms.jobLower : terms.jobsLower}`}
            </button>
          )}
          <button type="button" className="secondary" onClick={onCancel} disabled={busy}>Back</button>
        </div>
      </div>

      {parsed && (
        <>
          <div className="section-heading">Preview ({parsed.rows.length} {parsed.rows.length === 1 ? 'row' : 'rows'})</div>
          <div className="form-card">
            <div className="csv-preview-wrap">
              <table className="csv-preview-table">
                <thead>
                  <tr>{parsed.headers.map((h) => <th key={h}>{h}</th>)}</tr>
                </thead>
                <tbody>
                  {parsed.rows.slice(0, 50).map((row, i) => (
                    <tr key={i}>{parsed.headers.map((h) => <td key={h}>{row[h] || '—'}</td>)}</tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function JobsView({ session, features = { invoices: true }, planContext, smsTemplates = [], defaultAddToDraft = false }) {
  const [firstJobToast, setFirstJobToast] = useState(false);
  const terms = useTerms();
  const wideToolbar = useMediaQuery('(min-width: 681px)');
  const atCap = planContext && planContext.atCap;
  const [jobs, setJobs] = useState([]);
  const [customers, setCustomers] = useState([]);
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [mode, setMode] = useState('list');
  const [editing, setEditing] = useState(null);
  const [busy, setBusy] = useState(false);
  const [completionInitialDate, setCompletionInitialDate] = useState(null);
  const [returnMode, setReturnMode] = useState('list');
  const [layout, setLayout] = useState('calendar');
  const [search, setSearch] = useState('');
  const [sort, setSort] = useState('newest');
  // Calendar view state lives here (not inside CalendarView) so it survives the
  // round-trip to the edit/create form — "back" returns to the same view + date.
  const [calView, setCalView] = useState('day');
  const [calDate, setCalDate] = useState(formatYMD(todayStart()));
  const [calMonthOffset, setCalMonthOffset] = useState(0);
  const [createInitial, setCreateInitial] = useState(null);

  const canMutate = ['admin', 'lead'].includes(session.user.role);

  function exportJobs() {
    const headers = ['title', 'customer', 'type', 'schedule', 'default_price', 'status', 'description'];
    const rows = jobs.map((j) => [
      j.title, jobCustomerName(j), j.type, formatSchedule(j),
      j.default_price, j.status, j.description,
    ]);
    downloadCSV(`jobs-${formatYMD(new Date())}.csv`, headers, rows);
  }

  const refresh = useCallback(async () => {
    setLoading(true); setError(null);
    try {
      const [jobsData, customersData, usersData] = await Promise.all([
        apiRequest('/api/jobs', { slug: session.slug, token: session.token }),
        apiRequest('/api/customers', { slug: session.slug, token: session.token }),
        apiRequest('/api/auth/users', { slug: session.slug, token: session.token }),
      ]);
      setJobs(jobsData);
      setCustomers(customersData);
      setUsers(usersData);
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  }, [session.slug, session.token]);

  useEffect(() => { refresh(); }, [refresh]);

  // Honor ?open=<jobId> in the URL — used by Dashboard "Open" buttons so a
  // tap on an upcoming/overdue card lands the user directly on that job.
  useEffect(() => {
    if (jobs.length === 0) return;
    const params = new URLSearchParams(window.location.search);
    const openId = params.get('open');
    if (!openId) return;
    const target = jobs.find((j) => j.id === openId);
    if (!target) return;
    setEditing(target);
    // Clicking a job always lands on Edit; an explicit ?view=schedule (from a
    // "Manage schedule" button) opens the schedule instead.
    const view = params.get('view');
    setMode(view === 'schedule' ? 'schedule' : 'edit');
    // Strip the query params so reload / back nav doesn't keep reopening.
    const url = new URL(window.location.href);
    url.searchParams.delete('open');
    url.searchParams.delete('view');
    window.history.replaceState({}, '', url.pathname + (url.search ? url.search : '') + url.hash);
  }, [jobs]);

  function openCreateAt(date, start_time) {
    setEditing(null);
    setError(null);
    setCreateInitial({ type: 'single', date, start_time });
    setMode('create');
  }

  // After a save, point the calendar at the job's date so the change is
  // visible (e.g. rescheduling to today jumps the view to today).
  function focusCalendarOn(dateStr) {
    if (!dateStr) return;
    setCalDate(dateStr);
    const t = todayStart();
    const d = parseDate(dateStr);
    setCalMonthOffset((d.getFullYear() - t.getFullYear()) * 12 + (d.getMonth() - t.getMonth()));
  }

  // Warn on a double-booking; OK books anyway, Cancel returns to the form to
  // pick a different time. Returns true if the save should be aborted.
  function blockedByConflict(values, excludeId) {
    const c = findJobTimeConflict(jobs, values, excludeId);
    if (!c) return false;
    const t = c.job.start_time ? ` at ${formatTimeOfDay(c.job.start_time)}` : '';
    return !confirm(
      `This overlaps with an existing ${terms.jobLower}: ${c.job.title} — ${jobCustomerName(c.job)}${t}.\n\n`
      + 'OK to book anyway, or Cancel to change the time.'
    );
  }

  async function createJob(values) {
    if (blockedByConflict(values, null)) return;
    setBusy(true); setError(null);
    const wasFirst = jobs.length === 0;
    try {
      await apiRequest('/api/jobs', {
        method: 'POST', slug: session.slug, token: session.token, body: values,
      });
      setCreateInitial(null);
      setMode('list');
      focusCalendarOn(values.type === 'single' ? values.date : values.start_date);
      await refresh();
      if (wasFirst) {
        const seenKey = `fm_first_job_seen_${session.organization && session.organization.id}`;
        try {
          if (!localStorage.getItem(seenKey)) {
            localStorage.setItem(seenKey, '1');
            setFirstJobToast(true);
            setTimeout(() => setFirstJobToast(false), 6500);
          }
        } catch (e) {}
      }
    } catch (err) { setError(err); }
    finally { setBusy(false); }
  }

  async function updateJob(values) {
    if (blockedByConflict(values, editing.id)) return;
    setBusy(true); setError(null);
    try {
      await apiRequest(`/api/jobs/${editing.id}`, {
        method: 'PUT', slug: session.slug, token: session.token, body: values,
      });
      setEditing(null); setMode('list');
      focusCalendarOn(values.type === 'single' ? values.date : values.start_date);
      await refresh();
    } catch (err) { setError(err); }
    finally { setBusy(false); }
  }

  async function deleteJob(id) {
    if (!confirm(`Delete this ${terms.jobLower}?`)) return;
    setError(null);
    try {
      await apiRequest(`/api/jobs/${id}`, {
        method: 'DELETE', slug: session.slug, token: session.token,
      });
      await refresh();
    } catch (err) { setError(err); }
  }

  async function completeJob(values) {
    setBusy(true); setError(null);
    try {
      const updated = await apiRequest(`/api/jobs/${editing.id}/complete`, {
        method: 'POST', slug: session.slug, token: session.token, body: values,
      });
      await refresh();
      if (returnMode === 'schedule') {
        setEditing(updated);
        setMode('schedule');
      } else {
        setEditing(null);
        setMode('list');
      }
      setReturnMode('list');
      setCompletionInitialDate(null);
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  async function uncompleteOccurrence(job, date) {
    const completed = Array.isArray(job.completed_dates) ? job.completed_dates : [];
    if (!completed.includes(date)) return;
    if (!confirm(`Undo the completion on ${formatDateString(date)}? If it was added to a draft invoice, the matching line is pulled.`)) return;
    setBusy(true); setError(null);
    try {
      await apiRequest(`/api/jobs/${job.id}/completions/by-date/${date}`, {
        method: 'DELETE', slug: session.slug, token: session.token,
      });
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  function handleScheduleChange(updatedJob) {
    setEditing(updatedJob);
    return refresh();
  }

  function handleScheduleMarkComplete(date) {
    setCompletionInitialDate(date);
    setReturnMode('schedule');
    setMode('complete');
  }

  function userNames(ids) {
    return ids

function LineItemsEditor({ items, onChange }) {
  function update(idx, field, value) {
    const next = items.map((item, i) => {
      if (i !== idx) return item;
      const updated = { ...item, [field]: value };
      const q = parseFloat(updated.quantity);
      const r = parseFloat(updated.rate);
      updated.amount = (isFinite(q) ? q : 0) * (isFinite(r) ? r : 0);
      return updated;
    });
    onChange(next);
  }

  function add() {
    onChange([...items, { description: '', quantity: 1, rate: 0, amount: 0 }]);
  }

  function remove(idx) {
    onChange(items.filter((_, i) => i !== idx));
  }

  const total = items.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);

  return (
    <div>
      {items.length === 0 ? (
        <div className="line-items-empty">No line items yet. Click "Add line item" to start.</div>
      ) : (
        <table className="line-items-table">
          <thead>
            <tr>
              <th className="col-desc">Description</th>
              <th>Qty</th>
              <th>Rate</th>
              <th style={{ textAlign: 'right' }}>Amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {items.map((item, idx) => (
              <tr key={idx}>
                <td className="col-desc">
                  <input
                    value={item.description || ''}
                    onChange={(e) => update(idx, 'description', e.target.value)}
                    placeholder="e.g. Weekly mow service"
                  />
                </td>
                <td className="col-qty">
                  <input
                    type="number" step="0.01" min="0"
                    value={item.quantity ?? ''}
                    onChange={(e) => update(idx, 'quantity', e.target.value)}
                  />
                </td>
                <td className="col-rate">
                  <input
                    type="number" step="0.01" min="0"
                    value={item.rate ?? ''}
                    onChange={(e) => update(idx, 'rate', e.target.value)}
                  />
                </td>
                <td className="col-amount">{formatPrice(item.amount)}</td>
                <td className="col-remove">
                  <button type="button" onClick={() => remove(idx)} aria-label="Remove">×</button>
                </td>
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr>
              <td colSpan="3" style={{ textAlign: 'right' }}>Total</td>
              <td className="col-amount">{formatPrice(total)}</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      )}
      <button type="button" className="secondary" onClick={add}>+ Add line item</button>
    </div>
  );
}

function lineItemsTotal(items) {
  return (items || []).reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
}

function invoiceMath(inv) {
  const subtotal = lineItemsTotal(inv.line_items);
  let discount = 0;
  const dv = parseFloat(inv.discount_value) || 0;
  if (dv > 0 && (inv.discount_type === 'percent' || inv.discount_type === 'amount')) {
    discount = inv.discount_type === 'percent' ? subtotal * dv / 100 : dv;
  }
  const discounted = Math.max(0, subtotal - discount);
  const taxRate = parseFloat(inv.tax_rate) || 0;
  const tax = discounted * taxRate / 100;
  const total = discounted + tax;
  // Prepaid credit applied to this invoice reduces what's still owed.
  const creditApplied = Math.max(0, parseFloat(inv.credit_applied) || 0);
  const balanceDue = Math.max(0, total - creditApplied);
  return { subtotal, discount, discounted, taxRate, tax, total, creditApplied, balanceDue };
}

function isInvoiceLate(inv) {
  if (inv.status !== 'sent' || !inv.sent_date) return false;
  const sent = new Date(inv.sent_date);
  const ageDays = (Date.now() - sent.getTime()) / (1000 * 60 * 60 * 24);
  return ageDays > 30;
}

function daysOutstanding(inv) {
  if (!inv.sent_date) return 0;
  const sent = new Date(inv.sent_date);
  return Math.floor((Date.now() - sent.getTime()) / (1000 * 60 * 60 * 24));
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/).map((l) => l).filter((l) => l.trim().length > 0);
  if (lines.length === 0) return { headers: [], rows: [] };
  function splitLine(line) {
    const out = [];
    let cur = '';
    let inQuote = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQuote && line[i + 1] === '"') { cur += '"'; i++; }
        else { inQuote = !inQuote; }
      } else if (c === ',' && !inQuote) {
        out.push(cur);
        cur = '';
      } else {
        cur += c;
      }
    }
    out.push(cur);
    return out.map((s) => s.trim());
  }
  const headers = splitLine(lines[0]).map((h) => h.toLowerCase().replace(/\s+/g, '_'));
  const rows = lines.slice(1).map((line) => {
    const cells = splitLine(line);
    const row = {};
    headers.forEach((h, i) => { row[h] = cells[i] === undefined ? '' : cells[i]; });
    return row;
  });
  return { headers, rows };
}

function searchMatches(needle, ...fields) {
  if (!needle) return true;
  const n = needle.toLowerCase().trim();
  if (!n) return true;
  return fields.some((f) => f && String(f).toLowerCase().includes(n));
}

function downloadCSV(filename, headers, rows) {
  const escape = (cell) => {
    if (cell == null) return '';
    const s = String(cell);
    return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const csv = [headers, ...rows].map((row) => row.map(escape).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 200);
}

function sortBy(items, key, dir = 'asc') {
  const arr = [...items];
  arr.sort((a, b) => {
    const av = typeof key === 'function' ? key(a) : a[key];
    const bv = typeof key === 'function' ? key(b) : b[key];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === 'number' && typeof bv === 'number') return dir === 'asc' ? av - bv : bv - av;
    return dir === 'asc' ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
  });
  return arr;
}

function computeProjectedIncome(jobs, fromStr, toStr) {
  const todayStr = formatYMD(todayStart());
  const effectiveFrom = fromStr > todayStr ? fromStr : todayStr;
  if (effectiveFrom > toStr) return 0;
  let total = 0;
  for (const job of jobs) {
    if (!job.default_price) continue;
    const price = parseFloat(job.default_price);
    if (!isFinite(price) || price <= 0) continue;
    const upcoming = jobOccurrencesInRange(job, effectiveFrom, toStr).filter((o) => !o.completed);
    total += upcoming.length * price;
  }
  return total;
}
