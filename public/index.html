    .dtable .c-main { min-width: 0; }
    .dtable .c-main .t { font-size: 14px; font-weight: 500; color: var(--text); }
    .dtable .c-main .s {
      font-size: 12px; color: var(--text-muted); margin-top: 1px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .dtable .c-when {
      font-size: 12.5px; color: var(--text-muted); white-space: nowrap;
      min-width: 0; overflow: hidden; text-overflow: ellipsis;
    }
    .dtable .c-amt {
      text-align: right; font-size: 14px; font-weight: 600;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .dtable .c-amt .due { display: block; font-size: 11px; font-weight: 500; color: var(--text-muted); }
    .dtable .c-act { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
    .dtable .c-act .secondary { font-size: 12px; padding: 5px 11px; white-space: nowrap; }

    /* Invoice columns: number, who, date, status, amount, actions. */
    .inv-row { grid-template-columns: 74px minmax(0, 1fr) 104px 104px 124px 136px; }
    @container (max-width: 950px) {
      .inv-row { grid-template-columns: 62px minmax(0, 1fr) 96px 112px 132px; }
      .inv-row .c-when { display: none; }
    }
    @container (max-width: 640px) {
      /* Two lines on a phone: identity above, money and actions below. */
      .inv-row { grid-template-columns: 60px minmax(0, 1fr) auto; gap: 6px 12px; }
      .inv-row .c-when { display: none; }
      .inv-row > span:nth-child(4) { grid-column: 2; justify-self: start; }
      .inv-row .c-amt { grid-column: 3; grid-row: 1; }
      .inv-row .c-act { grid-column: 3; grid-row: 2; }
      .dtable-head.inv-row { display: none; }
    }

    /* Customer columns: who, where, how to reach them, what they owe. */
    .cust-row { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 128px minmax(0, 190px) 110px 52px; }
    .cust-row .c-owes { color: var(--danger); }
    @container (max-width: 1050px) {
      .cust-row { grid-template-columns: minmax(0, 1.2fr) 128px minmax(0, 190px) 110px 52px; }
      .cust-row .c-where { display: none; }
    }
    @container (max-width: 830px) {
      .cust-row { grid-template-columns: minmax(0, 1fr) 128px 110px 52px; }
      .cust-row .c-email { display: none; }
    }
    @container (max-width: 640px) {
      .cust-row { grid-template-columns: minmax(0, 1fr) auto 44px; gap: 4px 12px; }
      .cust-row .c-email, .cust-row .c-where { display: none; }
      .cust-row .c-phone { grid-column: 1; font-size: 12px; }
      .cust-row .c-amt { grid-column: 2; grid-row: 1; }
      .cust-row .c-act { grid-column: 3; grid-row: 1 / span 2; }
      .dtable-head.cust-row { display: none; }
    }

    /* Job columns: what, for whom, how often, when next, who's on it, price. */
    .job-row { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 150px 108px 76px 84px 52px; }
    .job-row .c-crew { display: flex; }
    .job-row .c-crew .job-avatars { margin: 0; }
    /* "Every other Thursday" is wider than the column, and nowrap alone lets
       it run into the next one. */
    .job-row .c-cadence { overflow: hidden; text-overflow: ellipsis; }
    .job-row .c-main .s-who { display: none; }
    @container (max-width: 1130px) {
      .job-row { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) 150px 108px 84px 52px; }
      .job-row .c-crew { display: none; }
    }
    @container (max-width: 950px) {
      .job-row { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) 108px 84px 52px; }
      .job-row .c-crew, .job-row .c-cadence { display: none; }
    }
    @container (max-width: 770px) {
      .job-row { grid-template-columns: minmax(0, 1fr) 108px 84px 52px; }
      .job-row .c-crew, .job-row .c-cadence, .job-row .c-who { display: none; }
      /* Who the job is for matters more than when it was last done, so when
         the customer column goes it takes over the sub-line rather than
         disappearing off the row. */
      .job-row .c-main .s-last { display: none; }
      .job-row .c-main .s-who { display: block; }
    }
    @container (max-width: 640px) {
      .job-row { grid-template-columns: minmax(0, 1fr) auto 44px; gap: 4px 12px; }
      .job-row .c-next { grid-column: 1; font-size: 12px; }
      .job-row .c-amt { grid-column: 2; grid-row: 1; }
      .job-row .c-act { grid-column: 3; grid-row: 1 / span 2; }
      .dtable-head.job-row { display: none; }
    }

    /* Quote columns: who it's for, when, where it stands, what it's worth. */
    .quote-row { grid-template-columns: minmax(0, 1fr) 108px 108px 124px 132px; }
    @container (max-width: 850px) {
      .quote-row { grid-template-columns: minmax(0, 1fr) 108px 124px 132px; }
      .quote-row .c-when { display: none; }
    }
    @container (max-width: 640px) {
      .quote-row { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; }
      .quote-row .c-when { display: none; }
      .quote-row .c-status { grid-column: 1; justify-self: start; }
      .quote-row .c-amt { grid-column: 2; grid-row: 1; }
      .quote-row .c-act { grid-column: 2; grid-row: 2; }
      .dtable-head.quote-row { display: none; }
    }

    /* Request columns: who, what they asked for, when, where it stands.
       What they typed can run to several lines, so these rows align to the
       top and the detail column wraps rather than truncating. */
    .req-row { grid-template-columns: 190px minmax(0, 1fr) 128px 92px 178px; align-items: start; }
    .req-row .c-main .s { white-space: normal; overflow: visible; }
    /* mailto:/tel: are real links so they work from a phone, but they read as
       contact details here, not as navigation. */
    .req-row .c-main .s a { color: inherit; text-decoration: none; }
    .req-row .c-main .s a:hover { text-decoration: underline; }
    .req-row .c-what { min-width: 0; font-size: 13px; color: var(--text); display: grid; gap: 3px; }
    .req-row .c-what .d { font-size: 12px; color: var(--text-muted); }
    .req-row .c-act { flex-wrap: wrap; justify-content: flex-start; }
    /* The decline note needs a real text box, so it drops below the columns. */
    .req-row .c-decline { grid-column: 1 / -1; margin-top: 10px; }
    @container (max-width: 1050px) {
      .req-row { grid-template-columns: 180px minmax(0, 1fr) 92px 178px; }
      .req-row .c-when { display: none; }
    }
    @container (max-width: 770px) {
      .req-row { grid-template-columns: minmax(0, 1fr) 92px; gap: 8px 14px; }
      .req-row .c-when { display: none; }
      .req-row .c-what { grid-column: 1; }
      .req-row .c-act { grid-column: 1 / -1; }
      .dtable-head.req-row { display: none; }
    }

    .rowmenu { position: relative; flex: none; }
    /* Looks like a button everywhere. It used to be three bare dots that grew
       a border on hover, which told a laptop what it was only once the pointer
       was already on it, and told a phone nothing at all. */
    .rowmenu-trigger {
      font-family: inherit; font-size: 16px; line-height: 1; cursor: pointer;
      color: var(--text); background: var(--card);
      border: 1px solid var(--border); border-radius: 8px;
      width: 32px; height: 32px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      transition: border-color 0.12s, background 0.12s;
    }
    .rowmenu-trigger:hover { border-color: var(--border-strong); background: var(--bg); }
    /* A thumb needs more to aim at than a pointer does. */
    @media (max-width: 680px) {
      .rowmenu-trigger { width: 34px; height: 34px; }
    }
    .rowmenu-trigger:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
    /* Fixed, and placed by RowMenu — see the comment there. */
    .rowmenu-pop {
      position: fixed; z-index: 70;
      min-width: 176px; max-width: calc(100vw - 16px); background: var(--card);
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: var(--shadow-md); padding: 5px; display: grid; gap: 1px;
    }
    .rowmenu-section {
      margin: 6px 0 2px; padding: 0 11px;
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-muted);
    }
    .rowmenu-item.checked { font-weight: 600; }
    .rowmenu-tick { margin-left: auto; color: var(--primary); font-size: 12px; }

    .rowmenu-item {
      font-family: inherit; font-size: 13px; text-align: left;
      color: var(--text); background: none; border: 0;
      padding: 8px 11px; border-radius: 6px; cursor: pointer; white-space: nowrap;
      display: flex; align-items: center; gap: 14px;
    }
    .rowmenu-item:hover { background: var(--row-hover); }
    .rowmenu-item.danger { color: var(--danger); }
    .rowmenu-item.danger:hover { background: var(--danger-bg); }

    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    .page-header h2 { margin: 0; font-size: 22px; }
    /* Headers carrying status pills need room between the items and the
       freedom to wrap; plain headers keep their existing two-child layout. */
    .page-header.with-pills { gap: 10px; flex-wrap: wrap; justify-content: flex-start; }
    .page-header .header-actions { display: flex; gap: 8px; margin-left: auto; }
    .header-pills { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    @media (max-width: 600px) {
      /* Once the name, the pills and the button stop fitting on one line,
         put the name and the button on the first row and drop the pills
         beneath them, rather than letting the button wrap alone. */
      .page-header.with-pills .header-actions { order: 2; }
      .page-header.with-pills .header-pills { order: 3; flex-basis: 100%; }
    }

    /* List */
    .list {
      background: var(--card); border-radius: 12px;
      border: 1px solid var(--border); overflow: hidden;
      box-shadow: var(--shadow-sm);
    }
    .list-empty { padding: 56px 24px; text-align: center; color: var(--text-muted); font-size: 14px; }
    /* A line of text with an action beside it. On a laptop they sit at either
       end; on a phone the button wraps to its own line, where space-between
       parks it at the left while the sentence above it is centred. */
    .empty-split {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }
    @media (max-width: 680px) { .empty-split { justify-content: center; } }
    .row {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; transition: background 0.12s;
    }
    .row:last-child { border-bottom: none; }
    .row:hover { background: var(--row-hover); }
    .row-link { cursor: pointer; }
    /* ---- screen help ---- */
    .helpbtn {
      width: 30px; height: 30px; flex: none; border-radius: 50%; cursor: pointer;
      border: 1px solid var(--border-strong); background: var(--card); color: var(--text-muted);
      font: 600 14px/1 'Inter', sans-serif; display: inline-grid; place-items: center; padding: 0;
      transition: color 0.15s, border-color 0.15s;
    }
    .helpbtn:hover { color: var(--text); border-color: var(--primary); }
    .helpbtn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    /* The first-visit spotlight. The lit button is a copy placed over the real
       one: the real one lives inside the top bar's stacking context and could
       not be lifted above a full-page dim. */
    .helpspot { position: fixed; inset: 0; z-index: 1600; background: rgba(20, 16, 10, 0.5); animation: helpspot-dim 2.8s ease both; cursor: pointer; }
    .helpspot-btn { position: fixed; color: var(--text); border-color: #fff; background: #fff; animation: helpspot-pulse 1.1s ease-out 2; }
    .helpspot-label { position: fixed; max-width: 220px; padding: 9px 13px; border-radius: 10px; background: #fff; color: var(--text); font-size: 13.5px; line-height: 1.35; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5); }
    .helpspot-label b { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border-strong); font-size: 11px; }
    @keyframes helpspot-dim { 0% { opacity: 0; } 10%, 84% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes helpspot-pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.75); } 100% { box-shadow: 0 0 0 22px rgba(255, 255, 255, 0); } }
    @media (prefers-reduced-motion: reduce) { .helpspot { animation: none; } .helpspot-btn { animation: none; box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.45); } }
    .helpsheet { max-width: 460px; max-height: min(86vh, 640px); overflow-y: auto; }
    .helpsheet-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
    .helpsheet-intro { margin: 0 0 16px; font-size: 14.5px; line-height: 1.55; color: var(--text-muted); }
    .helpsheet-tips { margin: 0; border-top: 1px solid var(--border); }
    .helpsheet-tips > div { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .helpsheet-tips dt { font-weight: 600; font-size: 14.5px; margin-bottom: 3px; }
    .helpsheet-tips dd { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--text-muted); }
    .helpsheet-foot { margin-top: 14px; font-size: 13px; color: var(--text-muted); }
    @media (max-width: 720px) { .helpbtn { width: 36px; height: 36px; font-size: 15px; } }
    /* ---- onboarding ---- */
    .ob-shell { max-width: 620px; }
    .ob-progress { display: flex; gap: 6px; margin-bottom: 22px; }
    .ob-progress span { flex: 1 1 0; height: 4px; border-radius: 99px; background: var(--border); transition: background 0.3s ease; }
    .ob-progress span.on { background: var(--primary); }
    .ob-title { font-size: clamp(24px, 5vw, 30px); line-height: 1.12; margin: 0 0 8px; text-wrap: balance; }
    .ob-sub { margin: 0 0 20px; }
    .ob-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 24px; }
    .ob-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ob-tile, .ob-choice {
      font: inherit; text-align: left; cursor: pointer; color: var(--text);
      background: var(--card); border: 1px solid var(--border-strong); border-radius: 12px;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .ob-tile { display: flex; flex-direction: column; gap: 3px; padding: 14px 16px; min-height: 72px; justify-content: center; }

    .invoice-referral { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border); }

    .booking-ref { margin: 0 0 16px; padding: 10px 14px; border-radius: 10px; background: var(--tinted); font-size: 14px; }

    .row .info .name { font-weight: 500; font-size: 14px; margin-bottom: 3px; }
    .row .info .meta { color: var(--text-muted); font-size: 12px; }

    /* Team row: 3-column grid so badge and action buttons feel like one
       cluster, with the badge anchored just to the left of the buttons. */
    .row.team-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      column-gap: 12px;
      align-items: center;
    }
    .team-row .team-role { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    }

    /* Invoice utility actions — View / Edit / Delete sit inline as a

    .row .actions .inv-util-break {

    /* Forms in app shell */

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; max-width: 880px; }
    /* A panel that wraps a form is as wide as the form inside it. Making the
       screens wide stretched these cards but not their fields, so "New job"
       became a 1156px card around 880px of inputs — 276px of empty box. The
       measure is declared once above; this stops the box outgrowing it.
       Scoped to cards that actually hold a form, because most of the other 50
       .form-card uses are info panels that should still fill the column. */
    .form-card:has(> .form-grid),

    .chip {

    .occurrence-row .actions button { white-space: nowrap; }

    /* Two-pane: a persistent rail of destinations beside their content.
       Used for sub-navigation — places you go — never for filters, which
       stay chips because they narrow one list rather than moving you.

       Below 720px the rail can't sit beside content, so each host picks its
       own fallback: customer detail keeps the scrolling tab strip (you hop
       between sections constantly there and a drill-down would cost a tap
       each way), while a screen you visit with one errand can drill down. */
    .two-pane {
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--card);
    }
    .two-pane-rail {
      background: var(--bg);
      border-right: 1px solid var(--border);
      padding: 12px 10px;
      min-width: 0;
    }
    .two-pane-btn {
      display: flex; align-items: center; justify-content: space-between;

      transition: background 0.12s, color 0.12s;
    }

    }

    .two-pane-group {
      font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em;

      font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--text-muted);
      margin: 18px 0 6px; padding: 0 2px;
    }
    .two-pane-narrow nav > *:first-child.drill-group { margin-top: 0; }
    .two-pane-narrow .drill-list + .drill-group { margin-top: 18px; }
    /* Icons follow the sections into the narrower layouts, so they do not
       appear and disappear as the window crosses a breakpoint. */
    .two-pane-label { display: inline-flex; align-items: center; gap: 9px; min-width: 0; }
    .two-pane-label .icon { flex: none; font-size: 15px; opacity: 0.7; }
    .two-pane-btn.active .two-pane-label .icon { opacity: 1; color: var(--primary); }
    .drill-name .icon { flex: none; font-size: 15px; opacity: 0.65; margin-right: 9px; }

    .two-pane-count {
      font-size: 11.5px; color: var(--text-muted);
      font-variant-numeric: tabular-nums; opacity: 0.75;
    }

      font-size: 11.5px; font-weight: 600;
      padding: 3px 10px; border-radius: 999px; white-space: nowrap;
    }

    .money-pill.credit { color: var(--success); background: var(--success-bg); }
    .two-pane-body { padding: 16px 18px 18px; min-width: 0; }
    .two-pane-narrow { min-width: 0; }
    /* The pane is already a white card. A .list carries its own surface, so
       inside the pane it drops the background, border and shadow and keeps
       just its row dividers — otherwise every section reads as a card in a
       card. Rows lose their side padding too, since the pane supplies it. */
    .two-pane-body .list,
    .two-pane-body > .form-card,
    .two-pane-body > form.form-card,
    .two-pane-body > * > .form-card {
      background: transparent; border: 0; border-radius: 0;
      box-shadow: none; overflow: visible;
    }
    .two-pane-body > .form-card,
    .two-pane-body > form.form-card,
    .two-pane-body > * > .form-card { padding: 0; }
    /* Consecutive cards inside the pane keep a rule between them, so the
       sections they used to separate as boxes stay separated as bands. */
    .two-pane-body > .form-card + .form-card,
    .two-pane-body > * > .form-card + .form-card {
      border-top: 1px solid var(--border);
      padding-top: 22px; margin-top: 22px;
    }
    .two-pane-body .list > .row { padding-left: 0; padding-right: 0; }
    .two-pane-body .list-empty { padding: 34px 8px; }

    /* Narrow: the rail becomes a full-width list you drill into. */
    /* The section's content gets the same white card the pane is on desktop.
       The back link and section title stay outside it, so the card holds the
       content and nothing else. .two-pane-body .list already drops its own
       surface, which is what stops this becoming a card inside a card. */
    .two-pane-narrow .two-pane-body {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      padding: 6px 16px;
    }
    .drill-list {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; box-shadow: var(--shadow-sm); overflow: hidden;
    }
    .drill-row {
      display: flex; align-items: center; gap: 12px; width: 100%;
      background: none; border: 0; border-bottom: 1px solid var(--border);
      padding: 15px 16px; cursor: pointer; text-align: left;
      font-family: inherit; color: var(--text);
    }
    .drill-row:last-child { border-bottom: 0; }
    .drill-row:hover { background: var(--row-hover); }
    .drill-name { font-size: 15px; font-weight: 500; flex: 1 1 auto; }
    .drill-count {
      font-size: 13px; color: var(--text-muted);
      font-variant-numeric: tabular-nums; flex: none;
    }
    .drill-chev { color: var(--border-strong); font-size: 17px; flex: none; line-height: 1; }
    .drill-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 10px;
    }
    .drill-back { flex: none; }
    .drill-title {
      font-family: var(--serif); font-size: 20px; font-weight: 600;
      letter-spacing: -0.01em; margin: 0; color: var(--text);
    }

    /* Day view — time grid */
    .day-grid {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
    }
    .day-untimed-section {
      border-bottom: 1px solid var(--border);
    }
    .day-untimed-header {
      padding: 9px 16px;
      background: var(--tinted);
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }
    .day-untimed-list { display: flex; flex-direction: column; }
    .day-untimed-block {
      display: flex; gap: 14px; align-items: flex-start;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.15s;
    }
    .day-untimed-block:last-child { border-bottom: none; }
    .day-untimed-block:hover { background: var(--row-hover); }
    .day-untimed-block.completed { opacity: 0.55; }
    .day-untimed-main { flex: 1; min-width: 0; }
    .day-untimed-title {
      font-weight: 600; font-size: 14px; color: var(--text);
      line-height: 1.3;
    }
    .day-untimed-customer {
      font-size: 13px; color: var(--text-muted); margin-top: 2px;
    }
    .day-untimed-sms {
      padding: 6px 10px;
      background: var(--card); border: 1px solid var(--border-strong);
      border-radius: 6px;
      font-size: 12px; font-family: inherit; cursor: pointer;
      color: var(--text); font-weight: 600;
    }
    .day-untimed-meta {
      display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
      flex-shrink: 0;
    }
    .day-untimed-actions {
      display: flex; align-items: center; gap: 6px;
    }
    .day-untimed-price {
      font-family: var(--serif); font-weight: 600;
      font-size: 16px; letter-spacing: -0.01em;
      color: var(--text);
    }
    .day-untimed-complete {
      padding: 6px 12px; background: var(--primary); color: white;
      border: none; border-radius: 6px;
      font-size: 12px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .day-untimed-complete:hover { background: var(--primary-hover); }
    .day-untimed-done-pill {
      font-size: 11px; font-weight: 600; color: var(--text-muted);
      letter-spacing: 0.02em;
    }
    .day-untimed-uncomplete {
      padding: 4px 10px; background: transparent; color: var(--text-muted);
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit;
      white-space: nowrap; transition: color 0.15s, border-color 0.15s;
    }
    .day-untimed-uncomplete:hover { color: var(--text); border-color: var(--text-muted); }
    .day-block-uncomplete {
      padding: 3px 8px; background: rgba(255,255,255,0.18); color: white;
      border: 1px solid rgba(255,255,255,0.3); border-radius: 5px;
      font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit;
      white-space: nowrap;
    }
    .day-block-uncomplete:hover { background: rgba(255,255,255,0.28); }
    @media (max-width: 600px) {
      .day-untimed-block {
        flex-direction: column; align-items: stretch;
        padding: 10px 12px; gap: 8px;
      }
      .day-untimed-meta {
        flex-direction: row; align-items: center; justify-content: space-between;
        gap: 8px;
      }
      .day-untimed-actions {
        flex-wrap: nowrap; gap: 6px;
      }
      .day-untimed-sms {
        max-width: 100px; min-width: 0; flex-shrink: 1;
      }
      .day-untimed-complete { flex-shrink: 0; }
    }

    .day-grid-body { display: flex; position: relative; }
    .day-grid-hours {
      width: 64px; flex-shrink: 0; position: relative;
      border-right: 1px solid var(--border);
    }
    .day-grid-hour {
      position: relative; border-bottom: 1px dashed var(--border);
    }
    .day-grid-hour:last-child { border-bottom: none; }
    .day-grid-hour-label {
      position: absolute; top: 4px; left: 8px;
      font-size: 11px; font-weight: 600;
      color: var(--text-muted);
      padding: 0;
    }
    .day-grid-blocks { flex: 1; position: relative; }
    .day-grid-lane { border-bottom: 1px dashed var(--border); }
    .day-grid-lane:last-child { border-bottom: none; }
    .day-grid-now {
      position: absolute; left: 0; right: 0; z-index: 2;
      pointer-events: none;
    }
    .day-grid-now-dot {
      position: absolute; left: -5px; top: -5px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px rgba(201, 133, 88, 0.2);
    }
    .day-grid-now-line {
      display: block; height: 2px; background: var(--accent);
      margin-left: 6px;
    }
    .day-block {
      position: absolute; left: 8px; right: 8px;
      background: var(--primary); color: white;
      border-radius: 8px; padding: 6px 10px;
      font-size: 12px; cursor: pointer;
      overflow: hidden;
      box-shadow: 0 4px 14px -6px rgba(40,30,20,0.4);
      transition: transform 0.15s, box-shadow 0.15s;
      z-index: 1; border: none; text-align: left;
      display: flex; flex-direction: column; gap: 2px;
    }
    .day-block:hover {
      transform: translateX(2px);
      box-shadow: 0 6px 18px -6px rgba(40,30,20,0.5);
    }
    .day-block.completed {
      background: var(--text-muted); opacity: 0.65;
    }
    .day-block-head { display: flex; justify-content: space-between; align-items: baseline; }
    .day-block-time { font-weight: 700; opacity: 0.9; font-size: 11px; letter-spacing: 0.02em; }
    .day-block-price {
      font-family: var(--serif); font-weight: 600; font-size: 12px;
      letter-spacing: -0.01em;
    }
    .day-block-title { font-weight: 600; line-height: 1.2; }
    .day-block-customer { opacity: 0.85; font-size: 11px; line-height: 1.2; }
    .day-block-bottom {
      display: flex; align-items: center; gap: 8px;
      justify-content: space-between;
      margin-top: auto;
      min-width: 0;
    }
    .day-block-bottom .day-block-customer {
      flex: 1; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      margin-top: 0;
    }
    .day-block-actions {
      display: flex; gap: 6px; align-items: center;
      justify-content: flex-end; flex-wrap: nowrap;
      flex-shrink: 0;
    }
    .day-block-actions .day-block-sms { flex: 0 1 auto; max-width: 100px; }
    @media (max-width: 600px) {
      .day-block-bottom {
        flex-direction: column; align-items: flex-start;
      }
      .day-block-actions {
        flex-wrap: nowrap; justify-content: flex-start;
        width: 100%; gap: 6px;
      }
      .day-block-actions .day-block-sms {
        max-width: 100px; flex-shrink: 1;
      }
      .day-block-complete { flex-shrink: 0; }
    }
    .day-block-complete {
      background: rgba(255,255,255,0.18); color: white;
      border: 1px solid rgba(255,255,255,0.3); border-radius: 6px;
      padding: 4px 9px; font-size: 11px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .day-block-complete:hover { background: rgba(255,255,255,0.32); }
    .day-block-sms {
      padding: 3px 6px;
      background: rgba(255,255,255,0.18); color: white;
      border: 1px solid rgba(255,255,255,0.3); border-radius: 6px;
      font-size: 11px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      min-width: 0;
    }
    .day-block-sms option { color: var(--text); background: var(--card); }
    .day-block.completed .day-block-sms { display: none; }

    /* Dashboard widgets */
    .dash-greeting { margin-bottom: 16px; }
    .dash-greeting-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 14px; flex-wrap: wrap;
    }
    .dash-greeting-text { min-width: 0; flex: 1; }
    .dash-greeting h2 {
      font-family: var(--serif); font-weight: 600;
      font-size: clamp(24px, 3.5vw, 32px);
      letter-spacing: -0.02em; margin: 0 0 4px;
    }
    .dash-greeting p {
      margin: 0; color: var(--text-muted);
      font-size: 14px; line-height: 1.5;
    }
    /* Wider than the list toolbars' gap: a greeting is two lines of serif,
       and the actions sit against its first line rather than its middle. */
    .dash-greeting-head.toolbar { margin-bottom: 0; align-items: flex-start; }
    .dash-greeting-head .tb-actions { padding-top: 4px; }

    .dash-pending-requests {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 14px 18px;
      background: linear-gradient(to right, var(--tinted), var(--card));
      border: 1px solid var(--accent);
      border-radius: 12px; margin: 16px 0;
      font-size: 14px;
    }
    .dash-pending-requests strong { font-family: var(--serif); font-size: 22px; font-weight: 600; margin-right: 6px; }

    /* One rhythm for the dashboard, whatever the order: the column sets the
       gap, and a widget's own leading and trailing margins are cancelled so
       they cannot add to it or, when absent, leave two cards touching. */
    .dash-widgets { display: flex; flex-direction: column; gap: 24px; }
    .dash-widget:empty { display: none; }
    .dash-widget > :first-child { margin-top: 0; }
    .dash-widget > :last-child { margin-bottom: 0; }
    .dash-quick-actions {
      display: flex; gap: 8px; margin: 16px 0;
      flex-wrap: wrap;
    }
    .dash-quick-actions button { font-size: 13px; }
    /* On a phone the row wrapped two-up with each button as wide as its own
       words, so the second line never lined up with the first. A grid of two
       equal columns: every button the same width, every row the same shape,
       and a third or fifth action simply starts a new row on the left. */
    @media (max-width: 720px) {
      .dash-quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .dash-quick-actions button {
        width: 100%; justify-content: center; padding: 12px 10px; font-size: 14px;
      }
    }

    /* Dashboard widget editor in Settings */
    .viewas-banner {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: var(--primary); color: #eef2f8;
      padding: 9px 24px; font-size: 13px;
      border-bottom: 1px solid var(--border);
    }
    .viewas-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); flex: none;
    }
    .viewas-banner strong { font-weight: 600; }
    .viewas-banner button {
      margin-left: auto; font-family: inherit; font-size: 12px; font-weight: 600;
      color: #eef2f8; background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.24);
      border-radius: 6px; padding: 5px 11px; cursor: pointer;
    }
    .viewas-banner button:hover { background: rgba(255,255,255,0.22); }
    @media (max-width: 600px) {
      .viewas-banner { padding: 9px 16px; }
      .viewas-banner button { margin-left: 0; }
    }
    .dash-top { display: flex; justify-content: flex-end; margin-bottom: 10px; }
    .dash-top .link-button { font-size: 13px; }

    /* Edit mode: the real cards, with a handle and a hide control. */
    .dash-edit-bar {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px; margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }
    .dash-edit-hint { font-size: 13px; color: var(--text-muted); flex: 1 1 auto; }
    .dash-edit-card {
      border: 1px dashed var(--border-strong); border-radius: 12px;
      padding: 8px; margin-bottom: 14px; background: var(--bg-elevated);
      cursor: grab;
    }
    .dash-edit-card.dragging { opacity: 0.45; cursor: grabbing; }
    .dash-edit-head {
      display: flex; align-items: center; gap: 10px; padding: 2px 6px 8px;
    }
    .dash-edit-grip { color: var(--border-strong); font-size: 14px; line-height: 1; letter-spacing: -2px; }
    @media (pointer: coarse) {
      /* No drag on touch, so the grip would be promising something it
         cannot do. The arrows are the control there. */
      .dash-edit-grip { display: none; }
      .dash-edit-card { cursor: default; }
    }
    .dash-edit-name {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-muted); flex: 1 1 auto;
    }
    .dash-edit-hide, .dash-edit-step {
      font-family: inherit; font-size: 12px; font-weight: 500;
      color: var(--text-muted); background: var(--card);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 10px; cursor: pointer;
    }
    .dash-edit-step { padding: 4px 9px; line-height: 1; }
    .dash-edit-step:hover:not(:disabled) { color: var(--text); border-color: var(--border-strong); }
    .dash-edit-step:disabled { opacity: 0.35; cursor: default; }
    .dash-edit-hide:hover { color: var(--danger); border-color: var(--danger); }
    /* The live widget is a preview here, not something to operate. */
    .dash-edit-body { pointer-events: none; }
    .dash-edit-body > * { margin-bottom: 0 !important; }

    .dash-hidden {
      border-top: 1px solid var(--border); padding-top: 14px; margin-top: 4px;
    }
    .dash-hidden-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-muted); margin: 0 0 8px;
    }
    .dash-hidden-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .dash-hidden-chip {
      font-family: inherit; font-size: 13px; font-weight: 500;
      color: var(--text-muted); background: var(--card);
      border: 1px dashed var(--border-strong); border-radius: 999px;
      padding: 7px 14px; cursor: pointer;
    }
    .dash-hidden-chip:hover {
      color: var(--text); border-style: solid; border-color: var(--primary);
    }
    .dash-widget-list {
      display: flex; flex-direction: column; gap: 8px;
    }
    .dash-widget-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; cursor: grab;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .dash-widget-row:hover {
      border-color: var(--border-strong);
      box-shadow: 0 2px 8px -2px rgba(40, 30, 20, 0.08);
    }
    .dash-widget-row:active { cursor: grabbing; }
    .dash-widget-drag {
      color: var(--text-muted); font-size: 16px; line-height: 1;
      letter-spacing: -3px; flex-shrink: 0; user-select: none;
    }
    .dash-widget-toggle { margin: 0; padding: 0; flex-shrink: 0; }
    .dash-widget-toggle input { width: 18px; height: 18px; cursor: pointer; }
    .dash-widget-text { flex: 1; min-width: 0; }
    .dash-widget-name { font-weight: 600; font-size: 14px; color: var(--text); }
    .dash-widget-help { font-size: 12px; color: var(--text-muted); margin-top: 1px; line-height: 1.4; }

    /* Quick-text editor rows in Settings */
    /* Quick text template editor — stacked layout (matches mobile) with a
       tinted card wrapper per template so they read as distinct blocks. */
    .sms-template-row {
      display: flex; flex-direction: column; gap: 10px;
      padding: 14px;
      margin-bottom: 12px;
      background: var(--tinted);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .sms-template-row:last-of-type { margin-bottom: 0; }
    .sms-template-fields {
      display: flex; flex-direction: column; gap: 10px;
      min-width: 0;
    }
    .sms-template-fields label { margin-top: 0; }
    .sms-template-row .sms-template-remove {
      align-self: flex-start;
      padding: 4px 10px; font-size: 12px;
    }
    .sms-template-row code {
      background: var(--card); padding: 1px 5px; border-radius: 3px;
      font-family: ui-monospace, monospace; font-size: 12px;
    }

    /* Week view — 7 columns of day summaries */
    .week-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
    }
    .week-col {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; display: flex; flex-direction: column;
      min-height: 200px; overflow: hidden;
    }
    .week-col.today { border-color: var(--primary); }
    .week-col.selected { box-shadow: 0 0 0 1px var(--accent) inset; }
    .week-col-head {
      padding: 10px 8px; border: none; background: var(--tinted);
      border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      cursor: pointer; font-family: inherit;
      transition: background 0.15s;
    }
    .week-col-head:hover { background: var(--row-hover); }
    .week-col.today .week-col-head { background: var(--primary); color: white; }
    .week-col-dow {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .week-col-num {
      font-family: var(--serif); font-size: 18px; font-weight: 600;
      letter-spacing: -0.02em; line-height: 1;
    }
    .week-col-body {
      padding: 8px; display: flex; flex-direction: column; gap: 4px;
      flex: 1;
    }
    .week-col-empty {
      color: var(--text-muted); font-size: 12px; text-align: center;
      margin-top: auto; margin-bottom: auto; opacity: 0.5;
    }
    .week-pill {
      display: flex; flex-direction: column; gap: 1px;
      padding: 6px 8px; background: var(--tinted);
      border: 1px solid var(--border); border-radius: 6px;
      text-align: left; font-family: inherit; cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }
    .week-pill:hover {
      border-color: var(--primary); transform: translateY(-1px);
    }
    .week-pill.done { opacity: 0.55; }
    .week-pill.done .week-pill-title { text-decoration: line-through; }
    .week-pill-time {
      font-size: 10px; font-weight: 700;
      color: var(--accent); letter-spacing: 0.02em;
    }
    .week-pill-title {
      font-size: 12px; font-weight: 600; color: var(--text);
      line-height: 1.2;
    }
    .week-pill-customer {
      font-size: 11px; color: var(--text-muted);
      line-height: 1.2;
    }
    @media (max-width: 860px) {
      .week-grid { grid-template-columns: repeat(7, minmax(110px, 1fr)); overflow-x: auto; }
    }

    .cal-week-label {
      font-size: 14px; font-weight: 600; color: var(--text);
      padding: 0 8px; letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .cal-mode-row {
      display: flex; align-items: center; gap: 16px;
      margin-bottom: 16px; flex-wrap: wrap;
    }
    .cal-day-nav {
      display: flex; align-items: center; gap: 6px;
      margin-left: auto;
    }
    .cal-day-nav .secondary { padding: 6px 12px; font-size: 14px; }
    .cal-day-picker {
      padding: 6px 10px; font-size: 13px; width: auto;
      font-family: ui-monospace, monospace;
    }
    .cal-day-header {
      display: flex; align-items: baseline; justify-content: space-between;
      margin: 4px 0 14px;
    }
    .cal-day-header h3 {
      font-family: var(--serif); font-size: 24px; margin: 0;
      letter-spacing: -0.02em; font-weight: 600;
    }
    .cal-day-count {
      font-size: 13px; color: var(--text-muted);
      font-weight: 500;
    }
    .cal-day-revenue { color: var(--text); font-weight: 600; white-space: nowrap; }
    .cal-day-sep { color: var(--text-muted); font-weight: 500; margin: 0 5px; }
    @media (max-width: 600px) {
      .cal-mode-row { gap: 10px; }
      .cal-day-nav { margin-left: 0; width: 100%; }
      .cal-day-picker { flex: 1; min-width: 0; }
      .cal-day-header h3 { font-size: 20px; }
      .cal-week-label { font-size: 12px; padding: 0 4px; }
      .day-grid-hours { width: 44px !important; }
      .day-grid-hour-label { font-size: 10px; left: 4px; padding: 0 2px; }
      .day-block { left: 4px; right: 4px; padding: 5px 8px; }
      .day-block-time { font-size: 10px; }
      .day-block-title { font-size: 11px; }
      .day-block-customer { font-size: 10px; }
      .day-grid-untimed { flex-direction: column; gap: 6px; padding: 10px 12px; }
      .day-grid-untimed-label { padding-top: 0; }
    }

    .calendar {
      background: var(--card); border-radius: 12px;
      border: 1px solid var(--border); padding: 18px;
      box-shadow: var(--shadow-sm);
    }
    .cal-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .cal-nav .cal-month { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
    .cal-nav button { padding: 6px 12px; font-size: 14px; }
    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
    }
    .cal-dow {
      padding: 6px; text-align: center; font-size: 11px;
      font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .cal-cell {
      min-height: 96px; padding: 6px 8px; border: 1px solid var(--border);
      border-radius: 8px; background: var(--card); overflow: hidden;
      display: flex; flex-direction: column; gap: 2px;
    }
    .cal-cell.empty { background: #f9f5ec; border-color: transparent; }
    .cal-cell { cursor: pointer; transition: background 0.12s, border-color 0.12s; }
    .cal-cell:hover:not(.empty) { background: var(--row-hover); }
    .cal-cell.today { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-ring); }
    .cal-cell.selected { border-color: var(--primary); background: var(--tinted); }
    .cal-cell.selected.today { box-shadow: 0 0 0 2px var(--primary-ring); }
    .cal-cell .cal-date { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .cal-cell.today .cal-date { color: var(--primary); }
    .cal-chip {
      font-size: 11px; padding: 2px 6px; border-radius: 4px;
      background: #eaf0f2; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer; transition: background 0.12s;
    }
    .cal-chip:hover { background: #d5dee3; }
    .cal-chip.done { background: #e8f1ec; color: var(--text-muted); text-decoration: line-through; }
    .cal-more { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

    .pager {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 14px; font-size: 13px; color: var(--text-muted);
    }
    .pager .info { flex: 1; text-align: center; }

    .badge.draft { background: #ece6d8; color: #6d6a64; }
    .badge.sent { background: #dde6f0; color: #3a4d68; }
    .badge.paid { background: #d5e8d6; color: #2f6b3a; }
    .badge.accepted { background: #d5e8d6; color: #2f6b3a; }
    .badge.declined { background: #f4dad6; color: #99362a; }

    .line-items-table { width: 100%; border-collapse: collapse; margin: 12px 0; }
    .line-items-table th {
      text-align: left; padding: 8px 10px; font-size: 12px;
      font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.04em;
      border-bottom: 1px solid var(--border);
    }
    .line-items-table td { padding: 8px 6px; vertical-align: middle; border-bottom: 1px solid var(--border); }
    .line-items-table input { padding: 8px 10px; font-size: 13px; }
    .line-items-table .col-desc { width: 50%; }
    .line-items-table .col-qty input,
    .line-items-table .col-rate input { width: 90px; text-align: right; }
    .line-items-table .col-amount { text-align: right; font-weight: 500; white-space: nowrap; padding-right: 12px; }
    .line-items-table .col-remove { width: 36px; text-align: right; }
    .line-items-table .col-remove button {
      background: none; border: none; color: var(--text-muted);
      font-size: 18px; line-height: 1; cursor: pointer; padding: 4px 8px;
    }
    .line-items-table .col-remove button:hover { color: var(--danger); }
    .line-items-table tfoot td {
      font-weight: 600; border-bottom: none; border-top: 2px solid var(--border);
      padding-top: 12px;
    }
    /* The two 90px inputs plus a description, an amount and a remove button
       put a floor of ~434px under this table. On a 375px phone that does not
       overflow the table — it widens the page, which drags the fixed tab bar
       sideways with it. They shrink here instead. */
    @media (max-width: 680px) {
      .line-items-table th, .line-items-table td { padding: 6px 3px; }
      .line-items-table th { font-size: 10px; letter-spacing: 0.02em; }
      .line-items-table input { padding: 7px 8px; font-size: 12.5px; }
      .line-items-table .col-desc { width: auto; min-width: 0; }
      .line-items-table .col-qty, .line-items-table .col-rate { width: 56px; }
      .line-items-table .col-qty input,
      .line-items-table .col-rate input { width: 100%; min-width: 0; }
      .line-items-table .col-amount { padding-right: 2px; font-size: 12.5px; }
      .line-items-table .col-remove { width: 24px; }
      .line-items-table .col-remove button { padding: 4px 2px; font-size: 16px; }
    }

    .line-items-empty {
      padding: 18px; text-align: center; color: var(--text-muted);
      font-size: 13px; border: 1px dashed var(--border-strong);
      border-radius: 8px; margin: 12px 0;
    }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px; margin-bottom: 24px;
    }
    .stats-grid.row-fixed-3 { grid-template-columns: repeat(3, 1fr); }
    .stats-grid.row-fixed-2 { grid-template-columns: repeat(2, 1fr); }
    @media (max-width: 720px) {
      .stats-grid.row-fixed-3 { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 500px) {
      .stats-grid.row-fixed-3,
      .stats-grid.row-fixed-2 { grid-template-columns: 1fr; }
    }
    /* Getting Started checklist (admin-only dashboard guide) */
    .gs-card {
      background: var(--card); border: 1px solid var(--border-strong);
      border-radius: 12px; padding: 18px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
    }
    .gs-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; margin-bottom: 14px;
    }
    .gs-title {
      font-family: var(--serif); font-weight: 600;
      font-size: 17px; color: var(--text);
      letter-spacing: -0.01em;
    }
    .gs-sub {
      font-size: 12px; color: var(--text-muted);
      margin-top: 2px;
    }
    .gs-list { display: flex; flex-direction: column; gap: 6px; }
    .gs-item {
      display: grid;
      grid-template-columns: 22px 1fr 18px;
      gap: 12px; align-items: center;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer; text-align: left;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
    }
    .gs-item:hover { background: var(--row-hover); border-color: var(--border-strong); }
    .gs-item.done { opacity: 0.6; }
    .gs-item.done:hover { opacity: 0.85; }
    .gs-check {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1.5px solid var(--border-strong);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: var(--text-muted);
      background: var(--card);
    }
    .gs-check.done {
      background: #2f6b46; border-color: #2f6b46; color: #fff;
    }
    .gs-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .gs-label {
      font-size: 14px; font-weight: 600; color: var(--text);
    }
    .gs-item.done .gs-label { text-decoration: line-through; }
    .gs-hint { font-size: 12px; color: var(--text-muted); }
    .gs-arrow {
      font-size: 16px; color: var(--text-muted);
    }
    .gs-item:hover .gs-arrow { color: var(--text); }

    .stat-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px;
      box-shadow: var(--shadow-sm);
    }
    .stat-card .label {
      font-size: 11px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.06em;
      font-weight: 600; margin-bottom: 6px;
    }
    .stat-card .value { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
    .stat-card .subvalue { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .stat-card.accent .value { color: var(--primary); }

    /* Team notes — widget header, cards, app-wide banner, compose modal */
    .team-notes-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin: 24px 0 12px;
    }
    .team-notes-count {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 22px; height: 22px; padding: 0 7px;
      background: var(--accent); color: #fff;
      border-radius: 999px; font-size: 11px; font-weight: 700;
      margin-left: 8px;
    }
    .team-notes-compose { padding: 7px 14px; font-size: 13px; }
    .team-notes-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .team-note-card {
      background: var(--card); border: 1px solid var(--border-strong);
      border-left: 3px solid var(--accent);
      border-radius: 10px; padding: 14px 16px;
      box-shadow: var(--shadow-sm);
    }
    /* Already-read notes fade back, so unread ones stand out. */
    .team-note-card.read {
      border-left-color: var(--border-strong);
      background: var(--bg);
      box-shadow: none;
      opacity: 0.78;
    }
    /* Notes you sent get a soft tint so they're visibly "your side." */
    .team-note-card.mine {
      border-left-color: var(--primary);
      background: var(--tinted);
    }
    .team-note-subject {
      font-weight: 600; font-size: 15px; margin-bottom: 4px;
      color: var(--text); letter-spacing: -0.01em;
    }
    .team-note-body {
      white-space: pre-wrap; font-size: 14px; line-height: 1.55;
      color: var(--text);
    }
    .team-note-foot {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 10px; padding-top: 10px;
      border-top: 1px dashed var(--border);
      font-size: 12px; color: var(--text-muted);
      gap: 12px;
    }
    .team-note-foot .link-button { font-size: 13px; font-weight: 600; }

    .team-notes-banner {
      display: flex; align-items: center; gap: 10px;
      width: 100%; padding: 10px 32px;
      background: var(--accent); color: #fff;
      border: none; cursor: pointer;
      font-family: inherit; font-size: 14px; font-weight: 500;
      text-align: left;
      transition: filter 0.15s;
    }
    .demo-banner {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 24px;
      background: #1d2638; color: #fff;
      font-size: 13px;
    }
    .demo-banner-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #f0a05c; flex-shrink: 0;
      animation: teamNotesPulse 1.6s ease-in-out infinite;
    }
    .demo-banner-text { flex: 1; }
    .demo-banner-cta {
      background: #fff; color: #1d2638;
      border: none; border-radius: 999px;
      padding: 6px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: transform 0.15s;
      flex-shrink: 0;
    }
    .demo-banner-cta:hover { transform: translateY(-1px); }
    @media (max-width: 600px) {
      .demo-banner { padding: 10px 14px; gap: 8px; font-size: 12px; }
      .demo-banner-cta { font-size: 12px; padding: 5px 10px; }
    }
    .team-notes-banner:hover { filter: brightness(1.05); }
    .team-notes-banner-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #fff; flex-shrink: 0;
      animation: teamNotesPulse 1.6s ease-in-out infinite;
    }
    @keyframes teamNotesPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    @media (max-width: 600px) {
      .team-notes-banner { padding: 10px 16px; font-size: 13px; }
    }

    .modal-overlay {
      position: fixed; inset: 0; z-index: 1500;
      background: rgba(40, 30, 20, 0.45);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      animation: modalFadeIn 0.18s ease-out;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    .modal-card {
      background: var(--card); border-radius: 14px;
      width: 100%; max-width: 520px;
      padding: 24px; max-height: 88vh; overflow-y: auto;
      box-shadow: 0 28px 64px -22px rgba(0,0,0,0.45);
      animation: modalSlideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalSlideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 6px;
    }
    .modal-head h3 {
      margin: 0; font-family: var(--serif); font-weight: 600;
      font-size: 22px; letter-spacing: -0.015em;
    }
    .modal-close {
      background: none; border: none; cursor: pointer;
      font-size: 24px; line-height: 1; color: var(--text-muted);
      padding: 4px 8px; border-radius: 8px;
    }
    .modal-close:hover { background: var(--row-hover); color: var(--text); }
    .email-preview {
      border: 1px solid var(--border); border-radius: 10px;
      background: #fff; overflow: hidden;
    }
    .email-preview-meta {
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: var(--tinted); font-size: 13px; color: var(--text-muted);
    }
    .email-preview-meta strong { color: var(--text); margin-right: 6px; }
    .email-preview-body {
      padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px; line-height: 1.55; color: #2d2a26;
    }
    .email-preview-body p { margin: 0 0 12px; }
    .email-preview-body a { color: #2c3e57; }
    .email-preview-frame {
      width: 100%; height: 520px; border: none; display: block;
      background: #faf8f4;
    }
    @media (max-width: 600px) {
      .email-preview-frame { height: 420px; }
    }
    .email-preview-text {
      white-space: pre-wrap; word-wrap: break-word;
      background: var(--tinted); padding: 14px 16px;
      border: 1px solid var(--border); border-radius: 8px;
      font-family: ui-monospace, Menlo, monospace; font-size: 12px;
      color: var(--text); max-height: 360px; overflow-y: auto;
    }

    /* Update-available toast — appears when /api/version reports a newer build */
    .version-banner {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      right: max(20px, env(safe-area-inset-right));
      left: auto;
      z-index: 1001;
      display: flex; align-items: center; gap: 12px;
      max-width: 92vw;
      padding: 12px 12px 12px 16px;
      background: var(--text); color: var(--bg);
      border-radius: 12px;
      box-shadow: 0 12px 32px -10px rgba(0, 0, 0, 0.35);
      font-size: 14px;
      animation: versionBannerIn 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes versionBannerIn {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }
    .version-banner-text {
      flex: 1; min-width: 0;
    }
    .version-banner-refresh {
      background: var(--bg); color: var(--text);
      border: none; border-radius: 8px;
      padding: 7px 14px; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      flex-shrink: 0;
    }
    .version-banner-refresh:hover { opacity: 0.9; }
    .version-banner-close {
      background: none; border: none;
      color: var(--bg); opacity: 0.6;
      cursor: pointer; font-size: 20px;
      width: 28px; height: 28px;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0; flex-shrink: 0;
    }
    .version-banner-close:hover { opacity: 1; }
    @media (max-width: 600px) {
      .version-banner {
        left: max(12px, env(safe-area-inset-left));
        right: max(12px, env(safe-area-inset-right));
        max-width: none;
      }
    }

    /* First-job celebration toast */
    .first-job-toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 1000;
      display: flex; align-items: center; gap: 14px;
      max-width: 380px; padding: 14px 16px 14px 18px;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white;
      border-radius: 14px;
      box-shadow: 0 16px 40px -10px rgba(0,0,0,0.35),
                  0 6px 14px -4px rgba(0,0,0,0.15);
      animation: firstJobIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .first-job-toast strong { display: block; font-size: 14px; line-height: 1.2; margin-bottom: 3px; }
    .first-job-toast span:not(.first-job-toast-burst) {
      display: block; font-size: 12.5px; opacity: 0.85; line-height: 1.4;
    }
    .first-job-toast-burst {
      font-size: 26px; display: inline-block;
      animation: firstJobBurst 1.2s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: center;
    }
    .first-job-toast-close {
      background: none; border: none; color: white; opacity: 0.7;
      cursor: pointer; font-size: 20px; line-height: 1;
      padding: 4px 8px; border-radius: 4px;
      transition: opacity 0.15s;
    }
    .first-job-toast-close:hover { opacity: 1; }
    @keyframes firstJobIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes firstJobBurst {
      0% { transform: scale(0.6) rotate(-20deg); opacity: 0; }
      40% { transform: scale(1.3) rotate(15deg); opacity: 1; }
      70% { transform: scale(0.95) rotate(-6deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    @media (max-width: 600px) {
      .first-job-toast {
        left: 16px; right: 16px; max-width: none; bottom: 16px;
      }
    }

    /* Auto-invoice schedule options */
    .auto-invoice-options {
      display: grid; grid-template-columns: 1fr; gap: 8px;
    }
    .auto-invoice-option {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 16px; cursor: pointer;
      background: var(--card); border: 1.5px solid var(--border);
      border-radius: 10px;
      transition: border-color 0.15s, background 0.15s;
    }
    .auto-invoice-option:hover { border-color: var(--border-strong); }
    .auto-invoice-option.active {
      border-color: var(--primary);
      background: var(--tinted);
    }
    .auto-invoice-option input[type="radio"] {
      margin-top: 3px; width: 16px; height: 16px; cursor: pointer;
    }
    .auto-invoice-option-name {
      font-weight: 600; font-size: 14px; color: var(--text);
    }
    .auto-invoice-option-help {
      font-size: 12.5px; color: var(--text-muted); margin-top: 2px;
      line-height: 1.4;
    }

    /* Customer notes timeline */
    .note-add {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px;
      margin-bottom: 16px;
    }
    .note-add textarea {
      width: 100%; resize: vertical; min-height: 70px;
      font-family: inherit; font-size: 14px; line-height: 1.5;
      color: var(--text); background: var(--bg);
      border: 1px solid var(--border-strong); border-radius: 8px;
      padding: 10px 12px;
    }
    .note-add textarea:focus { outline: none; border-color: var(--primary); }
    .note-add-actions {
      display: flex; justify-content: flex-end; margin-top: 10px;
    }
    .note-timeline {
      display: flex; flex-direction: column; gap: 10px;
    }
    .note-row {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px;
    }
    .note-meta {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 6px;
    }
    .note-author {
      font-size: 13px; font-weight: 600; color: var(--text);
    }
    .note-time {
      font-size: 11px; color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .note-delete {
      margin-left: auto; background: none; border: none;
      color: var(--text-muted); cursor: pointer;
      font-size: 18px; line-height: 1; padding: 2px 6px;
      border-radius: 4px; transition: color 0.15s, background 0.15s;
    }
    .note-delete:hover { color: var(--danger); background: var(--danger-bg); }
    .note-body {
      font-size: 14px; line-height: 1.55; color: var(--text);
      white-space: pre-wrap;
    }

    /* Empty state */
    .empty-state {
      text-align: center; padding: 56px 28px;
      background: var(--card); border: 1px dashed var(--border-strong);
      border-radius: 14px;
    }
    .empty-state-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 56px; height: 56px; border-radius: 16px;
      background: var(--tinted); color: var(--primary);
      margin-bottom: 16px;
    }
    .empty-state-icon .icon { font-size: 26px; }
    .empty-state h3 {
      font-family: var(--serif); font-weight: 600;
      font-size: 22px; letter-spacing: -0.01em;
      margin: 0 0 8px;
    }
    .empty-state p {
      color: var(--text-muted); font-size: 14px; line-height: 1.55;
      margin: 0 auto 22px; max-width: 380px;
    }
    .empty-state-cta {

    @media (max-width: 720px) {
      /* One row, always. Wrapping let a long name push the plan pill and the
         avatar onto a second line, and adding the brand mark made that the
         normal case rather than the rare one. The name truncates instead —
         it is the only part here that can afford to.

         Three groups with air between them, not five items evenly crammed:
         the menu at one edge, who you are at the other, identity in between.
         Everything sat 8-12px apart before, which read as one jammed row. */
      .topbar {
        padding: 14px 16px; flex-wrap: nowrap; gap: 14px;
        /* The shorthand above resets what the base rule set for the notch, and
           installed to the home screen that puts the brand under the clock.
           Restated here rather than left to the cascade. */
        padding-top: max(14px, env(safe-area-inset-top));
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
        /* The bar's glass, at the top: no paint, no border, and the page
           scrolls under it. Same two-layer build as the bar — the layers are
           declared with the bar's — denser here because it carries text.
           Sticky rather than fixed, so it keeps its place in the flow and
           nothing below needs a top offset to clear it. */
        position: sticky; top: 0; z-index: 30;
        background: none; border-bottom: 0;
        --glass-a: 0.55; --glass-blur: 14px;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
      }
      .topbar > * { position: relative; z-index: 1; }
      /* Two things that stick to the top of the page would now stick under
         the header: the schedule card's head in the 681–720 overlap, and the
         dashboard's edit bar. Both start where the header ends instead. */
      .rechead, .dash-edit-bar { top: calc(max(14px, env(safe-area-inset-top)) + 51px); }
      .topbar .right { flex: none; gap: 10px; }
      .topbar .brand-button { min-width: 0; flex: 0 1 auto; margin-right: auto; }
      /* A plan badge is worth a corner of a laptop, not a fifth of a phone's
         header. It stays only while it is an action — "Free · Upgrade" is a
         way to do something, "Pro" is a sticker. */
      .topbar .plan-pill.plan-pro { display: none; }
      /* The name carries the header by itself now, so it is set to be read
         rather than to leave room for a tile beside it. */
      .topbar .brand { font-size: 16px; }
      .topbar .brand-button { gap: 9px; }
      /* Half the screen at most, in vw so the bound scales with the phone
         rather than being a number that happens to fit one of them. With the
         name no longer printed beside it, a wordmark has room to be read
         rather than squeezed into the 108px left over after the text. */
      .brand-mark.is-logo img { height: 28px; max-width: 52vw; }
      .topbar .right { gap: 8px; font-size: 12px; flex-wrap: wrap; }
      .content { padding: 0 16px; margin: 20px auto; }
      .form-grid { grid-template-columns: 1fr; }
      .page-header { flex-direction: column; align-items: flex-start; gap: 10px; }
      .page-header h2 { font-size: 18px; }
      /* Plain headers stack narrow, but one carrying status pills wants to
         stay a wrapping row — stacked, each pill takes a line of its own. */
      .page-header.with-pills { flex-direction: row; align-items: center; }
      .row, .occurrence-row, .compact-row, .job-card { flex-wrap: wrap; }
      /* Generic list rows (invoices, customers, etc.) — let action clusters
         wrap to multiple lines so nothing gets clipped. */
      .row .actions, .job-card .actions {
        flex-wrap: wrap; width: 100%; margin-top: 8px;
        min-width: 0; gap: 6px;
      }
      .row .actions button, .job-card .actions button { flex: 0 0 auto; }
      /* Team row mobile: role badge to top-right, action buttons in a
         single inline row underneath. Horizontal scroll catches the case
         where four buttons (Resend + Reset + Change role + Remove) won't
         all fit on a 375px viewport. */
      .row.team-row {
        display: grid;
        grid-template-columns: 1fr auto;
        column-gap: 12px;
        row-gap: 8px;
      }
      .row.team-row .team-id { grid-column: 1; grid-row: 1; }
      .row.team-row .team-role {
        grid-column: 2; grid-row: 1;
        align-self: start; justify-self: end;
      }
      /* Who they are on the left, the menu on the right. The role moved into
         the name block above, so the pill's column is gone — except while the
         role is being changed, when this holds the select and needs the room. */
      .row.team-row { grid-template-columns: 1fr auto; align-items: center; }
      .row.team-row .team-role:has(.badge) { display: none; }
      .row.team-row .team-role { grid-column: 1 / -1; grid-row: 2; justify-self: start; }
      .row.team-row .actions {
        grid-column: 2; grid-row: 1;
        margin-top: 0; width: auto; align-self: center;
      }
      .team-role-text { text-transform: capitalize; }
      .row.team-row .actions::-webkit-scrollbar { display: none; }
      .row.team-row .actions button {
        padding: 8px 12px; font-size: 13px;
        white-space: nowrap;
      }
      /* Schedule rows (Mark complete / Skip / Reschedule) — keep inline.
         Tighter button padding so all three fit on one line. */
      .row .actions.schedule-actions {
        flex-wrap: nowrap;
      }
      .row .actions.schedule-actions button {
        padding: 9px 12px; font-size: 13px;
      }
      /* On mobile, left-align the action cluster so each util button
         sits at the left edge instead of pulling to the right. */
      .row .actions, .job-card .actions { justify-content: flex-start; }
      /* Drop the trailing "to <customer>" so the Email button is short
         enough to stay inline with Mark paid + Copy link. */
      .hide-on-mobile { display: none; }
      /* Schedule rows specifically — three actions fit on one line if we
         tighten them, see overrides below. */
      .occurrence-row .actions {
        flex-wrap: nowrap; width: 100%; margin-top: 8px;
        min-width: 0;
      }
      .occurrence-row .date { min-width: 70px; }
      /* Tighten the action cluster so SMS + Mark complete + Open stay on one row */
      .occurrence-row .actions .row-sms,
      .row .actions .row-sms {
        max-width: 92px; padding: 6px 8px; font-size: 12px;
      }
      .occurrence-row .actions button.primary {
        padding: 9px 12px; font-size: 13px;
      }
      .occurrence-row .actions button.secondary {
        padding: 8px 12px; font-size: 13px;
      }
      .filter-bar { flex-direction: column; align-items: stretch; }
      .filter-bar .toggle-group { align-self: flex-start; }
      .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
      .stat-card { padding: 14px; }
      .stat-card .value { font-size: 20px; }
      .cal-cell { min-height: 60px; padding: 4px 6px; }
      .cal-cell .cal-date { font-size: 11px; }
      .cal-chip { font-size: 10px; padding: 1px 4px; }
      .auth-shell { margin: 30px auto; }
      .card { padding: 24px; }
      .invoice-doc { padding: 24px; }
      .invoice-header { flex-direction: column; align-items: flex-start; }
      .invoice-header .meta { text-align: left; margin-top: 12px; }
      .invoice-meta-blocks { grid-template-columns: 1fr; }
      .search-bar { flex-direction: column; align-items: stretch; gap: 8px; }
      .search-bar select { width: 100% !important; }
    }
    @media (max-width: 480px) {
      .stats-grid { grid-template-columns: 1fr; }
      .cal-grid { gap: 2px; }
      .cal-dow { font-size: 9px; padding: 4px 2px; }
    }

    .landing { min-height: 100vh; }
    .landing-nav {
      display: flex; justify-content: space-between; align-items: center;

    .landing-nav .nav-actions { display: flex; gap: 12px; align-items: center; }

      opacity: 0.6;

    /* Gentle drifting decorative dots in hero — adds energy without clipart */
    .hero-orb {
      position: absolute; pointer-events: none; z-index: -1;
      border-radius: 50%;
      filter: blur(20px); opacity: 0.5;
      animation: orbDrift 12s ease-in-out infinite;
    }
    .hero-orb.orb-a { top: 18%;  left: 8%;  width: 140px; height: 140px;
      background: radial-gradient(circle, rgba(201, 133, 88, 0.35), transparent 70%); }
    .hero-orb.orb-b { top: 12%;  right: 10%; width: 180px; height: 180px;
      background: radial-gradient(circle, rgba(44, 62, 87, 0.18), transparent 70%);
      animation-delay: -4s; }
    .hero-orb.orb-c { bottom: 8%; left: 30%; width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(201, 133, 88, 0.22), transparent 70%);
      animation-delay: -8s; }
    @keyframes orbDrift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%      { transform: translate(20px, -18px) scale(1.05); }
      66%      { transform: translate(-12px, 14px) scale(0.95); }

    /* === Narrative shared === */

    }

    .ed-nav-cta {
      background: var(--text); color: var(--bg);

      transition: transform 0.2s ease, opacity 0.2s ease;
