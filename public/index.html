<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Field Manager — Run your service business in one place</title>
  <!-- iOS standalone PWA chrome -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Field Manager" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="description" content="Customers, schedules, quotes, and invoices for small service businesses. Free forever for five customers; $29/month flat when you grow. No App Store, no per-seat fees, no surprise overages." />
  <meta name="theme-color" content="#f7f4ec" />
  <link rel="canonical" href="https://fieldmgr.com/" />

  <!-- Open Graph (for Slack, iMessage, Facebook, LinkedIn link previews) -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://fieldmgr.com/" />
  <meta property="og:site_name" content="Field Manager" />
  <meta property="og:title" content="Field Manager — Run your service business in one place" />
  <meta property="og:description" content="Customers, schedules, quotes, and invoices for small service businesses. Free for five customers; $29/month flat when you grow." />
  <meta property="og:image" content="https://fieldmgr.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Field Manager — Run your service business in one place" />
  <meta name="twitter:description" content="Customers, schedules, quotes, and invoices for small service businesses. $29/mo flat." />
  <meta name="twitter:image" content="https://fieldmgr.com/og-image.png" />

  <!-- Favicons. SVG works in all modern browsers; .ico falls back for older
       Safari/IE; apple-touch-icon is for iOS home-screen install. -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  %TRACKING_SCRIPTS%


  <!-- Structured data: tells search engines this is a SaaS product with pricing -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Field Manager",
    "url": "https://fieldmgr.com",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web, iOS, Android (PWA)",
    "description": "Customers, schedules, quotes, and invoices for small service businesses. Built for the work, not the boardroom.",
    "offers": [
      { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "USD" },
      { "@type": "Offer", "name": "Pro", "price": "29", "priceCurrency": "USD",
        "priceSpecification": { "@type": "UnitPriceSpecification", "price": "29", "priceCurrency": "USD", "billingDuration": "P1M" }
      }
    ],
    "provider": { "@type": "Organization", "name": "Field Manager" }
  }
  </script>

  <!-- FAQ structured data for Google rich results + LLM-friendly Q&A -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Will Field Manager work for a one-person operation?",
        "acceptedAnswer": { "@type": "Answer", "text": "Especially then. The whole product was sketched around a single person running their own week. The team layer is optional and stays hidden until you grow into it." }
      },
      {
        "@type": "Question",
        "name": "What if I'm coming from a notebook or a spreadsheet?",
        "acceptedAnswer": { "@type": "Answer", "text": "Import customers from CSV in about a minute, then add jobs as they come. Most people are running their week through Field Manager by day two." }
      },
      {
        "@type": "Question",
        "name": "How does Field Manager pricing work?",
        "acceptedAnswer": { "@type": "Answer", "text": "Free forever for five customers or fewer and twenty jobs total. Pro is $29 a month, flat. No per-seat fees, no per-customer fees, no surprise overages." }
      },
      {
        "@type": "Question",
        "name": "How does Field Manager compare to Jobber or ServiceTitan?",
        "acceptedAnswer": { "@type": "Answer", "text": "Most field-service software starts at $69 per month or higher, charges per seat, or hides pricing behind a sales call. Field Manager is $29 a month flat with no per-seat or per-customer fees, and the pricing is on the public website." }
      },
      {
        "@type": "Question",
        "name": "What if I want to leave Field Manager?",
        "acceptedAnswer": { "@type": "Answer", "text": "Export all customers, jobs, invoices, and quotes as CSV any time and cancel from the Billing tab. Field Manager makes it easy to leave on purpose." }
      }
    ]
  }
  </script>

  <script>
    (function () {
      try {
        var t = localStorage.getItem('fm_theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Recurrence math shared with the server (src requires the same file). -->
  <script src="/shared/occurrences.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.7/babel.min.js"></script>
  <script>
    // Force classic JSX runtime so compiled output uses React.createElement
    // instead of `import { jsx } from "react/jsx-runtime"`. We load React as
    // a UMD global, so the ESM import line breaks the page on load.
    Babel.registerPreset('react-classic', {
      presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]],
    });
  </script>
  <style>
    :root {
      /* The shell's one measure. --shell-edge is where the content column's
         inner edge lands, so the top bar and nav can pad to the same line
         while their backgrounds still run edge to edge. The percentage is of
         the containing block, not the viewport, so a visible scrollbar does
         not push the chrome out of line with the content. */
      --shell-max: 1320px;
      --shell-pad: 26px;
      /* The rail is flush to the window edge; its items are inset by this
         much, which is also the top bar's padding, so the brand sits directly
         above the first destination. */
      --rail-w: 232px;
      --rail-inset: 24px;
      --bg: #f7f4ec;
      --bg-elevated: #fcfaf3;
      --card: #ffffff;
      --text: #19170f;
      --text-muted: #66635c;
      --border: #e8e1d1;
      --border-strong: #d4cab4;
      --primary: #2c3e57;
      --primary-hover: #1b2940;
      --primary-ring: rgba(44, 62, 87, 0.16);
      --accent: #c98558;
      --accent-hover: #b16f43;
      --danger: #a23b2c;
      --danger-bg: #f9e3df;
      --success: #2d6b4a;
      --success-bg: #e1ede5;
      --shadow-sm: 0 1px 2px rgba(25, 23, 15, 0.04), 0 1px 1px rgba(25, 23, 15, 0.02);
      --shadow-md: 0 1px 2px rgba(25, 23, 15, 0.04), 0 8px 24px -8px rgba(25, 23, 15, 0.08), 0 16px 48px -16px rgba(25, 23, 15, 0.06);
      --shadow-lg: 0 2px 4px rgba(25, 23, 15, 0.06), 0 16px 40px -8px rgba(25, 23, 15, 0.12), 0 32px 72px -16px rgba(25, 23, 15, 0.08);
      --row-hover: #faf6ea;
      --tinted: #efe7d3;
      --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
    }
    :root[data-theme="dark"] {
      --bg: #0d1117;
      --bg-elevated: #131820;
      --card: #1a1f2a;
      --text: #ede7d6;
      --text-muted: #8a857a;
      --border: #2a3142;
      --border-strong: #3d4459;
      --primary: #8da6c8;
      --primary-hover: #a8bedc;
      --primary-ring: rgba(141, 166, 200, 0.22);
      --accent: #dca176;
      --accent-hover: #c98558;
      --danger: #db6b5c;
      --danger-bg: #3a1c17;
      --success: #62a87e;
      --success-bg: #1a2e22;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.45);
      --shadow-md: 0 2px 6px rgba(0, 0, 0, 0.5), 0 16px 40px -8px rgba(0, 0, 0, 0.55), 0 32px 72px -16px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 4px 12px rgba(0, 0, 0, 0.55), 0 24px 64px -8px rgba(0, 0, 0, 0.6);
      --row-hover: #1e2533;
      --tinted: #2a3142;
    }
    :root[data-theme="dark"] .cal-cell.empty { background: #1a1d27; }
    :root[data-theme="dark"] .cal-chip { background: #2c3142; color: var(--text); }
    :root[data-theme="dark"] .cal-chip:hover { background: #3b4258; }
    :root[data-theme="dark"] .cal-chip.done { background: #1f3328; color: var(--text-muted); }
    :root[data-theme="dark"] .check-list label.checked { background: #2c3a4e; color: var(--primary); }
    :root[data-theme="dark"] .badge.draft { background: #2e2a22; color: #b0a99a; }
    :root[data-theme="dark"] .badge.sent { background: #1f2a3b; color: #92a8c8; }
    :root[data-theme="dark"] .badge.paid { background: #1c2e22; color: #7ab089; }
    :root[data-theme="dark"] .badge.accepted { background: #1c2e22; color: #7ab089; }
    :root[data-theme="dark"] .badge.declined { background: #3b1f1b; color: #d76b5d; }
    :root[data-theme="dark"] .badge { background: #3a2820; color: #e8a78c; }
    :root[data-theme="dark"] input:disabled, :root[data-theme="dark"] textarea:disabled { background: #1a1d27; color: var(--text-muted); }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-feature-settings: 'cv11', 'ss01', 'ss03';
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    h1, h2, h3, .brand {
      font-family: var(--serif);
      font-feature-settings: 'liga', 'kern';
      letter-spacing: -0.02em;
    }
    h1 { font-weight: 600; }
    h2, h3 { font-weight: 600; }
    button { font-family: inherit; }
    .icon {
      display: inline-block;
      width: 1em; height: 1em; vertical-align: -0.15em;
      stroke: currentColor; stroke-width: 2;
      stroke-linecap: round; stroke-linejoin: round;
      fill: none;
    }
    /* Filled, not stroked: .icon sets a 2px stroke for the drawn icons, and
       inheriting that would outline the letterform instead of setting it.
       At 20 units the glyph's ink measures 18.6 tall, against 18 plus a 1.7
       stroke for the drawn icons — so the two read at the same size. The
       central baseline puts its ink centre at 18.92 units, which is where
       the measured optical centre lands too. */
    .icon-glyph text {
      fill: currentColor; stroke: none;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 20px; font-weight: 600;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .fade-in-delay-1 { animation: fadeInUp 0.5s 0.06s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .fade-in-delay-2 { animation: fadeInUp 0.5s 0.12s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .fade-in-delay-3 { animation: fadeInUp 0.5s 0.18s cubic-bezier(0.16, 1, 0.3, 1) both; }

    /* Scroll-reveal: hidden by default, revealed when JS adds .is-revealed */
    [data-reveal] {
      opacity: 0; transform: translateY(28px);
      transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.85s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    [data-reveal].is-revealed { opacity: 1; transform: translateY(0); }
    [data-reveal-delay="1"] { transition-delay: 0.08s; }
    [data-reveal-delay="2"] { transition-delay: 0.16s; }
    [data-reveal-delay="3"] { transition-delay: 0.24s; }
    [data-reveal-delay="4"] { transition-delay: 0.32s; }
    [data-reveal-delay="5"] { transition-delay: 0.4s; }
    @media (prefers-reduced-motion: reduce) {
      [data-reveal] { opacity: 1; transform: none; transition: none; }
      .fade-in, .fade-in-delay-1, .fade-in-delay-2, .fade-in-delay-3 { animation: none; opacity: 1; }
    }

    /* Stacked hero headline with cycling industry word */
    .hero-stacked {
      display: flex; flex-direction: column;
      align-items: center;
      line-height: 1;
    }
    .hero-line { display: block; }
    .hero-cycle-line {
      display: block;
      line-height: 1.15;
      padding-bottom: 0.06em;
      white-space: nowrap;
      /* Inherits the h1's font-size — all three lines stay the same scale. */
    }
    .cycle-word {
      font-style: italic;
      color: var(--accent);
      display: inline-block;
      animation: wordSwap 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cycle-word.settled {
      font-style: normal;
      color: inherit;
      animation: wordSettle 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes wordSwap {
      0%   { opacity: 0; transform: translateY(0.18em); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes wordSettle {
      0%   { opacity: 0; transform: translateY(0.18em) scale(0.94); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Bold sans typography scoped to the hero only */
    .landing-hero h1 {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 800;
      font-feature-settings: 'ss01', 'cv11';
    }
    .landing .eyebrow,
    .landing .section-label { font-weight: 600; }

    /* Public profile page */
    .profile-page {
      min-height: 100vh;
      padding: 60px 20px;
      display: flex; flex-direction: column; align-items: center;
      background: var(--bg);
    }
    .profile-card {
      max-width: 560px; width: 100%;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 48px 40px;
      box-shadow: 0 20px 60px -20px rgba(40, 30, 20, 0.15);
      text-align: center;
    }
    .profile-logo {
      width: 88px; height: 88px; border-radius: 22px;
      object-fit: cover; margin-bottom: 18px;
      box-shadow: 0 4px 12px -4px rgba(40, 30, 20, 0.18);
    }
    .profile-name {
      font-family: var(--serif); font-weight: 600;
      font-size: 36px; letter-spacing: -0.02em;
      margin: 0 0 14px;
    }
    /* One line under the name, quieter than the name and set apart from the
       paragraph of about-text below it. */
    .profile-tagline {
      margin: -6px 0 24px; font-size: 15px; color: var(--text-muted);
      letter-spacing: 0.01em;
    }
    .profile-about {
      color: var(--text-muted); font-size: 16px; line-height: 1.6;
      margin: 0 0 28px; max-width: 460px; margin-left: auto; margin-right: auto;
    }
    .profile-cta-row { display: flex; justify-content: center; margin-bottom: 36px; }
    .profile-cta {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px; font-size: 15px; font-weight: 600;
      background: var(--primary); color: white;
      border-radius: 10px; text-decoration: none;
      box-shadow: 0 4px 14px -4px rgba(44, 62, 87, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .profile-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px -6px rgba(44, 62, 87, 0.45);
    }
    .profile-cta .icon { transition: transform 0.2s; }
    .profile-cta:hover .icon { transform: translateX(3px); }
    .profile-contact {
      text-align: left; max-width: 360px;
      margin: 0 auto; padding-top: 28px;
      border-top: 1px solid var(--border);
      display: grid; gap: 14px;
    }
    .profile-contact > div {
      display: grid; grid-template-columns: 80px 1fr; gap: 16px;
      align-items: baseline;
    }
    .profile-contact dt {
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); margin: 0;
    }
    .profile-contact dd {
      margin: 0; font-size: 14.5px; color: var(--text); line-height: 1.5;
    }
    .profile-contact dd a { color: var(--text); text-decoration: underline; text-decoration-color: rgba(0,0,0,0.2); }
    .profile-contact dd a:hover { text-decoration-color: var(--text); }
    .profile-footer {
      margin-top: 28px; font-size: 12px; color: var(--text-muted);
    }
    .profile-footer a { color: inherit; text-decoration: underline; }
    @media (max-width: 600px) {
      .profile-page { padding: 36px 16px; }
      .profile-card { padding: 32px 24px; }
      .profile-name { font-size: 28px; }
    }

    /* Auth screens */
    .auth-shell { max-width: 480px; margin: 80px auto; padding: 0 16px; }
    .auth-back-link {
      display: block; margin: 24px auto 0;
      background: none; border: none;
      font-family: inherit; font-size: 13px;
      color: var(--text-muted); cursor: pointer;
      padding: 6px 12px;
      transition: color 0.15s;
    }
    .auth-back-link:hover { color: var(--text); text-decoration: underline; }
    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      padding: 44px 40px;
      border: 1px solid var(--border);
    }
    h1 { margin: 0 0 8px; font-size: 30px; }
    h2 { font-size: 22px; }
    h3 { font-size: 17px; }
    .subtitle { color: var(--text-muted); margin: 0 0 28px; font-size: 14px; line-height: 1.6; }
    .tabs { display: flex; gap: 0; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
    .tab {
      flex: 1; padding: 12px 0; background: none; border: none;
      cursor: pointer; font-size: 14px; color: var(--text-muted);
      border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s;
    }
    .tab.active { color: var(--text); border-bottom-color: var(--primary); font-weight: 600; }
    .tab:hover { color: var(--text); }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; color: var(--text); }
    .hint { font-weight: 400; color: var(--text-muted); font-size: 12px; margin-left: 6px; }
    input, textarea {
      width: 100%; padding: 11px 14px; font-size: 14px;
      border: 1px solid var(--border-strong); border-radius: 8px;
      background: var(--card); font-family: inherit; color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    /* Native checkboxes/radios shouldn't inherit the width:100% form-field rule.
       Reset them so layouts that put them inline with text don't blow up. */
    input[type="checkbox"], input[type="radio"] {
      width: auto; padding: 0; border: 0;
      background: transparent; box-shadow: none;
      accent-color: var(--primary);
      flex-shrink: 0;
    }
    textarea { resize: vertical; min-height: 76px; }
    input:focus, textarea:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-ring);
    }
    input::placeholder, textarea::placeholder { color: #b0a99a; }
    button.primary {
      padding: 11px 20px; background: var(--primary); color: white;
      border: none; border-radius: 10px; font-size: 14px;
      font-weight: 600; cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 0 0 1px rgba(0, 0, 0, 0.04) inset;
      letter-spacing: -0.005em;
    }
    button.primary:hover { background: var(--primary-hover); box-shadow: 0 4px 12px -2px rgba(44, 62, 87, 0.2), 0 0 0 1px rgba(0, 0, 0, 0.04) inset; }
    button.primary:active { transform: translateY(1px); }
    button.primary:disabled { background: #a8a59c; cursor: not-allowed; box-shadow: none; }
    button.primary.block { width: 100%; margin-top: 24px; }
    button.secondary {
      padding: 9px 16px; background: var(--card); color: var(--text);
      border: 1px solid var(--border-strong); border-radius: 10px;
      font-size: 13px; font-weight: 500; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button.secondary:hover { background: var(--row-hover); border-color: var(--primary); }
    button.secondary:active { transform: translateY(1px); }
    button.danger {
      padding: 9px 16px; background: var(--card); color: var(--danger);
      border: 1px solid var(--border-strong); border-radius: 10px;
      font-size: 13px; font-weight: 500; cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    button.danger:hover { background: var(--danger-bg); border-color: var(--danger); }
    .error {
      margin-top: 16px; padding: 11px 14px;
      background: var(--danger-bg); color: var(--danger);
      border-radius: 8px; font-size: 13px;
    }
    .badge {
      display: inline-block; padding: 3px 10px; border-radius: 999px;
      background: #f4ddd0; color: #8c4e30; font-size: 11px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .status-pill {
      display: inline-block; padding: 2px 9px; border-radius: 999px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; vertical-align: middle;
    }
    .status-pending {
      background: #fbecd8; color: #8c5d20;
    }
    :root[data-theme="dark"] .status-pending {
      background: #3a2e1c; color: #e0b878;
    }

    /* App shell */
    .topbar {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 16px 32px; display: flex;
      align-items: center; justify-content: space-between;
      /* Respect iPhone notch / Dynamic Island in standalone PWA mode. */
      padding-top: max(16px, env(safe-area-inset-top));
      /* Bar stretches edge to edge, but its contents line up with the content
         column below it — otherwise the brand starts 56px left of the table
         it sits above. --shell-edge is that same left edge. */
      padding-left: max(var(--rail-inset), env(safe-area-inset-left));
      padding-right: max(var(--rail-inset), env(safe-area-inset-right));
    }
    .topbar .brand { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
    .topbar .brand-button { display: inline-flex; align-items: center; gap: 11px; min-width: 0; }
    .brand-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* A logo keeps its own shape. Squeezing one into a fixed tile turns a
       wordmark into an illegible 28px smudge, and a bordered tile makes a
       brand look like an avatar.
       Both limits are maxima and both sit on the image, so the box ends up the
       size of what is actually drawn: a tall crest is bounded by the height, a
       wide banner by the width, and neither is letterboxed inside a box of the
       wrong proportions. It may shrink if the header runs out of room. */
    .brand-mark.is-logo { display: block; flex: none; }
    /* The height is a definite length, not a max, and that is load-bearing: an
       SVG with a viewBox and no width/height carries a ratio but no intrinsic
       size, and `height: auto` on one inside a shrink-to-fit flex item resolves
       to zero — the entire brand disappears. A fixed height gives the ratio
       something to multiply. max-width then catches a banner, and object-fit
       scales it down rather than squashing it. */
    .brand-mark.is-logo img {
      display: block; height: 30px; width: auto;
      max-width: 260px; object-fit: contain;
    }
    /* Brand text acts as a refresh affordance (tap to reload), so style it
       as a button without any visible button chrome. */
    .topbar .brand-button {
      background: none; border: none; padding: 0;
      color: inherit; font-family: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .topbar .brand-button:hover { opacity: 0.7; }
    .topbar .brand-button:active { opacity: 0.5; }
    .topbar .right { display: flex; align-items: center; gap: 14px; font-size: 13px; }
    .topbar .right .user { color: var(--text-muted); }
    /* User menu */
    .user-menu-wrap { position: relative; }
    .user-menu-trigger {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--card); border: 1px solid var(--border-strong);
      cursor: pointer;
      padding: 3px 8px 3px 3px; border-radius: 999px;
      color: var(--text-muted);
      transition: border-color 0.15s, box-shadow 0.15s, color 0.15s;
    }
    .user-menu-trigger:hover {
      border-color: var(--primary); color: var(--text);
      box-shadow: 0 2px 8px -2px rgba(40,30,20,0.12);
    }
    .user-menu-trigger[aria-expanded="true"] {
      border-color: var(--primary); color: var(--text);
      box-shadow: 0 0 0 3px var(--primary-ring, rgba(44,62,87,0.18));
    }
    .user-menu-avatar {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white; font-weight: 600; font-size: 12px;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }
    .user-menu-caret {
      width: 10px; height: 7px;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .user-menu-trigger[aria-expanded="true"] .user-menu-caret {
      transform: rotate(180deg);
    }
    .user-menu-pop {
      position: absolute; right: 0; top: calc(100% + 8px);
      min-width: 260px; max-width: 320px; z-index: 100;
      background: var(--card); border: 1px solid var(--border-strong);
      border-radius: 12px;
      box-shadow: 0 20px 50px -16px rgba(40, 30, 20, 0.25),
                  0 6px 16px -4px rgba(40, 30, 20, 0.12);
      padding: 6px;
      animation: fadeInUp 0.15s ease-out;
    }
    .user-menu-header {
      padding: 10px 12px 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
    }
    .user-menu-name {
      font-weight: 600; font-size: 14px; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .user-menu-email {
      font-size: 12px; color: var(--text-muted); margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .user-menu-role {
      display: flex; align-items: center; gap: 6px; margin-top: 8px;
    }
    .user-menu-section {
      padding: 8px 12px 4px;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--text-muted);
    }
    .user-menu-item {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 8px 12px;
      background: none; border: none; cursor: pointer;
      font-family: inherit; font-size: 14px; color: var(--text);
      border-radius: 6px;
      text-align: left;
      transition: background 0.12s;
    }
    .user-menu-item:hover:not(:disabled) { background: var(--tinted); }
    .user-menu-item:disabled { opacity: 0.5; cursor: not-allowed; }
    .user-menu-item-meta {
      font-size: 11px; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
    }
    .user-menu-item-danger { color: var(--danger); }
    .user-menu-item-danger:hover:not(:disabled) { background: var(--danger-bg); }
    .user-menu-divider {
      height: 1px; background: var(--border); margin: 6px 0;
    }

    .topbar-system-link {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 6px;
      background: var(--tinted); color: var(--text-muted);
      border: 1px solid var(--border);
      font-family: inherit; font-size: 12px; font-weight: 600;
      letter-spacing: 0.02em; cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .topbar-system-link:hover {
      color: white; background: var(--primary); border-color: var(--primary);
    }
    .topbar-system-link .icon { font-size: 13px; opacity: 0.75; }
    .topbar-system-link:hover .icon { opacity: 1; }


    /* Plan pill in topbar */
    .plan-pill {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase;
      line-height: 1.6;
    }
    .plan-pill.plan-free {
      background: var(--tinted); color: var(--text-muted);
      cursor: pointer; border: 1px solid var(--border-strong);
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .plan-pill.plan-free:hover {
      background: var(--accent); color: white; border-color: var(--accent);
    }
    .plan-pill.plan-pro {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white;
    }

    /* Locked feature page */
    .locked-feature {
      display: flex; align-items: center; justify-content: center;
      padding: 60px 20px;
    }
    .locked-feature-card {
      max-width: 540px; text-align: center;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 48px 40px;
      box-shadow: var(--shadow-lg);
    }
    .locked-icon-wrap {
      display: inline-flex; align-items: center; justify-content: center;
      width: 56px; height: 56px; border-radius: 16px;
      background: var(--tinted); color: var(--primary);
      margin-bottom: 18px;
    }
    .locked-icon-wrap .icon { font-size: 24px; }
    .locked-eyebrow {
      font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
      color: var(--accent); text-transform: uppercase; margin-bottom: 10px;
    }
    .locked-feature-card h2 {
      font-family: var(--serif); font-size: 28px;
      margin: 0 0 12px; letter-spacing: -0.02em;
    }
    .locked-feature-card > p {
      color: var(--text-muted); margin: 0 0 24px;
      font-size: 15px; line-height: 1.55;
    }
    .locked-bullets {
      list-style: none; padding: 0; margin: 0 0 28px;
      text-align: left; max-width: 380px;
      margin-left: auto; margin-right: auto;
    }
    .locked-bullets li {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 0; font-size: 14px; color: var(--text);
    }
    .locked-bullets li .icon {
      color: var(--accent); flex-shrink: 0;
    }
    .locked-cta-row {
      display: flex; gap: 10px; justify-content: center;
      flex-wrap: wrap;
    }
    .locked-cta-row button.primary {
      padding: 12px 22px; font-size: 14px;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .locked-cta-row button.primary .icon { transition: transform 0.2s; }
    .locked-cta-row button.primary:hover .icon { transform: translateX(2px); }
    .locked-fine {
      margin-top: 16px; font-size: 12px; color: var(--text-muted);
    }

    /* Billing page hero */
    .billing-hero {
      padding: 32px 32px 28px;
      border-radius: 18px;
      margin-bottom: 24px;
      background: var(--card); border: 1px solid var(--border);
    }
    .billing-hero.billing-pro {
      background: linear-gradient(135deg, var(--card), var(--tinted));
      border-color: var(--border-strong);
    }
    .billing-hero.billing-free {
      background: linear-gradient(135deg, var(--tinted), var(--card));
      border-color: var(--accent);
    }
    .billing-hero-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .billing-trial-chip {
      background: #f4ddd0; color: #8c4e30;
      font-size: 11px; font-weight: 700;
      padding: 3px 10px; border-radius: 999px;
      letter-spacing: 0.04em;
    }
    .billing-hero-title {
      font-family: var(--serif); font-weight: 600;
      font-size: 28px; letter-spacing: -0.02em;
      margin: 0 0 10px;
    }
    .billing-hero-sub {
      color: var(--text-muted); font-size: 14.5px; line-height: 1.55;
      margin: 0; max-width: 600px;
    }
    .billing-cta-row {
      display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap;
    }
    .billing-cta-row button.primary {
      padding: 12px 22px; font-size: 14px;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .billing-cta-row button.primary .icon { transition: transform 0.2s; }
    .billing-cta-row button.primary:hover .icon { transform: translateX(2px); }

    .billing-usage-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 18px;
      margin-bottom: 8px;
    }
    @media (max-width: 600px) {
      .billing-usage-row { grid-template-columns: 1fr; }
    }
    .usage-bar { }
    .usage-bar-head {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 6px;
    }
    .usage-bar-label {
      font-size: 13px; font-weight: 600; color: var(--text);
    }
    .usage-bar-count {
      font-family: ui-monospace, monospace; font-size: 12px;
      color: var(--text-muted);
    }
    .usage-bar-count.over { color: var(--accent); font-weight: 600; }
    .usage-bar-track {
      height: 6px; background: var(--tinted);
      border-radius: 999px; overflow: hidden;
    }
    .usage-bar-fill {
      height: 100%; background: var(--primary);
      border-radius: 999px;
      transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .usage-bar-fill.over { background: var(--accent); }

    .danger-zone {
      margin-top: 24px; padding: 24px;
      background: var(--card);
      border: 1px solid var(--danger);
      border-radius: 16px;
    }
    .danger-zone-summary {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 18px;
    }
    .danger-zone-summary strong { font-size: 14px; color: var(--text); display: block; }
    .danger-zone-summary p { margin: 4px 0 0; font-size: 13px; color: var(--text-muted); line-height: 1.5; max-width: 500px; }
    .danger-zone-summary button.danger { flex-shrink: 0; }
    .danger-zone-confirm p { font-size: 13px; color: var(--text); margin: 0 0 12px; line-height: 1.5; }
    .danger-zone-confirm code {
      background: var(--tinted); padding: 2px 6px; border-radius: 4px;
      font-family: ui-monospace, monospace; font-size: 13px;
    }
    @media (max-width: 600px) {
      .danger-zone-summary { flex-direction: column; }
    }

    .billing-locked-list, .billing-included-list {
      list-style: none; padding: 0; margin: 0;
      font-size: 14px; color: var(--text);
    }
    .billing-locked-list li, .billing-included-list li {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 7px 0; line-height: 1.5;
    }
    .billing-locked-list li .icon { color: var(--text-muted); margin-top: 2px; flex-shrink: 0; }
    .billing-included-list li .icon { color: var(--accent); margin-top: 2px; flex-shrink: 0; }

    /* Inline upgrade prompt (limit hit) */
    .upgrade-prompt {
      display: flex; align-items: center; gap: 16px;
      background: linear-gradient(to right, var(--tinted), var(--card));
      border: 1px solid var(--accent);
      border-radius: 12px; padding: 14px 18px;
      margin-bottom: 16px;
    }
    .upgrade-prompt-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--accent); color: white;
      flex-shrink: 0;
    }
    .upgrade-prompt-icon .icon { font-size: 16px; }
    .upgrade-prompt-text { flex: 1; }
    .upgrade-prompt-text strong { display: block; font-size: 14px; color: var(--text); margin-bottom: 2px; }
    .upgrade-prompt-text span { font-size: 13px; color: var(--text-muted); line-height: 1.5; }
    .upgrade-prompt button.primary { white-space: nowrap; flex-shrink: 0; }
    /* 960px is a reading measure, and most of this app is tables: a day of
       jobs, a list of invoices, a customer's history. Those want the window.
       Forms do not — a text field 1200px wide is worse than one at 600 — so
       the field grid keeps its own measure while lists take the full width. */
    .content { max-width: var(--shell-max); margin: 32px auto; padding: 0 var(--shell-pad); }
    /* Settings, billing and profile are stacked form fields, and a field is
       not more readable for being 1300px wide. It starts where every other
       screen's content starts, though — centering the narrower column left a
       104px gutter after the rail while every other screen had 26, which read
       as the page having come loose from its navigation. */
    .content-narrow { max-width: 1000px; margin-left: 0; margin-right: auto; }
    /* The rail answers one question: where am I in the app. A record's own
       sections (a customer's jobs, invoices, notes) are part of the record and
       live inside the content. An area you enter deliberately, like Settings,
       takes the rail over rather than sitting beside it. Nothing else earns a
       second vertical column. */
    /* The frame is a column so the shell can take whatever height is left
       over. Subtracting a fixed top-bar height instead would be wrong the
       moment a verification, billing or view-as banner is on screen. */
    .app-frame { display: flex; flex-direction: column; min-height: 100vh; }
    .shell { display: flex; align-items: stretch; flex: 1 1 auto; }
    /* The rail itself stretches so its border runs the whole page, while the
       destinations inside it stick to the top — a sticky element cannot do
       both, which is why there are two elements here rather than one. */
    .rail {
      flex: none; width: var(--rail-w);
      border-right: 1px solid var(--border);
      background: var(--bg-elevated);
    }
    .rail-inner {
      position: sticky; top: 0;
      padding: 10px 10px 28px;
      max-height: 100vh; overflow-y: auto;
      overscroll-behavior: contain;
    }
    .shell > .content { flex: 1 1 auto; min-width: 0; }
    .rail-group {
      margin: 15px 0 4px; padding: 0 14px;
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em;
      text-transform: uppercase; color: var(--text-muted);
    }
    .rail-group:first-child { margin-top: 4px; }
    /* That reset is for a rail that opens with a group. An area's first group
       opens below the back button instead, so it keeps the same 15px
       separation every other group gets — matching by accident today, because
       :first-child stops applying once .rail-area is there. Stated so it
       cannot drift. */
    .rail-area + .rail-group { margin-top: 15px; }
    .rail-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      background: none; border: 0; cursor: pointer; font-family: inherit;
      font-size: 13.5px; font-weight: 500; color: var(--text-muted);
      text-align: left; padding: 8px 14px; border-radius: 8px;
      transition: background 0.12s, color 0.12s;
    }
    .rail-item:hover { background: var(--tinted); color: var(--text); }
    .rail-item:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
    .rail-item.active {
      background: var(--card); color: var(--text); font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .rail-item .icon { font-size: 15px; opacity: 0.7; flex: none; }
    /* Area sections have no icons, so their labels would start 25px left of
       where the app's destinations do. Pad them out to the same line. */
    .rail-item:not(:has(.icon)) { padding-left: 39px; }
    .rail-item.active .icon { opacity: 1; color: var(--primary); }
    .rail-item .rail-fill { flex: 1 1 auto; }
    .rail-badge {
      flex: none; background: var(--danger); color: #fff;
      font-size: 10.5px; font-weight: 700; line-height: 1;
      padding: 3px 6px; border-radius: 999px;
    }
    .rail-note { flex: none; font-size: 10.5px; font-weight: 600; color: var(--text-muted); }
    .rail-note.over { color: var(--danger); }
    /* The area header: what you are in, and the way out of it. Both sit above
       a divider so the sections below read as belonging to the area rather
       than to the app. */
    /* No rule under it — the colour already separates the way out from the
       sections, and a line as well was one divider too many. */
    .rail-area { padding: 2px 0 12px; margin-bottom: 6px; }
    .rail-back {
      display: flex; align-items: center; gap: 8px; width: 100%;
      background: var(--primary); border: 1px solid var(--primary); cursor: pointer;
      font-family: inherit; font-size: 12.5px; font-weight: 600;
      color: #fff; padding: 9px 12px; border-radius: 9px;
      box-shadow: var(--shadow-sm);
      transition: background 0.12s, border-color 0.12s;
    }
    .rail-back:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    /* A primary ring around a primary fill is invisible, so the focus ring
       borrows the text colour instead. */
    .rail-back:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
    /* Points back the way you came. */
    .rail-back .icon { transform: rotate(180deg); opacity: 0.8; flex: none; }
    .rail-back:hover .icon { opacity: 1; }

    .area-back {
      display: inline-flex; align-items: center; gap: 7px;
      background: none; border: 0; cursor: pointer; font-family: inherit;
      font-size: 13px; font-weight: 600; color: var(--text-muted);
      padding: 6px 10px; margin: 0 0 10px -10px; border-radius: 8px;
    }
    .area-back:hover { background: var(--tinted); color: var(--text); }
    .area-back span { font-size: 17px; line-height: 1; }

    /* A record's own sections are part of the record, not part of the app, so
       they go horizontal inside the content. Beside the rail they read as a
       second column of navigation, and then neither column means anything.

       The reason contact lived in that column was so a phone number stays on
       screen while you read an invoice. Sticky keeps that, with one rail. */
    .rechead { background: var(--bg); padding-bottom: 4px; }
    .reccard {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; box-shadow: var(--shadow-sm);
      padding: 15px 17px; margin-bottom: 16px;
    }
    .reccard-top { display: flex; align-items: center; gap: 13px; flex-wrap: wrap; }
    .reccard-avatar {
      flex: none; width: 42px; height: 42px; border-radius: 12px;
      display: grid; place-items: center; color: #fff;
      font-size: 14px; font-weight: 700; letter-spacing: 0.02em;
    }
    .reccard-id { min-width: 0; margin-right: 2px; }
    .reccard-name {
      margin: 0; font-size: 20px; letter-spacing: -0.01em; line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .reccard-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }
    .reccard-actions { margin-left: auto; display: flex; gap: 8px; }
    .reccard-contact {
      display: flex; flex-direction: column; align-items: flex-start;
      gap: 6px; margin-top: 13px;
    }
    .reccard-chip {
      display: inline-flex; align-items: baseline; gap: 8px;
      background: var(--tinted); border: 1px solid transparent;
      border-radius: 9px; padding: 6px 11px; min-width: 0; max-width: 100%;
      font-size: 12.5px; color: var(--text); text-decoration: none;
      transition: background 0.12s, border-color 0.12s;
    }
    a.reccard-chip:hover { background: var(--card); border-color: var(--border-strong); }
    /* Fixed label width so the values line up down the stack instead of
       starting at three different places. */
    .reccard-chip .k {
      flex: none; min-width: 52px; font-size: 9.5px; font-weight: 700;
      letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-muted);
    }
    /* Each detail owns its line, so a long address wraps rather than being cut
       off — the whole point of showing an address is being able to read it. */
    .reccard-chip .v { white-space: normal; overflow-wrap: anywhere; }
    /* Street on one line, city/state/zip on the next, the way an address is
       written on an envelope. */
    .reccard-chip .v .l { display: block; }
    /* Notes are free text about the place, not a way to reach someone, so they
       sit apart from the contact chips rather than pretending to be one. */
    .reccard-note {
      display: flex; gap: 10px; margin-top: 13px; padding-top: 12px;
      border-top: 1px solid var(--border); font-size: 13px; color: var(--text);
    }
    .reccard-note .k {
      flex: none; padding-top: 2px; font-size: 9.5px; font-weight: 700;
      letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-muted);
    }
    /* Sticky above the phone breakpoint only. The card is the right size for a
       laptop to keep on screen and too much of a phone to give up. */
    @media (min-width: 681px) {
      .rechead { position: sticky; top: 0; z-index: 20; padding-top: 10px; }
    }
    @media (max-width: 680px) {
      .reccard { padding: 13px 14px; }
      .reccard-name { font-size: 17px; }
      .reccard-avatar { width: 36px; height: 36px; border-radius: 10px; font-size: 12.5px; }
      /* Keep Edit on the name's line and let the money pill take the next one,
         rather than stranding the button on a row of its own. */
      .reccard-id { flex: 1 1 auto; }
      .reccard-actions { order: 3; }
      .reccard-top .money-pill { order: 4; }
      .reccard-contact { gap: 6px; margin-top: 11px; order: 5; }
      .reccard-chip { padding: 5px 9px; font-size: 12px; }
    }

    /* The customer page's sections, drawn as the same segmented control the
       Invoices, Jobs and Requests filters use — one way to switch views, not
       two. Unlike those it never wraps: six sections scroll sideways. */
    .rectabs {
      display: flex; gap: 2px; margin-bottom: 16px;
      width: fit-content; max-width: 100%;
      background: var(--tinted); border-radius: 11px; padding: 3px;
      overflow-x: auto; scrollbar-width: none; flex-wrap: nowrap;
    }
    .rectabs::-webkit-scrollbar { display: none; }
    .rectab {
      background: none; border: 0; cursor: pointer; font-family: inherit;
      font-size: 12.5px; font-weight: 500; color: var(--text-muted);
      padding: 9px 14px; border-radius: 8px; white-space: nowrap; flex: none;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .rectab:hover { color: var(--text); }
    .rectab.active {
      background: var(--card); color: var(--text); font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .rectab b { font-weight: 500; opacity: 0.6; }
    /* More tabs than fit: fade whichever edge has more behind it, so a label
       is never chopped mid-word and the strip reads as scrollable. */
    .rectabs.more-left { -webkit-mask-image: linear-gradient(to right, transparent, #000 36px); mask-image: linear-gradient(to right, transparent, #000 36px); }
    .rectabs.more-right { -webkit-mask-image: linear-gradient(to left, transparent, #000 36px); mask-image: linear-gradient(to left, transparent, #000 36px); }
    .rectabs.more-left.more-right { -webkit-mask-image: linear-gradient(to right, transparent, #000 36px, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to right, transparent, #000 36px, #000 calc(100% - 36px), transparent); }
    @media (max-width: 560px) {
      .rectabs { scroll-padding-inline: 36px; }
      .rectab { padding: 9px 12px; }
    }

    @media (max-width: 680px) {
      /* A phone cannot give 100px to a header. Labels go, values stay on one
         line — the number is still there to tap while you read. */
      .rechead { padding: 10px 0 9px; }
      .rechead-row h2 { font-size: 18px; }
      /* Wrap to a second line rather than shrink: five items sharing 375px
         shrink to "555-6… · mgr@pine… · 8…", which is worse than no header. */
      .rechead-meta { gap: 2px 18px; flex-wrap: wrap; margin-top: 6px; }
      .rechead-meta > div {
        display: flex; align-items: baseline;
        flex: 0 0 auto; max-width: 100%; min-width: 0;
      }
      .rechead-meta dt { display: none; }
      .rechead-meta dd { font-size: 12.5px; color: var(--text-muted); }
      /* No separators here: once items wrap, a leading "·" lands at the start
         of the second line and reads as a bullet on some rows but not others.
         Spacing does the same job and survives the wrap. */
    }

    /* Below the rail breakpoint the same list becomes a drawer, which is why
       the phone no longer needs a horizontal scroller for eight destinations. */
    .railtoggle {
      display: none; background: none; border: 0; cursor: pointer;
      padding: 6px; margin-right: 4px; margin-left: -6px; border-radius: 8px;
      color: var(--text); line-height: 0;
    }
    .railtoggle:hover { background: var(--tinted); }
    /* The phone's navigation. Hidden by default; it takes over from the menu
       button below 720px, where the drawer becomes the "More" sheet. */
    .tabbar { display: none; }
    .tabbar-inner { display: flex; }
    .tabbar button {
      flex: 1 1 0; min-width: 0; position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: none; border: 0; cursor: pointer; font-family: inherit;
      padding: 9px 2px 8px; color: var(--text-muted);
      font-size: 10.5px; font-weight: 600;
    }
    /* Lighter stroke than the app's default: at 20px a 2px stroke reads as a
       heavy glyph, and the whole bar with it. */
    .tabbar button .icon { font-size: 20px; opacity: 0.8; stroke-width: 1.7; }
    .tabbar button.active { color: var(--primary); }
    .tabbar button.active .icon { opacity: 1; }
    .tabbar .tab-label {
      max-width: 100%; overflow: hidden; letter-spacing: 0.005em;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .tabbar .tab-badge {
      position: absolute; top: 6px; left: 50%; margin-left: 4px;
      background: var(--danger); color: #fff; font-size: 9px;
      font-weight: 700; line-height: 1; padding: 2px 4.5px; border-radius: 999px;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.9);
    }
    @media (max-width: 720px) {
      /* Liquid glass, matched against iOS 26. A capsule 20px in from the
         sides, and a material built from two layers rather than a fill: the
         centre is a light blur that mostly brightens what passes under it,
         with almost no white of its own; the edge is a 1.5px refraction ring
         and a single soft line along the top where light catches it. No
         border — an outline of any weight reads as a frame around the glass
         rather than the glass's own edge. The shadow underneath carries the
         shape.
         The layers are pseudo-elements of a container that carries no filter
         itself. A child's backdrop-filter cannot see through a parent that
         has one — the parent becomes its whole backdrop — so one filtered
         element could never have both a centre and an edge. The sheet is the
         same construction, denser, and shares these rules. */
      .tabbar {
        display: block; position: fixed; z-index: 40;
        left: 20px; right: 20px;
        /* Clear of the home indicator on a modern iPhone, and of the edge. */
        bottom: calc(12px + env(safe-area-inset-bottom));
        /* 60 tall on a 30 radius: a true stadium. Cells are 50, the bubble 54. */
        border: 0; border-radius: 30px;
        --glass-a: 0.16; --glass-blur: 7px;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05),
                    0 10px 28px -12px rgba(0, 0, 0, 0.35);
        /* Gets out of the way when the drawer arrives — see the drawer's own
           timing; this leaves on the same curve so the two read as one move. */
        transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
      }
      .tabbar::before, .tabbar::after, .topbar::before, .topbar::after {
        content: ''; position: absolute; inset: 0; border-radius: inherit;
        pointer-events: none;
      }
      .tabbar::before, .topbar::before {
        background: rgba(255, 255, 255, var(--glass-a));
        -webkit-backdrop-filter: blur(var(--glass-blur)) brightness(1.16) saturate(135%);
        backdrop-filter: blur(var(--glass-blur)) brightness(1.16) saturate(135%);
      }
      /* The ring: a padding-box/content-box mask leaves only the outer 1.5px.
         The highlight in it sits where the phone is tilted toward. */
      .tabbar::after, .topbar::after {
        padding: 1.5px;
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask-composite: exclude;
        -webkit-backdrop-filter: blur(1px) brightness(1.14) saturate(150%);
        backdrop-filter: blur(1px) brightness(1.14) saturate(150%);
        background: radial-gradient(160px 40px at var(--glass-hx, 30%) var(--glass-hy, 0%),
                                    rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0) 70%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.62);
      }
      /* Nothing in a browser without backdrop-filter should read as a
         half-transparent panel with the list legible through it. */
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .tabbar::before, .topbar::before { background: rgba(255, 255, 255, 0.94); }
        .tabbar::after, .topbar::after { display: none; }
      }
      .tabbar.is-stowed {
        transform: translateY(calc(100% + 24px));
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .tabbar, .tab-pill { transition-duration: 0.01ms; }
      }
      /* On a strip the ring would draw a bright line down the screen's edges,
         where there is no edge to catch light. Just the one line, along the
         bottom where the glass ends. */
      .topbar::after {
        -webkit-mask: none; mask: none; padding: 0;
        -webkit-backdrop-filter: none; backdrop-filter: none; background: none;
        box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.55);
      }
      /* Above the glass layers. */
      .tabbar-inner { position: relative; z-index: 1; padding: 5px; }
      /* Black and full-strength, selected or not, as in the reference: the
         bubble alone says which tab you are on. */
      .tabbar button { padding: 0; gap: 0; color: var(--text); }
      .tabbar button.active { color: var(--text); }
      .tabbar button .icon { font-size: 26px; stroke-width: 1.8; opacity: 1; }
      .tab-ic {
        position: relative; display: grid; place-items: center;
        width: 100%; height: 50px;
      }
      /* One bubble that travels. It sits behind the buttons, one cell wide,
         and moves by whole cells on the bar's own curve, so a change of tab
         reads as the glass sliding rather than one marker vanishing and
         another appearing. A grey frosted tint, not a highlight: over white
         it lands as a light grey, over a photo as a paler version of what is
         behind it, with no brightness push of its own. */
      .tab-pill {
        position: absolute; left: 5px; top: 5px; height: 50px;
        width: calc((100% - 10px) / var(--tabs, 5));
        pointer-events: none;
        transform: translateX(calc(var(--tab, 0) * 100%));
        transition: transform 0.42s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.2s ease;
      }
      /* The element above is the full cell, which keeps the slide's maths a
         whole number of cells. The bubble is bigger than the cell, measured
         off the reference: nine tenths of the bar's height with 3px above
         and below, and wider than the icon pitch, reaching 4px past its own
         cell on each side — on the end tabs it comes within a pixel of the
         bar's edge, as it does there. A lens that large is most of why the
         reference's reads as a lens and a smaller one read as a sticker. */
      .tab-pill::before {
        content: ''; position: absolute; inset: -2px -4px; border-radius: 27px;
        background: rgba(138, 138, 144, 0.34);
        -webkit-backdrop-filter: blur(6px) saturate(110%);
        backdrop-filter: blur(6px) saturate(110%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 1px 4px rgba(0, 0, 0, 0.07);
      }
      /* A screen that is not a tab and has no More to stand in for it. */
      .tab-pill.is-off { opacity: 0; }
      /* The words come off the bar but stay in the accessibility tree — they
         are still each button's name for a screen reader, and the page's own
         heading names the screen right above it for everyone else. */
      .tabbar .tab-label {
        position: absolute; width: 1px; height: 1px; margin: -1px;
        padding: 0; overflow: hidden; white-space: nowrap;
        clip-path: inset(50%);
      }
      /* Hung off the icon's own top-right corner rather than the cell's. */
      .tabbar .tab-badge {
        top: 3px; left: 50%; right: auto; margin-left: 8px;
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8);
      }
      /* Room for the bar and the gap it floats in, so the last row of a list
         clears it rather than sitting underneath. */
      .app-frame { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
    }

    .drawer-scrim {
      /* Dark enough that the page behind reads as out of play. At 0.38 the
         controls behind it still looked live, and the close button appeared to
         be sitting in a row with them. */
      position: fixed; inset: 0; background: rgba(15, 13, 8, 0.52);
      z-index: 60; border: 0; padding: 0;
      animation: scrim-in 0.34s ease both;
    }
    .drawer-scrim.is-closing { animation: scrim-out 0.28s ease both; }
    @keyframes scrim-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scrim-out { from { opacity: 1; } to { opacity: 0; } }
    .drawer {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 61;
      width: 278px; max-width: 84vw; background: var(--bg-elevated);
      border-right: 1px solid var(--border); box-shadow: var(--shadow-md);
      /* The panel itself no longer scrolls or clips — its tab hangs off the
         right edge, and overflow-y on this element quietly clips the x axis
         too, which would slice the tab off. The scrolling moved inside. */
      display: flex; flex-direction: column; overflow: visible;
      /* Decelerating curve: the panel arrives quickly and settles, which is
         what a sheet being pulled out feels like. Leaving is quicker and
         linear-ish — an exit that eases out reads as hesitant. */
      will-change: transform;
      animation: drawer-in 0.4s cubic-bezier(0.32, 0.72, 0, 1) both;
    }
    /* Out is a touch quicker than in, but eased at both ends now — the old
       exit accelerated away and read as a snap rather than a close. */
    .drawer.is-closing { animation: drawer-out 0.32s cubic-bezier(0.4, 0, 0.2, 1) both; }
    .drawer.is-resumed, .drawer.is-resumed .rail-group, .drawer.is-resumed .rail-item { animation: none; }
    @keyframes drawer-in { from { transform: translateX(-100%); } to { transform: none; } }
    @keyframes drawer-out { from { transform: none; } to { transform: translateX(-100%); } }
    /* The destinations trail the panel by a hair, so it reads as one movement
       arriving rather than a block sliding on. */
    .drawer .rail-group, .drawer .rail-item { animation: drawer-items 0.32s ease 0.1s both; }
    .drawer.is-closing .rail-group, .drawer.is-closing .rail-item { animation: none; }
    @keyframes drawer-items { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .drawer, .drawer.is-closing, .drawer-scrim, .drawer-scrim.is-closing,
      .drawer .rail-group, .drawer .rail-item { animation-duration: 0.01ms; }
    }
    .drawer-scroll {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
      padding: 10px 10px 24px;
      padding-top: max(10px, env(safe-area-inset-top));
    }
    /* A tab off the panel's edge, in the panel's own colours — same fill, same
       border, rounded only on the outer side, so it reads as part of the
       drawer rather than as a control sitting on the page. */
    .drawer-tab {
      position: absolute; left: 100%; top: max(18px, env(safe-area-inset-top));
      width: 34px; height: 46px; cursor: pointer;
      background: var(--bg-elevated); color: var(--text-muted);
      border: 1px solid var(--border); border-left: 0;
      border-radius: 0 13px 13px 0;
      display: grid; place-items: center;
      font-family: inherit; font-size: 21px; line-height: 1;
      box-shadow: 6px 2px 14px -8px rgba(25, 23, 15, 0.3);
    }
    .drawer-tab:hover { color: var(--text); background: var(--card); }
    .drawer-tab:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .drawer-tab svg { display: block; width: 18px; height: 18px; }

    .drawer-head {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 6px 10px; margin-bottom: 2px;
      border-bottom: 1px solid var(--border);
    }
    .drawer-head .drawer-org {
      font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* Below the rail the drawer is glass, in the bar's material — the same
       two layers, denser because it carries text and text over glass needs
       both a heavier fill and more blur underneath than five icons do. This
       block is the material, shared by the tablet's left drawer and the
       phone's top sheet; each band sets only its own geometry below. The
       layers are pseudo-elements of a container with no filter of its own,
       because a child's backdrop-filter cannot see through a parent that has
       one. */
    @media (max-width: 1000px) {
      .drawer {
        background: none; border: 0; color: var(--text);
        --glass-a: 0.72; --glass-blur: 16px;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05),
                    0 12px 32px -12px rgba(0, 0, 0, 0.4);
      }
      .drawer::before, .drawer::after {
        content: ''; position: absolute; inset: 0; border-radius: inherit;
        pointer-events: none;
      }
      .drawer::before {
        background: rgba(255, 255, 255, var(--glass-a));
        -webkit-backdrop-filter: blur(var(--glass-blur)) brightness(1.16) saturate(135%);
        backdrop-filter: blur(var(--glass-blur)) brightness(1.16) saturate(135%);
      }
      .drawer::after {
        padding: 1.5px;
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask-composite: exclude;
        -webkit-backdrop-filter: blur(1px) brightness(1.14) saturate(150%);
        backdrop-filter: blur(1px) brightness(1.14) saturate(150%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.62);
      }
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .drawer::before { background: rgba(255, 255, 255, 0.94); }
        .drawer::after { display: none; }
      }
      /* Above the glass layers. */
      .drawer > * { position: relative; z-index: 1; }
      /* The desktop drawer's 52% wash is what the glass would be blurring —
         a darkened page — and that composites to a flat grey slab. Light
         enough here that the page still reads as the page through the glass,
         which is the entire point of it. */
      .drawer-scrim { background: rgba(15, 13, 8, 0.22); }
      .drawer-head { border-bottom-color: rgba(0, 0, 0, 0.08); }
      .drawer-head .drawer-org { color: var(--text); }
      /* The tablet's close hangs off the panel's edge in the panel's own
         glass; the phone repositions it inside the sheet below. Absolute is
         restated: the `.drawer > *` rule above sets position: relative on
         every direct child at the same specificity as the base rule that
         made this absolute, and would otherwise drop it into the flex flow. */
      .drawer-tab {
        position: absolute; z-index: 2; border: 0; color: var(--text);
        background: rgba(255, 255, 255, 0.72);
        -webkit-backdrop-filter: blur(16px) saturate(135%);
        backdrop-filter: blur(16px) saturate(135%);
        box-shadow: 0 2px 8px -4px rgba(0, 0, 0, 0.25);
      }
      .drawer-tab:hover { background: rgba(255, 255, 255, 0.9); color: var(--text); }
      .drawer-tab:focus-visible { outline-color: var(--primary); }
      .drawer .rail-group { color: rgba(29, 27, 22, 0.55); }
      .drawer .rail-item {
        color: var(--text); padding: 11px 14px; border-radius: 14px;
        font-size: 14.5px;
      }
      .drawer .rail-item:hover { background: rgba(0, 0, 0, 0.05); color: var(--text); }
      .drawer .rail-item:focus-visible { outline-color: var(--primary); }
      .drawer .rail-item .icon { font-size: 17px; opacity: 1; stroke-width: 2; }
      /* The bar's bubble, carried into the menu. */
      .drawer .rail-item.active {
        background: rgba(138, 138, 144, 0.22); color: var(--text);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      .drawer .rail-item.active .icon { color: var(--text); }
      .drawer .rail-note { color: var(--text-muted); }
      .drawer .rail-note.over { color: var(--danger); }
    }
    /* The tablet's drawer is a full-height panel on the screen's left edge:
       three of its four edges are the screen's, with nothing to catch light,
       so the ring keeps only the line along its right edge where the glass
       ends. */
    @media (min-width: 721px) and (max-width: 1000px) {
      .drawer::after {
        -webkit-mask: none; mask: none; padding: 0;
        -webkit-backdrop-filter: none; backdrop-filter: none;
        box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.55);
      }
    }
    /* On a phone the drawer is the bar's other half: the same 27px stadium,
       20px off the screen's edges, mirrored to the top. It drops in on the
       bar's own curve while the bar leaves on it, so the two read as one
       object making room for itself. Geometry only — the material is above. */
    @media (max-width: 720px) {
      .drawer {
        top: calc(12px + env(safe-area-inset-top)); left: 20px; right: 20px;
        bottom: auto; width: auto; max-width: none;
        /* Content-sized, up to the screen less the same 12px below. */
        max-height: calc(100vh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        max-height: calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        border-radius: 27px;
        /* Clips the scroller to the radius. The close moved inside the sheet
           for this reason; a tab hung off the edge would be sliced away. */
        overflow: hidden;
        animation: sheet-in 0.44s cubic-bezier(0.32, 0.72, 0, 1) both;
      }
      .drawer.is-closing { animation: sheet-out 0.34s cubic-bezier(0.4, 0, 0.2, 1) both; }
      /* The shorthand above resets the duration the app-wide reduced-motion
         rule set earlier in the file, so it has to be said again here, after. */
      @media (prefers-reduced-motion: reduce) {
        .drawer, .drawer.is-closing { animation-duration: 0.01ms; }
      }
      /* Its own height plus the offset, so it starts entirely above the edge. */
      @keyframes sheet-in { from { transform: translateY(calc(-100% - 60px)); } to { transform: none; } }
      @keyframes sheet-out { from { transform: none; } to { transform: translateY(calc(-100% - 60px)); } }
      .drawer-scroll { padding: 14px 10px 14px; }
      /* No name at the top. The glass header says it on every screen, and the
         sheet drops in right over that header — so the row was repeating the
         line it had just covered, and paying a divider for it. The sheet opens
         straight onto Work, and the close shares that first line. */
      .drawer-head { display: none; }
      .drawer .rail-group:first-child { padding-right: 48px; }
      /* Inside the sheet, in a corner, rather than hung off an edge that is
         clipped to the radius. Restated absolute: the `.drawer > *` rule sets
         position: relative on every direct child at the same specificity, and
         without this the close drops into the flex flow at the top-left. */
      .drawer-tab {
        position: absolute; left: auto; right: 10px; top: 10px;
        width: 36px; height: 36px; border-radius: 999px;
        background: rgba(0, 0, 0, 0.06);
        -webkit-backdrop-filter: none; backdrop-filter: none;
        box-shadow: none;
      }
      .drawer-tab svg { width: 16px; height: 16px; }
      .drawer-tab:hover { background: rgba(0, 0, 0, 0.1); }
    }
    @media (max-width: 1000px) { .rail { display: none; } }
    /* The menu button exists in exactly one band: too narrow for the rail,
       too wide for the tab bar. Written as a range rather than as a hide-then-
       show pair, because those depend on which rule comes last in the file and
       this one does not. */
    @media (min-width: 721px) and (max-width: 1000px) {
      /* 42, not the 33 it was: under the 44px a thumb needs. The negative
         margin puts the tap target's edge near the screen edge while the icon
         still lines up with the content below it. */
      .railtoggle {
        display: inline-flex; align-items: center; justify-content: center;
        width: 42px; height: 42px; padding: 0; margin: 0 0 0 -10px;
      }
    }

    /* One toolbar per screen, replacing the stack of page-header, filter row
       and search row that put three bands of chrome above every list. */
    .toolbar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .toolbar h2 { margin: 0; font-size: 22px; }
    .toolbar .tb-count { font-size: 12.5px; color: var(--text-muted); white-space: nowrap; }
    .toolbar .tb-count b { color: var(--text); font-weight: 600; }
    .toolbar .tb-gap { flex: 1 1 auto; }

    /* On a phone the toolbar stacks on purpose rather than breaking wherever
       the widths happen to run out — which varied by account, since the org
       sets its own words for jobs and customers. The spacer already sits
       between the heading and the controls, so giving it a full line makes
       the break happen there every time.

       Title and its count, then the search, then the controls. The actions
       never get pushed down on their own, which is the thing that put a
       right-anchored menu at the left edge of the screen. */
    .toolbar .tb-search { flex: 1 1 200px; min-width: 150px; }
    .toolbar input[type="search"], .toolbar select { font-size: 13px; padding: 7px 11px; }
    .toolbar select { width: auto; }

    /* display:contents so the heading and its count stay direct participants
       in the toolbar's flex line — the wrapper exists only to give the phone
       something to put on a line of its own, and as a real box it was an
       unbreakable ~280px item that pushed the invoice toolbar onto two rows
       on a laptop. */
    /* The wrapper exists only so the heading and its count can be ordered
       together; display:contents keeps them direct flex items either way. */
    /* The count sits under the heading at every width, not beside it. Beside
       it, "8 total · $1535.00 outstanding" reads as part of the title and
       shoves everything after it along; under it, it reads as the subtitle it
       is, and the controls start where the heading starts. */
    .toolbar .tb-title {
      display: flex; flex-direction: column; align-items: flex-start;
      gap: 1px; min-width: 0;
    }
    .toolbar .tb-actions { display: inline-flex; align-items: center; gap: 8px; flex: none; }
    /* The view / filter strip gets a line to itself rather than sitting against
       the heading — ordered last so it sits under the controls, and it is the
       wrapper that fills the line while the control inside keeps its own
       width. Telling the control itself to fill the line stretched a two-item
       one into a band of empty tint. */
    .toolbar .tb-row { order: 1; flex-basis: 100%; display: flex; min-width: 0; margin-top: 3px; }
    .toolbar .tb-row .segmented {
      max-width: 100%; flex-wrap: nowrap; overflow-x: auto;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .toolbar .tb-row .segmented::-webkit-scrollbar { display: none; }

    @media (max-width: 680px) {
      /* Four rows of chrome before the first invoice, and the create button
         alone on one of them. Three now, and the heaviest control rides up
         beside the heading instead of blocking the list.

         Order, not source order: the actions live at the end of the toolbar
         for the laptop layout, and putting them on the heading's line here
         would otherwise mean repeating the markup. */
      /* The wrapper is a real box now, so it takes the order its two children
         used to carry separately. */
      .toolbar > * { order: 6; }
      .toolbar .tb-title { order: 1; }
      .toolbar .tb-actions { order: 2; margin-left: auto; }
      /* Pills before the field. Which status you are looking at is part of what
         this list currently is, so it belongs up with the heading that names
         it — not under a search box you may never type in. */
      .toolbar .tb-search { order: 5; flex: 1 0 100%; }
      /* A desktop device: on a phone it wrapped to a line of its own and
         pushed the actions to yet another. */
      .toolbar .tb-gap { display: none; }
      .toolbar h2 { font-size: 19px; }

      /* "+ New invoice" under a heading that says Invoices is saying it twice.
         The label goes and the button becomes its verb. */
      .toolbar .tb-actions .primary .btn-label { display: none; }
      /* Both actions become glass circles, in the bar's material — the last
         two painted objects between two panes of glass. The glyphs are bare
         text, and an absolutely positioned pseudo-element paints after
         in-flow text, so the layers would cover the "+" and the dots. The
         button becomes its own stacking context (z-index on a positioned
         element — which, unlike filter or opacity, does not make it a
         backdrop root) and the layers sit at -1 inside it: above the
         button's own background, below its text, and still blurring the
         page. */
      .toolbar .tb-actions .primary, .toolbar .rowmenu-trigger {
        position: relative; z-index: 0; width: 40px; height: 40px; padding: 0;
        display: inline-grid; place-items: center; font-size: 18px; line-height: 1;
        border: 0; border-radius: 999px; background: none; color: var(--text);
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05), 0 6px 16px -8px rgba(0, 0, 0, 0.35);
      }
      .toolbar .tb-actions .primary:hover, .toolbar .rowmenu-trigger:hover,
      .toolbar .tb-actions .primary:active, .toolbar .rowmenu-trigger:active { background: none; color: var(--text); }
      .toolbar .tb-actions .primary::before, .toolbar .rowmenu-trigger::before,
      .toolbar .tb-actions .primary::after, .toolbar .rowmenu-trigger::after {
        content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
        z-index: -1;
      }
      .toolbar .tb-actions .primary::before, .toolbar .rowmenu-trigger::before {
        background: rgba(255, 255, 255, 0.3);
        -webkit-backdrop-filter: blur(8px) brightness(1.16) saturate(135%);
        backdrop-filter: blur(8px) brightness(1.16) saturate(135%);
      }
      .toolbar .tb-actions .primary::after, .toolbar .rowmenu-trigger::after {
        padding: 1.5px;
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask-composite: exclude;
        -webkit-backdrop-filter: blur(1px) brightness(1.14) saturate(150%);
        backdrop-filter: blur(1px) brightness(1.14) saturate(150%);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.62);
      }
      .toolbar .tb-actions .primary:hover::before, .toolbar .rowmenu-trigger:hover::before { background: rgba(255, 255, 255, 0.45); }
      /* The "+" is a bare glyph, and Inter draws its plus 1.3px below the
         centre of its own box at this size — measured against the circle,
         not eyeballed. The dots sit dead centre and get nothing. Padding on
         one side moves the centred content by half its amount. */
      .toolbar .tb-actions .primary { padding-bottom: 2.6px; }
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .toolbar .tb-actions .primary::before, .toolbar .rowmenu-trigger::before { background: rgba(255, 255, 255, 0.94); }
        .toolbar .tb-actions .primary::after, .toolbar .rowmenu-trigger::after { display: none; }
      }

      /* Statuses swipe rather than collapse into a select. A select showed
         "Unpaid (8)" and hid that four are drafts and four are sent; the strip
         carries every count on its face. */
      .toolbar .tb-row { order: 4; }
      .toolbar .segmented button { flex: none; }
    }

    /* Filters read as a control, not as navigation - that ambiguity is why a
       chip row next to a tab row felt arbitrary. */
    .segmented {
      display: inline-flex; background: var(--tinted); border-radius: 11px;
      padding: 3px; gap: 2px; flex-wrap: wrap;
    }
    .segmented button {
      font-family: inherit; font-size: 12.5px; font-weight: 500;
      color: var(--text-muted); background: none; border: 0;
      padding: 9px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap;
    }
    .segmented button:hover { color: var(--text); }
    .segmented button.on {
      background: var(--card); color: var(--text); font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .segmented button .n { opacity: 0.6; font-weight: 500; }

    /* Rows that use the width: columns, instead of a title at one edge and a
       number at the other with a thousand pixels of nothing between them. */
    .dtable { background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; box-shadow: var(--shadow-sm); overflow: hidden;
      /* Columns respond to this box, not the window — see the @container
         rules below. A rail beside the table changes its width without
         changing the viewport's. */
      container-type: inline-size; }
    .dtable-row {
      display: grid; align-items: center; gap: 16px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
    }
    .dtable-row:last-child { border-bottom: 0; }
    .dtable-row:not(.dtable-head):hover { background: var(--row-hover); }
    .row.is-clickable, .job-card.is-clickable { cursor: pointer; }
    .job-card.is-clickable:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
    .row.is-clickable:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
    .dtable-row.is-clickable { cursor: pointer; }
    .dtable-row.is-clickable:focus-visible {
      outline: 2px solid var(--primary); outline-offset: -2px;
    }
    .dtable-head {
      background: var(--bg-elevated); font-size: 10.5px; font-weight: 700;
      letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-muted);
    }
    .dtable .c-num { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
