  trial_reminder_1d: ['user_name', 'organization_name', 'trial_ends_on', 'billing_url'],
  trial_expired: ['user_name', 'organization_name', 'billing_url'],
};

const TEMPLATE_LABELS = {
  email_verification: 'Email verification (sent on signup)',
  trial_reminder_3d: 'Trial reminder — 3 days before end',
  trial_reminder_1d: 'Trial reminder — 1 day before end',
  trial_expired: 'Trial ended notice',
};

// Sample values used to render the live preview in the email-template
// editor. Real sends substitute real customer / org data.
const TEMPLATE_PREVIEW_SAMPLE = {
  user_name: 'Sample User',
  user_email: 'sample@example.com',
  organization_name: 'Acme Lawn Care',
  verify_url: 'https://fieldmgr.com/verify-email?token=sample',
  billing_url: 'https://fieldmgr.com/billing',
  trial_ends_on: (() => {
    const d = new Date(); d.setDate(d.getDate() + 3);
    return d.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
  })(),
};

function renderTemplateSample(source) {
  if (!source) return '';
  return Object.entries(TEMPLATE_PREVIEW_SAMPLE).reduce(
    (s, [k, v]) => s.split(`{{${k}}}`).join(v),
    source
  );
}

function EmailTemplatesSection({ token }) {
  const [templates, setTemplates] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [editingKey, setEditingKey] = useState(null);
  const [draft, setDraft] = useState(null);
  const [busy, setBusy] = useState(false);
  const [editorTab, setEditorTab] = useState('edit'); // 'edit' | 'preview'
  const [previewing, setPreviewing] = useState(null); // template for quick preview modal
  const [renderedPreview, setRenderedPreview] = useState(null); // { subject, html, text } from server
  const [previewLoading, setPreviewLoading] = useState(false);

  // Whenever the Preview tab is active and the draft changes, fetch a
  // freshly rendered preview from the server (uses the real shell
  // wrapper, so what you see is what gets sent).
  useEffect(() => {
    if (!editingKey || editorTab !== 'preview' || !draft) return;
    let cancelled = false;
    setPreviewLoading(true);
    apiRequest(`/api/system/email-templates/${editingKey}/preview`, {
      method: 'POST', token, body: draft,
    }).then((data) => { if (!cancelled) setRenderedPreview(data); })
      .catch((err) => { if (!cancelled) setError(err.message); })
      .finally(() => { if (!cancelled) setPreviewLoading(false); });
    return () => { cancelled = true; };
  }, [editingKey, editorTab, draft, token]);

  // Quick-preview modal fetches once on open.
  useEffect(() => {
    if (!previewing) return;
    let cancelled = false;
    setPreviewLoading(true);
    apiRequest(`/api/system/email-templates/${previewing.template_key}/preview`, {
      method: 'POST', token,
      body: { subject: previewing.subject, intro_html: previewing.intro_html, intro_text: previewing.intro_text },
    }).then((data) => { if (!cancelled) setRenderedPreview(data); })
      .catch(() => {})
      .finally(() => { if (!cancelled) setPreviewLoading(false); });
    return () => { cancelled = true; };
  }, [previewing, token]);

  const refresh = useCallback(async () => {
    setLoading(true); setError(null);
    try {
      const data = await apiRequest('/api/system/email-templates', { token });
      setTemplates(data);
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  }, [token]);

  useEffect(() => { refresh(); }, [refresh]);

  function startEdit(t) {
    setDraft({ subject: t.subject, intro_html: t.intro_html, intro_text: t.intro_text });
    setEditingKey(t.template_key);
    setEditorTab('edit');
  }

  async function saveEdit() {
    setBusy(true); setError(null);
    try {
      await apiRequest(`/api/system/email-templates/${editingKey}`, {
        method: 'PUT', token, body: draft,
      });
      setEditingKey(null); setDraft(null);
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  async function resetToDefault(key) {
    if (!confirm('Reset this template to its default text?')) return;
    setError(null);
    try {
      await apiRequest(`/api/system/email-templates/${key}`, { method: 'DELETE', token });
      await refresh();
    } catch (err) { setError(err.message); }
  }

  if (editingKey) {
    const vars = TEMPLATE_VARIABLES[editingKey] || [];
    return (
      <>
        <div className="section-heading" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', flexWrap: 'wrap', gap: 12 }}>
          <span>Edit: {TEMPLATE_LABELS[editingKey]}</span>
          <div className="chip-group" style={{ marginBottom: 0 }}>
            <button type="button" className={`chip ${editorTab === 'edit' ? 'active' : ''}`} onClick={() => setEditorTab('edit')}>Edit</button>
            <button type="button" className={`chip ${editorTab === 'preview' ? 'active' : ''}`} onClick={() => setEditorTab('preview')}>Preview</button>
          </div>
        </div>
        {error && <div className="error">{error}</div>}
        {editorTab === 'edit' ? (
          <div className="form-card">
            <p className="hint" style={{ marginBottom: 16 }}>
              Available variables (insert as <code>{`{{variable}}`}</code>): {vars.map((v) => <code key={v} style={{ marginRight: 6 }}>{`{{${v}}}`}</code>)}
            </p>
            <label>Subject</label>
            <input value={draft.subject} onChange={(e) => setDraft({ ...draft, subject: e.target.value })} />
            <label>HTML body</label>
            <textarea
              rows={8} value={draft.intro_html}
              onChange={(e) => setDraft({ ...draft, intro_html: e.target.value })}
              style={{ fontFamily: 'ui-monospace, Menlo, monospace', fontSize: 13 }}
            />
            <label>Plain text body</label>
            <textarea
              rows={6} value={draft.intro_text}
              onChange={(e) => setDraft({ ...draft, intro_text: e.target.value })}
              style={{ fontFamily: 'ui-monospace, Menlo, monospace', fontSize: 13 }}
            />
            <div className="form-actions">
              <button className="primary" disabled={busy} onClick={saveEdit}>{busy ? 'Saving...' : 'Save'}</button>
              <button className="secondary" disabled={busy} onClick={() => { setEditingKey(null); setDraft(null); }}>Cancel</button>
            </div>
          </div>
        ) : (
          <div className="form-card">
            <p className="hint" style={{ marginTop: 0, marginBottom: 12 }}>
              Preview uses sample data and the actual email shell — this is what the recipient sees.
            </p>
            <div className="email-preview">
              <div className="email-preview-meta">
                <div><strong>Subject:</strong> {renderedPreview ? renderedPreview.subject : '…'}</div>
              </div>
              {previewLoading && !renderedPreview ? (
                <div style={{ padding: 20, color: 'var(--text-muted)', textAlign: 'center' }}>Rendering…</div>
              ) : (
                <iframe
                  className="email-preview-frame"
                  title="Email preview"
                  srcDoc={renderedPreview ? renderedPreview.html : ''}
                />
              )}
            </div>
            <div className="section-heading" style={{ marginTop: 16 }}>Plain text version</div>
            <pre className="email-preview-text">{renderedPreview ? renderedPreview.text : ''}</pre>
            <div className="form-actions">
              <button className="primary" disabled={busy} onClick={saveEdit}>{busy ? 'Saving...' : 'Save'}</button>
              <button className="secondary" disabled={busy} onClick={() => { setEditingKey(null); setDraft(null); }}>Cancel</button>
            </div>
          </div>
        )}
      </>
    );
  }

  return (
    <>
      <div className="section-heading">Email templates</div>
      {error && <div className="error">{error}</div>}
      <div className="list">
        {loading ? (
          <div className="list-empty">Loading...</div>
        ) : templates.length === 0 ? (
          <div className="list-empty">No templates.</div>
        ) : (
          templates.map((t) => (
            <div key={t.template_key} className="row">
              <div className="info">
                <div className="name">
                  {TEMPLATE_LABELS[t.template_key] || t.template_key}
                  {t.is_default
                    ? <span className="hint" style={{ marginLeft: 8 }}>(using default)</span>
                    : <span className="hint" style={{ marginLeft: 8 }}>customized {t.updated_at ? formatDateString(t.updated_at.split('T')[0]) : ''}</span>}
                </div>
                <div className="meta">{t.subject}</div>
              </div>
              <div className="actions">
                <button className="secondary" onClick={() => setPreviewing(t)}>Preview</button>
                <button className="secondary" onClick={() => startEdit(t)}>Edit</button>
                {!t.is_default && (
                  <button className="secondary" onClick={() => resetToDefault(t.template_key)}>Reset</button>
                )}
              </div>
            </div>
          ))
        )}
      </div>
      {previewing && (
        <div className="modal-overlay" onClick={() => { setPreviewing(null); setRenderedPreview(null); }}>
          <div className="modal-card" style={{ maxWidth: 760 }} onClick={(e) => e.stopPropagation()}>
            <div className="modal-head">
              <h3 style={{ margin: 0 }}>{TEMPLATE_LABELS[previewing.template_key] || previewing.template_key}</h3>
              <button className="modal-close" onClick={() => { setPreviewing(null); setRenderedPreview(null); }}>×</button>
            </div>
            <p className="hint" style={{ marginTop: 0 }}>Preview uses sample data and the actual email shell.</p>
            <div className="email-preview">
              <div className="email-preview-meta">
                <div><strong>Subject:</strong> {renderedPreview ? renderedPreview.subject : '…'}</div>
              </div>
              {previewLoading && !renderedPreview ? (
                <div style={{ padding: 20, color: 'var(--text-muted)', textAlign: 'center' }}>Rendering…</div>
              ) : (
                <iframe
                  className="email-preview-frame"
                  title="Email preview"
                  srcDoc={renderedPreview ? renderedPreview.html : ''}
                />
              )}
            </div>
          </div>
        </div>
      )}
    </>
  );
}

function VerifyEmailPage() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token') || '';
  const [state, setState] = useState('working');
  const [error, setError] = useState(null);

  useEffect(() => {
    if (!token) { setState('invalid'); return; }
    (async () => {
      try {
        await apiRequest('/api/auth/verify-email', {
          method: 'POST', body: { token },
        });
        setState('done');
      } catch (err) {
        setError(err.message);
        setState('error');
      }
    })();
  }, [token]);

  return (
    <div className="auth-shell">
      <div className="card">
        <h1>Email verification</h1>
        {state === 'working' && <p className="subtitle">Verifying your email...</p>}
        {state === 'invalid' && (
          <>
            <p className="subtitle">This link is missing required information. Sign in and use the resend button to get a fresh link.</p>
            <button className="primary block" onClick={() => navigate('/signin')}>Sign in</button>
          </>
        )}
        {state === 'error' && (
          <>
            <p className="subtitle">{error || 'Could not verify your email.'}</p>
            <button className="primary block" onClick={() => navigate('/signin')}>Back to sign in</button>
          </>
        )}
        {state === 'done' && (
          <>
            <p className="subtitle">Email verified. You're all set.</p>
            <button className="primary block" onClick={() => navigate('/dashboard')}>Continue</button>
          </>
        )}
      </div>
    </div>
  );
}

function ResetPasswordPage() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token') || '';
  const [password, setPassword] = useState('');
  const [confirm, setConfirm] = useState('');
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setError(null);
    if (password !== confirm) {
      setError('Passwords do not match.');
      return;
    }
    setBusy(true);
    try {
      await apiRequest('/api/auth/reset-password', {
        method: 'POST',
        body: { token, new_password: password },
      });
      setDone(true);
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  if (!token) {
    return (
      <div className="auth-shell">
        <div className="card">
          <h1>Reset password</h1>
          <p className="subtitle">This reset link is missing required information. Request a new one from the sign-in page.</p>
          <button className="primary block" onClick={() => navigate('/signin')}>Back to sign in</button>
        </div>
      </div>
    );
  }

  if (done) {
    return (
      <div className="auth-shell">
        <div className="card">
          <h1>Password updated</h1>
          <p className="subtitle">You can now sign in with your new password.</p>
          <button className="primary block" onClick={() => navigate('/signin')}>Sign in</button>
        </div>
      </div>
    );
  }

  return (
    <div className="auth-shell">
      <div className="card">
        <h1>Reset password</h1>
        <p className="subtitle">Choose a new password to finish setup.</p>
        <form onSubmit={submit}>
          <label>New password <span className="hint">(at least 8 characters)</span></label>
          <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required autoFocus />
          <label>Confirm new password</label>
          <input type="password" value={confirm} onChange={(e) => setConfirm(e.target.value)} required />
          {error && <div className="error">{error}</div>}
          <button type="submit" className="primary block" disabled={busy}>
            {busy ? 'Saving...' : 'Set new password'}
          </button>
        </form>
      </div>
    </div>
  );
}

        if (!res.ok) {
          if (cancelled) return;
          setError(res.status === 404 ? 'Invoice not found.' : `Error ${res.status}`);
          return;
        }
        const data = await res.json();
        if (cancelled) return;
        setInvoice(data);
        document.title = `Invoice #${data.invoice_number} — ${data.company_name || data.organization_name}`;
      } catch (err) {
        if (!cancelled) setError(err.message);

    return () => { cancelled = true; };

            {invoice.customer_email && <p className="muted">{invoice.customer_email}</p>}

          </div>
          <div>
            <h3>Status</h3>

            {invoice.paid_date && <p className="muted">Paid {formatDateString(invoice.paid_date.split('T')[0])}</p>}

              style={{

                fontWeight: 600, fontSize: 16, borderRadius: 10,
                textDecoration: 'none',
              }}

              Pay {formatPrice(math.total)}

            <p style={{ marginTop: 8, fontSize: 12, color: 'var(--text-muted)' }}>

              <p style={{ marginTop: 8, fontSize: 12, color: 'var(--text-muted)' }}>
                After payment, {invoice.company_name || invoice.organization_name} will mark this invoice as paid in their records.
              </p>
            )}
          </div>
        )}

        <div className="invoice-actions no-print">
          <button className="secondary" onClick={() => window.print()}>Print or save as PDF</button>
        </div>

        {/* Last, and quieter than everything above it: paying comes first.
            The referral link, not the private page — invoices get forwarded. */}
        {invoice.referral && (
          <div className="invoice-referral no-print">
            <p>
              Know someone who could use us? Share your link and earn <strong>{invoice.referral.percent}%</strong> of {invoice.referral.cap_jobs != null ? `their first ${invoice.referral.cap_jobs} jobs` : 'every job we do for them'} as credit.
            </p>
            <div className="invoice-referral-row">
              <input readOnly value={invoice.referral.link} onFocus={(e) => e.target.select()} aria-label="Your referral link" />
              <CopyButton text={invoice.referral.link} label="Copy link" />
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

        if (cancelled) return;
        if (!res.ok) { setError(res.status === 404 ? 'This link is not active.' : `Error ${res.status}`); return; }
        const d = await res.json();
        if (cancelled) return;
        setData(d);
        document.title = `Your referrals — ${d.company_name}`;
      })
      .catch((err) => { if (!cancelled) setError(err.message); });
    return () => { cancelled = true; };
  }, [token]);

  if (error) {
    return (
      <div className="public-shell"><div className="invoice-doc">
        <h1 style={{ marginTop: 0 }}>Page unavailable</h1>
        <p className="subtitle">{error}</p>
      </div></div>
    );
  }
  if (!data) return <div className="public-shell"><div className="invoice-doc"><p className="subtitle">Loading...</p></div></div>;

  const link = `${window.location.origin}/book/${data.slug}?ref=${data.referral_code}`;
  const canShare = typeof navigator !== 'undefined' && typeof navigator.share === 'function';
  async function copy() {
    try { await navigator.clipboard.writeText(link); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (e) { /* the field is selectable */ }
  }
  function share() {
    navigator.share({ title: data.company_name, text: `I use ${data.company_name} — book through my link:`, url: link }).catch(() => {});
  }

  return (
    <div className="public-shell refpage">
      <div className="invoice-doc">
        <div className="refpage-head">
          {data.logo_url && <img src={data.logo_url} alt="" />}
          <div>
            <div className="refpage-co">{data.company_name}</div>
            <h1>{data.name ? `${data.name}, here are your referrals` : 'Your referrals'}</h1>
          </div>
        </div>

        <div className="refpage-stats">
          <div><div className="k">{formatPrice(data.credit_balance)}</div><div className="l">Credit available</div></div>
          <div><div className="k">{formatPrice(data.earned)}</div><div className="l">Earned from referrals</div></div>
          <div><div className="k">{data.referred.length}</div><div className="l">{data.referred.length === 1 ? 'Person referred' : 'People referred'}</div></div>
        </div>

        <h2 className="refpage-h">Your link</h2>
        <p className="subtitle" style={{ marginTop: 0 }}>
          Anyone who books through it is marked as your referral. You earn <strong style={{ color: 'var(--text)' }}>{data.percent}%</strong> of {data.cap_jobs != null ? `their first ${data.cap_jobs} jobs` : 'every job we do for them'}, as credit on your account.
        </p>
        <div className="refpage-link">
          <input id="refpage-link" readOnly value={link} onFocus={(e) => e.target.select()} aria-label="Your referral link" />
          <button type="button" className="primary" onClick={copy}>{copied ? 'Copied' : 'Copy'}</button>
          {canShare && <button type="button" className="secondary" onClick={share}>Share</button>}
        </div>

        <h2 className="refpage-h">Who you&apos;ve referred</h2>
        {data.referred.length === 0 ? (
          <p className="subtitle" style={{ marginTop: 0 }}>Nobody yet. Send your link to a neighbor or a friend.</p>
        ) : (
          <div className="refpage-list">
            {data.referred.map((r, i) => (
              <div key={i} className="refpage-row">
                <div>
                  <div className="n">{r.name}</div>
                  <div className="m">{r.rewards === 0 ? 'No jobs completed yet' : `${r.rewards} ${r.rewards === 1 ? 'reward' : 'rewards'}`}</div>
                </div>
                {r.earned > 0 && <div className="a">+{formatPrice(r.earned)}</div>}
              </div>
            ))}
          </div>
        )}

        <p className="refpage-foot">
          Credit comes off a future invoice. Questions? {data.company_phone && <a href={`tel:${data.company_phone.replace(/[^\d+]/g, '')}`}>{data.company_phone}</a>}{data.company_phone && data.company_email && ' · '}{data.company_email && <a href={`mailto:${data.company_email}`}>{data.company_email}</a>}
        </p>
      </div>
    </div>
  );
}

function PublicQuoteView({ id }) {
  const [quote, setQuote] = useState(null);
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [showDecline, setShowDecline] = useState(false);
  const [declineReason, setDeclineReason] = useState('');

  const load = useCallback(async () => {
    try {
      const res = await fetch(`/api/public/quotes/${id}`);
      if (!res.ok) {
        setError(res.status === 404 ? 'Quote not found.' : `Error ${res.status}`);
        return;
      }
      const data = await res.json();
      setQuote(data);
      document.title = `Quote — ${data.company_name || data.organization_name}`;
    } catch (err) { setError(err.message); }
  }, [id]);

  useEffect(() => { load(); }, [load]);

  async function accept() {
    if (!confirm('Accept this quote? The business will be notified and will follow up to schedule.')) return;
    setBusy(true); setError(null);
    try {
      const res = await fetch(`/api/public/quotes/${id}/accept`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `Error ${res.status}`);
      }
      await load();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  async function submitDecline() {
    setBusy(true); setError(null);
    try {
      const res = await fetch(`/api/public/quotes/${id}/decline`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reason: declineReason }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.error || `Error ${res.status}`);
      }
      setShowDecline(false); setDeclineReason('');
      await load();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  if (error && !quote) {
    return (
      <div className="public-shell">
        <div className="invoice-doc">
          <h1>Quote unavailable</h1>
          <p className="subtitle">{error}</p>
        </div>
      </div>
    );
  }
  if (!quote) {
    return <div className="public-shell"><div className="invoice-doc">Loading...</div></div>;
  }

  const total = (quote.line_items || []).reduce((s, li) => s + (parseFloat(li.amount) || 0), 0);
  const companyName = quote.company_name || quote.organization_name;
  const recipientName = quote.customer_business_name
    || [quote.customer_first_name, quote.customer_last_name].filter(Boolean).join(' ')
    || quote.prospect_name
    || '';
  const recipientEmail = quote.customer_email || quote.prospect_email;
  const recipientPhone = quote.customer_phone || quote.prospect_phone;
  const recipientAddress = quote.customer_address || quote.prospect_address;

  const fromApp = (typeof window !== 'undefined') &&
    new URLSearchParams(window.location.search).get('from') === 'app';

  function goBack() {
    if (window.history.length > 1) window.history.back();
    else navigate('/quotes');
  }

  return (
    <div className="public-shell">
      {fromApp && (
        <div style={{ maxWidth: 800, margin: '12px auto 0', padding: '0 16px' }}>
          <button
            type="button"
            className="link-button"
            onClick={goBack}
            style={{ fontSize: 14, padding: '6px 0', display: 'inline-flex', alignItems: 'center', gap: 4 }}
          >← Back</button>
        </div>
      )}
      <div className="invoice-doc">
        <header className="invoice-header">
          <div className="company">
            {quote.logo_url && <img src={quote.logo_url} alt={companyName} />}
            <div>
              <h1>{companyName}</h1>
              {quote.company_address && <p className="addr">{quote.company_address}</p>}
              {quote.company_phone && <p className="addr">{quote.company_phone}</p>}
              {quote.company_email && <p className="addr">{quote.company_email}</p>}
            </div>
          </div>
          <div className="meta">
            <div className="num">Quote</div>
            <div className="date">{formatDateString(quote.created_at.split('T')[0])}</div>
            <span className={`badge ${quote.status}`}>{quote.status}</span>
          </div>
        </header>

        <div className="invoice-meta-blocks">
          <div>
            <h3>Prepared for</h3>
            <p>{recipientName || '—'}</p>
            {recipientAddress && <p className="muted">{recipientAddress}</p>}
            {recipientEmail && <p className="muted">{recipientEmail}</p>}
            {recipientPhone && <p className="muted">{recipientPhone}</p>}
          </div>
          <div>
            <h3>Status</h3>
            <p style={{ textTransform: 'capitalize' }}>{quote.status}</p>
          </div>
        </div>

        {quote.description && (
          <div className="invoice-description">{quote.description}</div>
        )}

        <table className="invoice-items">
          <thead>
            <tr>
              <th>Description</th>
              <th className="r">Qty</th>
              <th className="r">Rate</th>
              <th className="r">Amount</th>
            </tr>
          </thead>
          <tbody>
            {(quote.line_items || []).map((item, i) => (
              <tr key={i}>
                <td>{item.description}</td>
                <td className="r">{item.quantity}</td>
                <td className="r">{formatPrice(item.rate)}</td>
                <td className="r">{formatPrice(item.amount)}</td>
              </tr>
            ))}
          </tbody>
        </table>
        <div style={{ marginTop: 12 }}>
          <div className="invoice-total">Estimated total {formatPrice(total)}</div>
        </div>

        {quote.notes && (
          <div style={{ marginTop: 24, padding: 16, background: 'var(--tinted)', borderRadius: 8, whiteSpace: 'pre-line', fontSize: 14 }}>
            {quote.notes}
          </div>
        )}

        {error && <div className="error" style={{ marginTop: 16 }}>{error}</div>}

        {quote.status === 'sent' && !showDecline && (
          <div className="invoice-pay-cta no-print" style={{ marginTop: 24, textAlign: 'center', display: 'flex', gap: 12, justifyContent: 'center', flexWrap: 'wrap' }}>
            <button
              className="primary"
              onClick={accept}
              disabled={busy}
              style={{ padding: '14px 32px', fontSize: 16, fontWeight: 600, borderRadius: 10 }}
            >
              Accept quote
            </button>
            <button
              className="secondary"
              onClick={() => setShowDecline(true)}
              disabled={busy}
              style={{ padding: '14px 24px', fontSize: 15, borderRadius: 10 }}
            >
              Decline
            </button>
          </div>
        )}

        {quote.status === 'sent' && showDecline && (
          <div className="no-print" style={{ marginTop: 24, padding: 16, background: 'var(--tinted)', borderRadius: 8 }}>
            <label>Reason (optional)</label>
            <textarea
              value={declineReason}
              onChange={(e) => setDeclineReason(e.target.value)}
              rows={3}
              placeholder="Anything you'd like them to know?"
            />
            <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
              <button className="danger" onClick={submitDecline} disabled={busy}>Confirm decline</button>
              <button className="secondary" onClick={() => { setShowDecline(false); setDeclineReason(''); }} disabled={busy}>Cancel</button>
            </div>
          </div>
        )}

        {quote.status === 'accepted' && (
          <div className="no-print" style={{ marginTop: 24, padding: 16, background: '#e8f5e9', color: '#1b5e20', borderRadius: 8, textAlign: 'center', fontWeight: 500 }}>
            You accepted this quote. {companyName} will follow up to schedule.
          </div>
        )}

        {quote.status === 'declined' && (
          <div className="no-print" style={{ marginTop: 24, padding: 16, background: 'var(--tinted)', borderRadius: 8, textAlign: 'center', color: 'var(--text-muted)' }}>
            You declined this quote.
          </div>
        )}

        <div className="invoice-actions no-print">
          <button className="secondary" onClick={() => window.print()}>Print or save as PDF</button>
        </div>
      </div>
    </div>
  );
}

// Reusable public booking form — used by the standalone /book/<slug> page
// and by the hosted landing page's form section. Owns its own state,
// submit, and inline success message. Caller supplies the org's slug,
// booking_form_config, name, and job label.
function BookingForm({ slug, config, orgName, jobLabel }) {
  const cfg = config || {};
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [phone, setPhone] = useState('');
  const [address, setAddress] = useState('');
  const [service, setService] = useState('');
  // Up to 3 (date, window) slot pairs. We always keep 3 in state and only
  // render / submit as many as the org's config allows.
  const [slots, setSlots] = useState([
    { date: '', window: 'anytime' },
    { date: '', window: 'anytime' },
    { date: '', window: 'anytime' },
  ]);
  function updateSlot(i, key, value) {
    setSlots((arr) => arr.map((s, idx) => (idx === i ? { ...s, [key]: value } : s)));
  }
  const [notes, setNotes] = useState('');
  const [referredBy, setReferredBy] = useState('');
  // A referral link: /book/<slug>?ref=<code>. The name is looked up so the
  // page can say who sent them; an unknown code is simply ignored.
  const [refCode] = useState(() => (new URLSearchParams(window.location.search).get('ref') || '').trim().slice(0, 16));
  const [refName, setRefName] = useState('');
  useEffect(() => {
    if (!refCode) return undefined;
    let cancelled = false;
    apiRequest(`/api/public/referrer/${slug}/${encodeURIComponent(refCode)}`)
      .then((r) => { if (!cancelled && r && r.name) setRefName(r.name); })
      .catch(() => {});
    return () => { cancelled = true; };
  }, [slug, refCode]);
  const [website, setWebsite] = useState(''); // honeypot
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [done, setDone] = useState(false);

  const showPhone = cfg.show_phone !== false;
  const showAddress = cfg.show_address !== false;
  const showNotes = cfg.show_notes !== false;
  const showReferredBy = cfg.show_referred_by === true;
  const slotCount = cfg.preferred_dates_mode === 'three' ? 3 : cfg.preferred_dates_mode === 'one' ? 1 : 0;
  const servicePlaceholder = cfg.service_placeholder || "Brief description of the service you'd like";
  const notesPlaceholder = cfg.notes_placeholder || 'Anything else they should know?';

  async function submit(e) {
    e.preventDefault();
    setBusy(true); setError(null);
    try {
      const visibleSlots = slots.slice(0, slotCount).filter((s) => s.date);
      await apiRequest(`/api/public/book/${slug}`, {
        method: 'POST',
        body: {
          requester_name: name,
          requester_email: email,
          requester_phone: phone,
          requester_address: address,
          service_description: service,
          preferred_slots: visibleSlots,
          notes,
          referred_by: referredBy,
          ref: refName ? refCode : '',
          website,
        },
      });
      setDone(true);
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  }

  if (done) {
    return (
      <div className="booking-done">
        <h3 style={{ marginTop: 0 }}>Request sent</h3>
        <p className="subtitle">Thanks! {orgName} got your request and will be in touch shortly to confirm.</p>
      </div>
    );
  }

  return (
    <form onSubmit={submit}>
      {refName && (
        <p className="booking-ref">
          You were referred by <strong>{refName}</strong>.
        </p>
      )}
      <label>Your name</label>
      <input value={name} onChange={(e) => setName(e.target.value)} required />

      <label>Email</label>
      <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" required={!showPhone} />

      {showPhone && (
        <>
          <label>Phone <span className="hint">(optional)</span></label>
          <input value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="555-1234" />
        </>
      )}

      {showAddress && (
        <>
          <label>Address <span className="hint">(where the work happens, optional)</span></label>
          <textarea value={address} onChange={(e) => setAddress(e.target.value)} rows={2} />
        </>
      )}

      <label>What do you need?</label>
      <textarea value={service} onChange={(e) => setService(e.target.value)} rows={3} required placeholder={servicePlaceholder} />

      {slotCount > 0 && (
        <div style={{ marginTop: 4 }}>
          {Array.from({ length: slotCount }, (_, i) => (
            <div key={i} style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: 12, marginBottom: i < slotCount - 1 ? 12 : 0 }}>
              <div style={{ minWidth: 0 }}>
                <label>
                  {slotCount === 1 ? 'Preferred date' : `Option ${i + 1} — date`}{' '}
                  <span className="hint">(optional)</span>
                </label>
                <input type="date" value={slots[i].date} onChange={(e) => updateSlot(i, 'date', e.target.value)} style={{ width: '100%' }} />
              </div>
              <div style={{ minWidth: 0 }}>
                <label>{slotCount === 1 ? 'Time of day' : 'Time'}</label>
                <select value={slots[i].window} onChange={(e) => updateSlot(i, 'window', e.target.value)} style={{ width: '100%' }}>
                  <option value="anytime">Anytime</option>
                  <option value="morning">Morning</option>
                  <option value="afternoon">Afternoon</option>
                  <option value="evening">Evening</option>
                </select>
              </div>
            </div>
          ))}
        </div>
      )}

      {showNotes && (
        <>
          <label>Notes <span className="hint">(optional)</span></label>
          <textarea value={notes} onChange={(e) => setNotes(e.target.value)} rows={2} placeholder={notesPlaceholder} />
        </>
      )}

      {showReferredBy && !refName && (
        <>
          <label>Referred by <span className="hint">(optional)</span></label>
          <input value={referredBy} onChange={(e) => setReferredBy(e.target.value)} placeholder="How did you hear about us?" />
        </>
      )}

      <input
        type="text" name="website" value={website}
        onChange={(e) => setWebsite(e.target.value)}
        style={{ position: 'absolute', left: '-9999px', opacity: 0, pointerEvents: 'none' }}
        tabIndex={-1} autoComplete="off"
      />

      {error && <div className="error">{error}</div>}

      <button type="submit" className="primary block" disabled={busy}>
        {busy ? 'Sending...' : 'Send request'}
      </button>
    </form>
  );
}

// Gallery carousel: click-drag to scroll on desktop, prev/next arrows, and
// native touch-swipe on mobile. Scrollbar hidden; not driven by browser
// scroll UI.
function LandingGallery({ items }) {
  const ref = useRef(null);
  const drag = useRef({ down: false, startX: 0, startScroll: 0 });

  function onDown(e) {
    const el = ref.current;
    if (!el) return;
    drag.current = { down: true, startX: e.pageX, startScroll: el.scrollLeft };
    el.classList.add('dragging');
  }
  function onMove(e) {
    if (!drag.current.down) return;
    const el = ref.current;
    if (!el) return;
    e.preventDefault();
    el.scrollLeft = drag.current.startScroll - (e.pageX - drag.current.startX);
  }
  function endDrag() {
    drag.current.down = false;
    if (ref.current) ref.current.classList.remove('dragging');
  }
  function nudge(dir) {
    const el = ref.current;
    if (!el) return;
    el.scrollBy({ left: dir * Math.max(el.clientWidth * 0.8, 260), behavior: 'smooth' });
  }

  return (
    <section className="lp-gallery-wrap">
      <button type="button" className="lp-gallery-arrow lp-gallery-prev" onClick={() => nudge(-1)} aria-label="Previous">‹</button>
      <div
        className="lp-gallery"
        ref={ref}
        onMouseDown={onDown}
        onMouseMove={onMove}
        onMouseUp={endDrag}
        onMouseLeave={endDrag}
      >
        {items.map((g, i) => (
          <figure key={i} className="lp-gallery-item">
            <img src={g.url} alt={g.caption || ''} loading="lazy" draggable={false} />
          </figure>
        ))}
      </div>
      <button type="button" className="lp-gallery-arrow lp-gallery-next" onClick={() => nudge(1)} aria-label="Next">›</button>
    </section>
  );
}

// Polls /api/version every 5 minutes. If the server's build identifier
// changes mid-session (i.e., a new deploy went out), shows a small toast
// asking the user to refresh. Dismiss is per-session — if another deploy
// goes out later, the banner returns.
function VersionCheck() {
  const initialRef = React.useRef(null);
  const [updateAvailable, setUpdateAvailable] = useState(false);
  const [dismissed, setDismissed] = useState(false);

  useEffect(() => {
    let stopped = false;
    async function check() {
      try {
        const res = await fetch('/api/version', { cache: 'no-store' });
        if (!res.ok || stopped) return;
        const data = await res.json();
        if (initialRef.current === null) {
          initialRef.current = data.version;
        } else if (data.version !== initialRef.current) {
          setUpdateAvailable(true);
        }
      } catch (e) { /* network blip, try again next tick */ }
    }
    check();
    const timer = setInterval(check, 5 * 60 * 1000);
    return () => { stopped = true; clearInterval(timer); };
  }, []);

  // Re-show the banner on the next mismatch even after dismissal —
  // tracked by resetting dismissed when updateAvailable flips off.
  useEffect(() => {
    if (!updateAvailable) setDismissed(false);
  }, [updateAvailable]);

  if (!updateAvailable || dismissed) return null;

  return (
    <div className="version-banner" role="status">
      <span className="version-banner-text">A new version is available.</span>
      <button
        type="button"
        className="version-banner-refresh"
        onClick={() => window.location.reload()}
      >Refresh</button>
      <button
        type="button"
        className="version-banner-close"
        onClick={() => setDismissed(true)}
        aria-label="Dismiss"
      >×</button>
    </div>
  );
}

// ===== Team notes: shared compose modal, dashboard widget, banner =====
//
// Anyone in the org can compose a note. Recipients see it on their
// dashboard + an app-wide banner + their inbox.

function TeamNoteCompose({ session, open, onClose, onSent }) {
  const [subject, setSubject] = useState('');
  const [body, setBody] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  if (!open) return null;

  async function submit(e) {
    e.preventDefault();
    setBusy(true); setError(null);
    try {
      await apiRequest('/api/team-messages', {
        method: 'POST', slug: session.slug, token: session.token,
        body: { subject, body },
      });
      setSubject(''); setBody('');
      onSent && onSent();
      onClose();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-card" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head">
          <h3>Send a team note</h3>
          <button className="modal-close" type="button" onClick={onClose} aria-label="Close">×</button>
        </div>
        <p className="subtitle" style={{ marginTop: 0, marginBottom: 14 }}>
          Goes to every teammate's dashboard and email — except yours.
        </p>
        <form onSubmit={submit}>
          <label>Subject <span className="hint">(optional)</span></label>
          <input
            value={subject}
            onChange={(e) => setSubject(e.target.value)}
            placeholder="Tomorrow's route, Mower swap, etc."
            maxLength={200}
          />
          <label>Message</label>
          <textarea
            value={body}
            onChange={(e) => setBody(e.target.value)}
            rows={6}
            required
            maxLength={5000}
            placeholder="What everyone should know."
          />
          {error && <div className="error">{error}</div>}
          <div className="form-actions" style={{ marginTop: 14 }}>
            <button type="submit" className="primary" disabled={busy || !body.trim()}>
              {busy ? 'Sending...' : 'Send to team'}
            </button>
            <button type="button" className="secondary" onClick={onClose} disabled={busy}>Cancel</button>
          </div>
        </form>
      </div>
    </div>
  );
}

function timeAgo(iso) {
  if (!iso) return '';
  const ms = Date.now() - new Date(iso).getTime();
  if (ms < 60_000) return 'just now';
  if (ms < 3_600_000) return `${Math.floor(ms / 60_000)}m ago`;
  if (ms < 86_400_000) return `${Math.floor(ms / 3_600_000)}h ago`;
  return `${Math.floor(ms / 86_400_000)}d ago`;
}

function DashboardWidgetTeamNotes({ ctx }) {
  const { session, teamNotes, refreshTeamNotes } = ctx;
  const [composing, setComposing] = useState(false);
  const [showAll, setShowAll] = useState(false);
  const userId = session.user.id;
  // Show the most recent notes regardless of read state or authorship. Unread
  // ones get the accent border; read ones dim. Notes you sent are tagged
  // "you" so it's clear they're yours and don't need a Got-it button.
  const allNotes = teamNotes || [];
  const recent = showAll ? allNotes : allNotes.slice(0, 4);
  const unreadCount = allNotes.filter((n) => !n.is_read && n.author_user_id !== userId).length;

  async function markRead(id) {
    try {
      await apiRequest(`/api/team-messages/${id}/read`, {
        method: 'POST', slug: session.slug, token: session.token,
      });
      refreshTeamNotes && refreshTeamNotes();
    } catch (e) { /* swallow */ }
  }

  async function deleteNote(id) {
    if (!confirm('Delete this team note? Anyone who hasn\'t opened it will lose it.')) return;
    try {
      await apiRequest(`/api/team-messages/${id}`, {
        method: 'DELETE', slug: session.slug, token: session.token,
      });
      refreshTeamNotes && refreshTeamNotes();
    } catch (e) { /* swallow */ }
  }

  const isAdmin = session.user.role === 'admin';

  return (
    <>
      <div className="team-notes-head">
        <div className="section-heading" style={{ margin: 0 }}>
          Team notes {unreadCount > 0 && <span className="team-notes-count">{unreadCount}</span>}
        </div>
        <button type="button" className="secondary team-notes-compose" onClick={() => setComposing(true)}>
          + Send a note
        </button>
      </div>
      {recent.length === 0 ? (
        <div className="list-empty" style={{ marginBottom: 20 }}>
          No team notes yet. Send the first one — your teammates will see it here and get an email.
        </div>
      ) : (
        <>
          <div className="team-notes-list">
            {recent.map((n) => {
              const isMine = n.author_user_id === userId;
              const isUnread = !n.is_read && !isMine;
              return (
                <div
                  key={n.id}
                  className={`team-note-card${isUnread ? '' : ' read'}${isMine ? ' mine' : ''}`}
                >
                  {n.subject && <div className="team-note-subject">{n.subject}</div>}
                  <div className="team-note-body">{n.body}</div>
                  <div className="team-note-foot">
                    <span>
                      {isMine ? 'You' : (n.author_name || n.author_email)}
                      {' · '}{timeAgo(n.created_at)}
                    </span>
                    <span style={{ display: 'inline-flex', gap: 12, alignItems: 'center' }}>
                      {isUnread && (
                        <button type="button" className="link-button" onClick={() => markRead(n.id)}>Got it</button>
                      )}
                      {(isMine || isAdmin) && (
                        <button
                          type="button"
                          className="link-button"
                          onClick={() => deleteNote(n.id)}
                          style={{ color: 'var(--danger)' }}
                        >Delete</button>
                      )}
                    </span>
                  </div>
                </div>
              );
            })}
          </div>
          {!showAll && allNotes.length > 4 && (
            <div style={{ marginBottom: 20, textAlign: 'center' }}>
              <button type="button" className="link-button" onClick={() => setShowAll(true)}>
                Show {allNotes.length - 4} older
              </button>
            </div>
          )}
        </>
      )}
      <TeamNoteCompose session={session} open={composing} onClose={() => setComposing(false)} onSent={refreshTeamNotes} />
    </>
  );
}

function App() {
  const path = useLocation();
  const [session, setSession] = useState(loadSession);

  // Signed in, there is nothing to sign in to — and from an installed app,
  // nothing to be sold (see the marketing routes below). Both go to the app.
  // This lives in App's own effect, after useLocation's: effects run child
  // before parent, so a redirect fired from a child component on first load
  // dispatched its popstate before the listener above existed, and the page
  // sat blank on a path nothing would ever re-read.
  const standalone = window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
  const isMarketing = path === '/' || path === '/start';
  const redirectToApp = !!session
    && ((isMarketing && standalone) || path === '/signin' || path === '/signup');
  useEffect(() => {
    if (redirectToApp) navigate('/dashboard', { replace: true });
  }, [redirectToApp]);

  const publicMatch = path.match(/^\/i\/([^/]+)/);
  if (publicMatch) return <PublicInvoiceView id={publicMatch[1]} />;
  const referralPageMatch = path.match(/^\/r\/([^/]+)/);
  if (referralPageMatch) return <PublicReferralView token={referralPageMatch[1]} />;
  const quoteMatch = path.match(/^\/q\/([^/]+)/);
  if (quoteMatch) return <PublicQuoteView id={quoteMatch[1]} />;
  const bookMatch = path.match(/^\/book\/([^/]+)/);
  if (bookMatch) return <PublicBookingView slug={bookMatch[1].toLowerCase()} />;
  const profileMatch = path.match(/^\/o\/([^/]+)/);
  if (profileMatch) return <PublicProfileView slug={profileMatch[1].toLowerCase()} />;
  if (path.startsWith('/staff')) return <StaffApp />;
  // /system/* is the URL space used by SystemView's chips and detail pages.
  // If a staff session is active and there's no regular user session, keep
  // those clicks inside StaffApp instead of dumping the user to /signin.
  if (path.startsWith('/system') && !session && loadStaffSession()) return <StaffApp />;
  if (path === '/reset-password') return <ResetPasswordPage />;
  if (path === '/verify-email') return <VerifyEmailPage />;
  if (path === '/terms') return <TermsPage />;
  if (path === '/privacy') return <PrivacyPage />;
  if (path === '/contact') return <ContactPage />;
  if (path === '/demo') return <DemoLauncher onSession={(s) => { saveSession(s); setSession(s); navigate('/dashboard'); }} />;

  // Hosted per-tenant landing page at bare /<slug>. Checked before the app
  // shell so anyone can view it — including a logged-in owner previewing.
  // App views (from APP_ROUTES) and public pages are reserved, so they
  // always take precedence over a same-named tenant slug.
  const RESERVED_TOP = new Set([
    ...Object.keys(APP_ROUTES).map((p) => p.slice(1)),
    'i', 'q', 'book', 'o', 'staff', 'system', 'signin', 'signup', 'start',
    'reset-password', 'verify-email', 'terms', 'privacy', 'contact', 'demo',
    'onboarding',
    'learn', 'barbers', 'blog', 'compare', 'templates', 'guides',
    'lawncare', 'lawn-care', 'use-cases', 'usecases',
    'cleaners', 'cleaning', 'detailers', 'detailing', 'handyman', 'pool-service',
  ]);
  const landingMatch = path.match(/^\/([a-z0-9-]{3,32})$/);
  if (landingMatch && !RESERVED_TOP.has(landingMatch[1].toLowerCase())) {
    return <PublicLandingView slug={landingMatch[1].toLowerCase()} />;
  }

  function handleLogout() { clearSession(); setSession(null); navigate('/'); }
  function handleSessionUpdate(next) { saveSession(next); setSession(next); }
  function handleAuthSuccess(next) { saveSession(next); setSession(next); navigate('/dashboard'); }

  // The marketing pages and the app are separate places. `/` used to be both
  // — the sales page signed out, the dashboard signed in — so the page that
  // sells the product vanished for anyone who had bought it, including its
  // owner trying to look at it. Now `/` and `/start` are the marketing pages
  // for everyone, and the app lives at its own URLs.
  //
  // One exception: an installed app. Its manifest pointed at `/` when it was
  // installed, and iOS keeps the manifest it installed with — so a signed-in
  // launch from the home screen still arrives here, and belongs in the app.
  if (isMarketing && !(session && standalone)) {
    return path === '/start'
      ? <SalesLandingPage signedIn={!!session} />
      : <LandingPage signedIn={!!session} />;
  }

  if (session) {
    // The effect at the top is already sending this to /dashboard.
    if (redirectToApp) return null;
    return <AppShell session={session} onLogout={handleLogout} onSessionUpdate={handleSessionUpdate} />;
  }

  // Signed out: the sign-in screen, at its own URLs and at any app URL — a
  // bookmarked /invoices used to fall through to the sales page.
  return <AuthShell onSession={handleAuthSuccess} />;
}


ReactDOM.createRoot(document.getElementById('root')).render(
  <>
    <App />
    <VersionCheck />
  </>
);
</script>
</body>
</html>
