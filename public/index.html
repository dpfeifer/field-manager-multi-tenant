      </div>

      <div className="form-card" style={{ marginTop: 12, padding: 16, background: 'var(--row-hover)' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, color: 'var(--text-muted)' }}>
          <span>Subtotal</span><span>{formatPrice(preview.subtotal)}</span>
        </div>
        {preview.discount > 0 && (
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, color: 'var(--text-muted)' }}>
            <span>Discount</span><span>−{formatPrice(preview.discount)}</span>
          </div>
        )}
        {preview.tax > 0 && (
          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 13, color: 'var(--text-muted)' }}>
            <span>Tax ({preview.taxRate}%)</span><span>{formatPrice(preview.tax)}</span>
          </div>
        )}
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 15, fontWeight: 600, marginTop: 8, paddingTop: 8, borderTop: '1px solid var(--border)' }}>
          <span>Total</span><span>{formatPrice(preview.total)}</span>
        </div>
      </div>

      <div className="form-actions">
        <button type="submit" className="primary" disabled={busy}>
          {busy ? 'Saving...' : (initial ? 'Save changes' : 'Create invoice')}
        </button>
        <button type="button" className="secondary" onClick={onCancel} disabled={busy}>Cancel</button>
      </div>
    </form>
  );
}

const STATUS_FILTERS = ['all', 'unpaid', 'draft', 'sent', 'paid', 'late'];
const STATUS_LABELS = { all: 'All', unpaid: 'Unpaid', draft: 'Draft', sent: 'Sent', paid: 'Paid', late: 'Late' };

function InvoicesView({ session }) {
  // Must sit above the early returns below: a hook skipped on some renders
  // changes the hook order and React unmounts the tree.
  const wideToolbar = useMediaQuery('(min-width: 681px)');
  const terms = useTerms();
  const [invoices, setInvoices] = useState([]);
  const [customers, setCustomers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [notice, setNotice] = useState(null);
  const [mode, setMode] = useState('list');
  const [editing, setEditing] = useState(null);
  const [busy, setBusy] = useState(false);
  const [copiedId, setCopiedId] = useState(null);
  const [search, setSearch] = useState('');
  const [sort, setSort] = useState('newest');
  const [statusFilter, setStatusFilter] = useState('unpaid');

  function exportInvoices() {
    const headers = ['invoice_number', 'customer', 'date', 'status', 'sent_date', 'paid_date', 'subtotal', 'discount', 'tax', 'total', 'description'];
    const rows = invoices.map((inv) => {
      const m = invoiceMath(inv);
      return [
        inv.invoice_number,
        customerDisplayName({
          first_name: inv.customer_first_name,
          last_name: inv.customer_last_name,
          business_name: inv.customer_business_name,
        }),
        inv.date, inv.status,
        inv.sent_date ? inv.sent_date.split('T')[0] : '',
        inv.paid_date ? inv.paid_date.split('T')[0] : '',
        m.subtotal.toFixed(2), m.discount.toFixed(2), m.tax.toFixed(2), m.total.toFixed(2),
        inv.description,
      ];
    });
    downloadCSV(`invoices-${formatYMD(new Date())}.csv`, headers, rows);
  }

  // Prepaid credit available for an invoice's customer (from the customers
  // list, which carries credit_balance).
  function creditFor(customerId) {
    const c = customers.find((x) => x.id === customerId);
    return c ? Math.max(0, parseFloat(c.credit_balance) || 0) : 0;
  }

  async function applyCredit(inv) {
    const most = Math.min(creditFor(inv.customer_id), invoiceMath(inv).balanceDue);
    if (most <= 0) return;
    if (!confirm(`Apply ${formatPrice(most)} of credit to invoice #${inv.invoice_number}?`)) return;
    setBusy(true); setError(null); setNotice(null);
    try {
      await apiRequest(`/api/invoices/${inv.id}/apply-credit`, {
        method: 'POST', slug: session.slug, token: session.token, body: {},
      });
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  async function copyPublicLink(invoiceId) {
    const url = `${window.location.origin}/i/${invoiceId}`;
    try {
      await navigator.clipboard.writeText(url);
      setCopiedId(invoiceId);
      setTimeout(() => setCopiedId((curr) => (curr === invoiceId ? null : curr)), 2000);
    } catch {
      window.prompt('Copy this link:', url);
    }
  }

  const canMutate = ['admin', 'lead'].includes(session.user.role);

  const refresh = useCallback(async () => {
    setLoading(true); setError(null);
    try {
      const [invData, custData] = await Promise.all([
        apiRequest('/api/invoices', { slug: session.slug, token: session.token }),
        apiRequest('/api/customers', { slug: session.slug, token: session.token }),
      ]);
      setInvoices(invData);
      setCustomers(custData);
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  }, [session.slug, session.token]);

  useEffect(() => { refresh(); }, [refresh]);

  // Honor ?open=<invoiceId> — used by the customer-detail "Edit" action to
  // jump straight into editing a specific invoice.
  useEffect(() => {
    if (invoices.length === 0) return;
    const params = new URLSearchParams(window.location.search);
    const openId = params.get('open');
    if (!openId) return;
    const target = invoices.find((inv) => inv.id === openId);
    if (!target) return;
    setEditing(target);
    setMode('edit');
    const url = new URL(window.location.href);
    url.searchParams.delete('open');
    window.history.replaceState({}, '', url.pathname + (url.search ? url.search : '') + url.hash);
  }, [invoices]);

  async function createInvoice(values) {
    setBusy(true); setError(null);
    try {
      await apiRequest('/api/invoices', {
        method: 'POST', slug: session.slug, token: session.token, body: values,
      });
      setMode('list');
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  async function updateInvoice(values) {
    setBusy(true); setError(null);
    try {
      await apiRequest(`/api/invoices/${editing.id}`, {
        method: 'PUT', slug: session.slug, token: session.token, body: values,
      });
      setEditing(null); setMode('list');
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  async function deleteInvoice(id) {
    const inv = invoices.find((x) => x.id === id);
    const applied = inv ? Math.max(0, parseFloat(inv.credit_applied) || 0) : 0;
    const extra = applied > 0
      ? `\n\n${formatPrice(applied)} of applied credit will be returned to the ${terms.customerLower}'s balance.`
      : '';
    if (!confirm(`Delete this invoice?${extra}`)) return;
    setError(null); setNotice(null);
    try {
      const r = await apiRequest(`/api/invoices/${id}`, {
        method: 'DELETE', slug: session.slug, token: session.token,
      });
      await refresh();
      if (r && r.credit_released > 0) {
        setNotice(`Invoice deleted. ${formatPrice(r.credit_released)} of credit returned.`);
      }
    } catch (err) { setError(err.message); }
  }

  async function transition(id, path) {
    setError(null); setNotice(null);
    try {
      const r = await apiRequest(`/api/invoices/${id}/${path}`, {
        method: 'POST', slug: session.slug, token: session.token,
      });
      await refresh();
      if (r && r.credit_released > 0) {
        setNotice(`${formatPrice(r.credit_released)} of credit returned to the ${terms.customerLower}'s balance.`);
      }
    } catch (err) { setError(err.message); }
  }

  async function emailInvoice(inv) {
    if (!confirm(`Email invoice #${inv.invoice_number} to ${inv.customer_email || 'the customer'}?`)) return;
    setError(null);
    try {
      await apiRequest(`/api/invoices/${inv.id}/send-email`, {
        method: 'POST', slug: session.slug, token: session.token,
      });
      await refresh();
      alert('Invoice emailed.');
    } catch (err) { setError(err.message); }
  }

  if (mode === 'create') {
    return (
      <div>
        <BackLink onClick={() => { setError(null); setMode('list'); }}>All invoices</BackLink>
        <div className="page-header"><h2>New invoice</h2></div>
        {error && <div className="error">{error}</div>}
        {customers.length === 0 ? (
          <div className="form-card">
            <p style={{ margin: 0, color: 'var(--text-muted)' }}>You need a customer first. Add one in the Customers tab.</p>
          </div>
        ) : (
          <div className="form-card">
            <InvoiceForm customers={customers} onSubmit={createInvoice} onCancel={() => { setError(null); setMode('list'); }} busy={busy} />
          </div>
        )}
      </div>
    );
  }

  if (mode === 'edit' && editing) {
    return (
      <div>
        <BackLink onClick={() => { setError(null); setEditing(null); setMode('list'); }}>All invoices</BackLink>
        <div className="page-header"><h2>Edit invoice #{editing.invoice_number}</h2></div>
        {error && <div className="error">{error}</div>}
        <div className="form-card">
          <InvoiceForm
            initial={editing}
            customers={customers}
            onSubmit={updateInvoice}
            onCancel={() => { setError(null); setEditing(null); setMode('list'); }}
            busy={busy}
          />
        </div>
      </div>
    );
  }

  function matchesStatus(inv) {
    if (statusFilter === 'all') return true;
    if (statusFilter === 'late') return isInvoiceLate(inv);
    if (statusFilter === 'unpaid') return inv.status === 'draft' || inv.status === 'sent';
    return inv.status === statusFilter;
  }

  const filteredInvoices = invoices.filter((inv) => matchesStatus(inv) && searchMatches(
    search,
    String(inv.invoice_number),
    inv.description,
    inv.customer_first_name, inv.customer_last_name, inv.customer_business_name
  ));
  const invSortKey = sort === 'number' ? 'invoice_number'
    : sort === 'total' ? (inv) => lineItemsTotal(inv.line_items)
    : sort === 'status' ? 'status'
    : 'created_at';
  const sortedInvoices = sortBy(filteredInvoices, invSortKey, sort === 'oldest' ? 'asc' : sort === 'status' ? 'asc' : 'desc');

  const statusCount = (f) => invoices.filter((inv) => {
    if (f === 'all') return true;
    if (f === 'late') return isInvoiceLate(inv);
    if (f === 'unpaid') return inv.status === 'draft' || inv.status === 'sent';
    return inv.status === f;
  }).length;

  // What is still owed across every unpaid invoice — the number you actually
  // open this screen to find out, so the toolbar says it rather than making
  // you add up a column.
  function openInvoice(inv) {
    if (canMutate) { setEditing(inv); setMode('edit'); }
    else navigate(`/i/${inv.id}?from=app`);
  }

  const outstandingTotal = invoices
    .filter((inv) => inv.status !== 'paid')
    .reduce((sum, inv) => sum + invoiceMath(inv).balanceDue, 0);

  return (
    <div>
      {/* Title, counts, search, filter and sort on one line. These used to be
          three stacked bands above every list, which is most of what made the
          screen feel crowded before a single invoice appeared. */}
      <div className="toolbar">
        <span className="tb-title">
          <h2>Invoices</h2>
          <span className="tb-count">
            {invoices.length} total{outstandingTotal > 0 && <> &middot; <b>{formatPrice(outstandingTotal)}</b> outstanding</>}
          </span>
        </span>
        <span className="tb-gap"></span>
        <input
          type="search"
          className="tb-search"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder={`Search invoice #, ${terms.customerLower}...`}
        />
        {/* One control at every width — it scrolls sideways on a phone rather
            than collapsing into a select, so the counts stay on screen. */}
        <div className="tb-row">
        <div className="segmented" role="group" aria-label="Filter invoices">
          {STATUS_FILTERS.map((f) => (
            <button
              key={f}
              type="button"
              className={statusFilter === f ? 'on' : ''}
              aria-pressed={statusFilter === f}
              onClick={() => setStatusFilter(f)}
            >{STATUS_LABELS[f]} <span className="n">{statusCount(f)}</span></button>
          ))}
        </div>
        </div>
        {wideToolbar && (
          <select value={sort} onChange={(e) => setSort(e.target.value)} aria-label="Sort invoices">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="number">Invoice # (high)</option>
            <option value="total">Total (high)</option>
            <option value="status">Status</option>
          </select>
        )}
        <span className="tb-actions">
          {canMutate && (
            <button className="primary" onClick={() => { setError(null); setMode('create'); }}>
              +<span className="btn-label"> New invoice</span>
            </button>
          )}
          <RowMenu
            label="More invoice actions"
            items={[
              { label: 'Export all as CSV', onClick: exportInvoices },
              ...(wideToolbar ? [] : sortMenuItems(sort, setSort, [
                { value: 'newest', label: 'Newest' },
                { value: 'oldest', label: 'Oldest' },
                { value: 'number', label: 'Invoice # (high)' },
                { value: 'total', label: 'Total (high)' },
                { value: 'status', label: 'Status' },
              ])),
            ]}
          />
        </span>
      </div>
      {error && <div className="error">{error}</div>}
      {notice && (
        <div className="error" style={{ background: '#e8f1ec', color: '#1f6f4a' }}>
          {notice}
          <button className="link-button" style={{ marginLeft: 10 }} onClick={() => setNotice(null)}>Dismiss</button>
        </div>
      )}
      <div className="dtable">
        {!loading && sortedInvoices.length > 0 && (
          <div className="dtable-row dtable-head inv-row" aria-hidden="true">
            <span>Invoice</span><span>{terms.customer}</span><span>Date</span>
            <span>Status</span><span style={{ textAlign: 'right' }}>Amount</span><span></span>
          </div>
        )}
        {loading ? (
          <div className="list-empty">Loading...</div>
        ) : sortedInvoices.length === 0 ? (
          invoices.length === 0 ? (
            <EmptyState
              icon="invoices"
              title="Draft your first invoice"
              body={canMutate
                ? `Bill a ${terms.customerLower} for completed work. Add line items, optional tax + discount, and share a public link your ${terms.customerLower} can pay from any device.`
                : `No invoices yet.`
              }
              action={canMutate && (
                <button className="primary" onClick={() => { setError(null); setMode('create'); }}>+ New invoice</button>
              )}
            />
          ) : (
            <div className="list-empty">No invoices match these filters.</div>
          )
        ) : (
          sortedInvoices.map((inv) => {
            const math = invoiceMath(inv);
            const late = isInvoiceLate(inv);
            const days = late ? daysOutstanding(inv) : 0;
            const who = customerDisplayName({
              first_name: inv.customer_first_name,
              last_name: inv.customer_last_name,
              business_name: inv.customer_business_name,
            });
            // At most one action stays on the row — whichever is the likely
            // next step for this status. Everything else is in the menu, so a
            // list of money is not also a wall of buttons.
            const inline = !canMutate ? null
              : inv.status === 'draft' ? { label: 'Mark sent', run: () => transition(inv.id, 'send') }
              : inv.status === 'sent' ? { label: 'Mark paid', run: () => transition(inv.id, 'mark-paid') }
              : null;
            return (
              <div
                key={inv.id}
                className="dtable-row inv-row is-clickable"
                role="button"
                tabIndex={0}
                onClick={() => openInvoice(inv)}
                onKeyDown={(e) => {
                  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openInvoice(inv); }
                }}
              >
                <span className="c-num">#{inv.invoice_number}</span>
                <div className="c-main">
                  <div className="t">{who}</div>
                  {inv.description && <div className="s">{inv.description}</div>}
                </div>
                <span className="c-when">{formatDateString(inv.date)}</span>
                <span>
                  <span className={`badge ${inv.status}`}>{inv.status}</span>
                  {late && (
                    <span className="badge" style={{ marginLeft: 6, background: 'var(--danger-bg)', color: 'var(--danger)' }}>
                      {days}d
                    </span>
                  )}
                </span>
                <span className="c-amt">
                  {formatPrice(math.total)}
                  {math.creditApplied > 0 && (
                    <span className="due">{formatPrice(math.creditApplied)} credit &middot; {formatPrice(math.balanceDue)} due</span>
                  )}
                </span>
                <span className="c-act" onClick={(e) => e.stopPropagation()}>
                  {inline && (
                    <button className="secondary" onClick={inline.run}>{inline.label}</button>
                  )}
                  <RowMenu
                    label={`Actions for invoice #${inv.invoice_number}`}
                    items={[
                      (inv.status === 'sent' || inv.status === 'paid')
                        && { label: 'View public page', onClick: () => navigate(`/i/${inv.id}?from=app`) },
                      (inv.status === 'sent' || inv.status === 'paid')
                        && { label: copiedId === inv.id ? 'Copied!' : 'Copy public link', onClick: () => copyPublicLink(inv.id) },
                      canMutate && (inv.status === 'draft' || inv.status === 'sent')
                        && { label: `Email to ${terms.customerLower}`, onClick: () => emailInvoice(inv) },
                      canMutate && inv.status !== 'paid' && math.balanceDue > 0 && creditFor(inv.customer_id) > 0
                        && { label: 'Apply credit', onClick: () => applyCredit(inv) },
                      canMutate && inv.status === 'sent'
                        && { label: 'Unsend', onClick: () => transition(inv.id, 'mark-draft') },
                      canMutate && inv.status === 'paid'
                        && { label: 'Mark unpaid', onClick: () => transition(inv.id, 'mark-unpaid') },
                      canMutate && { label: 'Edit', onClick: () => { setEditing(inv); setMode('edit'); } },
                      canMutate && { label: 'Delete', danger: true, onClick: () => deleteInvoice(inv.id) },
                    ]}
                  />
                </span>
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}

function QuoteForm({ initial, customers, onSubmit, onCancel, busy }) {
  const terms = useTerms();
  const initialIsProspect = initial ? !initial.customer_id : false;
  const [isProspect, setIsProspect] = useState(initialIsProspect);
  const [customer_id, setCustomerId] = useState(initial?.customer_id || (customers[0]?.id || ''));
  const [prospect_name, setProspectName] = useState(initial?.prospect_name || '');
  const [prospect_email, setProspectEmail] = useState(initial?.prospect_email || '');
  const [prospect_phone, setProspectPhone] = useState(initial?.prospect_phone || '');
  const [prospect_address, setProspectAddress] = useState(initial?.prospect_address || '');
  const [description, setDescription] = useState(initial?.description || '');
  const [notes, setNotes] = useState(initial?.notes || '');
  const [line_items, setLineItems] = useState(initial?.line_items || []);
  const [status, setStatus] = useState(initial?.status || 'draft');

  function submit(e) {
    e.preventDefault();
    const payload = {
      description: description || null,
      notes: notes || null,
      line_items, status,
    };
    if (isProspect) {
      payload.customer_id = null;
      payload.prospect_name = prospect_name;
      payload.prospect_email = prospect_email || null;
      payload.prospect_phone = prospect_phone || null;
      payload.prospect_address = prospect_address || null;
    } else {
      payload.customer_id = customer_id;
    }
    onSubmit(payload);
  }

  return (
    <form onSubmit={submit}>
      <div className="form-grid">
        <div className="full">
          <label>Recipient</label>
          <div className="toggle-group">
            <button type="button" className={!isProspect ? 'active' : ''} onClick={() => setIsProspect(false)}>Existing {terms.customerLower}</button>
            <button type="button" className={isProspect ? 'active' : ''} onClick={() => setIsProspect(true)}>Prospect</button>
          </div>
        </div>
        {!isProspect ? (
          <div className="full">
            <label>{terms.customer}</label>
            <select value={customer_id} onChange={(e) => setCustomerId(e.target.value)} required>
              {customers.length === 0 && <option value="">No {terms.customersLower} — add one first</option>}
              {customers.map((c) => <option key={c.id} value={c.id}>{customerDisplayName(c)}</option>)}
            </select>
          </div>
        ) : (
          <>
            <div className="full">
              <label>Prospect name</label>
              <input value={prospect_name} onChange={(e) => setProspectName(e.target.value)} required />
            </div>
            <div>
              <label>Email <span className="hint">(optional)</span></label>
              <input type="email" value={prospect_email} onChange={(e) => setProspectEmail(e.target.value)} />
            </div>
            <div>
              <label>Phone <span className="hint">(optional)</span></label>
              <input value={prospect_phone} onChange={(e) => setProspectPhone(e.target.value)} />
            </div>
            <div className="full">
              <label>Address <span className="hint">(optional)</span></label>
              <textarea value={prospect_address} onChange={(e) => setProspectAddress(e.target.value)} />
            </div>
          </>
        )}
        <div className="full">
          <label>Description <span className="hint">(shown on the quote)</span></label>
          <input value={description} onChange={(e) => setDescription(e.target.value)} />
        </div>
        <div className="full">
          <label>Notes <span className="hint">(internal)</span></label>
          <textarea value={notes} onChange={(e) => setNotes(e.target.value)} />
        </div>
        <div className="full">
          <label>Line items</label>
          <LineItemsEditor items={line_items} onChange={setLineItems} />
        </div>
        <div>
          <label>Status</label>
          <select value={status} onChange={(e) => setStatus(e.target.value)}>
            <option value="draft">Draft</option>
            <option value="sent">Sent</option>
            <option value="accepted">Accepted</option>
            <option value="declined">Declined</option>
          </select>
        </div>
      </div>
      <div className="form-actions">
        <button type="submit" className="primary" disabled={busy}>
          {busy ? 'Saving...' : (initial ? 'Save changes' : 'Create quote')}
        </button>
        <button type="button" className="secondary" onClick={onCancel} disabled={busy}>Cancel</button>
      </div>
    </form>
  );
}

function splitProspectName(name) {
  if (!name) return { first: '', last: '', business: '' };
  const parts = name.trim().split(/\s+/);
  if (parts.length === 1) return { first: parts[0], last: '', business: '' };
  return { first: parts[0], last: parts.slice(1).join(' '), business: '' };
}

function PromoteForm({ quote, onSubmit, onCancel, busy, customers = [] }) {
  const terms = useTerms();
  const split = splitProspectName(quote.prospect_name);
  const [first_name, setFirst] = useState(split.first);
  const [last_name, setLast] = useState(split.last);
  const [business_name, setBusiness] = useState(split.business);
  const [phone, setPhone] = useState(quote.prospect_phone || '');
  const [email, setEmail] = useState(quote.prospect_email || '');
  const [address, setAddress] = useState(quote.prospect_address || '');
  const [notes, setNotes] = useState('');
  // Already filled in when the request came through a referral link, or named
  // a customer exactly.
  const [referredBy, setReferredBy] = useState(quote.referred_by_customer_id || '');
  const referrers = useMemo(() => customers
    .map((c) => ({ id: c.id, name: customerDisplayName(c) }))
    .sort((a, b) => a.name.localeCompare(b.name)), [customers]);

  function submit(e) {
    e.preventDefault();
    const values = { first_name, last_name, business_name, phone, email, address, notes };
    if (referrers.length > 0) values.referred_by_customer_id = referredBy || null;
    onSubmit(values);
  }

  return (
    <form onSubmit={submit}>
      <p className="subtitle" style={{ marginBottom: 20 }}>
        Creating a {terms.customerLower} from prospect <strong style={{ color: 'var(--text)' }}>{quote.prospect_name}</strong>.
        The quote will be re-linked to the new {terms.customerLower} and the prospect fields will be cleared.
      </p>
      <div className="form-grid">
        <div>
          <label>First name</label>
          <input value={first_name} onChange={(e) => setFirst(e.target.value)} />
        </div>
        <div>
          <label>Last name</label>
          <input value={last_name} onChange={(e) => setLast(e.target.value)} />
        </div>
        <div className="full">
          <label>Business name <span className="hint">(optional)</span></label>
          <input value={business_name} onChange={(e) => setBusiness(e.target.value)} />
        </div>
        <div>
          <label>Phone</label>
          <input value={phone} onChange={(e) => setPhone(e.target.value)} />
        </div>
        <div>
          <label>Email</label>
          <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} />
        </div>
        <div className="full">
          <label>Address</label>
          <textarea value={address} onChange={(e) => setAddress(e.target.value)} />
        </div>
        <div className="full">
          <label>Notes <span className="hint">(optional)</span></label>
          <textarea value={notes} onChange={(e) => setNotes(e.target.value)} />
        </div>
        {referrers.length > 0 && (
          <div className="full">
            <label>Referred by <span className="hint">(optional)</span></label>
            <select value={referredBy} onChange={(e) => setReferredBy(e.target.value)}>
              <option value="">Nobody</option>
              {referrers.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
        )}
      </div>
      <div className="form-actions">
        <button type="submit" className="primary" disabled={busy}>
          {busy ? 'Creating...' : `Create ${terms.customerLower}`}
        </button>
        <button type="button" className="secondary" onClick={onCancel} disabled={busy}>Cancel</button>
      </div>
    </form>
  );
}

function quoteRecipientName(q) {
  if (q.customer_id) {
    return customerDisplayName({
      first_name: q.customer_first_name,
      last_name: q.customer_last_name,
      business_name: q.customer_business_name,
    });
  }
  return q.prospect_name || '(unnamed prospect)';
}

function QuotesView({ session, features = { invoices: true } }) {
  const terms = useTerms();
  const wideToolbar = useMediaQuery('(min-width: 681px)');
  const [quotes, setQuotes] = useState([]);
  const [customers, setCustomers] = useState([]);
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [mode, setMode] = useState('list');
  const [editing, setEditing] = useState(null);
  const [busy, setBusy] = useState(false);
  const [search, setSearch] = useState('');
  const [sort, setSort] = useState('newest');

  const canMutate = ['admin', 'lead'].includes(session.user.role);
  const [copiedQuoteId, setCopiedQuoteId] = useState(null);

  async function ensureSent(q) {
    if (q.status !== 'draft') return;
    await apiRequest(`/api/quotes/${q.id}/mark-sent`, {
      method: 'POST', slug: session.slug, token: session.token,
    });
    await refresh();
  }

  async function copyQuoteLink(q) {
    const url = `${window.location.origin}/q/${q.id}`;
    try {
      await ensureSent(q);
      await navigator.clipboard.writeText(url);
      setCopiedQuoteId(q.id);
      setTimeout(() => setCopiedQuoteId((curr) => (curr === q.id ? null : curr)), 2000);
    } catch (err) {
      if (err && err.message) { setError(err.message); return; }
      window.prompt('Copy this link:', url);
    }
  }

  async function viewQuoteLink(q) {
    try {
      await ensureSent(q);
      navigate(`/q/${q.id}?from=app`);
    } catch (err) { setError(err.message); }
  }

  function exportQuotes() {
    const headers = ['recipient', 'is_prospect', 'description', 'status', 'total', 'created_at'];
    const rows = quotes.map((q) => [
      quoteRecipientName(q),
      q.customer_id ? 'no' : 'yes',
      q.description, q.status,
      lineItemsTotal(q.line_items).toFixed(2),
      q.created_at ? q.created_at.split('T')[0] : '',
    ]);
    downloadCSV(`quotes-${formatYMD(new Date())}.csv`, headers, rows);
  }

  const refresh = useCallback(async () => {
    setLoading(true); setError(null);
    try {
      const [quoteData, custData, usersData] = await Promise.all([
        apiRequest('/api/quotes', { slug: session.slug, token: session.token }),
        apiRequest('/api/customers', { slug: session.slug, token: session.token }),
        apiRequest('/api/auth/users', { slug: session.slug, token: session.token }),
      ]);
      setQuotes(quoteData);
      setCustomers(custData);
      setUsers(usersData);
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  }, [session.slug, session.token]);

  useEffect(() => { refresh(); }, [refresh]);

  // Honor ?open=<quoteId> — used by the customer-detail quote rows to open
  // a specific quote for editing.
  useEffect(() => {
    if (quotes.length === 0) return;
    const params = new URLSearchParams(window.location.search);
    const openId = params.get('open');
    if (!openId) return;
    const target = quotes.find((q) => q.id === openId);
    if (!target) return;
    setEditing(target);
    setMode('edit');
    const url = new URL(window.location.href);
    url.searchParams.delete('open');
    window.history.replaceState({}, '', url.pathname + (url.search ? url.search : '') + url.hash);
  }, [quotes]);

  async function createQuote(values) {
    setBusy(true); setError(null);
    try {
      await apiRequest('/api/quotes', { method: 'POST', slug: session.slug, token: session.token, body: values });
      setMode('list');
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  async function updateQuote(values) {
    setBusy(true); setError(null);
    try {
      await apiRequest(`/api/quotes/${editing.id}`, { method: 'PUT', slug: session.slug, token: session.token, body: values });
      setEditing(null); setMode('list');
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  async function deleteQuote(id) {
    if (!confirm('Delete this quote?')) return;
    setError(null);
    try {
      await apiRequest(`/api/quotes/${id}`, { method: 'DELETE', slug: session.slug, token: session.token });
      await refresh();
    } catch (err) { setError(err.message); }
  }

  async function emailQuote(q) {
    const email = q.customer_email || q.prospect_email;
    if (!email) {
      alert('This recipient has no email on file.');
      return;
    }
    if (!confirm(`Email this quote to ${email}?`)) return;
    setError(null);
    try {
      await apiRequest(`/api/quotes/${q.id}/send-email`, {
        method: 'POST', slug: session.slug, token: session.token,
      });
      await refresh();
      alert('Quote emailed.');
    } catch (err) { setError(err.message); }
  }

  async function promoteToCustomer(values) {
    setBusy(true); setError(null);
    try {
      await apiRequest(`/api/quotes/${editing.id}/promote-to-customer`, {
        method: 'POST', slug: session.slug, token: session.token, body: values,
      });
      setEditing(null); setMode('list');
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  async function createInvoiceFromQuote(quoteId) {
    if (!confirm('Create a draft invoice from this quote? The line items will be copied and the quote will be marked accepted.')) return;
    setError(null);
    try {
      await apiRequest(`/api/quotes/${quoteId}/create-invoice`, {
        method: 'POST', slug: session.slug, token: session.token,
      });
      await refresh();
      alert('Draft invoice created. Switch to the Invoices tab to review and send.');
    } catch (err) { setError(err.message); }
  }

  async function createJobFromQuote(values) {
    setBusy(true); setError(null);
    try {
      await apiRequest('/api/jobs', {
        method: 'POST', slug: session.slug, token: session.token, body: values,
      });
      if (['draft', 'sent'].includes(editing.status)) {
        await apiRequest(`/api/quotes/${editing.id}`, {
          method: 'PUT', slug: session.slug, token: session.token, body: { status: 'accepted' },
        });
      }
      setEditing(null); setMode('list');
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  if (mode === 'create') {
    return (
      <div>
        <BackLink onClick={() => { setError(null); setMode('list'); }}>All quotes</BackLink>
        <div className="page-header"><h2>New quote</h2></div>
        {error && <div className="error">{error}</div>}
        <div className="form-card">
          <QuoteForm customers={customers} onSubmit={createQuote} onCancel={() => { setError(null); setMode('list'); }} busy={busy} />
        </div>
      </div>
    );
  }

  if (mode === 'edit' && editing) {
    return (
      <div>
        <BackLink onClick={() => { setError(null); setEditing(null); setMode('list'); }}>All quotes</BackLink>
        <div className="page-header"><h2>Edit quote</h2></div>
        {error && <div className="error">{error}</div>}
        <div className="form-card">
          <QuoteForm
            initial={editing}
            customers={customers}
            onSubmit={updateQuote}
            onCancel={() => { setError(null); setEditing(null); setMode('list'); }}
            busy={busy}
          />
        </div>
      </div>
    );
  }

  if (mode === 'promote' && editing) {
    return (
      <div>
        <div className="page-header"><h2>Promote prospect to {terms.customerLower}</h2></div>
        {error && <div className="error">{error}</div>}
        <div className="form-card">
          <PromoteForm
            quote={editing}
            customers={features.referrals ? customers : []}
            onSubmit={promoteToCustomer}
            onCancel={() => { setError(null); setEditing(null); setMode('list'); }}
            busy={busy}
          />
        </div>
      </div>
    );
  }

  if (mode === 'createJob' && editing) {
    const total = lineItemsTotal(editing.line_items);
    const initial = {
      customer_id: editing.customer_id,
      title: editing.description || 'Job from quote',
      description: null,
      type: 'single',
      date: formatYMD(new Date()),
      default_price: total > 0 ? total : null,
      assigned_to: [],
    };
    return (
      <div>
        <div className="page-header"><h2>Create {terms.jobLower} from quote</h2></div>
        {error && <div className="error">{error}</div>}
        <div className="form-card">
          <JobForm
            initial={initial}
            customers={customers}
            users={users}
            onSubmit={createJobFromQuote}
            onCancel={() => { setError(null); setEditing(null); setMode('list'); }}
            busy={busy}
          />
        </div>
      </div>
    );
  }

  const filteredQuotes = quotes.filter((q) => searchMatches(
    search,
    q.description,
    quoteRecipientName(q),
    q.prospect_email,
    q.prospect_phone
  ));
  const qSortKey = sort === 'total' ? (q) => lineItemsTotal(q.line_items)
    : sort === 'status' ? 'status'
    : 'created_at';
  const sortedQuotes = sortBy(filteredQuotes, qSortKey, sort === 'oldest' ? 'asc' : sort === 'status' ? 'asc' : 'desc');
  // Quotes still in play — a declined or accepted one is no longer money on the table.
  const openTotal = quotes
    .filter((q) => q.status === 'draft' || q.status === 'sent')
    .reduce((sum, q) => sum + lineItemsTotal(q.line_items), 0);

  return (
    <div>
      <div className="toolbar">
        <span className="tb-title">
          <h2>Quotes</h2>
          <span className="tb-count">
            {quotes.length} total{openTotal > 0 && <> &middot; <b>{formatPrice(openTotal)}</b> outstanding</>}
          </span>
        </span>
        <span className="tb-gap"></span>
        <input
          type="search"
          className="tb-search"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder="Search customer, prospect, description..."
        />
        {wideToolbar && (
          <select value={sort} onChange={(e) => setSort(e.target.value)} aria-label="Sort quotes">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="total">Total (high)</option>
            <option value="status">Status</option>
          </select>
        )}
        <span className="tb-actions">
          {canMutate && (
            <button className="primary" onClick={() => { setError(null); setMode('create'); }}>
              +<span className="btn-label"> New quote</span>
            </button>
          )}
          <RowMenu
            label="More quote actions"
            items={[
              ...(quotes.length > 0 ? [{ label: 'Export all as CSV', onClick: exportQuotes }] : []),
              ...(wideToolbar ? [] : sortMenuItems(sort, setSort, [
                { value: 'newest', label: 'Newest' },
                { value: 'oldest', label: 'Oldest' },
                { value: 'total', label: 'Total (high)' },
                { value: 'status', label: 'Status' },
              ])),
            ]}
          />
        </span>
      </div>
      {error && <div className="error">{error}</div>}
      <div className="dtable">
        {!loading && sortedQuotes.length > 0 && (
          <div className="dtable-row dtable-head quote-row" aria-hidden="true">
            <span>Quoted to</span><span className="c-when">Date</span>
            <span className="c-status">Status</span>
            <span style={{ textAlign: 'right' }}>Total</span><span></span>
          </div>
        )}
        {loading ? (
          <div className="list-empty">Loading...</div>
        ) : sortedQuotes.length === 0 ? (
          quotes.length === 0 ? (
            <EmptyState
              icon="quotes"
              title="Send your first quote"
              body={canMutate
                ? `Estimate work for an existing ${terms.customerLower} or a brand-new prospect. Accepted quotes convert in one click — to a ${terms.customerLower}, a ${terms.jobLower}, or an invoice.`
                : 'No quotes yet.'
              }
              action={canMutate && (
                <button className="primary" onClick={() => { setError(null); setMode('create'); }}>+ New quote</button>
              )}
            />
          ) : (
            <div className="list-empty">No quotes match this search.</div>
          )
        ) : (
          sortedQuotes.map((q) => {
            const total = lineItemsTotal(q.line_items);
            return (
              <div
                key={q.id}
                className={`dtable-row quote-row${canMutate ? ' is-clickable' : ''}`}
                role={canMutate ? 'button' : undefined}
                tabIndex={canMutate ? 0 : undefined}
                onClick={canMutate ? () => { setEditing(q); setMode('edit'); } : undefined}
                onKeyDown={canMutate ? (e) => {
                  if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    setEditing(q); setMode('edit');
                  }
                } : undefined}
              >
                <span className="c-main">
                  <div className="t">
                    {quoteRecipientName(q)}
                    {!q.customer_id && <span className="hint" style={{ marginLeft: 8 }}>(prospect)</span>}
                  </div>
                  {q.description && <div className="s">{q.description}</div>}
                </span>
                <span className="c-when">{formatDateString(q.created_at.split('T')[0])}</span>
                <span className="c-status"><span className={`badge ${q.status}`}>{q.status}</span></span>
                <span className="c-amt">{formatPrice(total)}</span>
                <span className="c-act" onClick={(e) => e.stopPropagation()}>
                  {canMutate && (
                    <>
                    {/* Sending it is what a quote is for, so that stays on the
                        row. Everything else is a menu item. */}
                    <button className="secondary" onClick={() => emailQuote(q)}>Email</button>
                    <RowMenu
                      label={`Actions for ${quoteRecipientName(q)}`}
                      items={[
                        { label: 'View public page', onClick: () => viewQuoteLink(q) },
                        { label: copiedQuoteId === q.id ? 'Copied!' : 'Copy public link', onClick: () => copyQuoteLink(q) },
                        !q.customer_id
                          && { label: `Promote to ${terms.customerLower}`, onClick: () => { setError(null); setEditing(q); setMode('promote'); } },
                        q.customer_id && features.invoices
                          && { label: 'Create invoice', onClick: () => createInvoiceFromQuote(q.id) },
                        q.customer_id
                          && { label: `Create ${terms.jobLower}`, onClick: () => { setError(null); setEditing(q); setMode('createJob'); } },
                        { label: 'Delete', danger: true, onClick: () => deleteQuote(q.id) },
                      ]}
                    />
                    </>
                  )}
                </span>
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}

// Its own tab rather than a corner of Auto-invoice: it is a thing an owner
// goes looking for by name.
function ReferralPanel({ session, form, setField, isAdmin, busy, saved, error, submit }) {
  const terms = useTerms();
  const [sample, setSample] = useState(null); // null | 'sending' | { ok, text }
  async function sendSample() {
    setSample('sending');
    try {
      const r = await apiRequest('/api/settings/referrals/sample-email', {
        method: 'POST', slug: session.slug, token: session.token,
      });
      setSample({ ok: true, text: `Sent to ${r.to}.` });
    } catch (err) { setSample({ ok: false, text: err.message }); }
  }
  return (
    <>
      {error && <div className="error">{error}</div>}
      {saved && (
        <div className="error" style={{ background: '#e8f1ec', color: '#1f6f4a' }}>Saved.</div>
      )}
      <form onSubmit={submit} className="form-card">
        <div className="section-heading" style={{ marginTop: 0 }}>Referral rewards</div>
        <p className="hint" style={{ marginTop: 0, marginBottom: 14 }}>
          Set who referred a {terms.customerLower} on their record. Each time you complete a {terms.jobLower} for them, the person who sent them earns a share of its price as credit on their own account. Undoing the completion takes it back. To switch referrals off altogether, use Sections.
        </p>
        <div className="form-grid">
          <div>
            <label>Reward <span className="hint">(% of each {terms.jobLower})</span></label>
            <input
              type="number" min="0" max="100" step="0.5"
              value={form.referral_percent ?? ''}
              disabled={!isAdmin}
              onChange={(e) => setField('referral_percent', e.target.value)}
            />
          </div>
          <div>
            <label>Limit <span className="hint">({terms.jobsLower} per referred {terms.customerLower})</span></label>
            <input
              type="number" min="1" step="1"
              value={form.referral_cap_jobs ?? ''}
              placeholder="No limit"
              disabled={!isAdmin}
              onChange={(e) => setField('referral_cap_jobs', e.target.value)}
            />
            <span className="hint" style={{ display: 'block', marginTop: 4 }}>Leave empty to reward every {terms.jobLower}, forever.</span>
          </div>
        </div>
        <label style={{ display: 'flex', alignItems: 'flex-start', gap: 10, marginTop: 16, fontWeight: 'normal' }}>
          <input
            type="checkbox"
            checked={form.referral_email_enabled !== false}
            disabled={!isAdmin}
            onChange={(e) => setField('referral_email_enabled', e.target.checked)}
            style={{ marginTop: 3 }}
          />
          <span>
            Email the referrer when they earn credit.
            <span className="hint" style={{ display: 'block', marginTop: 4 }}>
              A short thank-you from your business with the amount and their new balance. Replies come to your business email. Skipped for anyone without an email on file.
            </span>
          </span>
        </label>
        {isAdmin && (
          <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap', margin: '10px 0 0 28px' }}>
            <button type="button" className="secondary" onClick={sendSample} disabled={sample === 'sending'}>
              {sample === 'sending' ? 'Sending...' : 'Send me a sample'}
            </button>
            {sample && sample !== 'sending' && (
              <span className="hint" role="status" style={{ color: sample.ok ? 'var(--success)' : 'var(--danger)' }}>{sample.text}</span>
            )}
          </div>
        )}
        <label style={{ display: 'flex', alignItems: 'flex-start', gap: 10, marginTop: 20, fontWeight: 'normal' }}>
          <input
            type="checkbox"
            checked={form.referral_invoice_note !== false}
            disabled={!isAdmin}
            onChange={(e) => setField('referral_invoice_note', e.target.checked)}
            style={{ marginTop: 3 }}
          />
          <span>
            Mention referrals on invoices.
            <span className="hint" style={{ display: 'block', marginTop: 4 }}>
              A quiet line at the bottom of the invoice page and the invoice email, with the {terms.customerLower}&apos;s own referral link. Never on the printed or PDF copy.
            </span>
          </span>
        </label>

        {isAdmin && (
          <div className="form-actions">
            <button type="submit" className="primary" disabled={busy}>{busy ? 'Saving...' : 'Save'}</button>
          </div>
        )}
      </form>
    </>
  );
}

function AutoInvoicePanel({ session, form, setField, isAdmin, busy, saved, error, submit }) {
  const terms = useTerms();
  const [running, setRunning] = useState(false);
  const [runResult, setRunResult] = useState(null);
  const [runError, setRunError] = useState(null);

  async function runNow() {
    setRunning(true); setRunError(null); setRunResult(null);
    try {
      const r = await apiRequest('/api/billing/auto-invoice/run', {
        method: 'POST', slug: session.slug, token: session.token,
      });
      setRunResult(r);
    } catch (err) { setRunError(err.message); }
    finally { setRunning(false); }
  }

  const schedule = form.auto_invoice_schedule || 'off';
  const lastRun = form.auto_invoice_last_run_at
    ? new Date(form.auto_invoice_last_run_at).toLocaleString()
    : null;

  return (
    <>
      {error && <div className="error">{error}</div>}
      {saved && (
        <div className="error" style={{ background: '#e8f1ec', color: '#1f6f4a' }}>Saved.</div>
      )}
      <form onSubmit={submit} className="form-card">
        <div className="section-heading" style={{ marginTop: 0 }}>Default for "Add to draft" on completion</div>
        <label style={{ display: 'flex', alignItems: 'flex-start', gap: 10, marginBottom: 8, fontWeight: 'normal' }}>
          <input
            type="checkbox"
            checked={!!form.auto_append_to_draft}
            disabled={!isAdmin}
            onChange={(e) => setField('auto_append_to_draft', e.target.checked)}
            style={{ marginTop: 3 }}
          />
          <span>
            Pre-check the "Add to draft invoice" box on the mark-complete form. Each completion can still be toggled individually.
            <span className="hint" style={{ display: 'block', marginTop: 4 }}>
              When checked at completion time, the visit is appended to the {terms.customerLower}&apos;s open draft (or a new one is started). Un-completing removes the line.
            </span>
          </span>
        </label>

        <div className="section-heading">Scheduled rollup</div>
        <p className="hint" style={{ marginTop: 0, marginBottom: 14 }}>
          Roll up unbilled completions into draft invoices on a schedule. We never auto-send — drafts land in your Invoices tab for review. Per-{terms.customerLower} opt-out lives on the {terms.customerLower} record.
        </p>

        <div className="auto-invoice-options">
          <label className={`auto-invoice-option${schedule === 'off' ? ' active' : ''}`}>
            <input
              type="radio" name="ai-schedule" value="off"
              checked={schedule === 'off'} disabled={!isAdmin}
              onChange={() => setField('auto_invoice_schedule', 'off')}
            />
            <div>
              <div className="auto-invoice-option-name">Off</div>
              <div className="auto-invoice-option-help">Manual invoicing only.</div>
            </div>
          </label>
          <label className={`auto-invoice-option${schedule === 'monthly' ? ' active' : ''}`}>
            <input

              onChange={() => setField('auto_invoice_schedule', 'monthly')}
            />
            <div>
              <div className="auto-invoice-option-name">Monthly</div>
              <div className="auto-invoice-option-help">Bills the previous calendar month on the chosen day.</div>
            </div>
          </label>
          <label className={`auto-invoice-option${schedule === 'weekly' ? ' active' : ''}`}>
            <input
              type="radio" name="ai-schedule" value="weekly"
              checked={schedule === 'weekly'} disabled={!isAdmin}
              onChange={() => setField('auto_invoice_schedule', 'weekly')}
            />
            <div>
              <div className="auto-invoice-option-name">Weekly</div>
              <div className="auto-invoice-option-help">Bills the previous 7 days on the chosen weekday.</div>
            </div>
          </label>
        </div>

        {schedule === 'monthly' && (
          <div className="form-grid" style={{ marginTop: 14 }}>
            <div>
              <label>Day of month to run</label>
              <select
                value={form.auto_invoice_day_of_month || 1}
                onChange={(e) => setField('auto_invoice_day_of_month', parseInt(e.target.value, 10))}
                disabled={!isAdmin}

                  <option key={d} value={d}>{d}</option>
                ))}
              </select>
              <span className="hint" style={{ display: 'block', marginTop: 6 }}>
                Capped at 28 so short months still work.
              </span>
            </div>
          </div>
        )}

        {schedule === 'weekly' && (
          <div className="form-grid" style={{ marginTop: 14 }}>
            <div>
              <label>Day of week to run</label>
              <select
                value={form.auto_invoice_day_of_week != null ? form.auto_invoice_day_of_week : 1}
                onChange={(e) => setField('auto_invoice_day_of_week', parseInt(e.target.value, 10))}
                disabled={!isAdmin}
              >
                <option value={0}>Sunday</option>
                <option value={1}>Monday</option>
                <option value={2}>Tuesday</option>
                <option value={3}>Wednesday</option>
                <option value={4}>Thursday</option>
                <option value={5}>Friday</option>
                <option value={6}>Saturday</option>
              </select>
            </div>
          </div>
        )}

        {lastRun && (
          <div className="hint" style={{ marginTop: 16 }}>
            Last run: <strong style={{ color: 'var(--text)' }}>{lastRun}</strong>
          </div>
        )}

        {isAdmin && (
          <div className="form-actions">
            <button type="submit" className="primary" disabled={busy}>
              {busy ? 'Saving...' : 'Save schedule'}
            </button>
            {schedule !== 'off' && (
              <button type="button" className="secondary" onClick={runNow} disabled={running}>
                {running ? 'Running…' : 'Run now'}
              </button>
            )}
          </div>
        )}
      </form>

      {(runResult || runError) && (
        <div className="form-card" style={{ marginTop: 14 }}>
          {runError && <div className="error">{runError}</div>}
          {runResult && (
            <>
              <div className="section-heading" style={{ marginTop: 0 }}>Run summary</div>
              <p className="hint" style={{ marginTop: 0 }}>
                Period: <strong style={{ color: 'var(--text)' }}>{runResult.period.start} → {runResult.period.end}</strong>
              </p>
              {runResult.drafted.length === 0 ? (
                <p>No new completions to bill. Nothing was drafted.</p>
              ) : (
                <>
                  <p>{runResult.drafted.length} {runResult.drafted.length === 1 ? 'invoice' : 'invoices'} drafted, totaling {formatPrice(runResult.drafted.reduce((s, d) => s + (d.total || 0), 0))}.</p>
                  <button className="primary" onClick={() => navigate('/invoices')}>Review invoices</button>
                </>
              )}
            </>
          )}
        </div>
      )}
    </>
  );
}

// Time zone picker for the organization. The full IANA list comes from the
// runtime itself (Intl.supportedValuesOf), so it stays current without us
// shipping a table; the North American zones are floated to the top because
// that is where the accounts are. Labels carry the current abbreviation
// (PDT, EST) since that is what people actually recognise.
const COMMON_TIMEZONES = [
  'America/New_York', 'America/Chicago', 'America/Denver', 'America/Phoenix',
  'America/Los_Angeles', 'America/Anchorage', 'Pacific/Honolulu',
];

let ALL_TIMEZONES = null;
function allTimezones() {
  if (!ALL_TIMEZONES) {
    try { ALL_TIMEZONES = Intl.supportedValuesOf('timeZone') || []; }
    catch (err) { ALL_TIMEZONES = []; }
    if (!ALL_TIMEZONES.length) ALL_TIMEZONES = COMMON_TIMEZONES.slice();
  }
  return ALL_TIMEZONES;
}

function timezoneLabel(zone) {
  try {
    const abbr = new Intl.DateTimeFormat('en-US', { timeZone: zone, timeZoneName: 'short' })
      .formatToParts(new Date()).find((part) => part.type === 'timeZoneName');
    return `${zone.replace(/_/g, ' ')}${abbr ? ` (${abbr.value})` : ''}`;
  } catch (err) { return zone; }
}

function browserTimezone() {
  try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }
  catch (err) { return ''; }
}

function TimezoneSelect({ value, onChange, disabled }) {
  // A saved zone the runtime does not know still has to be selectable, or
  // opening the editor would silently change it.
  const all = allTimezones();
  const list = value && all.indexOf(value) === -1 ? [value].concat(all) : all;
  const common = COMMON_TIMEZONES.filter((z) => list.indexOf(z) !== -1);
  const rest = list.filter((z) => common.indexOf(z) === -1);
  return (
    <select value={value || ''} disabled={disabled} onChange={(e) => onChange(e.target.value)}>
      <optgroup label="Common">
        {common.map((z) => <option key={z} value={z}>{timezoneLabel(z)}</option>)}
      </optgroup>
      <optgroup label="All time zones">
        {rest.map((z) => <option key={z} value={z}>{timezoneLabel(z)}</option>)}
      </optgroup>
    </select>
  );
}

// The one-line embed a client pastes into their own website.
//
// The closing tag is escaped as <\/script> deliberately. Written literally,
// it terminates the <script> element that holds this whole inline JSX block —
// the browser and the build script both stop reading there, and the build
// quietly emits a half-sized bundle rather than failing. The escape is
// invisible at runtime; the string still ends in a normal closing tag.
function bookingEmbedSnippet(slug) {
  return `<script src="${window.location.origin}/embed.js" data-org="${slug}"><\/script>`;
}

// A row's actions, folded into one menu.
//
// List rows had grown to seven buttons each — send, mark paid, apply credit,
// copy link, email, view, edit, delete — and when every row shouts, nothing
// leads. The row keeps at most one inline action, the one you are most likely
// to want next, and everything else lives here.
// On a phone the sort control moves into the overflow menu. Building it here
// keeps the four lists from each inventing their own version of the same list.
function sortMenuItems(current, setSort, options) {
  return [
    { section: 'Sort by' },
    ...options.map((o) => ({
      label: o.label,
      checked: current === o.value,
      onClick: () => setSort(o.value),
    })),
  ];
}

function RowMenu({ items, label = 'More actions' }) {
  const [open, setOpen] = useState(false);
  // Positioned against the window rather than against the row. Absolute
  // placement made the panel a child of whatever it sat in, and rows live in
  // cards and grids that clip their overflow — on the last team member the
  // menu was cut off by the bottom of the card it opened in.
  const [pos, setPos] = useState(null);
  const wrap = useRef(null);
  const pop = useRef(null);

  React.useLayoutEffect(() => {
    if (!open) { setPos(null); return; }
    const trigger = wrap.current && wrap.current.querySelector('.rowmenu-trigger');
    const el = pop.current;
    if (!trigger || !el) return;
    const t = trigger.getBoundingClientRect();
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    const M = 8;
    // Hangs off the trigger's right edge, which suits a kebab at the end of a
    // row; pulled back only when that would leave the screen.
    let left = t.right - w;
    if (left + w > window.innerWidth - M) left = window.innerWidth - w - M;
    if (left < M) left = M;
    // Below unless there is no room below and there is room above.
    let top = t.bottom + 4;
    if (top + h > window.innerHeight - M && t.top - h - 4 >= M) top = t.top - h - 4;
    setPos({ top, left });
  }, [open]);

  useEffect(() => {
    if (!open) return undefined;
    const onDown = (e) => { if (wrap.current && !wrap.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    // Fixed to the window, so it would otherwise sit still while the row it
    // belongs to scrolls away underneath it.
    const onScroll = () => setOpen(false);
    document.addEventListener('mousedown', onDown);
    document.addEventListener('keydown', onKey);
    window.addEventListener('scroll', onScroll, true);
    window.addEventListener('resize', onScroll);
    return () => {
      document.removeEventListener('mousedown', onDown);
      document.removeEventListener('keydown', onKey);
      window.removeEventListener('scroll', onScroll, true);
      window.removeEventListener('resize', onScroll);
    };
  }, [open]);

  const visible = items.filter(Boolean);
  // A menu of nothing but headings is still an empty menu.
  if (!visible.some((it) => !it.section)) return null;

  return (
    <div className="rowmenu" ref={wrap}>
      <button
        type="button"
        className="rowmenu-trigger"
        aria-haspopup="menu"
        aria-expanded={open}
        aria-label={label}
        onClick={() => setOpen((v) => !v)}
      >&#8943;</button>
      {open && (
        <div
          className="rowmenu-pop"
          role="menu"
          ref={pop}
          style={pos
            ? { top: pos.top, left: pos.left }
            /* Rendered so it can be measured, hidden until it has somewhere
               to be. useLayoutEffect places it before the browser paints. */
            : { top: 0, left: 0, visibility: 'hidden' }}
        >
          {visible.map((it, i) => (
            it.section ? (
              <p key={i} className="rowmenu-section">{it.section}</p>
            ) : (
              <button
                key={i}
                type="button"
                role={it.checked === undefined ? 'menuitem' : 'menuitemradio'}
                aria-checked={it.checked === undefined ? undefined : !!it.checked}
                className={`rowmenu-item${it.danger ? ' danger' : ''}${it.checked ? ' checked' : ''}`}
                onClick={() => { setOpen(false); it.onClick(); }}
              >
                <span>{it.label}</span>
                {it.checked && <span className="rowmenu-tick" aria-hidden="true">✓</span>}
              </button>
            )
          ))}
        </div>
      )}
    </div>
  );
}

function CopyButton({ text, label = 'Copy' }) {
  const [copied, setCopied] = useState(false);
  async function doCopy() {
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (err) {
      alert('Could not copy. The link is: ' + text);
    }
  }
  return (
    <button type="button" className="secondary" onClick={doCopy}>
      {copied ? 'Copied!' : label}
    </button>
  );
}

function SettingsView({ session, features = { invoices: true, quotes: true, reports: true, team: true, requests: true }, onFeaturesChange }) {
  const path = useLocation();
  const subView = path === '/settings/links' ? 'links'
    : path === '/settings/modules' ? 'modules'
    : path === '/settings/terminology' ? 'terminology'
    : path === '/settings/quick-text' ? 'quick-text'
    : path === '/settings/dashboard' ? 'dashboard'
    : path === '/settings/auto-invoice' ? 'auto-invoice'
    : path === '/settings/referrals' ? 'referrals'
    : path === '/settings/booking-form' ? 'booking-form'
    : path === '/settings/payments' ? 'payments'
    : path === '/settings/landing' ? 'landing'
    : 'company';
  const [settings, setSettings] = useState(null);
  const [form, setForm] = useState({});
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [saved, setSaved] = useState(false);
  const [localFeatures, setLocalFeatures] = useState(features);
  const [featuresBusy, setFeaturesBusy] = useState(false);
  const [featuresSaved, setFeaturesSaved] = useState(false);
  const [editIdentity, setEditIdentity] = useState(false);
  const [orgName, setOrgName] = useState('');
  const [orgSlug, setOrgSlug] = useState('');
  const [orgTimezone, setOrgTimezone] = useState('');

  function startEditIdentity() {
    setOrgName((settings && settings.organization_name) || '');
    setOrgSlug((settings && settings.organization_slug) || session.slug);
    setOrgTimezone((settings && settings.organization_timezone) || browserTimezone());
    setError(null);
    setEditIdentity(true);
  }

  async function saveIdentity() {
    const nextSlug = orgSlug.trim().toLowerCase();
    const slugChanged = nextSlug !== session.slug;
    if (slugChanged && !confirm(
      `Change your address from /${session.slug} to /${nextSlug}?\n\n`
      + 'Any booking link or QR code you have already shared or printed will stop working, '
      + 'and everyone on the account will need to sign in again.'
    )) return;
    setBusy(true); setError(null);
    try {
      const org = await apiRequest('/api/settings/organization', {
        method: 'PUT', slug: session.slug, token: session.token,
        body: { name: orgName.trim(), slug: nextSlug, timezone: orgTimezone || undefined },
      });
      setEditIdentity(false);
      if (slugChanged) {
        // The app resolves the org by slug on every request, so the stored
        // session has to move with it before anything else is fetched.
        saveSession({ token: session.token, user: session.user, organization: org });
        window.location.reload();
        return;
      }
      await load();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  const isAdmin = session.user.role === 'admin';

  // Every section, not a hand-picked few: the panel mounts before the account
  // has loaded, and a key missing here kept showing its default instead of
  // what was saved — Team and Requests had been doing that quietly.
  useEffect(() => { setLocalFeatures(features); },
    [features.invoices, features.quotes, features.reports, features.team, features.requests, features.referrals]);

  function toggleFeature(key) {
    setLocalFeatures((f) => ({ ...f, [key]: !f[key] }));
    setFeaturesSaved(false);
  }

  async function saveFeatures() {
    setFeaturesBusy(true); setError(null);
    try {
      await apiRequest('/api/onboarding/features', {
        method: 'PUT', slug: session.slug, token: session.token, body: { features: localFeatures },
      });
      setFeaturesSaved(true);
      if (onFeaturesChange) await onFeaturesChange();
    } catch (err) { setError(err.message); }
    finally { setFeaturesBusy(false); }
  }

  const load = useCallback(async () => {
    setLoading(true); setError(null);
    try {
      const data = await apiRequest('/api/settings', { slug: session.slug, token: session.token });
      setSettings(data);
      setForm({
        company_name: data.company_name || '',
        logo_url: data.logo_url || '',
        address: data.address || '',
        phone: data.phone || '',
        email: data.email || '',
        venmo_handle: data.venmo_handle || '',
        payment_link_url: data.payment_link_url || '',
        resend_from_email: data.resend_from_email || '',
        cloudinary_folder: data.cloudinary_folder || '',
        customer_label: data.customer_label || 'Customer',
        customer_label_plural: data.customer_label_plural || 'Customers',
        job_label: data.job_label || 'Job',
        job_label_plural: data.job_label_plural || 'Jobs',
        about: data.about || '',
        tagline: data.tagline || '',
        sms_templates: Array.isArray(data.sms_templates) ? data.sms_templates : [],
        dashboard_widgets: Array.isArray(data.dashboard_widgets) && data.dashboard_widgets.length > 0
          ? data.dashboard_widgets
          : DEFAULT_DASHBOARD_WIDGETS,
        auto_invoice_schedule: data.auto_invoice_schedule || 'off',
        auto_invoice_day_of_month: data.auto_invoice_day_of_month || 1,
        auto_invoice_day_of_week: data.auto_invoice_day_of_week != null ? data.auto_invoice_day_of_week : 1,
        auto_invoice_last_run_at: data.auto_invoice_last_run_at || null,
        auto_append_to_draft: !!data.auto_append_to_draft,
        referral_email_enabled: data.referral_email_enabled !== false,
        referral_invoice_note: data.referral_invoice_note !== false,
        referral_percent: data.referral_percent != null ? parseFloat(data.referral_percent) : 10,
        referral_cap_jobs: data.referral_cap_jobs != null ? data.referral_cap_jobs : (data.updated_at ? '' : 5),
        booking_form_config: (data.booking_form_config && typeof data.booking_form_config === 'object')
          ? {
              show_phone: data.booking_form_config.show_phone !== false,
              show_address: data.booking_form_config.show_address !== false,
              show_notes: data.booking_form_config.show_notes !== false,
              show_referred_by: data.booking_form_config.show_referred_by === true,
              preferred_dates_mode: ['none', 'one', 'three'].includes(data.booking_form_config.preferred_dates_mode) ? data.booking_form_config.preferred_dates_mode : 'one',
              title: data.booking_form_config.title || '',
              subtitle: data.booking_form_config.subtitle || '',
              service_placeholder: data.booking_form_config.service_placeholder || '',
              notes_placeholder: data.booking_form_config.notes_placeholder || '',
            }
          : { show_phone: true, show_address: true, show_notes: true, show_referred_by: false, preferred_dates_mode: 'one', title: '', subtitle: '', service_placeholder: '', notes_placeholder: '' },
      });
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  }, [session.slug, session.token]);

  useEffect(() => { load(); }, [load]);

  function setField(key, value) {
    setForm((f) => ({ ...f, [key]: value }));
    setSaved(false);
  }

  async function submit(e) {
    e.preventDefault();
    setBusy(true); setError(null); setSaved(false);
    try {
      const updated = await apiRequest('/api/settings', {
        method: 'PUT', slug: session.slug, token: session.token, body: form,
      });
      setSettings(updated);
      setSaved(true);
      if (onFeaturesChange) await onFeaturesChange();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  function setSmsTemplate(index, key, value) {
    setForm((f) => {
      const next = (f.sms_templates || []).slice();
      next[index] = { ...next[index], [key]: value };
      return { ...f, sms_templates: next };
    });
    setSaved(false);
  }
  function addSmsTemplate() {
    setForm((f) => ({
      ...f,
      sms_templates: [
        ...(f.sms_templates || []),
        { id: 'tpl_' + Math.random().toString(36).slice(2, 9), label: '', message: '' },
      ],
    }));
    setSaved(false);
  }
  function removeSmsTemplate(index) {
    setForm((f) => ({
      ...f,
      sms_templates: (f.sms_templates || []).filter((_, i) => i !== index),
    }));
    setSaved(false);
  }

  function toggleDashboardWidget(id) {
    setForm((f) => ({
      ...f,
      dashboard_widgets: (f.dashboard_widgets || []).map((w) =>
        w.id === id ? { ...w, enabled: !w.enabled } : w
      ),
    }));
    setSaved(false);
  }
  function moveDashboardWidget(fromId, toId) {
    setForm((f) => {
      const list = (f.dashboard_widgets || []).slice();
      const fromIdx = list.findIndex((w) => w.id === fromId);
      const toIdx = list.findIndex((w) => w.id === toId);
      if (fromIdx === -1 || toIdx === -1 || fromIdx === toIdx) return f;
      const [moved] = list.splice(fromIdx, 1);
      list.splice(toIdx, 0, moved);
      return { ...f, dashboard_widgets: list };
    });
    setSaved(false);
  }

  // Widget layout moved onto the dashboard itself, so this URL just forwards.
  useEffect(() => {
    if (subView === 'dashboard') navigate('/dashboard');
  }, [subView]);

  if (loading && (subView === 'company' || subView === 'payments' || subView === 'terminology' || subView === 'quick-text' || subView === 'links' || subView === 'auto-invoice' || subView === 'referrals' || subView === 'booking-form' || subView === 'landing')) {

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const ms = new Date(dateStr).getTime() - Date.now();
  return Math.ceil(ms / (1000 * 60 * 60 * 24));
}

function DemoBanner() {
  const founder = useFounderStatus();
  const founderActive = !!(founder && founder.active && founder.seats_remaining > 0);
  return (
    <div className="demo-banner">
      <span className="demo-banner-dot" />
      <span className="demo-banner-text">
        You're trying a demo — nothing here is real.
        {founderActive && <> Limited-time offer — <strong>${Math.round(founder.founder_price)}/mo</strong>.</>}
      </span>
      <button className="demo-banner-cta" onClick={() => {
        // Demo session is still in localStorage. Clear it before sending the
        // visitor to signup so the AppShell doesn't intercept the route.
        clearSession();
        window.location.href = '/signup';
      }}>
        {founderActive ? 'Lock in this price →' : 'Start free →'}
      </button>

  );
}

function BillingBanner({ status, trialDaysLeft, isAdmin, orgId, session }) {
  const founder = useFounderStatus();
  if (!status) return null;
  const trialEnded = status === 'trial_expired' || (status === 'trialing' && trialDaysLeft !== null && trialDaysLeft <= 0);
  const droppedToFree = trialEnded || status === 'canceled';
  const dismissKey = droppedToFree && orgId ? `fm_dropped_to_free_seen_${orgId}` : null;
  const [dismissed, setDismissed] = useState(() => {
    if (!dismissKey) return false;
    try { return localStorage.getItem(dismissKey) === '1'; } catch (e) { return false; }
  });
  function dismiss() {
    setDismissed(true);
    if (dismissKey) { try { localStorage.setItem(dismissKey, '1'); } catch (e) {} }
  }

  let body = null;
  let bg = '#fff5e6';
  let color = '#8c5a00';
  let showDismiss = false;

  const founderActive = !!(founder && founder.active && founder.seats_remaining > 0);
  if (status === 'trialing' && trialDaysLeft !== null && trialDaysLeft > 3) {
    bg = 'var(--tinted)';
    color = 'var(--text-muted)';
    body = isAdmin
      ? (founderActive
          ? <>You're trying Pro free — {trialDaysLeft} days left. <button className="link-button" style={{ color: 'inherit', textDecoration: 'underline' }} onClick={() => navigate('/billing')}>Add billing now</button> to take advantage of our limited-time offer.</>
          : <>You're trying Pro free — {trialDaysLeft} days left. <button className="link-button" style={{ color: 'inherit', textDecoration: 'underline' }} onClick={() => navigate('/billing')}>Add billing now</button> to keep Pro after the trial.</>)
      : <>This organization is on a Pro trial — {trialDaysLeft} days left.</>;
  } else if (status === 'trialing' && trialDaysLeft !== null && trialDaysLeft <= 3 && trialDaysLeft > 0) {
    body = isAdmin
      ? (founderActive
          ? <>Your Pro trial ends in {trialDaysLeft} {trialDaysLeft === 1 ? 'day' : 'days'}. <button className="link-button" style={{ color: 'inherit', textDecoration: 'underline' }} onClick={() => navigate('/billing')}>Subscribe to lock in this price</button>, or do nothing to drop to Free.</>
          : <>Your Pro trial ends in {trialDaysLeft} {trialDaysLeft === 1 ? 'day' : 'days'}. <button className="link-button" style={{ color: 'inherit', textDecoration: 'underline' }} onClick={() => navigate('/billing')}>Subscribe to keep Pro</button>, or do nothing to drop to Free.</>)
      : <>This organization's Pro trial ends in {trialDaysLeft} {trialDaysLeft === 1 ? 'day' : 'days'}.</>;
  } else if (trialEnded && !dismissed) {
    bg = 'var(--tinted)'; color = 'var(--text)';
    showDismiss = true;
    body = isAdmin
      ? <>Your Pro trial ended — you're now on <strong>Free</strong> with caps of 5 customers + 20 jobs. <button className="link-button" style={{ color: 'inherit', textDecoration: 'underline', fontWeight: 600 }} onClick={() => startUpgrade(session)}>Upgrade to Pro · <ProPriceText founder={founder} /></button>.</>
      : <>This organization's Pro trial ended. It's now on the Free plan.</>;
  } else if (status === 'past_due') {
    bg = 'var(--danger-bg)'; color = 'var(--danger)';
    body = isAdmin
      ? <>Your latest payment failed — editing is locked until it clears. <button className="link-button" style={{ color: 'inherit', textDecoration: 'underline' }} onClick={() => navigate('/billing')}>Update payment method</button>.</>
      : <>Payment is past due. Ask an admin to update the payment method.</>;
  } else if (status === 'canceled' && !dismissed) {
    bg = 'var(--tinted)'; color = 'var(--text)';
    showDismiss = true;
    body = isAdmin
      ? <>Your Pro subscription is canceled — you're on <strong>Free</strong> now. Data and settings are preserved. <button className="link-button" style={{ color: 'inherit', textDecoration: 'underline', fontWeight: 600 }} onClick={() => startUpgrade(session)}>Resubscribe</button>.</>
      : <>Your organization's Pro subscription was canceled. It's now on the Free plan.</>;
  }

  if (!body) return null;
  return (
    <div style={{
      background: bg, color, padding: '10px 24px', textAlign: 'center',
      fontSize: 13, fontWeight: 500, borderBottom: '1px solid var(--border)',
      position: 'relative',
    }}>
      {body}
      {showDismiss && isAdmin && (
        <button
          aria-label="Dismiss"
          onClick={dismiss}
          style={{
            position: 'absolute', right: 12, top: '50%', transform: 'translateY(-50%)',
            background: 'transparent', border: 'none', cursor: 'pointer',
            color: 'inherit', fontSize: 18, lineHeight: 1, padding: 4, opacity: 0.6,
          }}
        >×</button>
      )}
    </div>
  );
}
