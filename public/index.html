    .ed-hero {
      max-width: 1240px; margin: 0 auto;
      padding: 72px 32px 80px;
      position: relative;
    }
    .ed-hero-text {
      max-width: 980px; margin: 0 auto 64px;
      text-align: center;
    }
    .ed-eyebrow {
      display: inline-block;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.22em;
      color: var(--text-muted); margin-bottom: 28px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .ed-hero-headline {
      font-family: var(--serif); font-weight: 500;
      font-size: clamp(40px, 5.6vw, 72px);
      line-height: 1.04; letter-spacing: -0.035em;
      margin: 0 0 28px; color: var(--text);
    }
    .ed-hero-headline em {
      font-style: italic; font-weight: 500;
      color: var(--accent);
      white-space: nowrap;
    }
    .ed-hero-headline .cycle-word {
      display: inline-block;
      animation: cycleSlide 0.46s cubic-bezier(0.45, 0, 0.55, 1);
    }
    .ed-hero-headline .cycle-settled {
      animation: cycleSettle 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes cycleSlide {
      0%   { transform: translateY(0.45em); opacity: 0; }
      22%  { transform: translateY(0);      opacity: 1; }
      78%  { transform: translateY(0);      opacity: 1; }
      100% { transform: translateY(-0.45em); opacity: 0; }
    }
    @keyframes cycleSettle {
      0%   { transform: translateY(0.45em); opacity: 0; }
      100% { transform: translateY(0);       opacity: 1; }
    }
    .ed-hero-lede {
      font-size: 18px; line-height: 1.6;
      color: var(--text-muted); margin: 0 auto 36px;
      max-width: 560px;
    }
    .ed-hero-actions {
      display: flex; flex-direction: column;
      align-items: center; gap: 16px;
    }
    .ed-hero-actions .primary {
      background: var(--text); color: var(--bg);
      border: none; border-radius: 999px;
      padding: 16px 28px; font-size: 15px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      display: inline-flex; align-items: center; gap: 10px;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.2s ease;
    }
    .ed-hero-actions .primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px -10px rgba(0,0,0,0.25);
    }
    .ed-hero-note {
      font-size: 13px; color: var(--text-muted);
      line-height: 1.5; max-width: 420px;
      text-align: center;
    }
    .ed-hero-founder-note {
      font-size: 13px; line-height: 1.5;
      color: var(--accent); font-weight: 500;
      text-align: center; max-width: 420px;
      padding: 6px 14px;
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      border-radius: 999px;
    }
    .ed-hero-cta-row {
      display: flex; align-items: center; gap: 16px;
      flex-wrap: wrap; justify-content: center;
    }
    .ed-hero-demo-link {
      background: transparent; border: none;
      color: var(--text-muted);
      font-size: 14px; font-family: inherit;
      cursor: pointer; padding: 8px 4px;
      text-decoration: underline;
      text-underline-offset: 4px;
      transition: color 0.15s ease;
    }
    .ed-hero-demo-link:hover { color: var(--text); }

    /* Editorial collage: 9 sharp-edged photos sharing a middle horizontal
       seam. Within each row tiles touch left-to-right. Heights vary above
       and below the seam, so outer top/bottom edges stagger. Rows can be
       slightly offset so left/right edges stagger too. */
    .ed-collage {
      position: relative;
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      aspect-ratio: 2.2 / 1;
      min-height: 420px;
    }
    .ed-tile {
      position: absolute;
      background-size: cover;
      background-position: center;
      background-color: #e8dfd0;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  z-index 0s 0.4s;
    }
    .ed-tile:hover {
      transform: scale(1.03);
      z-index: 10;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  z-index 0s;
    }
    /* row 1 (above seam) — 5 tiles, dramatic height contrast.
       Tile 2 + Tile 5 are tall portraits anchoring the rhythm;
       tiles 1, 3, 4 are shorter landscapes. */
    .ed-tile-1 { left:  0%; bottom: 50%; width: 17%; height: 28%;
      background-image: url('https://images.unsplash.com/photo-1623161551727-54c918bdcec1?w=600&q=80&auto=format&fit=crop');
    }
    .ed-tile-2 { left: 17%; bottom: 50%; width: 21%; height: 42%;
      background-image: url('https://images.unsplash.com/photo-1728706613021-e447801e1ea6?w=700&q=80&auto=format&fit=crop');
    }
    .ed-tile-3 { left: 38%; bottom: 50%; width: 22%; height: 34%;
      background-image: url('https://images.unsplash.com/photo-1740657254989-42fe9c3b8cce?w=700&q=80&auto=format&fit=crop');
    }
    .ed-tile-4 { left: 60%; bottom: 50%; width: 18%; height: 26%;
      background-image: url('https://images.unsplash.com/photo-1641199788912-9a7385a35c82?w=600&q=80&auto=format&fit=crop');
    }
    .ed-tile-5 { left: 78%; bottom: 50%; width: 22%; height: 40%;
      background-image: url('https://images.unsplash.com/photo-1628847115161-d6793dc59c7f?w=700&q=80&auto=format&fit=crop');
    }
    /* row 2 (below seam) — 4 tiles, more uniform heights, offset right
       so the outer left edge staggers vs row 1. */
    .ed-tile-6 { left:  6%; top: 50%; width: 24%; height: 38%;
      background-image: url('https://images.unsplash.com/photo-1734303023491-db8037a21f09?w=800&q=80&auto=format&fit=crop');
    }
    .ed-tile-7 { left: 30%; top: 50%; width: 22%; height: 34%;
      background-image: url('https://images.unsplash.com/photo-1530700131180-d43d9b8cc41f?w=700&q=80&auto=format&fit=crop');
    }
    .ed-tile-8 { left: 52%; top: 50%; width: 24%; height: 40%;
      background-image: url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=700&q=80&auto=format&fit=crop');
    }
    .ed-tile-9 { left: 76%; top: 50%; width: 20%; height: 32%;
      background-image: url('https://images.unsplash.com/photo-1613844044163-1ad2f2d0b152?w=600&q=80&auto=format&fit=crop');
    }
    @media (max-width: 860px) {
      .ed-hero {
        padding: 48px 20px 56px;
      }
      .ed-hero-text { margin-bottom: 40px; }
      /* Mobile collage: vertical mosaic with grid-template-areas.
         Same touching-tiles feel as desktop, oriented for narrow screens.
         A few tiles are hidden so the remaining six get room to breathe. */
      .ed-collage {
        aspect-ratio: 3 / 4;
        min-height: 0;
        max-width: 460px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(4, 1fr);
        grid-template-areas:
          "a a b"
          "a a b"
          "c d d"
          "c e f";
        gap: 0;
        padding: 0;
        overflow: visible;
      }
      .ed-tile {
        position: static !important;
        width: auto !important; height: auto !important;
        left: auto !important; top: auto !important; bottom: auto !important;
        aspect-ratio: auto !important;
      }
      /* Map each tile to a mosaic slot. Big square anchor + two tall
         portraits + a wide landscape + two small detail tiles. */
      .ed-tile-6 { grid-area: a; }
      .ed-tile-5 { grid-area: b; }
      .ed-tile-7 { grid-area: c; }
      .ed-tile-3 { grid-area: d; }
      .ed-tile-1 { grid-area: e; }
      .ed-tile-4 { grid-area: f; }
      .ed-tile-2, .ed-tile-8, .ed-tile-9 { display: none; }
    }

    /* chapters */
    .ed-chapters {
      max-width: 1080px; margin: 0 auto;
      padding: 40px 32px 96px;
    }
    @media (max-width: 600px) {
      .ed-chapters { padding: 24px 20px 56px; }
    }
    /* ---- the sales page takes the app's identity ----
       The terracotta and the black pills made the page that sells the product
       look like a different company from the product. Scoped to the landing
       pages: the app's own --accent is untouched. */
    .landing-editorial { --accent: var(--primary); }
    .landing-editorial .sales-cta, .landing-editorial .ed-nav-cta { background: var(--primary); color: #fff; }
    .landing-editorial .sales-cta:hover { box-shadow: 0 14px 32px -10px rgba(44, 62, 87, 0.55); }

    /* The hero: words on the left, the product on the right. */
    .ed-hero.ed-hero--split {
      display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 0.92fr);
      gap: 40px; align-items: center; padding: 40px 32px 88px;
    }
    .ed-hero--split .ed-hero-text { max-width: none; margin: 0; text-align: left; }
    .ed-hero--split .ed-hero-headline { font-size: clamp(38px, 4.7vw, 62px); font-weight: 600; text-wrap: balance; }
    .ed-hero--split .ed-hero-headline em { white-space: normal; }
    .ed-hero--split .ed-hero-lede { margin: 0 0 32px; max-width: 30em; }
    .ed-hero--split .ed-hero-lede b { color: var(--text); font-weight: 600; }
    .ed-hero--split .ed-hero-actions { align-items: flex-start; }
    /* The two buttons are one height: the same type size, and 17px of padding
       plus the 1px border against the loud one's 18. Stretching the row was
       not enough on its own — on a phone they wrap onto two rows, each row
       sizes itself, and a button with no padding of its own collapsed. */
    /* Every button row on the sales page, not only the hero's: the closing
       banner uses the same pair and had the same mismatch. */
    .landing-editorial .sales-hero-actions { align-items: stretch; gap: 12px; }
    .ed-hero--split .sales-hero-actions { justify-content: flex-start; }
    .landing-editorial .sales-cta-secondary {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 17px 28px; font-size: 17px;
      background: #fff; border-color: var(--border);
    }
    /* The pricing buttons are the hero's pair again, not a third style: the
       Free plan's is the quiet white pill, Pro's the navy one — same radius,
       same height, same type size. They were small square-cornered outlines,
       and the last black on a navy page. */
    .landing-editorial .ed-plan-cta {
      border-radius: 999px; padding: 17px 28px; font-size: 17px; font-weight: 600;
      background: #fff; border: 1px solid var(--border); color: var(--text);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease, background 0.15s;
    }
    .landing-editorial .ed-plan-cta:hover { background: var(--tinted); color: var(--text); transform: translateY(-1px); }
    .landing-editorial .ed-plan-cta-pro { background: var(--primary); border-color: var(--primary); color: #fff; }
    .landing-editorial .ed-plan-cta-pro:hover {
      background: var(--primary); color: #fff; opacity: 1;
      transform: translateY(-2px); box-shadow: 0 14px 32px -10px rgba(44, 62, 87, 0.55);
    }
    /* Chapters alternate sides. Every shot is the same phone frame, so it is
       the side-to-side rhythm that says "new section"; four in a row on one
       side read as a single long column. From 901px up only — below that they
       stack, words first, and an order swap would put the phone on top. */
    @media (min-width: 901px) {
      .ed-chapter:nth-child(even) { grid-template-columns: minmax(0, 380px) minmax(0, 460px); }
      .ed-chapter:nth-child(even) .ed-chapter-body-col { order: 2; }
    }
    .ed-hero-kicker {
      display: inline-flex; align-items: center; gap: 8px; margin: 0 0 20px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--primary);
    }
    .ed-hero-kicker::before { content: ''; width: 22px; height: 1.5px; background: var(--primary); }
    /* With the offer pill above it, the kicker takes its own line and drops the
       rule — side by side, the rule read as a dash joining the two. */
    .ed-hero-text .sales-hero-badge { display: block; width: fit-content; margin-bottom: 22px; }
    .ed-hero-text .sales-hero-badge + .ed-hero-kicker { display: flex; }
    .ed-hero-text .sales-hero-badge + .ed-hero-kicker::before { display: none; }
    /* The phone floats in its column with room under it — flush on the strip
       below, it read as standing on a shelf. */
    .ed-hero-stage { display: grid; place-items: center; }
    .ed-hero-stage .pd-phone { --pd-w: 300; }

    /* Four equal facts, centred, each a number, a label and one short line. */
    .ed-strip {
      display: grid; grid-template-columns: repeat(4, 1fr); text-align: center;
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
    }
    .ed-strip > div { padding: 28px 20px 26px; border-left: 1px solid var(--border); }
    .ed-strip > div:first-child { border-left: 0; }
    .ed-strip-k { font-family: var(--serif); font-weight: 600; font-size: 34px; line-height: 1; letter-spacing: -0.02em; }
    .ed-strip-k small { font-family: inherit; font: 500 15px/1 'Inter', sans-serif; color: var(--text-muted); letter-spacing: 0; }
    .ed-strip-l { margin-top: 10px; font-size: 14px; font-weight: 600; }
    .ed-strip-v { margin-top: 3px; font-size: 13px; color: var(--text-muted); line-height: 1.45; }
    @media (max-width: 860px) {
      /* Stacked, the phone sits on the centre line — so the words above it do
         too. Left-aligned copy over a centred phone read as two layouts. */
      .ed-hero.ed-hero--split { grid-template-columns: 1fr; gap: 40px; padding: 28px 32px 56px; }
      .ed-hero--split .ed-hero-text { margin: 0 auto; max-width: 600px; text-align: center; }
      .ed-hero--split .ed-hero-lede { margin-inline: auto; }
      .ed-hero--split .sales-hero-trust, .ed-hero--split .ed-hero-lede { text-wrap: balance; }
      .ed-hero--split .sales-hero-actions { justify-content: center; }
      .ed-hero-text .sales-hero-badge { margin-inline: auto; }
      .ed-hero-text .sales-hero-badge + .ed-hero-kicker { justify-content: center; }
      .ed-hero-stage .pd-phone { --pd-w: 268; }
      .ed-chapter-mock .pd-phone { --pd-w: 256; }
      .ed-strip { grid-template-columns: 1fr 1fr; }
      .ed-strip > div { padding: 22px 14px 20px; }
      .ed-strip > div:nth-child(odd) { border-left: 0; }
      .ed-strip > div:nth-child(n+3) { border-top: 1px solid var(--border); }
      .ed-strip-k { font-size: 28px; }
    }
    @media (max-width: 600px) {
      .ed-hero.ed-hero--split { gap: 34px; padding: 24px 20px 52px; }
      /* Stacked and full width: two thumbs' worth of button, one over the other. */
      .landing-editorial .sales-hero-actions { width: 100%; }
      .landing-editorial .sales-hero-actions > * { flex: 1 1 100%; justify-content: center; }
    }

    /* ---- the phone ---- */
    .pd-phone {
      --pd-w: 280;
      width: calc(var(--pd-w) * 1px); max-width: 100%; aspect-ratio: 300 / 614; position: relative;
      border-radius: 46px; background: #14171c; padding: 9px; flex: none;
      box-shadow: 0 0 0 1px #2a2e36 inset, 0 2px 4px rgba(0, 0, 0, 0.2), 0 40px 70px -30px rgba(25, 23, 15, 0.55);
    }
    .pd-phone::after {
      content: ''; position: absolute; top: 18px; left: 50%; translate: -50% 0;
      width: 84px; height: 24px; border-radius: 99px; background: #0b0d10; z-index: 9;
    }
    /* clip-path, not just overflow. A rounded overflow:hidden does not reliably
       clip children that are transformed or carry backdrop-filter — they sit on
       their own compositor layer and poke past the corners. A clip-path clips
       layers too, and makes the screen the glass's backdrop root, so the blur
       only ever samples what is inside the phone. */
    .pd-scr {
      position: relative; width: 100%; height: 100%; border-radius: 38px;
      overflow: hidden; clip-path: inset(0 round 38px); background: var(--bg);
    }
    /* Laid out at the app's real 375px and scaled to the screen. The width is a
       bare number so the scale is plain arithmetic: dividing one length by
       another inside calc() is newer than the browsers this page has to reach. */
    .pd-app {
      position: absolute; left: 0; top: 0; width: 375px; height: 794px;
      transform-origin: 0 0; transform: scale(calc((var(--pd-w) - 18) / 375));
      color: var(--text); text-align: left; font-size: 14px; line-height: 1.4;
    }
    .pd-top {
      position: absolute; left: 0; right: 0; top: 0; z-index: 4; padding: 52px 16px 14px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .pd-top b { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
    .pd-av { width: 40px; height: 40px; border-radius: 99px; border: 1px solid var(--border); background: #fff; display: grid; place-items: center; }
    .pd-av i { width: 28px; height: 28px; border-radius: 99px; background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: #fff; font: 600 12px/28px 'Inter', sans-serif; text-align: center; font-style: normal; }
    .pd-view { position: absolute; inset: 0; padding: 122px 16px 0; opacity: 0; transform: translateY(8px); transition: opacity 0.45s ease, transform 0.45s ease; }
    .pd-view.on { opacity: 1; transform: none; }
    .pd-view--page { padding: 64px 22px 0; background: var(--bg); }
    .pd-tb { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .pd-tb h5 { font-family: var(--serif); font-weight: 600; font-size: 24px; line-height: 1.1; letter-spacing: -0.02em; margin: 0; }
    .pd-c { font-size: 12.5px; color: var(--text-muted); margin-top: 3px; } .pd-c b { color: var(--text); font-weight: 600; }
    .pd-acts { display: flex; gap: 8px; }
    .pd-sec { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin: 18px 0 9px; }
    .pd-req { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px 10px 16px; margin-bottom: 10px; background: linear-gradient(to right, var(--tinted), #fff); border: 1px solid var(--accent); border-radius: 14px; font-size: 13.5px; }
    .pd-req strong { font-family: var(--serif); font-size: 21px; font-weight: 600; margin-right: 5px; }
    .pd-req-btn { flex: 0 0 auto; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; padding: 8px 15px; border-radius: 999px; }
    .pd-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .pd-stat { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; }
    .pd-l { font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
    .pd-n { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; margin-top: 6px; line-height: 1.15; } .pd-s { font-size: 12.5px; color: var(--text-muted); }
    .pd-day { display: flex; background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .pd-day-hrs { width: 50px; flex: 0 0 auto; border-right: 1px solid var(--border); }
    .pd-day-hrs > div { border-bottom: 1px dashed var(--border); position: relative; }
    .pd-day-hrs span { position: absolute; top: 5px; left: 7px; font-size: 10.5px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
    .pd-day-lanes { flex: 1; position: relative; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 19px, rgba(120, 110, 95, 0.1) 19px, rgba(120, 110, 95, 0.1) 20px); }
    .pd-day-lane { border-bottom: 1px dashed var(--border); }
    .pd-day-now { position: absolute; left: 0; right: 0; z-index: 2; }
    .pd-day-now i { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: var(--terracotta, #c98558); box-shadow: 0 0 0 4px rgba(201, 133, 88, 0.2); }
    .pd-day-now b { display: block; height: 2px; margin-left: 6px; background: var(--terracotta, #c98558); }
    .pd-day-blk { position: absolute; left: 5px; right: 5px; z-index: 1; display: flex; flex-direction: column; gap: 2px; padding: 7px 10px; border-radius: 9px; background: var(--primary); color: #fff; font-size: 12.5px; box-shadow: 0 4px 14px -6px rgba(40, 30, 20, 0.4); overflow: hidden; }
    .pd-day-hd { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; font-weight: 700; letter-spacing: 0.02em; opacity: 0.92; }
    .pd-day-hd em { font-family: var(--serif); font-style: normal; font-weight: 600; font-size: 13px; letter-spacing: -0.01em; }
    .pd-day-ti { font-weight: 600; line-height: 1.2; }
    .pd-day-bt { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; font-size: 11px; }
    .pd-day-bt span { opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pd-day-bt u { flex: 0 0 auto; text-decoration: none; font-weight: 600; padding: 4px 8px; border-radius: 6px; background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.3); }
    .pd-credit { flex: 0 0 auto; font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: #e8f1ec; color: #1f6f4a; white-space: nowrap; }
    .pd-link { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
    .pd-link-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .pd-link-row span { flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--text-muted); background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pd-link-row b { flex: 0 0 auto; font-size: 12.5px; font-weight: 600; line-height: 1; background: var(--primary); color: #fff; border-radius: 9px; padding: 9px 12px; }
    .pd-earn { font-size: 14px; font-weight: 600; color: #1f6f4a; }
    .pd-lst { background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .pd-ro { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-top: 1px solid var(--border); }

    .pd-book h5 { font-family: var(--serif); font-weight: 600; font-size: 24px; line-height: 1.12; letter-spacing: -0.02em; margin: 0 0 8px; }

    .pd-book label { display: block; font-size: 12.5px; font-weight: 600; margin: 12px 0 5px; }
    .pd-field { border: 1px solid var(--border); background: #fff; border-radius: 10px; padding: 11px 12px; font-size: 14px; }
    .pd-field--tall { min-height: 62px; }
    .pd-submit { margin-top: 20px; background: var(--primary); color: #fff; border-radius: 11px; padding: 14px; text-align: center; font-size: 15px; font-weight: 600; }
    /* the app's own two-layer glass */
    .pd-glass { position: relative; }
    .pd-glass::before, .pd-glass::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; }
    .pd-glass > * { position: relative; z-index: 1; }
    .pd-glass::before { background: rgba(255, 255, 255, var(--pd-a, 0.16)); -webkit-backdrop-filter: blur(var(--pd-bl, 7px)) brightness(1.16) saturate(135%); backdrop-filter: blur(var(--pd-bl, 7px)) brightness(1.16) saturate(135%); }
    .pd-glass::after { padding: 1.5px; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.62); }
    .pd-top.pd-glass { --pd-a: 0.55; --pd-bl: 14px; position: absolute; }
    .pd-top.pd-glass::after { -webkit-mask: none; mask: none; padding: 0; box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.55); }
    .pd-gc { width: 40px; height: 40px; border-radius: 99px; display: grid; place-items: center; --pd-a: 0.3; --pd-bl: 8px; box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05), 0 6px 16px -8px rgba(0, 0, 0, 0.35); font-size: 18px; font-weight: 600; }
    .pd-bar { position: absolute; left: 20px; right: 20px; bottom: 18px; z-index: 5; border-radius: 30px; box-shadow: 0 1px 1px rgba(0, 0, 0, 0.05), 0 10px 28px -12px rgba(0, 0, 0, 0.35); }
    .pd-bar.pd-glass { position: absolute; }
    .pd-in { display: flex; padding: 5px; position: relative; }
    .pd-t { flex: 1 1 0; height: 50px; display: grid; place-items: center; color: var(--text); position: relative; }
    .pd-t .icon { font-size: 26px; stroke-width: 1.8; vertical-align: 0; }
    .pd-pill { position: absolute; left: 5px; top: 5px; height: 50px; width: calc((100% - 10px) / 5); transform: translateX(calc(var(--pd-i, 0) * 100%)); transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); }
    .pd-pill::before { content: ''; position: absolute; inset: -2px -4px; border-radius: 27px; background: rgba(138, 138, 144, 0.34); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 1px 4px rgba(0, 0, 0, 0.07); }
    @media (prefers-reduced-motion: reduce) { .pd-view, .pd-pill { transition-duration: 0.01ms; } }

    .legal-body p {
      font-size: 16px; line-height: 1.7;
      color: var(--text-muted); margin: 0 0 18px;
    }
    .legal-body h2 {
      font-family: var(--serif); font-weight: 500;
      font-size: 22px; letter-spacing: -0.015em;
      color: var(--text); margin: 40px 0 14px;
    }
    .legal-body a {
      color: var(--accent); text-decoration: underline;
      text-underline-offset: 3px;
    }
    .legal-body a:hover { opacity: 0.8; }
    .contact-form { max-width: 480px; margin: 0 auto; }
    .contact-form label {
      display: block; font-size: 13px; font-weight: 600;
      margin: 18px 0 6px; color: var(--text);
    }
    .contact-form input, .contact-form textarea {
      width: 100%; box-sizing: border-box;
      font-family: inherit; font-size: 15px;
      padding: 10px 12px; border: 1px solid var(--border-strong);
      border-radius: 8px; background: var(--card); color: var(--text);
    }
    .contact-form textarea { resize: vertical; }
    .contact-form .error {
      color: #b91c1c; font-size: 14px; margin-top: 12px;
    }
    .contact-form button { margin-top: 18px; }

    /* Hosted per-tenant landing page (/<slug>): hero, gallery, services, form. */
    .lp {
      color: var(--text);
      /* Per-tenant accent (overridden inline via --lp-accent); hover derives. */
      --lp-accent: var(--accent);
      --lp-accent-hover: color-mix(in srgb, var(--lp-accent) 85%, #000);
    }
    .lp-loading { padding: 96px 24px; text-align: center; color: var(--text-muted); }
    .lp-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px clamp(20px, 5vw, 56px);
      background: color-mix(in srgb, var(--bg) 80%, transparent);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .lp-nav-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .lp-nav-logo { height: 44px; width: 44px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
    .lp-nav-brand-text { display: flex; flex-direction: column; line-height: 1.12; min-width: 0; }
    .lp-nav-name { font-family: var(--serif); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; color: var(--text); }
    .lp-nav-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--lp-accent); margin-top: 3px; }
    .lp-nav-cta, .lp-cta {
      background: var(--lp-accent); color: #fff; border: 0; cursor: pointer; font-family: inherit;
      text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700;
      transition: background 0.15s ease;
    }
    .lp-nav-cta:hover, .lp-cta:hover { background: var(--lp-accent-hover); }
    .lp-nav-cta { border-radius: 8px; padding: 11px 22px; font-size: 12px; }

    /* Background field spans the nav + hero, then fades out before the
       gallery (bottom gradient). Content sits above the fade via z-index. */
    .lp-top {
      position: relative;
      background-color: var(--bg);
      background-image:
        linear-gradient(45deg, var(--tinted) 25%, transparent 25%, transparent 75%, var(--tinted) 75%),
        linear-gradient(45deg, var(--tinted) 25%, transparent 25%, transparent 75%, var(--tinted) 75%);
      background-size: 100px 100px; background-position: 0 0, 50px 50px;
    }
    .lp-top > .lp-hero { position: relative; z-index: 1; }
    .lp-top::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 42%;
      background: linear-gradient(to bottom, transparent, var(--bg)); z-index: 0; pointer-events: none;
    }
    .lp-hero {
      display: grid; grid-template-columns: 1fr 1.1fr; gap: clamp(24px, 5vw, 60px);
      align-items: center;
      padding: clamp(28px, 4vw, 56px) clamp(20px, 5vw, 56px) clamp(48px, 6vw, 80px);
    }
    .lp-hero-media {
      justify-self: center; max-width: 440px; width: 100%;
      border: 5px solid var(--lp-accent); border-radius: 14px; overflow: hidden;
      box-shadow: 0 22px 50px -22px rgba(0,0,0,0.35); background: var(--card);
    }
    .lp-hero-media img { width: 100%; aspect-ratio: 5 / 6; object-fit: cover; display: block; }
    .lp-hero-panel { display: flex; flex-direction: column; align-items: flex-start; }
    .lp-hero-title {
      font-family: var(--serif); font-weight: 600; letter-spacing: -0.02em;
      font-size: clamp(34px, 4.4vw, 54px); line-height: 1.06; margin: 0 0 18px; color: var(--text);
    }
    .lp-hero-sub { font-size: clamp(15px, 1.5vw, 18px); line-height: 1.6; color: var(--text-muted); margin: 0 0 28px; max-width: 520px; }
    .lp-cta { border-radius: 10px; padding: 15px 30px; font-size: 13px; }
    @media (max-width: 820px) {
      .lp-hero { grid-template-columns: 1fr; gap: 28px; text-align: center; }
      .lp-hero-media { grid-row: 1; max-width: 340px; }
      .lp-hero-panel { align-items: center; }
      .lp-hero-sub { margin-left: auto; margin-right: auto; }
    }

    /* Draggable gallery carousel — arrows + click-drag; scrollbar hidden. */
    /* Content sections (gallery / services / testimonials) live in one flex
       column so the vertical rhythm is a single uniform gap regardless of
       which sections are present. The container's own padding provides the
       matching gap to the hero band above and the booking band below. */
    /* No top padding: the hero band already carries its own bottom padding +
       fade, so the first section sits right under it. Bottom padding matches
       the inter-section gap so the last section clears the booking band. */
    .lp-sections { display: flex; flex-direction: column; gap: 76px; padding: 0 0 76px; }
    .lp-gallery-wrap { position: relative; }
    .lp-gallery {
      display: flex; gap: 10px; overflow-x: auto;
      padding: 0 clamp(20px, 5vw, 48px);
      scrollbar-width: none; -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch; cursor: grab;
    }
    .lp-gallery::-webkit-scrollbar { display: none; }
    .lp-gallery.dragging { cursor: grabbing; scroll-behavior: auto; }
    .lp-gallery-item {
      flex: 0 0 auto; width: clamp(240px, 42vw, 380px); aspect-ratio: 4 / 5;
      margin: 0; border-radius: 12px; overflow: hidden; background: var(--tinted);
      user-select: none;
    }
    .lp-gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; user-select: none; }
    .lp-gallery.dragging img { pointer-events: none; }
    .lp-gallery-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
      width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-size: 24px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: var(--shadow-md); transition: background 0.15s ease;
    }
    .lp-gallery-arrow:hover { background: var(--bg-elevated); }
    .lp-gallery-prev { left: clamp(8px, 2vw, 20px); }
    .lp-gallery-next { right: clamp(8px, 2vw, 20px); }
    @media (max-width: 600px) { .lp-gallery-arrow { display: none; } }

    .lp-section-title {
      font-family: var(--serif); font-weight: 600; letter-spacing: -0.01em;
      font-size: clamp(26px, 4vw, 38px); text-align: center; margin: 0 0 36px;
    }
    .lp-services { max-width: 760px; margin: 0 auto; padding: 0 24px; width: 100%; }
    .lp-services-list { display: flex; flex-direction: column; gap: 22px; }
    .lp-service { border-bottom: 1px solid var(--border); padding-bottom: 22px; }
    .lp-service:last-child { border-bottom: 0; padding-bottom: 0; }
    .lp-service-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
    .lp-service-name { font-size: 18px; font-weight: 600; }
    .lp-service-price { font-size: 15px; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
    .lp-service-desc { margin: 8px 0 0; color: var(--text-muted); line-height: 1.55; font-size: 14px; }

    /* Testimonials: social-proof cards above the booking form. */
    .lp-testimonials { max-width: 1000px; margin: 0 auto; padding: 0 24px; width: 100%; }
    .lp-testimonials-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 22px;
    }
    .lp-testimonial {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 26px 24px; margin: 0; display: flex; flex-direction: column; gap: 13px;
    }
    .lp-stars { display: flex; gap: 3px; color: var(--lp-accent); }
    .lp-stars svg { width: 16px; height: 16px; display: block; }
    .lp-testimonial-quote { margin: 0; font-size: 15px; line-height: 1.6; color: var(--text); }
    .lp-testimonial-author {
      font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Social icon row (landing footer). */
    .lp-socials { display: flex; justify-content: center; gap: 12px; margin-bottom: 22px; }
    .lp-social {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--border);
      color: var(--text-muted); transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    .lp-social:hover { color: #fff; background: var(--lp-accent); border-color: var(--lp-accent); }
    .lp-social svg { width: 20px; height: 20px; display: block; }

    /* Booking section: accent band with a white form card (matches
       barbersthetic). Scoped to .lp-book so the shared /book page — which
       renders <BookingForm> without .lp-book — keeps the standard look. */
    .lp-book { background: var(--lp-accent); padding: clamp(40px, 6vw, 84px) clamp(16px, 4vw, 40px); }
    .lp-book-inner {
      max-width: 640px; margin: 0 auto; background: var(--card);
      border-radius: 16px; padding: clamp(32px, 5vw, 56px) clamp(24px, 5vw, 56px);
      box-shadow: 0 30px 70px -34px rgba(0, 0, 0, 0.45);
    }
    .lp-book-title { text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }
    .lp-book-sub { text-align: center; color: var(--text-muted); margin: 0 0 30px; }
    .lp-book .booking-done { text-align: center; padding: 24px 0; }
    .lp-book form label {
      text-transform: uppercase; letter-spacing: 0.08em; font-size: 11px;
      font-weight: 700; color: var(--text);
    }
    .lp-book form label .hint { text-transform: none; letter-spacing: 0; font-weight: 400; }
    .lp-book form input, .lp-book form textarea, .lp-book form select {
      background: var(--bg); border: 1px solid var(--border-strong);
    }
    .lp-book form .primary { background: var(--lp-accent); border-color: var(--lp-accent); }
    .lp-book form .primary:hover { background: var(--lp-accent-hover); border-color: var(--lp-accent-hover); }

    .lp-footer { text-align: center; padding: 44px 24px; color: var(--text-muted); font-size: 13px; line-height: 1.7; }
    .lp-powered { margin-top: 10px; font-size: 12px; }
    .lp-powered a { color: inherit; }

    /* Landing-page editor (staff org detail) + image upload control */
    .img-upload { margin-bottom: 6px; }
    .img-upload-preview { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .img-upload-preview img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
    .img-upload-btn {
      display: inline-block; cursor: pointer; font-size: 13px; font-weight: 600;
      padding: 8px 14px; border: 1px solid var(--border-strong); border-radius: 8px;
      background: var(--card); color: var(--text);
    }
    .img-upload-btn:hover { background: var(--row-hover); }
    .lp-editor .section-heading { margin-top: 24px; }
    .lp-editor-row, .lp-editor-service {
      border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px;
    }
    .lp-editor-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .lp-editor-service-top { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .lp-editor-socials { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .lp-editor-social-row { display: flex; align-items: center; gap: 10px; }
    .lp-editor-social-row input { flex: 1; }
    /* Condensed gallery editor: thumbnail grid + one multi-file "Add" tile. */
    .lp-thumb-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
    .lp-thumb {
      position: relative; width: 94px; height: 94px; border-radius: 8px; overflow: hidden;
      background: var(--tinted); border: 1px solid var(--border);
    }
    .lp-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .lp-thumb-x {
      position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; border: 0;
      border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; font-size: 15px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .lp-thumb-x:hover { background: rgba(0,0,0,0.8); }
    .lp-thumb-add {
      display: flex; align-items: center; justify-content: center; text-align: center;
      cursor: pointer; border: 1px dashed var(--border-strong); background: var(--bg-elevated);
      color: var(--text-muted); font-size: 12px; font-weight: 600; line-height: 1.25; padding: 6px;
    }
    .lp-thumb-add:hover { background: var(--tinted); }
    @media (max-width: 600px) {
      .legal-page { padding: 32px 20px 64px; }
      .legal-head { margin-bottom: 40px; padding-bottom: 32px; }
      .legal-body h2 { margin: 32px 0 12px; }
    }

    /* === Process flow section (editorial style) === */
    .flow-section {
      max-width: 1080px; margin: 0 auto;
      padding: 80px 32px 64px;
    }
    .flow-header {
      text-align: center; max-width: 640px;
      margin: 0 auto 56px;
    }
    .flow-headline {
      font-family: var(--serif); font-weight: 500;
      font-size: clamp(28px, 3.6vw, 44px);
      letter-spacing: -0.025em; margin: 14px 0 0;
      color: var(--text); line-height: 1.1;
    }
    .flow-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--border);
    }
    .flow-step {
      padding: 40px 24px;
      border-right: 1px solid var(--border);
      text-align: center;
    }
    .flow-step:last-child { border-right: none; }
    .flow-step-num {
      font-family: var(--serif); font-weight: 500;
      font-size: 13px; color: var(--accent);
      letter-spacing: 0.05em; margin-bottom: 18px;
    }
    .flow-step-word {
      font-family: var(--serif); font-weight: 500;
      font-size: 28px; color: var(--text);
      letter-spacing: -0.02em; line-height: 1;
      margin-bottom: 12px;
    }
    .flow-step-detail {
      font-size: 13px; line-height: 1.55;
      color: var(--text-muted); margin: 0 auto;
      max-width: 220px;
    }
    @media (max-width: 720px) {
      .flow-section { padding: 56px 20px 40px; }
      .flow-grid { grid-template-columns: 1fr; }
      .flow-step {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 28px 16px;
      }
      .flow-step:last-child { border-bottom: none; }
    }

    /* === Landing pricing block === */
    .landing-pricing {
      padding: 80px 24px 40px;
    }
    .landing-pricing-inner { max-width: 1080px; margin: 0 auto; }
    .landing-pricing-head { text-align: center; max-width: 640px; margin: 0 auto 56px; }
    .landing-pricing-head h2 {
      font-family: var(--serif); font-weight: 600;
      font-size: clamp(32px, 4vw, 48px);
      letter-spacing: -0.025em; margin: 0 0 12px;
    }
    .landing-pricing-head p {
      color: var(--text-muted); font-size: 17px;
      line-height: 1.55; margin: 0;
    }
    .plan-card-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 22px;
      max-width: 880px; margin: 0 auto;
    }
    .plan-card {
      background: var(--card); border: 1px solid var(--border-strong);
      border-radius: 18px; padding: 32px;
      box-shadow: 0 12px 32px -16px rgba(40, 30, 20, 0.15);
      display: flex; flex-direction: column;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .plan-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 56px -22px rgba(40, 30, 20, 0.25);
    }
    .plan-card-pro {
      background: linear-gradient(180deg, var(--card), var(--tinted));
      border-color: var(--accent);
      border-width: 1.5px;
    }
    .plan-card-badge {
      position: absolute; top: -12px; right: 24px;
      background: var(--accent); color: white;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; padding: 4px 12px; border-radius: 999px;
      box-shadow: 0 4px 12px -3px rgba(201, 133, 88, 0.4);
    }
    .plan-card-name {
      font-size: 13px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--text-muted); margin-bottom: 6px;
    }
    .plan-card-pro .plan-card-name { color: var(--accent); }
    .plan-card-price { margin-bottom: 12px; }
    .plan-card-price .amt {
      font-family: var(--serif); font-weight: 600;
      font-size: 48px; letter-spacing: -0.03em; line-height: 1;
      color: var(--text);
    }
    .plan-card-price .suf {
      font-size: 16px; color: var(--text-muted);
      margin-left: 4px;
    }
    .plan-card-blurb {
      color: var(--text-muted); font-size: 14px; line-height: 1.5;
      margin: 0 0 24px;
    }
    .plan-card-cta {
      width: 100%; padding: 12px;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-size: 14px;
    }
    .plan-card-cta .icon { transition: transform 0.2s; }
    .plan-card-cta:hover .icon { transform: translateX(3px); }
    .plan-card-list {
      list-style: none; padding: 0; margin: 28px 0 0;
      font-size: 14px;
    }
    .plan-card-list li {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0; color: var(--text);
    }
    .plan-card-list li.excluded {
      color: var(--text-muted); text-decoration: line-through;
      text-decoration-color: rgba(0,0,0,0.15);
    }
    .plan-tick {
      display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--tinted); color: var(--primary);
      flex-shrink: 0; font-size: 12px;
    }
    .plan-card-pro .plan-tick { background: var(--accent); color: white; }
    li.excluded .plan-tick {
      background: var(--card); color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .plan-fineprint {
      max-width: 640px; margin: 36px auto 0;
      text-align: center; font-size: 13px; color: var(--text-muted);
      line-height: 1.6;
    }
    @media (max-width: 720px) {
      .plan-card-row { grid-template-columns: 1fr; }
      .landing-pricing { padding: 56px 20px 24px; }
    }

    /* === Screenshot-style beat visuals === */
    .scrn-frame {
      width: 100%; max-width: 480px;
      background: var(--card); border: 1px solid var(--border-strong);
      border-radius: 14px; overflow: hidden;
      box-shadow: 0 30px 70px -22px rgba(40, 30, 20, 0.32),
                  0 12px 28px -10px rgba(40, 30, 20, 0.18);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .scrn-frame:hover { transform: translateY(-4px); }
    .scrn-bar {
      background: #efeae0; padding: 9px 14px;
      display: flex; align-items: center; gap: 14px;
      border-bottom: 1px solid var(--border);
    }
    .scrn-dots { display: flex; gap: 5px; }
    .scrn-dots span { width: 9px; height: 9px; border-radius: 50%; background: #d8d2c5; }
    .scrn-dots span:nth-child(1) { background: #f08580; }
    .scrn-dots span:nth-child(2) { background: #f0c374; }
    .scrn-dots span:nth-child(3) { background: #80c97e; }
    .scrn-url {
      flex: 1; text-align: center; font-size: 11px;
      color: var(--text-muted); letter-spacing: 0.02em;
      font-family: ui-monospace, monospace;
    }
    .scrn-body { background: var(--bg); }

    .scrn-app { font-family: 'Inter', sans-serif; }
    .scrn-topbar {
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      background: var(--card);
      display: flex; justify-content: space-between; align-items: center;
    }
    .scrn-brand {
      font-family: var(--serif); font-size: 14px; font-weight: 600;
      letter-spacing: -0.02em;
    }
    .scrn-userpill {
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--primary); color: white;
      font-size: 11px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
    }
    .scrn-nav {
      padding: 0 16px; border-bottom: 1px solid var(--border);
      display: flex; gap: 16px; background: var(--card);
      overflow-x: auto;
    }
    .scrn-tab {
      padding: 8px 0; font-size: 11px; color: var(--text-muted);
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .scrn-tab.on {
      color: var(--text); font-weight: 600;
      border-bottom-color: var(--primary);
    }
    .scrn-page { padding: 14px 16px 18px; }
    .scrn-pageheader {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .scrn-pageheader h4 {
      font-family: var(--serif); font-size: 16px;
      margin: 0; letter-spacing: -0.02em;
    }
    .scrn-pill {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; padding: 2px 8px; border-radius: 999px;
      background: #f4ddd0; color: #8c4e30;
    }
    .scrn-pill-good { background: #e0eedd; color: #2f6b46; }
    .scrn-card {

    .scrn-note-label {
      display: block; font-size: 9px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--accent); margin-bottom: 4px;

    .scrn-note span:not(.scrn-note-label) {
      font-size: 12px; color: var(--text); font-style: italic;
      line-height: 1.4;
    }

    /* Signup screenshot */

    .scrn-brand-row {
      font-family: var(--serif); font-size: 14px; font-weight: 600;
      letter-spacing: -0.02em; margin-bottom: 14px;
      color: var(--text);
    }
    .scrn-signup-h {
      font-family: var(--serif); font-size: 18px;
      margin: 0 0 4px; letter-spacing: -0.02em; font-weight: 600;
    }
    .scrn-signup-sub {
      margin: 0 0 16px; font-size: 12px; color: var(--text-muted);
    }
    .scrn-field { margin-bottom: 8px; }
    .scrn-label {
      display: block; font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-muted); margin-bottom: 4px;
    }
    .scrn-input {
      display: block; padding: 8px 10px; background: var(--card);
      border: 1px solid var(--border); border-radius: 6px;
      font-size: 12px; color: var(--text); font-family: ui-monospace, monospace;
    }
    .scrn-cta {
      margin-top: 12px; padding: 10px;
      background: var(--primary); color: white; text-align: center;
      border-radius: 8px; font-size: 13px; font-weight: 600;
    }
    .scrn-fineprint {
      margin-top: 8px; font-size: 11px; color: var(--text-muted);
      text-align: center;
    }

    /* Modules screenshot */
    .scrn-subnav {
      display: flex; gap: 6px; margin-bottom: 10px;
      font-size: 11px;
    }
    .scrn-subnav span {
      padding: 4px 10px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text-muted); font-weight: 500;
    }
    .scrn-subnav span.on {
      background: var(--primary); color: white; border-color: var(--primary);
      font-weight: 600;
    }
    .scrn-mod-row {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 8px 10px; margin-bottom: 5px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 8px;
    }
    .scrn-mod-toggle {
      width: 28px; height: 16px; background: #d8d2c5;
      border-radius: 999px; position: relative;
      flex-shrink: 0; margin-top: 2px;
      transition: background 0.2s;
    }
    .scrn-mod-toggle.on { background: var(--primary); }
    .scrn-mod-knob {
      position: absolute; top: 2px; left: 2px;
      width: 12px; height: 12px; background: white; border-radius: 50%;
      transition: left 0.2s;
    }
    .scrn-mod-toggle.on .scrn-mod-knob { left: 14px; }
    .scrn-mod-text { flex: 1; }
    .scrn-mod-label {
      font-size: 12px; font-weight: 600; color: var(--text);
      display: flex; align-items: center; gap: 6px;
    }
    .scrn-mod-off-pill {
      font-size: 8px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; padding: 1px 5px; border-radius: 4px;
      background: var(--tinted); color: var(--text-muted);
    }
    .scrn-mod-sub {
      font-size: 10px; color: var(--text-muted); margin-top: 1px;
      line-height: 1.4;
    }

    .visual-price {
      width: 100%; max-width: 360px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .vp-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 16px; background: var(--card);
      border: 1px solid var(--border); border-radius: 10px;
      font-size: 14px; font-weight: 500;
    }
    .vp-row.vp-dim { color: var(--text-muted); }
    .vp-row.vp-dim .vp-price { font-family: var(--serif); }
    .vp-highlight {
      background: linear-gradient(to right, var(--tinted), var(--card));
      border: 1.5px solid var(--accent); position: relative;
    }
    .vp-highlight .vp-name { font-weight: 700; color: var(--text); }
    .vp-highlight .vp-price {
      font-family: var(--serif); font-weight: 600;
      color: var(--accent); font-size: 18px; letter-spacing: -0.02em;
    }
    .vp-free .vp-price { color: var(--primary); }

    .visual-modules { display: flex; flex-wrap: wrap; gap: 8px; max-width: 420px; }
    .vm-pill {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 12px; border-radius: 999px;
      font-size: 13px; font-weight: 600;
      border: 1px solid var(--border);
      background: var(--card); color: var(--text-muted);
      transition: all 0.25s;
    }
    .vm-pill.on {
      background: var(--tinted); color: var(--text);
      border-color: var(--accent);
    }
    .vm-pill.on .vm-tick { color: var(--accent); }
    .vm-pill.off { opacity: 0.55; }
    .vm-pill.off .vm-tick { color: var(--text-muted); }
    .vm-pill.locked {
      background: var(--text); color: var(--bg);
      border-color: var(--text);
    }
    .vm-pill.locked .vm-tick { color: var(--accent); }
    .vm-tag {
      font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text-muted); font-weight: 600;
      margin-left: 2px;
    }
    .vm-pill.locked .vm-tag { color: var(--bg); opacity: 0.6; }

    /* Marquee — scrolling industry strip at the bottom of hero */
    .hero-marquee {
      margin: 48px -40px 0;
      padding: 18px 0;
      overflow: hidden;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: var(--card);
      -webkit-mask-image: linear-gradient(to right, transparent, black 6%, black 94%, transparent);
              mask-image: linear-gradient(to right, transparent, black 6%, black 94%, transparent);
    }
    .marquee-track {
      display: flex; gap: 28px;
      width: max-content;
      animation: marqueeScroll 50s linear infinite;
    }
    .marquee-item {
      display: inline-flex; align-items: center; gap: 14px;
      font-size: 15px; font-weight: 600; color: var(--text);
      white-space: nowrap;
    }
    .marquee-dot {
      color: var(--accent); font-size: 8px;
    }
    @keyframes marqueeScroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    @media (max-width: 720px) {
      .hero-marquee { margin-left: -20px; margin-right: -20px; }
    }

    @media (max-width: 860px) {
      .hero-orb { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hero-orb { animation: none; }
    }
    .landing-hero .eyebrow {
      display: inline-block; padding: 5px 14px;
      background: var(--card); border: 1px solid var(--border-strong);
      border-radius: 999px; font-size: 12px; color: var(--text-muted);
      font-weight: 600; margin-bottom: 28px;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .landing-hero h1 {
      /* Tuned so the longest cycle phrase ('pool service business',
         21 chars) fits on one line at every viewport from a 320px
         phone up through the hero's 1020px content max on desktop. */
      font-size: clamp(30px, 7.8vw, 96px);
      line-height: 0.98; letter-spacing: -0.045em; margin: 0 0 28px;
      font-weight: 800;
    }
    .landing-hero .lede {
      font-size: 20px; color: var(--text-muted); line-height: 1.5; margin: 0 0 40px;
      max-width: 620px; margin-left: auto; margin-right: auto;
    }
    .landing-hero .cta-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .landing-hero .cta-row button.primary {
      padding: 14px 28px; font-size: 15px; gap: 8px;
      display: inline-flex; align-items: center;
      position: relative; overflow: visible;
      transition: background 0.25s, transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .landing-hero .cta-row button.primary::after {
      content: ''; position: absolute; inset: 0;
      border-radius: inherit; pointer-events: none;
      box-shadow: 0 0 0 0 rgba(201, 133, 88, 0); transition: box-shadow 0.4s;
    }
    .landing-hero .cta-row button.primary .icon { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .landing-hero .cta-row button.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px -8px rgba(201, 133, 88, 0.42),
                  0 4px 10px -4px rgba(40, 30, 20, 0.15);
    }
    .landing-hero .cta-row button.primary:hover .icon { transform: translateX(4px); }
    .landing-hero .cta-row button.secondary { padding: 14px 28px; font-size: 15px; }

    .features-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px; padding: 60px 0;
    }
    .feature-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 32px 28px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.3s;
      position: relative; overflow: hidden;
    }
    .feature-card::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(circle at var(--mx, 50%) var(--my, 0%), rgba(201, 133, 88, 0.08), transparent 60%);
      opacity: 0; transition: opacity 0.3s;
    }
    .feature-card:hover {
      transform: translateY(-5px) rotate(-0.4deg);
      box-shadow: 0 14px 32px -10px rgba(40, 30, 20, 0.18),
                  0 6px 16px -6px rgba(40, 30, 20, 0.12);
      border-color: var(--border-strong);
    }
    .feature-card:nth-child(even):hover { transform: translateY(-5px) rotate(0.4deg); }
    .feature-card:nth-child(3n):hover  { transform: translateY(-5px) rotate(-0.6deg); }
    .feature-card:hover::before { opacity: 1; }
    .feature-card .feature-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; border-radius: 12px;
      background: var(--tinted); color: var(--primary);
      margin-bottom: 18px; font-size: 20px;
      transition: background 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  color 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .feature-card .feature-icon .icon {
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .feature-card:hover .feature-icon {
      background: var(--primary); color: white;
      transform: rotate(-5deg) scale(1.05);
    }
    .feature-card:hover .feature-icon .icon { transform: scale(1.1); }
    .feature-card:nth-child(even):hover .feature-icon { transform: rotate(5deg) scale(1.05); }
    .feature-card h3 { margin: 0 0 12px; font-size: 18px; line-height: 1.2; position: relative; }
    .feature-card p { margin: 0; color: var(--text-muted); font-size: 14px; line-height: 1.6; position: relative; }

    .section-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--text-muted); font-weight: 600; margin-bottom: 14px;
      font-family: 'Inter', sans-serif;
    }
    .section-title-large {
      font-size: clamp(34px, 5vw, 52px);
      line-height: 1.05; letter-spacing: -0.02em;
      margin: 0 0 16px; max-width: 900px;
    }
    .section-lede-large {
      font-size: 17px; color: var(--text-muted); line-height: 1.55;
      max-width: 600px; margin: 0 0 48px;
    }

    .how-band {
      background: var(--tinted);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 80px 40px;
      margin: 60px 0;
    }
    .how-inner {
      max-width: 1100px; margin: 0 auto;
      display: grid; grid-template-columns: 280px 1fr; gap: 80px;
      align-items: start;
    }
    .how-left .section-label { text-align: left; margin-bottom: 18px; }
    .how-left h2 {
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.1; letter-spacing: -0.02em;
      margin: 0 0 16px; font-weight: 600;
    }
    .how-left p {
      margin: 0; color: var(--text-muted);
      font-size: 14.5px; line-height: 1.6;
    }
    .steps {
      display: flex; flex-direction: column;
    }
    .step {
      position: relative;
      display: grid; grid-template-columns: 64px 1fr;
      gap: 28px; align-items: start;
      padding: 24px 0;
      border-bottom: 1px solid var(--border);
    }
    .step:last-child { border-bottom: none; }
    .step-num {
      font-family: var(--serif);
      font-size: 44px; line-height: 1; font-weight: 400;
      color: var(--text-muted); opacity: 0.55;
      letter-spacing: -0.02em;
    }
    .step h3 { margin: 8px 0 6px; font-size: 17px; line-height: 1.3; font-weight: 600; }
    .step p { margin: 0; color: var(--text-muted); font-size: 14.5px; line-height: 1.6; max-width: 520px; }

    .quote-section {
      padding: 80px 40px; text-align: center;
      max-width: 760px; margin: 0 auto;
    }
    .quote-section blockquote {
      font-family: var(--serif); font-style: italic;
      font-size: 26px; line-height: 1.4; letter-spacing: -0.01em;
      margin: 0 0 24px; color: var(--text);
    }
    .quote-section cite {
      font-style: normal; font-size: 13px; color: var(--text-muted);
      display: block; letter-spacing: 0.02em;
    }
    .quote-section cite strong { color: var(--text); font-weight: 600; }

    .divider-fancy {
      max-width: 100px; margin: 0 auto;
      border: none; border-top: 1px solid var(--border-strong);
      position: relative; overflow: visible;
    }
    .divider-fancy::after {
      content: '◆'; position: absolute; left: 50%; top: -10px;
      transform: translateX(-50%);
      background: var(--bg); padding: 0 8px;
      color: var(--accent); font-size: 10px;
    }

    @media (max-width: 860px) {
      .how-inner { grid-template-columns: 1fr; gap: 40px; }
      .how-band { padding: 56px 24px; margin: 40px 0; }
    }
    @media (max-width: 720px) {
      .section-title-large { font-size: 28px; }
      .quote-section { padding: 50px 24px; }
      .quote-section blockquote { font-size: 22px; }
      .step { grid-template-columns: 48px 1fr; gap: 18px; padding: 20px 0; }
      .step-num { font-size: 36px; }
    }

    .industries {
      padding: 60px 0; text-align: center;
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    }
    .industries h2 {
      font-size: clamp(28px, 4vw, 42px); margin: 0 0 14px;
      letter-spacing: -0.02em; line-height: 1.1;
      max-width: 760px; margin-left: auto; margin-right: auto;
    }
    .industries .lede { color: var(--text-muted); margin: 0 0 36px; font-size: 15px; }
    .industries-row {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
    }
    .industry-chip {
      padding: 10px 18px; background: var(--card); border: 1px solid var(--border-strong);
      border-radius: 999px; font-size: 14px; font-weight: 500;
    }

    .pricing { padding: 100px 0 40px; text-align: center; }
    .pricing h2 {
      font-size: clamp(28px, 4vw, 42px); margin: 0 0 14px;
      letter-spacing: -0.02em; line-height: 1.1;
    }
    .pricing .lede { color: var(--text-muted); margin: 0 0 40px; font-size: 15px; }
    .price-card {
      max-width: 460px; margin: 0 auto;
      background: var(--card); border: 1px solid var(--border-strong);
      border-radius: 20px; padding: 44px 40px;
      box-shadow: var(--shadow-lg);
      position: relative; overflow: hidden;
    }

      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(to right, var(--primary), var(--accent));
    }
    .price-card .amount {
      font-family: var(--serif);
      font-size: 64px; font-weight: 600; letter-spacing: -0.03em; line-height: 1;
    }
    .price-card .amount-suffix { color: var(--text-muted); font-size: 16px; font-weight: 500; }
    .price-card .trial-hint {
      color: var(--text-muted); font-size: 14px; margin: 14px 0 24px;
    }
    .price-card ul {
      list-style: none; padding: 0; margin: 24px 0;
      text-align: left; font-size: 14px;
    }
    .price-card li { padding: 6px 0; }
    .price-card li::before {
      content: '✓'; color: var(--primary); font-weight: 600; margin-right: 10px;
    }
    .price-card button.primary { width: 100%; padding: 14px; font-size: 15px; margin-top: 4px; }
    .price-card .fineprint { color: var(--text-muted); font-size: 12px; margin-top: 14px; }

    .cta-band {
      padding: 80px 40px; text-align: center;
      background: var(--card); border-radius: 16px; margin: 60px auto;
      max-width: 760px; box-shadow: var(--shadow-sm);
    }
    .cta-band h2 {
      font-size: clamp(28px, 4vw, 40px); margin: 0 0 14px;
      letter-spacing: -0.02em; line-height: 1.1;
    }
    .cta-band p { color: var(--text-muted); margin: 0 0 24px; font-size: 15px; }

    .landing-footer {
      padding: 40px; text-align: center; color: var(--text-muted); font-size: 13px;
      border-top: 1px solid var(--border); margin-top: 40px;

      color: var(--text-muted); text-decoration: none;

      max-width: 980px; margin: 0 auto;
      padding: 96px 32px 64px; text-align: center;
    }
    .sales-hero-badge {
      display: inline-block;
      background: color-mix(in srgb, var(--accent) 14%, transparent);
      color: var(--accent); font-weight: 600; font-size: 13px;
      padding: 8px 16px; border-radius: 999px; margin-bottom: 28px;
      letter-spacing: 0.01em;

    .sales-hero-headline {
      font-family: var(--serif); font-weight: 500;
      font-size: clamp(40px, 6vw, 76px);
      line-height: 1.04; letter-spacing: -0.035em;
      margin: 0 0 24px; color: var(--text);
    }
    .sales-hero-headline em {
      font-style: italic; color: var(--accent); font-weight: 500;
    }
    .sales-hero-sub {

      color: var(--text-muted); max-width: 680px; margin: 0 auto 32px;

    .sales-hero-actions {
      display: flex; gap: 16px; justify-content: center; align-items: center;
      flex-wrap: wrap; margin-bottom: 20px;
    }
    .sales-hero-trust {
      font-size: 13px; color: var(--text-muted); margin: 0;
    }
    .sales-cta {
      background: var(--text); color: var(--bg);
      border: none; border-radius: 999px;
      padding: 14px 26px; font-size: 15px; font-weight: 600;
      cursor: pointer; font-family: inherit;

    .sales-cta-secondary {

      color: var(--text);
      border-radius: 999px;

      cursor: pointer; font-family: inherit;
      transition: background 0.15s, transform 0.2s;

    .sales-cta-secondary:hover { background: var(--tinted); transform: translateY(-1px); }

    .sales-section {
      max-width: 1100px; margin: 0 auto;
      padding: 80px 32px;

const GLYPH_ICONS = { invoices: '$' };

function Icon({ name }) {
  const glyph = GLYPH_ICONS[name];
  if (glyph) {

// The header's identity, and whether the name needs saying twice.
//
// A wordmark is the account's name written the way its owner writes it, so
// printing the same words beside it said everything twice — and on a phone the
// second copy was clipped half way through saying it. A symbol is not a name,
// though, and dropping the text next to one leaves a small coloured square
// alone in the header. So ask the logo which it is: its own proportions are
// the tell, since words are wide and marks are not.
//
// Nothing is printed until the image has reported those proportions, which is
// why 'pending' exists — rendering the name first and retracting it once the
// logo loads would flash the duplicate we are trying to avoid.
//
// With no logo, or one that fails to load, the name stands alone. There used
// to be a coloured initials tile in that case; it read as a placeholder for a
// logo the account did not have, which is not a thing a header should say.
const WORDMARK_RATIO = 2.5;

function Brand({ orgName, logo, onClick }) {
  const [shape, setShape] = useState('pending');
  const imgRef = useRef(null);

  const measure = (el) => {
    const { naturalWidth: w, naturalHeight: h } = el;
    setShape(w && h && w / h >= WORDMARK_RATIO ? 'wordmark' : 'symbol');
  };

  // An image served from cache can finish loading before React has a load
  // handler on it, and then onLoad never fires — the name stayed hidden
  // behind a 'pending' that nothing would resolve. So after mount, and
  // whenever the logo changes, ask the element directly.
  useEffect(() => {
    setShape('pending');
    const el = imgRef.current;
    if (el && el.complete && el.naturalWidth) measure(el);
  }, [logo]);

  const failed = shape === 'failed';
  const useLogo = logo && !failed;
  const showName = !useLogo || shape === 'symbol';
  return (
    <button
      type="button"
      className="brand brand-button"
      onClick={onClick}
      title="Refresh"
      aria-label="Refresh app"
    >
      {useLogo && (
        <span className="brand-mark is-logo">
          <img ref={imgRef} src={logo} alt={orgName} onLoad={(e) => measure(e.target)} onError={() => setShape('failed')} />
        </span>
      )}
      {showName && <span className="brand-name">{orgName}</span>}
    </button>
  );
}

function useLocation() {
  const [path, setPath] = useState(() => window.location.pathname);
  useEffect(() => {
    const onPop = () => setPath(window.location.pathname);
    window.addEventListener('popstate', onPop);
    return () => window.removeEventListener('popstate', onPop);
  }, []);
  return path;
}

function navigate(to, opts = {}) {
  if (window.location.pathname === to && !opts.force) return;
  // A new screen starts at its top. Without this the scroll position carried
  // over from the last screen, and with a sticky header on the phone the new
  // page's title opened hidden underneath it. Only when the path changes: a
  // view or filter that rewrites the query on the same page keeps its place,
  // and Back is the browser's own, so it restores where you were.
  const leaving = to.split('?')[0] !== window.location.pathname;
  if (opts.replace) {
    window.history.replaceState({}, '', to);
  } else {
    window.history.pushState({}, '', to);
  }
  window.dispatchEvent(new PopStateEvent('popstate'));
  if (leaving) window.scrollTo(0, 0);
}

async function apiRequest(path, { method = 'GET', body, slug, token } = {}) {
  const headers = { 'Content-Type': 'application/json' };
  if (slug) headers['x-organization-slug'] = slug;
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const res = await fetch(path, {
    method, headers,
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 204) return null;
  const isJson = (res.headers.get('content-type') || '').includes('application/json');
  const data = isJson ? await res.json() : await res.text();
  if (!res.ok) {
    // A session the server no longer accepts cannot be recovered by retrying,
    // and leaving it in place means every screen renders "Invalid or expired
    // token" over a shell you are still apparently signed in to. Sign out.
    if (data && data.code === 'session_invalid') expireSession();
    const err = new Error((data && data.error) || `Request failed (${res.status})`);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

// Screens fire several requests at once, so the first dead one wins and the
// rest are ignored — otherwise a page load triggers six redirects.
const AUTH_PATHS = ['/signin', '/signup', '/forgot', '/reset', '/accept-invite', '/demo'];
let sessionExpiring = false;
function expireSession() {
  if (sessionExpiring) return;
  // Nothing to end, so nothing to do. This is the guard that matters: the
  // organization middleware answers a wrong slug with the same code, and on
  // the sign-in form that is a typo to report, not a session to throw away.
  if (!localStorage.getItem(STORAGE.token)) return;
  // Signed in but sitting on an auth screen — switching accounts, say — a bad
  // slug there should surface as an error, not sign you out of what you have.
  if (AUTH_PATHS.some((p) => window.location.pathname.startsWith(p))) return;
  sessionExpiring = true;
  clearSession();
  // A full load rather than a re-render: every view still holding data fetched
  // under the old session goes away with the document.
  window.location.replace('/signin?expired=1');
}

function customerDisplayName(c) {
  if (!c) return '';
  if (c.business_name) return c.business_name;
  const parts = [c.first_name, c.last_name].filter(Boolean).join(' ').trim();
  return parts || '(unnamed)';
}

// Splits "1 Industrial Parkway, Building C, North Las Vegas, NV 89030" into the
// street line and the city line. Only the "<City>, <ST> <ZIP>" shape is split —
// anything else (a PO box, a rural route, an address from outside the US) is
// left exactly as typed rather than guessed at and broken in the wrong place.
function addressLines(address) {
  const raw = String(address || '').trim();
  if (!raw) return [];
  if (/[\n\r]/.test(raw)) {
    return raw.split(/[\n\r]+/).map((l) => l.trim()).filter(Boolean);
  }
  const parts = raw.split(',').map((x) => x.trim()).filter(Boolean);
  if (parts.length >= 2 && /^[A-Za-z]{2}\.?\s+\d{5}(-\d{4})?$/.test(parts[parts.length - 1])) {
    const cityLine = parts.slice(-2).join(', ');
    const streetLine = parts.slice(0, -2).join(', ');
    return streetLine ? [streetLine, cityLine] : [cityLine];
  }
  return [raw];
}

function jobCustomerName(j) {
  if (j.customer_business_name) return j.customer_business_name;
  const parts = [j.customer_first_name, j.customer_last_name].filter(Boolean).join(' ').trim();
  return parts || '(unnamed)';
}

function formatDateShort(str) {
  if (!str) return '';
  const [y, mo, d] = str.split('-').map(Number);
  return new Date(y, mo - 1, d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function formatDateString(s) {
  const d = parseDate(s);
  if (!d) return '';
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

function dayOfWeekName(s) {
  const d = parseDate(s);
  if (!d) return '';
  return DAY_NAMES[d.getDay()];
}

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

const FILTER_RANGES = {
  today: () => {
    const t = formatYMD(todayStart());
    return { start: t, end: t };
  },
  week: () => {
    const t = todayStart();
    return { start: formatYMD(t), end: formatYMD(addDays(t, 6)) };
  },
  past: () => {
    const t = todayStart();
    return { start: formatYMD(addDays(t, -90)), end: formatYMD(addDays(t, -1)), onlyOpen: true };
  },
};

function expandJobsToOccurrences(jobs, filter) {
  const range = FILTER_RANGES[filter] && FILTER_RANGES[filter]();
  if (!range) return null;
  const occurrences = jobs.flatMap((j) => jobOccurrencesInRange(j, range.start, range.end));
  const filtered = range.onlyOpen ? occurrences.filter((o) => !o.completed) : occurrences;
  return filtered.sort((a, b) => a.date.localeCompare(b.date));
}

function lastCompletion(job) {
  // completed_dates is the source of truth; migrated/older visits have no note
  // entry, so keying off completion_notes alone mislabels them "Not started".
  const dates = [
    ...(Array.isArray(job.completed_dates) ? job.completed_dates : []),
    ...(Array.isArray(job.completion_notes) ? job.completion_notes.map((n) => n.date) : []),
  ];
  if (dates.length === 0) return null;
  const lastDate = dates.reduce((m, d) => (d > m ? d : m));
  const note = (job.completion_notes || []).find((n) => n.date === lastDate);
  return { date: lastDate, completedByName: note ? note.completedByName : null };
}

function formatSchedule(j) {
  const timeRange = formatTimeRange(j.start_time, j.duration_minutes);
  const timeSuffix = timeRange ? ` · ${timeRange}` : '';
  if (j.type === 'single') return formatDateString(j.date) + timeSuffix;
  if (j.type === 'recurring') {
    const start = formatDateString(j.start_date);
    const end = j.end_date ? ` until ${formatDateString(j.end_date)}` : '';
    if (j.recurrence_pattern === 'weekly') {
      return `Every ${dayOfWeekName(j.start_date)} starting ${start}${end}${timeSuffix}`;
    }
    if (j.recurrence_pattern === 'biweekly') {
      return `Every other ${dayOfWeekName(j.start_date)} starting ${start}${end}${timeSuffix}`;
    }
    if (j.recurrence_pattern === 'monthly') {
      const d = parseDate(j.start_date);
      return `Monthly on the ${ordinal(d.getDate())} starting ${start}${end}${timeSuffix}`;
    }
  }
  return '';
}

// Short cadence label — the chip form of formatSchedule, without dates.
function jobCadenceLabel(j) {
  if (j.type === 'single') return 'One-time';
  if (j.type === 'recurring') {
    const day = dayOfWeekName(j.start_date);
    if (j.recurrence_pattern === 'weekly') return `Every ${day}`;
    if (j.recurrence_pattern === 'biweekly') return `Every other ${day}`;
    if (j.recurrence_pattern === 'monthly') return `Monthly · ${ordinal(parseDate(j.start_date).getDate())}`;
  }
  return '';
}

// "Jun 27" — compact month/day; accepts a YYYY-MM-DD string or a Date.
function formatShortDate(d) {
  const date = typeof d === 'string' ? parseDate(d) : d;
  if (!date || isNaN(date)) return '';
  return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

// "Colton Pfeifer" -> "CP", "Samantha" -> "SA".
function nameInitials(name) {
  const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

// Stable avatar color hashed from a seed (user id), so a person keeps the
// same color across rows.
const AVATAR_PALETTE = ['#b07a4f', '#6b8e9e', '#7a9471', '#9e7a8e', '#8a7fae', '#a8894f', '#5f8a7d'];
function avatarColor(seed) {
  const s = String(seed || '');
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return AVATAR_PALETTE[h % AVATAR_PALETTE.length];
}

function formatTimeOfDay(hhmm) {
  if (!hhmm) return '';
  const s = String(hhmm);
  const m = s.match(/^(\d{2}):(\d{2})/);
  if (!m) return '';
  const h = parseInt(m[1], 10);
  const min = m[2];
  const period = h >= 12 ? 'PM' : 'AM';
  const display = h === 0 ? 12 : h > 12 ? h - 12 : h;
  return `${display}:${min} ${period}`;
}

function addMinutesToTime(hhmm, minsToAdd) {
  if (!hhmm) return null;
  const m = String(hhmm).match(/^(\d{2}):(\d{2})/);
  if (!m) return null;
  const total = parseInt(m[1], 10) * 60 + parseInt(m[2], 10) + (parseInt(minsToAdd, 10) || 0);
  const wrapped = ((total % (24 * 60)) + 24 * 60) % (24 * 60);
  const h = Math.floor(wrapped / 60);
  const mm = wrapped % 60;
  return `${String(h).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}

function formatDuration(mins) {
  const n = parseInt(mins, 10);
  if (!Number.isFinite(n) || n <= 0) return '';
  const h = Math.floor(n / 60);
  const m = n % 60;
  if (h === 0) return `${m}m`;
  if (m === 0) return `${h}h`;
  return `${h}h ${m}m`;
}

function formatTimeRange(startTime, durationMinutes) {
  if (!startTime) return '';
  const start = formatTimeOfDay(startTime);
  const mins = parseInt(durationMinutes, 10);
  if (!Number.isFinite(mins) || mins <= 0) return start;
  const endTime = addMinutesToTime(startTime, mins);
  return `${start} – ${formatTimeOfDay(endTime)}`;
}

// Append the invoice amount to a generic Pay-now URL when we recognize
// the provider's query-string convention. Falls back to the raw URL for
// anything we don't know.
function buildPayLink(rawUrl, total, invoiceNumber) {
  if (!rawUrl) return rawUrl;
  const amountUSD = (Math.round(total * 100) / 100).toFixed(2);
  const amountCents = Math.round(total * 100);
  try {
    const u = new URL(rawUrl);
    const host = u.hostname.toLowerCase();
    // Stripe Payment Links accept prefilled_amount (in the smallest currency
    // unit, e.g. cents) when the link was created with "Customer chooses amount."
    if (host === 'buy.stripe.com' || host.endsWith('.stripe.com')) {
      u.searchParams.set('prefilled_amount', String(amountCents));
      return u.toString();
    }
    // PayPal.me/USERNAME/AMOUNT pre-fills the amount in their flow.
    if (host === 'paypal.me' || host === 'www.paypal.me') {
      const parts = u.pathname.split('/').filter(Boolean);
      // Only append if the URL is /handle (1 segment) with no amount yet.
      if (parts.length === 1) {
        u.pathname = `/${parts[0]}/${amountUSD}`;
        return u.toString();
      }
    }
    // Square invoice links and others — leave untouched.
  } catch (e) {
    // Not a valid URL — return as-is, the browser will error on click.
  }
  return rawUrl;
}

function formatPrice(p) {
  if (p === null || p === undefined || p === '') return '';
  const n = typeof p === 'string' ? parseFloat(p) : p;
  if (!isFinite(n)) return '';
  return `$${n.toFixed(2)}`;
}

function SignupForm({ onSuccess }) {
  const [orgName, setOrgName] = useState('');
