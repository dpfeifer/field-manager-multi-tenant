// Which set of install steps to show. iPadOS reports itself as a Mac, hence
// the touch-points check.
function installDevice() {
  const ua = navigator.userAgent || '';
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) return 'installed';
  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'ios';
  if (/Android/.test(ua)) return 'android';
  return 'desktop';
}

function OnboardingInstall() {
  const [device] = useState(installDevice);
  const [showAll, setShowAll] = useState(false);
  const [installed, setInstalled] = useState(false);
  // Chrome hands over a one-tap installer when it judges the page installable;
  // index.html catches the event at boot, because it fires once and early.
  const canPrompt = !!window.__fmInstallPrompt && !installed;
  async function promptInstall() {
    const ev = window.__fmInstallPrompt;
    if (!ev) return;
    ev.prompt();
    const choice = await ev.userChoice.catch(() => null);
    window.__fmInstallPrompt = null;
    if (choice && choice.outcome === 'accepted') setInstalled(true);
  }
  const ios = (
    <ol className="ob-steps">
      <li>Tap the <strong>Share</strong> button in Safari</li>
      <li>Scroll to <strong>Add to Home Screen</strong></li>
      <li>Tap <strong>Add</strong></li>
    </ol>
  );
  const android = (
    <ol className="ob-steps">
      <li>Tap the <strong>three-dot menu</strong> in Chrome</li>
      <li>Tap <strong>Add to Home screen</strong> or <strong>Install app</strong></li>
      <li>Tap <strong>Add</strong></li>
    </ol>
  );
  const desktop = (
    <p className="ob-note" style={{ margin: 0 }}>
      On a computer, bookmark this page — or use the install icon at the end of the address bar. Then open <strong>fieldmgr.com</strong> on your phone and sign in: same account, same data.
    </p>
  );
  return (
    <>
      <p className="subtitle">
        There is nothing to download. It runs in the browser on your phone, your tablet and the laptop in the truck, and it is always up to date. On a phone, put it on your home screen and it opens full screen, like any other app.
      </p>
      {(device === 'installed' || installed) && <div className="ob-panel"><strong>You are already running it from your home screen.</strong> Nothing more to do.</div>}
      {device !== 'installed' && !installed && (
        <div className="ob-panel">
          {canPrompt
            ? <button type="button" className="primary" onClick={promptInstall}>Install Field Manager</button>
            : (device === 'ios' ? ios : device === 'android' ? android : desktop)}
        </div>
      )}
      {!showAll
        ? <button type="button" className="link-btn ob-more" onClick={() => setShowAll(true)}>Using a different device?</button>
        : (
          <div className="ob-alldevices">
            {device !== 'ios' && <div className="ob-panel"><div className="ob-panel-h">iPhone &middot; Safari</div>{ios}</div>}
            {device !== 'android' && <div className="ob-panel"><div className="ob-panel-h">Android &middot; Chrome</div>{android}</div>}
            {device !== 'desktop' && <div className="ob-panel"><div className="ob-panel-h">Computer</div>{desktop}</div>}
          </div>
        )}
    </>
  );
}

function OnboardingPage({ session, onDone }) {
  const STEPS = ['trade', 'setup', 'customers', 'install'];
  const [step, setStep] = useState('trade');
  const [trade, setTrade] = useState(null);
  const [features, setFeatures] = useState({ invoices: true, quotes: true, reports: true, team: false, requests: true, referrals: false });
  const [words, setWords] = useState(['Customer', 'Customers', 'Job', 'Jobs']);
  const [editWords, setEditWords] = useState(false);
  const [start, setStart] = useState('add');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);

  const stepIndex = STEPS.indexOf(step);
  function go(delta) {
    const next = STEPS[stepIndex + delta];
    if (next) { setError(null); setStep(next); window.scrollTo(0, 0); }
  }
  function pickTrade(t) {
    setTrade(t.key);
    setWords(t.words);
    setFeatures({ invoices: false, quotes: false, reports: false, team: false, requests: false, referrals: false,
      ...Object.fromEntries(t.on.map((k) => [k, true])) });
  }
  const setWord = (i, v) => setWords((w) => w.map((x, k) => (k === i ? v : x)));
  const tradeLabel = (ONBOARDING_TRADES.find((t) => t.key === trade) || {}).label;
  const lower = (s) => (s || '').toLowerCase();

  async function finish() {
    setBusy(true); setError(null);
    try {
      await apiRequest('/api/onboarding/complete', {
        method: 'POST', slug: session.slug, token: session.token,
        body: {
          trade, features,
          terminology: { customer_label: words[0], customer_label_plural: words[1], job_label: words[2], job_label_plural: words[3] },
        },
      });
      if (start === 'send') {
        // Through the support inbox, so it reaches a person with the account
        // attached. A failure here must not strand them in the wizard.
        await apiRequest('/api/support', {
          method: 'POST', slug: session.slug, token: session.token,
          body: {
            category: 'Question', context: 'onboarding',
            subject: `Please load my ${lower(words[1])} for me`,
            message: `I picked "send you my list" during setup. Please reply and tell me where to send my ${lower(words[0])} list — a spreadsheet, an export from another app, or photos of a notebook.`,
          },
        }).catch(() => {});
      }
      await onDone();
      if (start === 'add') navigate('/customers?new=1');
      else if (start === 'import') navigate('/customers?import=1');
    } catch (err) { setError(err.message); setBusy(false); }
  }

  const head = (title, sub) => (
    <>
      <div className="ob-progress" role="progressbar" aria-valuemin={1} aria-valuemax={STEPS.length} aria-valuenow={stepIndex + 1} aria-label={`Step ${stepIndex + 1} of ${STEPS.length}`}>
        {STEPS.map((s, i) => <span key={s} className={i <= stepIndex ? 'on' : ''} />)}
      </div>
      <h1 className="ob-title">{title}</h1>
      {sub && <p className="subtitle ob-sub">{sub}</p>}
    </>
  );
  const foot = (primary) => (
    <div className="ob-foot">
      {stepIndex > 0 ? <button type="button" className="secondary" disabled={busy} onClick={() => go(-1)}>&larr; Back</button> : <span />}
      {primary}
    </div>
  );

  return (
    <div className="auth-shell ob-shell">
      <div className="card ob-card">
        {step === 'trade' && (
          <>
            {head(`Welcome to ${session.organization.name}.`, 'What kind of work do you do? We will set the app up to match — you can change any of it.')}
            <div className="ob-tiles" role="radiogroup" aria-label="Kind of work">
              {ONBOARDING_TRADES.map((t) => (
                <button key={t.key} type="button" role="radio" aria-checked={trade === t.key}
                  className={`ob-tile${trade === t.key ? ' on' : ''}`} onClick={() => pickTrade(t)}>
                  <span className="ob-tile-l">{t.label}</span>
                  <span className="ob-tile-h">{t.hint}</span>
                </button>
              ))}
            </div>
            {foot(<button type="button" className="primary" disabled={!trade} onClick={() => go(1)}>Continue &rarr;</button>)}
          </>
        )}

        {step === 'setup' && (
          <>
            {head(trade === 'other' ? 'Here is what we set up.' : `Set up for ${lower(tradeLabel)}.`,
              `Your dashboard, calendar and ${lower(words[0])} book are always on. These are the extras — switch off what you will not use, and turn it back on any time in Settings.`)}
            <div className="ob-sections">
              {ONBOARDING_SECTIONS.map(([key, label, desc]) => (
                <label key={key} className={`ob-section${features[key] ? ' on' : ''}`}>
                  <input type="checkbox" checked={!!features[key]} onChange={() => setFeatures((f) => ({ ...f, [key]: !f[key] }))} />
                  <span className="ob-section-l">{label}</span>
                  <span className="ob-section-d">{desc}</span>
                </label>
              ))}
            </div>
            <div className="ob-words">
              {!editWords ? (
                <p>
                  We will call them <strong>{lower(words[1])}</strong> and <strong>{lower(words[3])}</strong>.{' '}
                  <button type="button" className="link-btn" onClick={() => setEditWords(true)}>Change the wording</button>
                </p>
              ) : (
                <div className="ob-words-grid">
                  {['One customer', 'Several', 'One job', 'Several'].map((l, i) => (
                    <div key={i}>
                      <label htmlFor={`ob-word-${i}`}>{l}</label>
                      <input id={`ob-word-${i}`} value={words[i]} maxLength={30} onChange={(e) => setWord(i, e.target.value)} />
                    </div>
                  ))}
                </div>
              )}
            </div>
            {foot(<button type="button" className="primary" onClick={() => go(1)}>Continue &rarr;</button>)}
          </>
        )}

        {step === 'customers' && (
          <>
            {head(`Get your ${lower(words[1])} in.`, 'The app is empty until they are. Pick how you would like to start — this is where you land when setup finishes.')}
            <div className="ob-choices" role="radiogroup" aria-label="How to start">
              {[
                ['add', `Add my first ${lower(words[0])}`, 'Name and a phone number is enough. Takes a minute.'],
                ['import', 'Import a spreadsheet', 'Paste or upload a CSV from Excel, Google Sheets or another app.'],
                ['send', 'Send you my list — free', 'A spreadsheet, an export, even photos of a notebook. We load it for you, usually the same day.'],
                ['later', 'I will do it later', 'Go to the dashboard and look around first.'],
              ].map(([key, label, desc]) => (
                <button key={key} type="button" role="radio" aria-checked={start === key}
                  className={`ob-choice${start === key ? ' on' : ''}`} onClick={() => setStart(key)}>
                  <span className="ob-choice-dot" aria-hidden="true" />
                  <span><span className="ob-choice-l">{label}</span><span className="ob-choice-d">{desc}</span></span>
                </button>
              ))}
            </div>
            {foot(<button type="button" className="primary" onClick={() => go(1)}>Continue &rarr;</button>)}
          </>
        )}

        {step === 'install' && (
          <>
            {head('Put it on your home screen.')}
            <OnboardingInstall />
            {error && <div className="error" style={{ marginTop: 16 }}>{error}</div>}
            {foot(<button type="button" className="primary" disabled={busy} onClick={finish}>{busy ? 'Finishing...' : 'Finish setup'}</button>)}
          </>
        )}
      </div>
    </div>
  );
}

  const [error, setError] = useState(null);

        method: 'PUT', slug: session.slug, token: session.token, body: { name },
      });
      onSessionUpdate({ ...session, user: { ...session.user, name: updated.name } });
      setSuccess('Name updated.');
    } catch (err) { setError(err.message); }
    finally { setNameBusy(false); }
  }

  async function saveEmail(e) {
    e.preventDefault();
    setError(null); setSuccess(null);
    if (!emailPassword) { setError('Enter your current password to confirm the email change.'); return; }
    setEmailBusy(true);
    try {
      const updated = await apiRequest('/api/auth/me', {
        method: 'PUT', slug: session.slug, token: session.token,
        body: { email, current_password: emailPassword },
      });
      onSessionUpdate({ ...session, user: { ...session.user, email: updated.email } });
      setEmailPassword('');
      setSuccess('Email updated.');
    } catch (err) { setError(err.message); }
    finally { setEmailBusy(false); }
  }

  async function changePassword(e) {
    e.preventDefault();
    setError(null); setSuccess(null);
    if (newPassword !== confirmPassword) {
      setError('New passwords do not match.');
      return;
    }
    setPwBusy(true);
    try {
      await apiRequest('/api/auth/me', {
        method: 'PUT', slug: session.slug, token: session.token,
        body: { current_password: currentPassword, new_password: newPassword },
      });
      setCurrentPassword(''); setNewPassword(''); setConfirmPassword('');
      setSuccess('Password changed.');
    } catch (err) { setError(err.message); }
    finally { setPwBusy(false); }
  }

  return (
    <div>
      <div className="page-header">
        <h2>Profile</h2>
      </div>
      {error && <div className="error">{error}</div>}
      {success && <div className="error" style={{ background: '#e8f1ec', color: '#1f6f4a' }}>{success}</div>}

      <div className="form-card">
        <div className="section-heading" style={{ marginTop: 0 }}>Account</div>
        <form onSubmit={saveName}>
          <label>Name</label>
          <input value={name} onChange={(e) => setName(e.target.value)} />
          <label>Role</label>
          <input value={session.user.role} disabled />
          <label>Organization</label>
          <input value={`${session.organization.name} (${session.organization.slug})`} disabled />
          <div className="form-actions">
            <button type="submit" className="primary" disabled={nameBusy}>
              {nameBusy ? 'Saving...' : 'Save name'}
            </button>
          </div>
        </form>
      </div>

      <div className="form-card">
        <div className="section-heading" style={{ marginTop: 0 }}>Change email</div>
        <form onSubmit={saveEmail}>
          <label>Email</label>
          <input
            type="email"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            required
          />
          <label>Current password <span className="hint">(confirms it's you)</span></label>
          <input
            type="password"
            value={emailPassword}
            onChange={(e) => setEmailPassword(e.target.value)}
            autoComplete="current-password"
            required={email !== session.user.email}
            disabled={email === session.user.email}
          />
          <div className="form-actions">
            <button type="submit" className="primary" disabled={emailBusy || email === session.user.email}>
              {emailBusy ? 'Saving...' : 'Save email'}
            </button>
          </div>
        </form>
      </div>

      <div className="form-card">
        <div className="section-heading" style={{ marginTop: 0 }}>Change password</div>
        <form onSubmit={changePassword}>
          <label>Current password</label>
          <input type="password" value={currentPassword} onChange={(e) => setCurrentPassword(e.target.value)} required />
          <label>New password <span className="hint">(at least 8 characters)</span></label>
          <input type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} required />
          <label>Confirm new password</label>
          <input type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} required />
          <div className="form-actions">
            <button type="submit" className="primary" disabled={pwBusy}>
              {pwBusy ? 'Saving...' : 'Change password'}
            </button>
          </div>
        </form>
      </div>

      <div className="form-card">
        <div className="section-heading" style={{ marginTop: 0 }}>Appearance</div>
        <label>Theme</label>
        <div className="toggle-group">
          <button type="button" className={theme === 'light' ? 'active' : ''} onClick={() => changeTheme('light')}>Light</button>
          <button type="button" className={theme === 'dark' ? 'active' : ''} onClick={() => changeTheme('dark')}>Dark</button>
        </div>
      </div>

      <div className="form-card">
        <div className="section-heading" style={{ marginTop: 0 }}>Install on your home screen</div>
        <InstallInstructions />
      </div>
    </div>
  );
}

function SupportView({ session }) {
  const [subject, setSubject] = useState('');
  const [category, setCategory] = useState('Question');
  const [message, setMessage] = useState('');
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [done, setDone] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setBusy(true); setError(null);
    try {
      // Pass the previous path as "context" so the support team knows where
      // the user was before they clicked Help & Support.
      const ctx = (typeof document !== 'undefined' && document.referrer) || '';
      await apiRequest('/api/support', {
        method: 'POST', slug: session.slug, token: session.token,
        body: { subject, category, message, context: ctx },
      });
      setDone(true);
      setSubject(''); setMessage(''); setCategory('Question');
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  return (
    <div>
      <div className="page-header"><h2>Help &amp; support</h2></div>

      {done && (
        <div className="form-card" style={{ background: 'var(--tinted)', borderColor: 'var(--primary)' }}>
          <div className="section-heading" style={{ marginTop: 0 }}>Thanks — we got it.</div>
          <p style={{ margin: 0, color: 'var(--text-muted)' }}>
            We'll get back to you usually within a day. If it's urgent, send another note marked <em>Bug</em> or <em>Billing</em>.
          </p>
          <div className="form-actions" style={{ marginTop: 16 }}>
            <button className="secondary" onClick={() => setDone(false)}>Send another</button>
          </div>
        </div>
      )}

      {!done && (
        <form className="form-card" onSubmit={submit}>
          <p className="subtitle" style={{ marginTop: 0, marginBottom: 16 }}>
            Question, bug, or feature request — drop it here and a human will get back to you, usually within a day.
          </p>

          <label>What's it about?</label>
          <select value={category} onChange={(e) => setCategory(e.target.value)}>
            <option value="Question">Question</option>
            <option value="Bug">Bug</option>
            <option value="Feature request">Feature request</option>
            <option value="Billing">Billing</option>
            <option value="Other">Other</option>
          </select>

          <label>Subject</label>
          <input
            value={subject}
            onChange={(e) => setSubject(e.target.value)}
            placeholder="One-line summary"
            maxLength={200}
            required
          />

          <label>Message</label>
          <textarea
            value={message}
            onChange={(e) => setMessage(e.target.value)}
            rows={8}
            placeholder="What's going on? The more detail the better — including what you were doing, what you expected, and what actually happened."
            maxLength={5000}
            required
          />

          {error && <div className="error">{error}</div>}

          <div className="form-actions" style={{ marginTop: 16 }}>
            <button type="submit" className="primary" disabled={busy || !subject.trim() || !message.trim()}>
              {busy ? 'Sending...' : 'Send to support'}
            </button>
          </div>
        </form>
      )}
    </div>
  );
}

// What each role can actually do, read off the server's own gating: job
// completion is deliberately ungated so crew can close out work, everything
// structural is requireRole('admin', 'lead'), and reports/team/billing/
// settings are admin-only.
//
// One list because the invite form and the role editor had already drifted:
// invite claimed "Lead — no invoicing" while leads have always had the full
// invoice lifecycle (create, send, apply credit, mark paid, delete), and the
// role editor explained nothing at all.
const ROLE_OPTIONS = [
  { value: 'employee', label: 'Employee', summary: 'Sees the schedule, marks visits complete, adds customer notes.' },
  { value: 'lead', label: 'Lead', summary: 'Everything above, plus creating and editing work, customers, invoices and quotes.' },
  { value: 'admin', label: 'Admin', summary: 'Everything, plus reports, team, billing and settings.' },
];

function RoleSelect({ value, onChange, disabled, style }) {
  return (
    <select value={value} onChange={(e) => onChange(e.target.value)} disabled={disabled} style={style}>
      {ROLE_OPTIONS.map((r) => (
        <option key={r.value} value={r.value}>{r.label}</option>
      ))}
    </select>
  );
}

// Stated once above the list rather than under every dropdown. Three panels
// side by side, so the roles read as a progression — each one is the previous
// plus more — which a stacked list obscured. The badges are the same ones each
// row shows for its role, tying the key to the list beneath it.
function RoleLegend() {
  return (
    <div className="role-legend">
      {ROLE_OPTIONS.map((r) => (
        <div key={r.value} className="role-legend-item">
          <span className="badge">{r.label}</span>
          <span>{r.summary}</span>
        </div>
      ))}
    </div>
  );
}

function TeamView({ session }) {
  const wideActions = useMediaQuery('(min-width: 681px)');
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [mode, setMode] = useState('list');
  const [busy, setBusy] = useState(false);
  const [editingRoleId, setEditingRoleId] = useState(null);
  const [resettingId, setResettingId] = useState(null);
  const [resetPassword, setResetPassword] = useState('');
  const [resetSuccess, setResetSuccess] = useState(null);
  const [resendingId, setResendingId] = useState(null);
  const [resendSuccess, setResendSuccess] = useState(null);
  const [composeOpen, setComposeOpen] = useState(false);

  const refresh = useCallback(async () => {
    setLoading(true); setError(null);
    try {
      const data = await apiRequest('/api/auth/users', { slug: session.slug, token: session.token });
      setUsers(data);
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  }, [session.slug, session.token]);

  useEffect(() => { refresh(); }, [refresh]);

  async function inviteUser(values) {
    setBusy(true); setError(null);
    try {
      await apiRequest('/api/auth/register', {
        method: 'POST', slug: session.slug, token: session.token, body: values,
      });
      setMode('list');
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  async function changeRole(userId, newRole) {
    setError(null);
    try {
      await apiRequest(`/api/auth/users/${userId}`, {
        method: 'PUT', slug: session.slug, token: session.token, body: { role: newRole },
      });
      setEditingRoleId(null);
      await refresh();
    } catch (err) { setError(err.message); }
  }

  async function deleteUser(userId, displayName) {
    if (!confirm(`Remove ${displayName} from the team?`)) return;
    setError(null);
    try {
      await apiRequest(`/api/auth/users/${userId}`, {
        method: 'DELETE', slug: session.slug, token: session.token,
      });
      await refresh();
    } catch (err) { setError(err.message); }
  }

  async function resendInvite(userId, displayName) {
    setError(null); setResetSuccess(null); setResendSuccess(null);
    setResendingId(userId);
    try {
      await apiRequest(`/api/auth/users/${userId}/resend-invite`, {
        method: 'POST', slug: session.slug, token: session.token,
      });
      setResendSuccess(`Invite resent to ${displayName}.`);
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setResendingId(null); }
  }

  async function submitResetPassword(userId) {
    setError(null); setResetSuccess(null);
    try {
      await apiRequest(`/api/auth/users/${userId}/reset-password`, {
        method: 'POST', slug: session.slug, token: session.token,
        body: { new_password: resetPassword },
      });
      setResettingId(null); setResetPassword('');
      setResetSuccess('Password reset. Share the new password with your teammate.');
    } catch (err) { setError(err.message); }
  }

  if (mode === 'invite') {
    return (
      <div>
        <div className="page-header"><h2>Invite teammate</h2></div>
        {error && <div className="error">{error}</div>}
        <RoleLegend />
        <div className="form-card">
          <InviteForm
            onSubmit={inviteUser}
            onCancel={() => { setError(null); setMode('list'); }}
            busy={busy}
          />
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="page-header">
        <h2>Team</h2>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <button className="secondary" onClick={() => setComposeOpen(true)}>+ Send a team note</button>
          <button className="primary" onClick={() => { setError(null); setMode('invite'); }}>+ Invite teammate</button>
        </div>
      </div>
      {error && <div className="error">{error}</div>}
      {resetSuccess && (
        <div className="error" style={{ background: '#e8f1ec', color: '#1f6f4a' }}>{resetSuccess}</div>
      )}
      {resendSuccess && (
        <div className="error" style={{ background: '#e8f1ec', color: '#1f6f4a' }}>{resendSuccess}</div>
      )}
      <RoleLegend />
      <div className="list">
        {loading ? (
          <div className="list-empty">Loading...</div>
        ) : users.length === 0 ? (
          <div className="list-empty">No teammates yet.</div>
        ) : (
          users.map((u) => {
            const isMe = u.id === session.user.id;
            const displayName = u.name || u.email;
            const isResetting = resettingId === u.id;
            return (
              <div key={u.id} className="row team-row">
                <div className="team-id">
                  <span className="team-avatar" style={{ background: avatarColor(u.id) }} aria-hidden="true">{nameInitials(displayName || u.email)}</span>
                  <div className="info">
                  <div className="name">
                    {displayName}{isMe && <span className="hint" style={{ marginLeft: 8 }}>(you)</span>}
                    {u.invite_pending && (
                      <span className="status-pill status-pending" style={{ marginLeft: 10 }}>Invite pending</span>
                    )}
                  </div>
                  <div className="meta">{u.email}</div>
                  {/* On a phone the role reads as a third line of who this
                      person is, under their address. A pill out at the edge
                      was a label floating away from what it labels. */}
                  {!wideActions && editingRoleId !== u.id && (
                    <div className="meta team-role-text">{u.role}</div>
                  )}
                  {isResetting && (
                    <div className="secondary-meta" style={{ marginTop: 8 }}>
                      <input
                        type="password"
                        placeholder="New password"
                        value={resetPassword}
                        onChange={(e) => setResetPassword(e.target.value)}
                        style={{ width: 260, marginRight: 8 }}
                      />
                      <button className="primary" onClick={() => submitResetPassword(u.id)} disabled={!resetPassword}>Set password</button>
                      <button className="secondary" onClick={() => { setResettingId(null); setResetPassword(''); }} style={{ marginLeft: 6 }}>Cancel</button>
                    </div>
                  )}
                  </div>
                </div>
                <div className="team-role">
                  {editingRoleId === u.id ? (
                    <>
                      <RoleSelect
                        value={u.role}
                        onChange={(next) => changeRole(u.id, next)}
                        style={{ width: 'auto', padding: '7px 10px', fontSize: 13 }}
                      />
                      <button className="secondary" onClick={() => setEditingRoleId(null)}>Cancel</button>
                    </>
                  ) : (
                    <span className="badge">{u.role}</span>
                  )}
                </div>
                {!isMe && editingRoleId !== u.id && !isResetting && (
                  <div className="actions">
                    {wideActions ? (
                      <>
                        {u.invite_pending && (
                          <button
                            className="secondary"
                            disabled={resendingId === u.id}
                            onClick={() => resendInvite(u.id, displayName)}
                          >
                            {resendingId === u.id ? 'Sending...' : 'Resend invite'}
                          </button>
                        )}
                        <button className="secondary" onClick={() => { setResettingId(u.id); setResetPassword(''); setResetSuccess(null); }}>Reset password</button>
                        <button className="secondary" onClick={() => setEditingRoleId(u.id)}>Change role</button>
                        <button className="danger" onClick={() => deleteUser(u.id, displayName)}>Remove</button>
                      </>
                    ) : (
                      /* Four buttons never fit a phone, and the sideways
                         scroller that held them asked for a swipe to reach
                         Remove. Same menu the lists use. */
                      <RowMenu
                        label={`Actions for ${displayName}`}
                        items={[
                          u.invite_pending && {
                            label: resendingId === u.id ? 'Sending...' : 'Resend invite',
                            onClick: () => resendInvite(u.id, displayName),
                          },
                          { label: 'Reset password', onClick: () => { setResettingId(u.id); setResetPassword(''); setResetSuccess(null); } },
                          { label: 'Change role', onClick: () => setEditingRoleId(u.id) },
                          { label: 'Remove', danger: true, onClick: () => deleteUser(u.id, displayName) },
                        ]}
                      />
                    )}
                  </div>
                )}
              </div>
            );
          })
        )}
      </div>
      <TeamNoteCompose
        session={session}
        open={composeOpen}
        onClose={() => setComposeOpen(false)}
      />
    </div>
  );
}

function StaffManagementSection({ token, currentUserId }) {
  const [staff, setStaff] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [mode, setMode] = useState('list');
  const [newEmail, setNewEmail] = useState('');
  const [newName, setNewName] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [busy, setBusy] = useState(false);

  const refresh = useCallback(async () => {
    setLoading(true); setError(null);
    try {
      const data = await apiRequest('/api/system/admins', { token });
      setStaff(data);
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  }, [token]);

  useEffect(() => { refresh(); }, [refresh]);

  async function addStaff(e) {
    e.preventDefault();
    setBusy(true); setError(null);
    try {
      await apiRequest('/api/system/admins', {
        method: 'POST', token,
        body: { email: newEmail, password: newPassword, name: newName || null },
      });
      setNewEmail(''); setNewName(''); setNewPassword('');
      setMode('list');
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  async function deleteStaff(id, name) {
    if (!confirm(`Revoke staff access for ${name}?`)) return;
    setError(null);
    try {
      await apiRequest(`/api/system/admins/${id}`, { method: 'DELETE', token });
      await refresh();
    } catch (err) { setError(err.message); }
  }

  return (
    <>
      <div className="section-heading" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span>Staff accounts</span>
        {mode === 'list' && (
          <button className="secondary" style={{ fontSize: 12, padding: '4px 10px' }} onClick={() => setMode('create')}>+ Add staff</button>
        )}
      </div>
      {error && <div className="error">{error}</div>}
      {mode === 'create' && (
        <form onSubmit={addStaff} className="form-card">
          <div className="form-grid">
            <div className="full">
              <label>Email</label>
              <input type="email" value={newEmail} onChange={(e) => setNewEmail(e.target.value)} required />
            </div>
            <div>
              <label>Name <span className="hint">(optional)</span></label>
              <input value={newName} onChange={(e) => setNewName(e.target.value)} />
            </div>
            <div>
              <label>Temp password <span className="hint">(complexity required)</span></label>
              <input type="password" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} required />
            </div>
          </div>
          <div className="form-actions">
            <button type="submit" className="primary" disabled={busy}>{busy ? 'Creating...' : 'Create staff account'}</button>
            <button type="button" className="secondary" onClick={() => setMode('list')} disabled={busy}>Cancel</button>
          </div>
        </form>
      )}
      <div className="list">
        {loading ? (
          <div className="list-empty">Loading...</div>
        ) : staff.length === 0 ? (
          <div className="list-empty">No dedicated staff yet. Add one to give a teammate platform access without an org login.</div>
        ) : (
          staff.map((s) => {
            const isMe = currentUserId === s.id;
            return (
              <div key={s.id} className="row">
                <div className="info">
                  <div className="name">{s.name || s.email}{isMe && <span className="hint" style={{ marginLeft: 8 }}>(you)</span>}</div>
                  <div className="meta">{s.email} • Added {formatDateString(s.created_at.split('T')[0])}</div>
                </div>
                {!isMe && (
                  <div className="actions">
                    <button className="danger" onClick={() => deleteStaff(s.id, s.name || s.email)}>Revoke</button>
                  </div>
                )}
              </div>
            );
          })
        )}
      </div>
    </>
  );
}

    : path === '/system/overview' ? 'overview'
    : path === '/system/funnel' ? 'funnel'

  return (
    <div>
      <div className="page-header">
        <h2>System</h2>
        <span className="badge">{isStaff ? 'Staff' : 'System admin'}</span>
      </div>
      {/* Watching the funnel is a different activity from editing an email
          template. A single chip row could not say so; a rail can. */}
      <TwoPane
        ariaLabel="System sections"
        deepLinked={path !== '/system'}
        active={subView}
        onSelect={(key) => navigate(SYSTEM_ROUTES[key])}
        sections={[
          { key: 'overview', label: 'Overview', icon: 'activity', group: 'Watch' },
          { key: 'funnel', label: 'Funnel', icon: 'funnel', group: 'Watch' },

function SiteSettingsSection({ token }) {
  const [data, setData] = useState(null);
  const [coupon, setCoupon] = useState('');
  const [seats, setSeats] = useState(10);
  const [founderPrice, setFounderPrice] = useState(19);
  const [listedPrice, setListedPrice] = useState(29);
  const [pixelId, setPixelId] = useState('');
  const [ga4Id, setGa4Id] = useState('');
  const [loading, setLoading] = useState(true);
  const [busy, setBusy] = useState(false);
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState(null);

  async function refresh() {
    setLoading(true); setError(null);
    try {
      const d = await apiRequest('/api/system/site-settings', { token });
      setData(d);
      setCoupon(d.stripe_founder_coupon_id || '');
      setSeats(d.founder_total_seats);
      setFounderPrice(d.founder_price);
      setListedPrice(d.listed_price);
      setPixelId(d.meta_pixel_id || '');
      setGa4Id(d.ga4_measurement_id || '');
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  }
  useEffect(() => { refresh(); }, []);

  async function save(e) {
    e.preventDefault();
    setBusy(true); setError(null); setSaved(false);
    try {
      await apiRequest('/api/system/site-settings', {
        method: 'PUT', token,
        body: {
          stripe_founder_coupon_id: coupon,
          founder_total_seats: seats,
          founder_price: founderPrice,
          listed_price: listedPrice,
          meta_pixel_id: pixelId,

      await refresh();
      setTimeout(() => setSaved(false), 2000);

    finally { setBusy(false); }

        <p className="hint" style={{ marginTop: 0 }}>

        <label>Stripe coupon ID</label>
        <input

        />
        <span className="hint" style={{ display: 'block', marginTop: 6 }}>

function OrganizationsSection({ session }) {

  const [error, setError] = useState(null);
  const [search, setSearch] = useState('');
  const [sort, setSort] = useState('newest');
  const [includeDemo, setIncludeDemo] = useState(false);

  const refresh = useCallback(async () => {
    setLoading(true); setError(null);
    try {
      const path = '/api/system/organizations' + (includeDemo ? '?include_demo=1' : '');
      const data = await apiRequest(path, { token: session.token });
      setOrgs(data);
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  }, [session.token, includeDemo]);

  useEffect(() => { refresh(); }, [refresh]);

  const filtered = orgs.filter((o) => searchMatches(search, o.name, o.slug, o.subscription_status));
  const activationSteps = (o) =>
    (o.onboarding_completed_at ? 1 : 0) + (o.customer_count > 0 ? 1 : 0)
    + (o.job_count > 0 ? 1 : 0) + (o.invoice_count > 0 ? 1 : 0);
  const sortKey = sort === 'name' ? (o) => (o.name || '').toLowerCase()
    : sort === 'status' ? 'subscription_status'
    : sort === 'users' ? (o) => -o.user_count
    // Least-activated first; newest breaks ties so fresh stalls surface.
    : sort === 'activation' ? (o) => activationSteps(o) * 1e15 - new Date(o.created_at).getTime()
    : 'created_at';
  const sorted = sortBy(filtered, sortKey, sort === 'oldest' ? 'asc' : sort === 'name' || sort === 'status' || sort === 'activation' ? 'asc' : 'desc');

  return (
    <>
      {error && <div className="error">{error}</div>}
      <div className="search-bar" style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
        <input
          type="search" value={search} onChange={(e) => setSearch(e.target.value)}

        />
        <select value={sort} onChange={(e) => setSort(e.target.value)} style={{ width: 'auto' }}>
          <option value="newest">Sort: Newest</option>
          <option value="oldest">Sort: Oldest</option>
          <option value="name">Sort: Name</option>
          <option value="status">Sort: Status</option>
          <option value="users">Sort: Most users</option>
          <option value="activation">Sort: Least activated</option>
        </select>
        <label style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 13, color: 'var(--text-muted)', whiteSpace: 'nowrap' }}>
          <input type="checkbox" checked={includeDemo} onChange={(e) => setIncludeDemo(e.target.checked)} />
          Show demos
        </label>
      </div>
      <div className="list">
        {loading ? (
          <div className="list-empty">Loading...</div>
        ) : sorted.length === 0 ? (
          <div className="list-empty">{orgs.length === 0 ? 'No organizations.' : 'No orgs match this search.'}</div>
        ) : (
          sorted.map((o) => (
            <div key={o.id} className="row">
              <div className="info">
                <div className="name">
                  {o.name}
                  <span className={`badge ${badgeForStatus(o.subscription_status)}`} style={{ marginLeft: 10 }}>
                    {statusLabel(o.subscription_status, o.trial_ends_at)}

                </div>

                </div>
                <div className="secondary-meta">
                  {o.user_count} {o.user_count === 1 ? 'user' : 'users'} •
                  {' '}{o.customer_count} {o.customer_count === 1 ? 'customer' : 'customers'} •
                  {' '}{o.job_count} {o.job_count === 1 ? 'job' : 'jobs'} •
                  {' '}{o.invoice_count} {o.invoice_count === 1 ? 'invoice' : 'invoices'} •

// Cloudinary direct-from-browser image upload. Gets a signed upload
// signature from our backend (system-admin only), then POSTs the file
// straight to Cloudinary and returns the secure_url via onChange.
// Sign via our backend, upload the file straight to Cloudinary, and return
// the hosted secure_url. Shared by the hero uploader and the multi-file
// gallery uploader.
async function uploadToCloudinary(token, file, endpoint, slug) {
  const opts = { method: 'POST', token };
  if (slug) opts.slug = slug;
  const sig = await apiRequest(endpoint || '/api/system/upload-signature', opts);
  const fd = new FormData();
  fd.append('file', file);
  fd.append('api_key', sig.api_key);
  fd.append('timestamp', sig.timestamp);
  fd.append('folder', sig.folder);
  fd.append('signature', sig.signature);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${sig.cloud_name}/image/upload`, { method: 'POST', body: fd });
  const out = await res.json();
  if (!res.ok || !out.secure_url) throw new Error((out.error && out.error.message) || 'Upload failed');
  return out.secure_url;
}

function ImageUpload({ token, value, onChange, label, endpoint, slug }) {
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  async function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setBusy(true); setErr(null);
    try {
      onChange(await uploadToCloudinary(token, file, endpoint, slug));
    } catch (er) {
      setErr(er.message);
    } finally {
      setBusy(false);
      e.target.value = '';
    }
  }

  return (
    <div className="img-upload">
      {value && (
        <div className="img-upload-preview">
          <img src={value} alt="" />
          <button type="button" className="link-button" onClick={() => onChange('')}>Remove</button>
        </div>
      )}
      <label className="img-upload-btn">
        {busy ? 'Uploading…' : (value ? 'Replace image' : (label || 'Upload image'))}
        <input type="file" accept="image/*" onChange={handleFile} disabled={busy} style={{ display: 'none' }} />
      </label>
      {err && <div className="error" style={{ marginTop: 6 }}>{err}</div>}
    </div>
  );
}

// Landing-page editor, shared by the staff org-detail view (system endpoints)
// and the tenant Settings page (settings endpoints). Endpoints/auth are
// passed in via saveUrl / uploadEndpoint / apiSlug.
function LandingPageEditor({ slug, token, initial, saveUrl, uploadEndpoint, apiSlug }) {
  const [cfg, setCfg] = useState(() => landingInit(initial));
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [saved, setSaved] = useState(false);
  const [galleryBusy, setGalleryBusy] = useState(null);
  const [galleryErr, setGalleryErr] = useState(null);

  function set(patch) { setCfg((c) => ({ ...c, ...patch })); setSaved(false); }
  function removeGallery(i) { setCfg((c) => ({ ...c, gallery: c.gallery.filter((_, idx) => idx !== i) })); setSaved(false); }
  function appendGallery(items) { setCfg((c) => ({ ...c, gallery: [...c.gallery, ...items] })); setSaved(false); }
  async function handleGalleryFiles(e) {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (files.length === 0) return;
    setGalleryErr(null);
    const uploaded = [];
    try {
      for (let i = 0; i < files.length; i++) {
        setGalleryBusy(`Uploading ${i + 1}/${files.length}…`);
        uploaded.push({ url: await uploadToCloudinary(token, files[i], uploadEndpoint, apiSlug), caption: '' });
      }
    } catch (er) {
      setGalleryErr(er.message);
    } finally {
      if (uploaded.length) appendGallery(uploaded);
      setGalleryBusy(null);
    }
  }
  function setService(i, patch) { set({ services: cfg.services.map((s, idx) => (idx === i ? { ...s, ...patch } : s)) }); }
  function addService() { set({ services: [...cfg.services, { name: '', price: '', description: '' }] }); }
  function removeService(i) { set({ services: cfg.services.filter((_, idx) => idx !== i) }); }
  function moveService(i, dir) {
    const j = i + dir;
    if (j < 0 || j >= cfg.services.length) return;
    const next = cfg.services.slice();
    [next[i], next[j]] = [next[j], next[i]];
    set({ services: next });
  }
  function setTestimonial(i, patch) { set({ testimonials: cfg.testimonials.map((t, idx) => (idx === i ? { ...t, ...patch } : t)) }); }
  function addTestimonial() { set({ testimonials: [...cfg.testimonials, { quote: '', author: '', rating: 5 }] }); }
  function removeTestimonial(i) { set({ testimonials: cfg.testimonials.filter((_, idx) => idx !== i) }); }
  function setSocial(key, value) { set({ socials: { ...cfg.socials, [key]: value } }); }

  async function save() {
    setBusy(true); setError(null);
    try {
      await apiRequest(saveUrl, { method: 'PUT', token, slug: apiSlug, body: cfg });
      setSaved(true);
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  return (
    <div className="form-card lp-editor">
      <div className="section-heading" style={{ marginTop: 0, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span>Landing page</span>
        <a href={`/${slug}`} target="_blank" rel="noopener noreferrer" style={{ fontSize: 13, fontWeight: 500 }}>View page ↗</a>
      </div>

      <label style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
        <input type="checkbox" checked={cfg.enabled} onChange={(e) => set({ enabled: e.target.checked })} />
        Page is live at <code>/{slug}</code>
      </label>
      <p className="hint" style={{ marginTop: 4 }}>When off, visitors to /{slug} see a "not found" page.</p>

      <label>Tagline</label>
      <p className="hint" style={{ margin: '0 0 12px' }}>
        Set under <strong>Your public details</strong>, so it prints on invoices too. It shows here under your name.
      </p>

      <div className="section-heading">Style</div>
      <label>Accent color <span className="hint">(buttons, image frame, tagline — defaults to terracotta)</span></label>
      <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
        <input type="color" value={cfg.accent_color || '#c98558'} onChange={(e) => set({ accent_color: e.target.value })} style={{ width: 48, height: 38, padding: 2, cursor: 'pointer' }} />
        <input value={cfg.accent_color} onChange={(e) => set({ accent_color: e.target.value })} placeholder="#c98558" style={{ width: 120 }} />
        {cfg.accent_color && <button type="button" className="link-button" onClick={() => set({ accent_color: '' })}>Reset</button>}
      </div>
      <label style={{ marginTop: 16 }}>Background color <span className="hint">(solid color behind the hero — overrides the pattern)</span></label>
      <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
        <input type="color" value={cfg.background_color || '#f7f4ec'} onChange={(e) => set({ background_color: e.target.value })} style={{ width: 48, height: 38, padding: 2, cursor: 'pointer' }} />
        <input value={cfg.background_color} onChange={(e) => set({ background_color: e.target.value })} placeholder="#f7f4ec" style={{ width: 120 }} />
        {cfg.background_color && <button type="button" className="link-button" onClick={() => set({ background_color: '' })}>Reset</button>}
      </div>
      <label style={{ marginTop: 16 }}>Background pattern <span className="hint">(tiled behind the hero — used only when no background color is set)</span></label>
      <ImageUpload token={token} endpoint={uploadEndpoint} slug={apiSlug} value={cfg.background_image_url} onChange={(url) => set({ background_image_url: url })} label="Upload pattern" />

      <div className="section-heading">Hero</div>
      <label>Hero image</label>
      <ImageUpload token={token} endpoint={uploadEndpoint} slug={apiSlug} value={cfg.hero_image_url} onChange={(url) => set({ hero_image_url: url })} label="Upload hero image" />
      <label>Headline</label>
      <input value={cfg.hero_title} onChange={(e) => set({ hero_title: e.target.value })} placeholder="Sharp cuts. Quiet chair." />
      <label>Subhead</label>
      <textarea rows={2} value={cfg.hero_subtitle} onChange={(e) => set({ hero_subtitle: e.target.value })} placeholder="By appointment only — a private barber serving…" />

      <div className="section-heading">Gallery</div>
      <p className="hint" style={{ marginTop: 0 }}>Photos for the swiper below the hero. Select several at once.</p>
      <div className="lp-thumb-grid">
        {cfg.gallery.map((g, i) => (
          <div key={i} className="lp-thumb">
            <img src={g.url} alt="" />
            <button type="button" className="lp-thumb-x" onClick={() => removeGallery(i)} aria-label="Remove photo">×</button>
          </div>
        ))}
        <label className="lp-thumb lp-thumb-add">
          <span>{galleryBusy || '+ Add photos'}</span>
          <input type="file" accept="image/*" multiple onChange={handleGalleryFiles} disabled={!!galleryBusy} style={{ display: 'none' }} />
        </label>
      </div>
      {galleryErr && <div className="error" style={{ marginTop: 6 }}>{galleryErr}</div>}

      <div className="section-heading">Services</div>
      {cfg.services.map((s, i) => (
        <div key={i} className="lp-editor-service">
          <div className="lp-editor-service-top">
            <input value={s.name} onChange={(e) => setService(i, { name: e.target.value })} placeholder="Service name (e.g. Full Cut)" style={{ flex: 2 }} />
            <input value={s.price} onChange={(e) => setService(i, { price: e.target.value })} placeholder="Starting at $100" style={{ flex: 1 }} />
            <button type="button" className="link-button" onClick={() => moveService(i, -1)} disabled={i === 0} aria-label="Move up" title="Move up">↑</button>
            <button type="button" className="link-button" onClick={() => moveService(i, 1)} disabled={i === cfg.services.length - 1} aria-label="Move down" title="Move down">↓</button>
            <button type="button" className="link-button" onClick={() => removeService(i)}>Remove</button>
          </div>
          <textarea rows={2} value={s.description} onChange={(e) => setService(i, { description: e.target.value })} placeholder="Short description of the service" />
        </div>
      ))}
      <button type="button" className="secondary" onClick={addService} style={{ marginTop: 8 }}>+ Add service</button>

      <div className="section-heading">Testimonials</div>
      <p className="hint" style={{ marginTop: 0 }}>Short customer quotes, shown as cards above the booking form.</p>
      {cfg.testimonials.map((t, i) => (
        <div key={i} className="lp-editor-service">
          <div className="lp-editor-service-top">
            <input value={t.author} onChange={(e) => setTestimonial(i, { author: e.target.value })} placeholder="Customer name (e.g. Marcus T.)" style={{ flex: 2 }} />
            <select value={t.rating} onChange={(e) => setTestimonial(i, { rating: parseInt(e.target.value, 10) })} style={{ flex: 1, minWidth: 120 }}>
              <option value={5}>★★★★★</option>
              <option value={4}>★★★★☆</option>
              <option value={3}>★★★☆☆</option>
              <option value={2}>★★☆☆☆</option>
              <option value={1}>★☆☆☆☆</option>
              <option value={0}>No stars</option>
            </select>
            <button type="button" className="link-button" onClick={() => removeTestimonial(i)}>Remove</button>
          </div>
          <textarea rows={2} value={t.quote} onChange={(e) => setTestimonial(i, { quote: e.target.value })} placeholder="Best cut in the city — been coming for years." />
        </div>
      ))}
      <button type="button" className="secondary" onClick={addTestimonial} style={{ marginTop: 8 }}>+ Add testimonial</button>

      <div className="section-heading">Social links</div>
      <p className="hint" style={{ marginTop: 0 }}>Enter a username or a full URL. Blank platforms are hidden. Shown as icons in the footer.</p>
      <div className="lp-editor-socials">
        {[
          { key: 'instagram', label: 'Instagram', ph: '@yourhandle' },
          { key: 'facebook', label: 'Facebook', ph: 'yourpage' },
          { key: 'tiktok', label: 'TikTok', ph: '@yourhandle' },
          { key: 'youtube', label: 'YouTube', ph: '@yourchannel' },
          { key: 'x', label: 'X', ph: '@yourhandle' },
          { key: 'website', label: 'Website', ph: 'example.com' },
        ].map((p) => (
          <div key={p.key} className="lp-editor-social-row">
            <label style={{ margin: 0, minWidth: 84 }}>{p.label}</label>
            <input value={cfg.socials[p.key] || ''} onChange={(e) => setSocial(p.key, e.target.value)} placeholder={p.ph} />
          </div>
        ))}
      </div>

      {error && <div className="error" style={{ marginTop: 12 }}>{error}</div>}
      <div style={{ marginTop: 16, display: 'flex', alignItems: 'center', gap: 12 }}>
        <button className="primary" onClick={save} disabled={busy}>{busy ? 'Saving…' : 'Save landing page'}</button>
        {saved && <span style={{ color: 'var(--success)', fontSize: 13 }}>Saved ✓</span>}
      </div>
    </div>
  );
}

function OrgDetailView({ session, orgId }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [extendDays, setExtendDays] = useState(14);
  const [resetUserId, setResetUserId] = useState(null);
  const [resetPassword, setResetPassword] = useState('');
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [deleteSlugInput, setDeleteSlugInput] = useState('');
  const [addEmail, setAddEmail] = useState('');
  const [addName, setAddName] = useState('');
  const [addRole, setAddRole] = useState('admin');
  const [addBusy, setAddBusy] = useState(false);
  const [addMsg, setAddMsg] = useState(null);
  const [editIdentity, setEditIdentity] = useState(false);
  const [idName, setIdName] = useState('');
  const [idCompany, setIdCompany] = useState('');
  const [idSlug, setIdSlug] = useState('');
  const [idTimezone, setIdTimezone] = useState('');

  const refresh = useCallback(async () => {
    setLoading(true); setError(null);
    try {
      const d = await apiRequest(`/api/system/organizations/${orgId}`, { token: session.token });
      setData(d);
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  }, [orgId, session.token]);

  useEffect(() => { refresh(); }, [refresh]);

  async function setBilling(status) {
    const label = status === 'free' ? 'Mark this org as comped/free?' : 'Reset to a fresh 14-day trial?';
    if (!confirm(label)) return;
    setBusy(true); setError(null);
    try {
      await apiRequest(`/api/system/organizations/${orgId}/billing`, {
        method: 'PUT', token: session.token, body: { status },
      });
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  async function extendTrial() {
    setBusy(true); setError(null);
    try {
      await apiRequest(`/api/system/organizations/${orgId}/extend-trial`, {
        method: 'POST', token: session.token, body: { days: parseInt(extendDays, 10) || 14 },
      });
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  async function submitResetPassword(userId) {
    if (!resetPassword) return;
    setBusy(true); setError(null);
    try {
      await apiRequest(`/api/system/organizations/${orgId}/users/${userId}/reset-password`, {
        method: 'POST', token: session.token, body: { new_password: resetPassword },
      });
      setResetUserId(null); setResetPassword('');
      alert('Password reset. Share the new password with the user.');
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  async function deleteOrg() {
    setBusy(true); setError(null);
    try {
      await apiRequest(`/api/system/organizations/${orgId}`, {
        method: 'DELETE', token: session.token, body: { confirm_slug: deleteSlugInput },
      });
      navigate('/system');
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  async function addUser() {
    if (!addEmail.trim()) return;
    setAddBusy(true); setAddMsg(null); setError(null);
    try {
      await apiRequest(`/api/system/organizations/${orgId}/users`, {
        method: 'POST', token: session.token,
        body: { email: addEmail.trim(), name: addName.trim() || undefined, role: addRole },
      });
      setAddMsg(`Invite sent to ${addEmail.trim()} as ${addRole}.`);
      setAddEmail(''); setAddName('');
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setAddBusy(false); }
  }

  function startEditIdentity() {
    const org = data.organization;
    setIdName(org.name || '');
    setIdCompany((data.settings && data.settings.company_name) || '');
    setIdSlug(org.slug || '');
    setIdTimezone(org.timezone || '');
    setError(null);
    setEditIdentity(true);
  }

  async function saveIdentity() {
    const nextSlug = idSlug.trim().toLowerCase();
    if (nextSlug !== data.organization.slug && !confirm(
      `Change the address from /${data.organization.slug} to /${nextSlug}?\n\n`
      + 'Existing booking links, QR codes, and the landing page URL will stop working, '
      + 'and anyone signed in to this account will need to sign in again.'
    )) return;
    setBusy(true); setError(null);
    try {
      await apiRequest(`/api/system/organizations/${orgId}`, {
        method: 'PUT', token: session.token,
        body: { name: idName.trim(), company_name: idCompany.trim(), slug: nextSlug, timezone: idTimezone || undefined },
      });
      setEditIdentity(false);
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  async function toggleLandingAccess(enabled) {
    setBusy(true); setError(null);
    try {
      await apiRequest(`/api/system/organizations/${orgId}/landing-access`, {
        method: 'PUT', token: session.token, body: { enabled },
      });
      await refresh();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  if (loading) {
    return (
      <div>
        <div className="page-header">
          <h2>Organization</h2>
          <button className="secondary" onClick={() => navigate('/system')}>← Back</button>
        </div>
        <div className="list-empty">Loading...</div>
      </div>
    );
  }
  if (!data) {
    return (
      <div>
        <div className="page-header"><h2>Not found</h2></div>
        <button className="secondary" onClick={() => navigate('/system')}>← Back</button>
      </div>
    );
  }

  const o = data.organization;
  const stripeUrl = o.stripe_customer_id ? `https://dashboard.stripe.com/customers/${o.stripe_customer_id}` : null;

  return (
    <div>
      <div className="page-header">
        <h2>
          {o.name}
          <span className={`badge ${badgeForStatus(o.subscription_status)}`} style={{ marginLeft: 12 }}>
            {statusLabel(o.subscription_status, o.trial_ends_at)}
          </span>
        </h2>
        <button className="secondary" onClick={() => navigate('/system')}>← Back to orgs</button>
      </div>
      {error && <div className="error">{error}</div>}

      <div className="form-card">
        <div className="section-heading" style={{ marginTop: 0, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <span>Details</span>
          {!editIdentity && (
            <button className="secondary" onClick={startEditIdentity}>Edit name &amp; address</button>
          )}
        </div>
        {editIdentity && (
          <div style={{ marginBottom: 18 }}>
            <label>Account name <span className="hint">(what you see in this panel)</span></label>
            <input value={idName} onChange={(e) => setIdName(e.target.value)} placeholder="Acme Hauling" />
            <label>Company name <span className="hint">(what customers see on invoices, booking, and the landing page)</span></label>
            <input value={idCompany} onChange={(e) => setIdCompany(e.target.value)} placeholder="Leave blank to use the account name" />
            <label>Address <span className="hint">(their public URLs: /book/&lt;address&gt;, /o/&lt;address&gt;, and the landing page)</span></label>
            <input
              value={idSlug}
              onChange={(e) => setIdSlug(e.target.value)}
              placeholder="acme-hauling"
              style={{ fontFamily: 'ui-monospace, Menlo, monospace' }}
            />
            {idSlug.trim().toLowerCase() !== o.slug && (
              <p className="hint" style={{ color: 'var(--danger)' }}>
                Changing the address breaks existing booking links and QR codes, and signs out anyone currently using the account.
              </p>
            )}
            <label>Time zone <span className="hint">(when reminders and scheduled sends fire for them)</span></label>
            <TimezoneSelect value={idTimezone} onChange={setIdTimezone} disabled={busy} />
            <div className="form-actions">
              <button className="primary" disabled={busy || !idName.trim()} onClick={saveIdentity}>Save</button>
              <button className="secondary" disabled={busy} onClick={() => setEditIdentity(false)}>Cancel</button>
            </div>
          </div>
        )}
        <dl className="detail-info">
          <dt>Slug</dt><dd>{o.slug}</dd>
          <dt>Time zone</dt><dd>{o.timezone ? timezoneLabel(o.timezone) : '—'}</dd>
          <dt>Created</dt><dd>{formatDateString(o.created_at.split('T')[0])}</dd>
          {o.trial_ends_at && (<><dt>Trial ends</dt><dd>{formatDateString(o.trial_ends_at.split('T')[0])}</dd></>)}
          <dt>Next invoice #</dt><dd>{o.next_invoice_number}</dd>
          {o.stripe_customer_id && (
            <><dt>Stripe customer</dt><dd><a href={stripeUrl} target="_blank" rel="noopener noreferrer">{o.stripe_customer_id} ↗</a></dd></>
          )}
          {o.stripe_subscription_id && (
            <><dt>Stripe subscription</dt><dd>{o.stripe_subscription_id}</dd></>
          )}
          <dt>Counts</dt><dd>{o.customer_count} customers · {o.job_count} jobs · {o.invoice_count} invoices · {o.quote_count} quotes</dd>
        </dl>
      </div>

      <div className="form-card">
        <div className="section-heading" style={{ marginTop: 0 }}>Landing page access</div>
        <label style={{ display: 'inline-flex', alignItems: 'center', gap: 8, margin: 0, cursor: 'pointer' }}>
          <input
            type="checkbox"
            checked={!!o.landing_enabled}
            disabled={busy}
            onChange={(e) => toggleLandingAccess(e.target.checked)}
          />
          <span>Let this client edit their own landing page from Settings</span>
        </label>
        <p className="hint" style={{ marginTop: 8, marginBottom: 0 }}>
          When on, the org's admins get a Landing page section in their own Settings.
          You can edit the page from here either way.
        </p>
      </div>

      <LandingPageEditor
        slug={o.slug}
        token={session.token}
        initial={data.settings && data.settings.landing_page_config}
        saveUrl={`/api/system/organizations/${orgId}/landing`}
        uploadEndpoint="/api/system/upload-signature"
      />

      <div className="form-card">
        <div className="section-heading" style={{ marginTop: 0 }}>Billing actions</div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
          {o.subscription_status === 'free' ? (
            <button className="secondary" disabled={busy} onClick={() => setBilling('trialing')}>Remove free (start trial)</button>
          ) : (
            <button className="secondary" disabled={busy} onClick={() => setBilling('free')}>Set free (comp account)</button>
          )}
          <span style={{ color: 'var(--text-muted)', fontSize: 13, marginLeft: 12 }}>Extend trial by</span>
          <input
            type="number" min="1" max="365" value={extendDays}
            onChange={(e) => setExtendDays(e.target.value)}
            style={{ width: 70 }}
          />
          <span style={{ color: 'var(--text-muted)', fontSize: 13 }}>days</span>
          <button className="primary" disabled={busy} onClick={extendTrial}>Apply</button>
        </div>
        <p className="hint" style={{ marginTop: 12 }}>
          Extending adds days on top of the current trial end (or starts a trial from today if none).
        </p>
      </div>

      <div className="form-card" style={{ borderColor: 'var(--danger)' }}>
        <div className="section-heading" style={{ marginTop: 0, color: 'var(--danger)' }}>Danger zone</div>
        {!confirmDelete ? (
          <>
            <p className="hint" style={{ marginBottom: 14 }}>
              Permanently delete this organization and everything in it (users, customers, jobs, invoices, quotes, settings). Any active Stripe subscription will be canceled. <strong>This cannot be undone.</strong>
            </p>
            <button className="danger" onClick={() => setConfirmDelete(true)}>Delete organization</button>
          </>
        ) : (
          <>
            <p style={{ marginBottom: 12, fontSize: 14 }}>
              Type <code style={{ background: 'var(--tinted)', padding: '2px 6px', borderRadius: 4 }}>{o.slug}</code> below to confirm. Cascades through all data and cancels Stripe.
            </p>
            <input
              value={deleteSlugInput}
              onChange={(e) => setDeleteSlugInput(e.target.value)}
              placeholder={`Type ${o.slug}`}
              style={{ marginBottom: 12 }}
            />
            <div style={{ display: 'flex', gap: 8 }}>
              <button
                className="danger"
                disabled={busy || deleteSlugInput !== o.slug}
                onClick={deleteOrg}
              >
                {busy ? 'Deleting...' : 'Permanently delete'}
              </button>
              <button
                className="secondary"
                disabled={busy}
                onClick={() => { setConfirmDelete(false); setDeleteSlugInput(''); }}
              >
                Cancel
              </button>
            </div>
          </>
        )}
      </div>

      <div className="section-heading">Users ({data.users.length})</div>
      <div className="list">
        {data.users.length === 0 ? (
          <div className="list-empty">No users in this org.</div>
        ) : (
          data.users.map((u) => {
            const isResetting = resetUserId === u.id;
            return (
              <div key={u.id} className="row">
                <div className="info">
                  <div className="name">
                    {u.name || u.email}
                    <span className="badge" style={{ marginLeft: 8 }}>{u.role}</span>
                    {!u.email_verified_at && <span className="hint" style={{ marginLeft: 8, color: 'var(--danger)' }}>unverified</span>}
                  </div>
                  <div className="meta">{u.email} · joined {formatDateString(u.created_at.split('T')[0])}</div>
                  {isResetting && (
                    <div style={{ marginTop: 8, display: 'flex', gap: 8, alignItems: 'center' }}>
                      <input
                        type="password" placeholder="New password"
                        value={resetPassword}
                        onChange={(e) => setResetPassword(e.target.value)}
                        style={{ width: 260 }}
                      />
                      <button className="primary" disabled={busy || !resetPassword} onClick={() => submitResetPassword(u.id)}>Set</button>
                      <button className="secondary" disabled={busy} onClick={() => { setResetUserId(null); setResetPassword(''); }}>Cancel</button>
                    </div>
                  )}
                </div>
                {!isResetting && (
                  <div className="actions">
                    <button className="secondary" onClick={() => { setResetUserId(u.id); setResetPassword(''); }}>Reset password</button>
                  </div>
                )}
              </div>
            );
          })
        )}
      </div>

      <div className="form-card">
        <div className="section-heading" style={{ marginTop: 0 }}>Add teammate</div>
        <p className="hint" style={{ marginTop: 0 }}>Creates the user and emails them an invite link to set their password.</p>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
          <input type="email" placeholder="email@example.com" value={addEmail} onChange={(e) => setAddEmail(e.target.value)} style={{ flex: 2, minWidth: 200 }} />
          <input placeholder="Name (optional)" value={addName} onChange={(e) => setAddName(e.target.value)} style={{ flex: 1, minWidth: 140 }} />
          <select value={addRole} onChange={(e) => setAddRole(e.target.value)} style={{ width: 'auto' }}>
            <option value="admin">Admin</option>
            <option value="lead">Lead</option>
            <option value="employee">Employee</option>
          </select>
          <button className="primary" disabled={addBusy || !addEmail.trim()} onClick={addUser}>{addBusy ? 'Adding…' : 'Add'}</button>
        </div>
        {addMsg && <div style={{ marginTop: 8, color: 'var(--success)', fontSize: 13 }}>{addMsg}</div>}
      </div>
    </div>
  );
}
