  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setError(null); setBusy(true);
    try {
      const data = await apiRequest('/api/signup', {
        method: 'POST',

          organization: { name: orgName, timezone: browserTimezone() },

}

function LoginForm({ onSuccess }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [forgotMode, setForgotMode] = useState(false);
  const [forgotSent, setForgotSent] = useState(false);
  const [accountOptions, setAccountOptions] = useState(null);

  async function attemptLogin(orgSlug) {
    setError(null); setBusy(true);
    try {
      const data = await apiRequest('/api/auth/login', {
        method: 'POST',
        body: { email, password, org_slug: orgSlug || undefined },
      });
      if (data.multiple_accounts) {
        setAccountOptions(data.multiple_accounts);
        setBusy(false);
        return;
      }
      const session = {
        token: data.token,
        user: data.user,
        organization: data.organization,
        slug: data.organization && data.organization.slug,
      };
      saveSession(session);
      onSuccess(session);
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  function submit(e) {
    e.preventDefault();
    attemptLogin();
  }

  async function submitForgot(e) {
    e.preventDefault();
    setError(null); setBusy(true);
    try {
      await apiRequest('/api/auth/forgot-password', {
        method: 'POST', body: { email },
      });
      setForgotSent(true);
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  if (forgotMode) {
    if (forgotSent) {
      return (
        <div>
          <p style={{ fontSize: 14 }}>
            If an account with that email exists, a reset link is on its way.
            Check your inbox (and spam folder).
          </p>
          <button className="primary block" onClick={() => { setForgotMode(false); setForgotSent(false); }}>
            Back to sign in
          </button>
        </div>
      );
    }
    return (
      <form onSubmit={submitForgot}>
        <p className="subtitle" style={{ marginBottom: 16 }}>Enter the email for your account. We'll send a reset link.</p>
        <label>Email</label>
        <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required autoFocus />
        {error && <div className="error">{error}</div>}
        <button type="submit" className="primary block" disabled={busy}>
          {busy ? 'Sending...' : 'Send reset link'}
        </button>
        <div style={{ textAlign: 'center', marginTop: 12 }}>
          <button type="button" className="link-button" onClick={() => setForgotMode(false)}>Back to sign in</button>
        </div>
      </form>
    );
  }

  if (accountOptions) {
    return (
      <div>
        <p className="subtitle" style={{ marginBottom: 16 }}>
          You have accounts at multiple businesses. Which one are you signing into?
        </p>
        {accountOptions.map((a) => (
          <button
            key={a.slug}
            className="secondary block"
            style={{ width: '100%', marginBottom: 8, padding: 14, textAlign: 'left' }}
            disabled={busy}
            onClick={() => attemptLogin(a.slug)}
          >
            <strong>{a.name}</strong>
            <span style={{ display: 'block', fontSize: 12, color: 'var(--text-muted)', marginTop: 2 }}>{a.slug}</span>
          </button>
        ))}
        {error && <div className="error">{error}</div>}
        <div style={{ textAlign: 'center', marginTop: 12 }}>
          <button type="button" className="link-button" onClick={() => { setAccountOptions(null); setError(null); }}>
            Back to sign in
          </button>
        </div>
      </div>
    );
  }

  return (
    <form onSubmit={submit}>
      <label>Email</label>
      <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required autoFocus />
      <label>Password</label>
      <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required />
      {error && <div className="error">{error}</div>}
      <button type="submit" className="primary block" disabled={busy}>
        {busy ? 'Signing in...' : 'Sign in'}
      </button>
      <div style={{ textAlign: 'center', marginTop: 12 }}>
        <button type="button" className="link-button" onClick={() => { setForgotMode(true); setError(null); setForgotSent(false); }}>
          Forgot your password?
        </button>
      </div>
    </form>
  );
}

// Per-transition delays, in ms. Slot-wheel feel: warm-up, peak speed, decelerate, settle.
// Length must be INDUSTRIES.length - 1 (one delay between each pair of words).
const CYCLE_DELAYS = [820, 580, 400, 290, 220, 190, 180, 180, 180, 180, 180, 190, 220, 290, 400, 580, 820];

function StaticHeadline() {
  return (
    <h1 className="ed-hero-headline fade-in-delay-1">
      Built for the work,<br />
      <em>not the boardroom.</em>
    </h1>
  );
}

function HeroHeadline() {
  const variant = (typeof window !== 'undefined'
    && new URLSearchParams(window.location.search).get('v') === 'b') ? 'b' : 'a';
  return variant === 'b' ? <StaticHeadline /> : <CyclingHeadline />;
}

function CyclingHeadline() {
  const [idx, setIdx] = useState(0);
  const reachedEnd = idx >= INDUSTRIES.length - 1;
  useEffect(() => {
    if (reachedEnd) return;
    const delay = CYCLE_DELAYS[idx] || 460;
    const t = setTimeout(() => setIdx(i => i + 1), delay);
    return () => clearTimeout(t);
  }, [idx, reachedEnd]);
  // Match animation duration to the cycle delay so the slide stays continuous.
  const animDuration = reachedEnd ? null : `${CYCLE_DELAYS[idx] || 460}ms`;
  return (
    <h1 className="ed-hero-headline fade-in-delay-1">
      Run your<br />
      <em
        key={idx}
        className={`cycle-word${reachedEnd ? ' cycle-settled' : ''}`}
        style={animDuration ? { animationDuration: animDuration } : undefined}
      >{INDUSTRIES[idx]}</em><br />
      in one place.
    </h1>
  );
}

  useEffect(() => {
    if (typeof IntersectionObserver === 'undefined') {
      document.querySelectorAll('[data-reveal]').forEach(el => el.classList.add('is-revealed'));
      return;
    }
    const observer = new IntersectionObserver((entries) => {
      for (const entry of entries) {

          observer.unobserve(entry.target);
        }
      }
    }, { rootMargin: '0px 0px -10% 0px', threshold: 0.12 });

function ContactPage() {
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [message, setMessage] = useState('');
  const [website, setWebsite] = useState(''); // honeypot
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [sent, setSent] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setError(null); setBusy(true);
    try {
      await apiRequest('/api/public/contact', {
        method: 'POST',
        body: { name, email, message, website },
      });
      setSent(true);
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  return (
    <LegalShell title="Contact us" eyebrow="We'd love to hear from you">
      {sent ? (
        <p style={{ textAlign: 'center' }}>Thanks — your message is on its way. We'll get back to you by email soon.</p>
      ) : (
        <form className="contact-form" onSubmit={submit}>
          <label>Your name</label>
          <input value={name} onChange={(e) => setName(e.target.value)} required />
          <label>Email</label>
          <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required />
          <label>Message</label>
          <textarea value={message} onChange={(e) => setMessage(e.target.value)} rows={6} required />
          <input
            type="text" value={website} onChange={(e) => setWebsite(e.target.value)}
            tabIndex={-1} autoComplete="off" aria-hidden="true"
            style={{ position: 'absolute', left: '-9999px', width: 1, height: 1 }}
          />
          {error && <div className="error">{error}</div>}
          <button type="submit" className="primary block" disabled={busy}>
            {busy ? 'Sending...' : 'Send message'}
          </button>
        </form>
      )}
    </LegalShell>
  );
}

  const [noteText, setNoteText] = useState('');
  const [noteBusy, setNoteBusy] = useState(false);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [tab, setTab] = useState('jobs');
  const [copiedId, setCopiedId] = useState(null);
  const [credit, setCredit] = useState({ balance: 0, entries: [] });
  const [creditAmount, setCreditAmount] = useState('');
  const [creditNote, setCreditNote] = useState('');
  const [creditBusy, setCreditBusy] = useState(false);
  const [referrals, setReferrals] = useState({ referred_by: null, referred: [], earned: 0 });
  const [inviteState, setInviteState] = useState(null); // null | 'sending' | { ok, text }
  // Which edges of the tab strip have tabs scrolled out of sight.
  const tabsRef = useRef(null);
  const [tabsMore, setTabsMore] = useState({ left: false, right: false });
  const measureTabs = useCallback(() => {
    const el = tabsRef.current;
    if (!el) return;
    const left = el.scrollLeft > 4;
    const right = el.scrollLeft + el.clientWidth < el.scrollWidth - 4;
    setTabsMore((cur) => (cur.left === left && cur.right === right ? cur : { left, right }));
  }, []);
  useEffect(() => {
    measureTabs();
    window.addEventListener('resize', measureTabs);
    return () => window.removeEventListener('resize', measureTabs);
  }, [measureTabs, loading, showReferrals]);
  async function resetReferralPage() {
    if (!confirm(`Reset ${customerDisplayName(customer)}'s referral page link? The link they have now stops working, so you will need to send them the new one. Their referral link, credit and history are not affected.`)) return;
    try {
      const r = await apiRequest(`/api/customers/${customer.id}/referrals/reset-page`, {
        method: 'POST', slug: session.slug, token: session.token,
      });
      setReferrals((cur) => ({ ...cur, referral_page_token: r.referral_page_token }));
      setInviteState({ ok: true, text: 'New link made. The old one no longer works — send them this one.' });
    } catch (err) { setInviteState({ ok: false, text: err.message }); }
  }
  async function emailReferralLink() {
    setInviteState('sending');
    try {
      const r = await apiRequest(`/api/customers/${customer.id}/referrals/send-link`, {
        method: 'POST', slug: session.slug, token: session.token,
      });
      setInviteState({ ok: true, text: `Sent to ${r.to}.` });
    } catch (err) { setInviteState({ ok: false, text: err.message }); }
  }

  const refreshCredits = useCallback(async () => {
    const c = await apiRequest(`/api/customers/${customer.id}/credits`, { slug: session.slug, token: session.token });
    setCredit(c);
  }, [customer.id, session.slug, session.token]);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      setLoading(true); setError(null);
      try {
        const [j, i, q, n, cr] = await Promise.all([
          apiRequest('/api/jobs', { slug: session.slug, token: session.token }),
          apiRequest('/api/invoices', { slug: session.slug, token: session.token }),
          apiRequest('/api/quotes', { slug: session.slug, token: session.token }),
          apiRequest(`/api/customers/${customer.id}/notes`, { slug: session.slug, token: session.token }),
          apiRequest(`/api/customers/${customer.id}/credits`, { slug: session.slug, token: session.token }),
        ]);
        if (cancelled) return;
        // Not part of the load-or-fail set: the page is whole without it.
        apiRequest(`/api/customers/${customer.id}/referrals`, { slug: session.slug, token: session.token })
          .then((r) => { if (!cancelled) setReferrals(r); }).catch(() => {});
        const cid = customer.id;
        setJobs(j.filter((x) => x.customer_id === cid));
        setInvoices(i.filter((x) => x.customer_id === cid));
        setQuotes(q.filter((x) => x.customer_id === cid));
        setNotes(n);
        setCredit(cr);
      } catch (err) {
        if (!cancelled) setError(err.message);
      } finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [customer.id, session.slug, session.token]);

  async function addNote(e) {
    e.preventDefault();
    if (!noteText.trim()) return;
    setNoteBusy(true); setError(null);
    try {
      const created = await apiRequest(`/api/customers/${customer.id}/notes`, {
        method: 'POST', slug: session.slug, token: session.token,
        body: { body: noteText.trim() },
      });
      setNotes((prev) => [created, ...prev]);
      setNoteText('');
    } catch (err) { setError(err.message); }
    finally { setNoteBusy(false); }
  }

  async function deleteNote(noteId) {
    if (!confirm('Delete this note? This cannot be undone.')) return;
    setError(null);
    try {
      await apiRequest(`/api/customers/${customer.id}/notes/${noteId}`, {
        method: 'DELETE', slug: session.slug, token: session.token,
      });
      setNotes((prev) => prev.filter((n) => n.id !== noteId));
    } catch (err) { setError(err.message); }
  }

  // Invoice actions — mirror the main invoice list so invoices are
  // actionable straight from the customer view. Each re-fetches just this
  // customer's invoices on success.
  async function refreshInvoices() {
    try {
      const i = await apiRequest('/api/invoices', { slug: session.slug, token: session.token });
      setInvoices(i.filter((x) => x.customer_id === customer.id));
    } catch (err) { setError(err.message); }
  }
  async function invTransition(id, path) {
    setError(null);
    try {
      await apiRequest(`/api/invoices/${id}/${path}`, { method: 'POST', slug: session.slug, token: session.token });
      await refreshInvoices();
    } catch (err) { setError(err.message); }
  }
  async function invDelete(id) {
    if (!confirm('Delete this invoice?')) return;
    setError(null);
    try {
      await apiRequest(`/api/invoices/${id}`, { method: 'DELETE', slug: session.slug, token: session.token });
      await refreshInvoices();
    } catch (err) { setError(err.message); }
  }
  async function invCopyLink(invoiceId) {
    const url = `${window.location.origin}/i/${invoiceId}`;
    try {
      await navigator.clipboard.writeText(url);
      setCopiedId(invoiceId);
      setTimeout(() => setCopiedId((c) => (c === invoiceId ? null : c)), 2000);
    } catch { window.prompt('Copy this link:', url); }
  }
  async function invEmail(inv) {
    if (!confirm(`Email invoice #${inv.invoice_number} to ${inv.customer_email || 'the customer'}?`)) return;
    setError(null);
    try {
      await apiRequest(`/api/invoices/${inv.id}/send-email`, { method: 'POST', slug: session.slug, token: session.token });
      await refreshInvoices();
      alert('Invoice emailed.');
    } catch (err) { setError(err.message); }
  }

  async function addCredit(e) {
    e.preventDefault();
    const amt = parseFloat(creditAmount);
    if (!isFinite(amt) || amt <= 0) { setError('Enter a credit amount greater than zero.'); return; }
    setCreditBusy(true); setError(null);
    try {
      await apiRequest(`/api/customers/${customer.id}/credits`, {
        method: 'POST', slug: session.slug, token: session.token,
        body: { amount: amt, note: creditNote },
      });
      setCreditAmount(''); setCreditNote('');
      await refreshCredits();
    } catch (err) { setError(err.message); }
    finally { setCreditBusy(false); }
  }

  async function removeCredit(entry) {
    const msg = entry.invoice_id
      ? `Undo this credit application? ${formatPrice(Math.abs(entry.amount))} goes back to the ${terms.customerLower}'s balance and invoice #${entry.invoice_number} will owe it again.`
      : `Remove this ${formatPrice(entry.amount)} credit?`;
    if (!confirm(msg)) return;
    setCreditBusy(true); setError(null);
    try {
      await apiRequest(`/api/customers/${customer.id}/credits/${entry.id}`, {
        method: 'DELETE', slug: session.slug, token: session.token,
      });
      await Promise.all([refreshCredits(), refreshInvoices()]);
    } catch (err) { setError(err.message); }
    finally { setCreditBusy(false); }
  }

  async function applyCreditToInvoice(inv) {
    const m = invoiceMath(inv);
    const most = Math.min(credit.balance, m.balanceDue);
    if (most <= 0) return;
    if (!confirm(`Apply ${formatPrice(most)} of credit to invoice #${inv.invoice_number}?`)) return;
    setCreditBusy(true); setError(null);
    try {
      await apiRequest(`/api/invoices/${inv.id}/apply-credit`, {
        method: 'POST', slug: session.slug, token: session.token, body: {},
      });
      await Promise.all([refreshCredits(), refreshInvoices()]);
    } catch (err) { setError(err.message); }
    finally { setCreditBusy(false); }
  }

  function formatNoteTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const ms = now - d;
    if (ms < 60000) return 'just now';
    if (sameDay && ms < 3600000) return `${Math.floor(ms / 60000)}m ago`;
    if (sameDay) return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  return (
    <div>
      <BackLink onClick={onBack}>All {terms.customersLower}</BackLink>
      {/* Sticky, so the phone number is still there while you read an invoice
          four screens down — that was the only reason contact sat in a column
          of its own, and it survives here without a second rail. */}
      <div className="rechead">
        <CustomerCard
          customer={customer}
          creditBalance={credit.balance}
          referredBy={showReferrals && referrals.referred_by ? customerDisplayName(referrals.referred_by) : null}
          onEdit={canMutate ? () => onEdit(customer) : null}
        />
      </div>

      {error && <div className="error">{error}</div>}

      <div
        className={`rectabs${tabsMore.left ? ' more-left' : ''}${tabsMore.right ? ' more-right' : ''}`}
        role="tablist" aria-label={`${customerDisplayName(customer)} sections`}
        ref={tabsRef} onScroll={measureTabs}
      >
        {[
          { key: 'jobs', label: terms.jobs, count: loading ? '' : jobs.length },
          { key: 'invoices', label: 'Invoices', count: loading ? '' : invoices.length },
          { key: 'quotes', label: 'Quotes', count: loading ? '' : quotes.length },
          { key: 'credit', label: 'Credit', count: loading ? '' : formatPrice(credit.balance) },
          showReferrals && { key: 'referrals', label: 'Referrals', count: loading ? '' : referrals.referred.length },
          { key: 'notes', label: 'Notes', count: loading ? '' : notes.length },
        ].filter(Boolean).map((sec) => (
          <button
            key={sec.key}
            type="button"
            role="tab"
            aria-selected={tab === sec.key}
            className={`rectab${tab === sec.key ? ' active' : ''}`}
            onClick={(e) => {
              setTab(sec.key);
              // Six tabs do not fit a phone; bring the chosen one into view
              // instead of leaving it half off the edge of the strip. Only the
              // strip is scrolled, by hand: scrollIntoView also nudges the
              // page, and on iOS that detached the fixed tab bar, which then
              // travelled with the page.
              const strip = tabsRef.current;
              if (strip) {
                const t = e.currentTarget.getBoundingClientRect();
                const box = strip.getBoundingClientRect();
                const left = strip.scrollLeft + (t.left - box.left) - (box.width - t.width) / 2;
                strip.scrollTo({ left: Math.max(0, left), behavior: 'smooth' });
              }
            }}
          >
            <span>{sec.label}</span>
            {sec.count !== '' && sec.count != null && sec.count !== 0 && sec.count !== formatPrice(0) && <b>{sec.count}</b>}
          </button>
        ))}
      </div>

      {loading ? (
        <div className="list-empty">Loading related items...</div>
      ) : (
        <>
          {tab === 'jobs' && (
            <div className="list">
              {jobs.length === 0 ? (
                <div className="list-empty">No {terms.jobsLower} for this {terms.customerLower}.</div>
              ) : jobs.map((j) => (
                <div key={j.id} className="row">
                  <div className="info">
                    <div className="name">{j.title}</div>
                    <div className="meta">
                      {formatSchedule(j)}
                      {j.default_price != null && <> · {formatPrice(j.default_price)}</>}
                      {j.status === 'completed' && <> · Completed</>}
                    </div>
                  </div>
                  <div className="actions">
                    <button className="secondary" onClick={() => navigate(`/jobs?open=${j.id}&view=schedule`)}>Manage schedule</button>
                    {canMutate && (
                      <button className="secondary" onClick={() => navigate(`/jobs?open=${j.id}`)}>Edit {terms.jobLower}</button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          )}

          {tab === 'invoices' && (
            <div className="list">
              {invoices.length === 0 ? (
                <div className="list-empty">No invoices.</div>
              ) : invoices.map((inv) => (
                <div key={inv.id} className="row">
                  <div className="info">
                    <div className="name">
                      Invoice #{inv.invoice_number} <span className="price">{formatPrice(invoiceMath(inv).total)}</span>
                    </div>
                    <div className="meta">
                      {formatDateString(inv.date)} · <span className={`badge ${inv.status}`}>{inv.status}</span>
                      {invoiceMath(inv).creditApplied > 0 && (
                        <> · <span style={{ color: 'var(--success)' }}>
                          {formatPrice(invoiceMath(inv).creditApplied)} credit applied
                        </span>
                        {invoiceMath(inv).balanceDue > 0 && <> · {formatPrice(invoiceMath(inv).balanceDue)} due</>}
                        </>
                      )}
                    </div>
                  </div>
                  {canMutate && (
                    <div className="actions">
                      {inv.status !== 'paid' && credit.balance > 0 && invoiceMath(inv).balanceDue > 0 && (
                        <button className="secondary" disabled={creditBusy} onClick={() => applyCreditToInvoice(inv)}>
                          Apply credit
                        </button>
                      )}
                      {inv.status === 'draft' && (
                        <button className="primary" onClick={() => invTransition(inv.id, 'send')}>Mark as sent</button>
                      )}
                      {inv.status === 'sent' && (
                        <button className="primary" onClick={() => invTransition(inv.id, 'mark-paid')}>Mark paid</button>
                      )}
                      {inv.status === 'paid' && (
                        <button className="secondary" onClick={() => invTransition(inv.id, 'mark-unpaid')}>Mark unpaid</button>
                      )}
                      {(inv.status === 'sent' || inv.status === 'paid') && (
                        <button className="secondary" onClick={() => invCopyLink(inv.id)}>
                          {copiedId === inv.id ? 'Copied!' : 'Copy link'}
                        </button>
                      )}
                      {(inv.status === 'draft' || inv.status === 'sent') && (
                        <button className="secondary" onClick={() => invEmail(inv)}>
                          Email<span className="hide-on-mobile"> to {terms.customerLower}</span>
                        </button>
                      )}
                      <div className="inv-util-break" aria-hidden="true" />
                      <div className="inv-util-group">
                        {(inv.status === 'sent' || inv.status === 'paid') && (
                          <button className="inv-util" onClick={() => navigate(`/i/${inv.id}?from=app`)}>View</button>
                        )}
                        <button className="inv-util" onClick={() => navigate(`/invoices?open=${inv.id}`)}>Edit</button>
                        {inv.status === 'sent' && (
                          <button className="inv-util" onClick={() => invTransition(inv.id, 'mark-draft')}>Unsend</button>
                        )}
                        <button className="inv-util inv-util-danger" onClick={() => invDelete(inv.id)}>Delete</button>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}

          {tab === 'quotes' && (
            <div className="list">
              {quotes.length === 0 ? (
                <div className="list-empty">No quotes.</div>
              ) : quotes.map((q) => (
                <div
                  key={q.id}
                  className="compact-row compact-row-clickable"
                  onClick={() => navigate(`/quotes?open=${q.id}`)}
                  role="button"
                  tabIndex={0}
                  onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); navigate(`/quotes?open=${q.id}`); } }}
                >
                  <div className="info">
                    <div className="name">
                      {q.description || 'Quote'} <span className="price">{formatPrice(lineItemsTotal(q.line_items))}</span>
                    </div>
                    <div className="meta"><span className={`badge ${q.status}`}>{q.status}</span></div>
                  </div>
                  <span className="compact-row-chevron">›</span>
                </div>
              ))}
            </div>
          )}

          {tab === 'referrals' && (
            <div>
              {referrals.referral_code && (
                <div className="form-card" style={{ marginBottom: 16 }}>
                  <div className="section-heading" style={{ marginTop: 0 }}>{customerDisplayName(customer)}&apos;s referral link</div>
                  <p className="hint" style={{ marginTop: 0 }}>
                    Send them this. Anyone who books through it arrives already marked as their referral.
                  </p>
                  <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                    <input
                      readOnly onFocus={(e) => e.target.select()}
                      style={{ flex: '1 1 170px', minWidth: 0 }}
                      value={`${window.location.origin}/book/${session.slug}?ref=${referrals.referral_code}`}
                    />
                    <CopyButton text={`${window.location.origin}/book/${session.slug}?ref=${referrals.referral_code}`} label="Copy link" />
                  </div>
                  {referrals.referral_page_token && (
                    <div className="ref-actions">
                      {canMutate && (
                        <button type="button" className="secondary" onClick={emailReferralLink} disabled={inviteState === 'sending' || !customer.email}>
                          {inviteState === 'sending' ? 'Sending...' : 'Email them their link'}
                        </button>
                      )}
                      <CopyButton text={`${window.location.origin}/r/${referrals.referral_page_token}`} label="Copy their referral page" />
                      <span className="ref-actions-links">
                        <a className="link-btn" href={`/r/${referrals.referral_page_token}`} target="_blank" rel="noopener noreferrer">Preview</a>
                        {canMutate && (
                          <button type="button" className="link-btn" style={{ color: 'var(--text-muted)' }} onClick={resetReferralPage}>Reset link</button>
                        )}
                      </span>
                      {inviteState && inviteState !== 'sending' && (
                        <span className="hint" role="status" style={{ color: inviteState.ok ? 'var(--success)' : 'var(--danger)' }}>{inviteState.text}</span>
                      )}
                      {!customer.email && <span className="hint">No email on file.</span>}
                    </div>
                  )}
                  <p className="hint" style={{ marginBottom: 0 }}>
                    Their referral page is private to them: their credit, who booked through their link, and the link itself. If it ends up with someone else, reset it and the old link stops working.
                  </p>
                </div>
              )}
              {referrals.referred_by && (
                <p className="hint" style={{ marginTop: 0 }}>
                  Referred by{' '}
                  <button type="button" className="link-btn" onClick={() => onOpenCustomer && onOpenCustomer(referrals.referred_by.id)}>
                    {customerDisplayName(referrals.referred_by)}
                  </button>.
                </p>
              )}
              {referrals.referred.length > 0 && (
                <div className="section-heading" style={{ marginTop: 0 }}>
                  {referrals.referred.length} referred · {formatPrice(referrals.earned)} earned
                </div>
              )}
              <div className="list">
                {referrals.referred.length === 0 ? (
                  <div className="list-empty">
                    Nobody yet. When {customerDisplayName(customer)} sends you someone, open that {terms.customerLower}, choose Edit, and set "Referred by".
                  </div>
                ) : referrals.referred.map((r) => (
                  <div
                    key={r.id} className="row row-link" role="button" tabIndex={0}
                    onClick={() => onOpenCustomer && onOpenCustomer(r.id)}
                    onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onOpenCustomer && onOpenCustomer(r.id); } }}
                  >
                    <div className="info">
                      <div className="name">{customerDisplayName(r)}</div>
                      <div className="meta">
                        {r.rewards === 0 ? 'No rewards yet' : `${r.rewards} ${r.rewards === 1 ? 'reward' : 'rewards'} earned`}
                      </div>
                    </div>
                    <div className="actions" style={{ fontWeight: 600, color: 'var(--success)' }}>
                      {parseFloat(r.earned) > 0 ? `+${formatPrice(parseFloat(r.earned))}` : ''}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {tab === 'credit' && (
            <div>
              <div className="form-card">
                <div className="section-heading" style={{ marginTop: 0 }}>
                  {formatPrice(credit.balance)} credit available
                </div>
                <p className="hint" style={{ marginTop: 0 }}>
                  Prepayments for future work. Apply credit to an invoice from the Invoices tab.
                </p>
                {canMutate && (
                  <form onSubmit={addCredit} style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'flex-end' }}>
                    <div style={{ flex: '0 0 140px' }}>
                      <label>Amount</label>
                      <input
                        type="number" step="0.01" min="0"
                        value={creditAmount}
                        onChange={(e) => setCreditAmount(e.target.value)}
                        placeholder="500.00"
                      />
                    </div>
                    <div style={{ flex: 1, minWidth: 180 }}>
                      <label>Note <span className="hint">(optional)</span></label>
                      <input
                        value={creditNote}
                        onChange={(e) => setCreditNote(e.target.value)}
                        placeholder="Prepaid for 2026 season"
                      />
                    </div>
                    <button type="submit" className="primary" disabled={creditBusy}>
                      {creditBusy ? 'Saving…' : 'Add credit'}
                    </button>
                  </form>
                )}
              </div>

              <div className="section-heading">History</div>
              <div className="list">
                {credit.entries.length === 0 ? (
                  <div className="list-empty">No credit recorded yet.</div>
                ) : credit.entries.map((c) => {
                  const amt = parseFloat(c.amount);
                  const isApplied = amt < 0;
                  return (
                    <div key={c.id} className="row">
                      <div className="info">
                        <div className="name">
                          <span style={{ color: isApplied ? 'var(--text-muted)' : 'var(--success)', fontWeight: 600 }}>
                            {isApplied ? '−' : '+'}{formatPrice(Math.abs(amt))}
                          </span>
                          {isApplied && c.invoice_number != null && <> · Invoice #{c.invoice_number}</>}
                          {c.source_job_id && <> · Referral</>}
                        </div>
                        <div className="meta">
                          {formatNoteTime(c.created_at)}
                          {c.note && <> — {c.note}</>}
                          {c.created_by_name && <> · {c.created_by_name}</>}
                        </div>
                      </div>
                      {canMutate && (
                        <div className="actions">
                          <button className="secondary" disabled={creditBusy} onClick={() => removeCredit(c)}>
                            {isApplied ? 'Undo' : 'Remove'}
                          </button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {tab === 'notes' && (
            <div>
              <form className="note-add" onSubmit={addNote}>
                <textarea
                  value={noteText}
                  onChange={(e) => setNoteText(e.target.value)}
                  placeholder={`Add a note about ${customerDisplayName(customer)} — calls, preferences, anything to remember next time.`}
                  rows={3}
                  disabled={noteBusy}
                />
                <div className="note-add-actions">
                  <button type="submit" className="primary" disabled={noteBusy || !noteText.trim()}>
                    {noteBusy ? 'Saving...' : 'Add note'}
                  </button>
                </div>
              </form>
              <div className="note-timeline">
                {notes.length === 0 ? (
                  <div className="list-empty">No notes yet. Add the first one above.</div>
                ) : (
                  notes.map((n) => (
                    <div key={n.id} className="note-row">
                      <div className="note-meta">
                        <span className="note-author">{n.author_name || n.author_email || 'Unknown'}</span>
                        <span className="note-time" title={new Date(n.created_at).toLocaleString()}>
                          {formatNoteTime(n.created_at)}
                        </span>
                        {canMutate && (
                          <button
                            type="button" className="note-delete"
                            onClick={() => deleteNote(n.id)}
                            aria-label="Delete note"
                          >×</button>
                        )}
                      </div>
                      <div className="note-body">{n.body}</div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

// The record's identity card. Above a phone it rides in a sticky header, so a
// number or a gate code is still on screen while you read an invoice further
// down — that was the only reason contact used to sit in a column of its own.
function CustomerCard({ customer, creditBalance = 0, referredBy = null, onEdit }) {
  const name = customerDisplayName(customer);
  // When a business has a person on file, that person is the subtitle rather
  // than another chip — it is who you ask for, not a way to reach them.
  const person = customer.business_name && (customer.first_name || customer.last_name)
    ? [customer.first_name, customer.last_name].filter(Boolean).join(' ')
    : null;
  const owed = parseFloat(customer.outstanding_balance) || 0;
  const chips = [
    customer.address && {
      k: 'Address', v: customer.address, lines: addressLines(customer.address),
      href: `https://maps.google.com/?q=${encodeURIComponent(customer.address)}`,
      external: true,
    },
    customer.phone && { k: 'Phone', v: customer.phone, href: `tel:${customer.phone.replace(/[^\d+]/g, '')}` },
    customer.email && { k: 'Email', v: customer.email, href: `mailto:${customer.email}` },
  ].filter(Boolean);

  return (
    <div className="reccard">
      <div className="reccard-top">
        <span className="reccard-avatar" style={{ background: avatarColor(customer.id) }} aria-hidden="true">
          {nameInitials(name)}
        </span>
        <div className="reccard-id">
          <h2 className="reccard-name">{name}</h2>
          {person && <div className="reccard-sub">{person}</div>}
          {referredBy && <div className="reccard-sub">Referred by {referredBy}</div>}
        </div>
        {/* What they owe and what they have on credit lead the screen. They
            used to be two rows in a card below, which is where you look last. */}
        {owed > 0 && <span className="money-pill owes">Owes {formatPrice(owed)}</span>}
        {creditBalance > 0 && <span className="money-pill credit">{formatPrice(creditBalance)} credit</span>}
        {onEdit && (
          <div className="reccard-actions">
            <button className="secondary" onClick={onEdit}>Edit</button>
          </div>
        )}
      </div>
      {chips.length > 0 && (
        <div className="reccard-contact">
          {chips.map((c) => (
            <a
              key={c.k}
              className="reccard-chip"
              href={c.href}
              {...(c.external ? { target: '_blank', rel: 'noopener noreferrer' } : {})}
            >
              <span className="k">{c.k}</span>
              <span className="v">
                {c.lines
                  ? c.lines.map((line, i) => <span key={i} className="l">{line}</span>)
                  : c.v}
              </span>
            </a>
          ))}
        </div>
      )}
      {customer.notes && (
        <div className="reccard-note">
          <span className="k">Notes</span>
          <span>{customer.notes}</span>
        </div>
      )}
    </div>
  );
}

function CsvImportView({ session, onDone, onCancel }) {
  const terms = useTerms();
  const [text, setText] = useState('');
  const [parsed, setParsed] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [result, setResult] = useState(null);

  const VALID_COLS = new Set(['first_name', 'last_name', 'business_name', 'phone', 'email', 'address', 'notes']);
  const SAMPLE = 'first_name,last_name,business_name,phone,email,address,notes\nBob,Smith,,555-0100,bob@example.com,123 Maple St,Front yard only\n,,Acme Co,555-9000,info@acme.com,500 Oak Ave,Net 30';

  function handleParse() {
    setError(null); setResult(null);
    try {
      const out = parseCSV(text);
      if (out.rows.length === 0) {
        setError('No rows to import. Make sure your CSV has a header row plus at least one data row.');
        setParsed(null);
        return;
      }
      const unknown = out.headers.filter((h) => !VALID_COLS.has(h));
      if (unknown.length > 0) {
        setError(`Unknown columns: ${unknown.join(', ')}. Allowed: ${[...VALID_COLS].join(', ')}.`);
        setParsed(null);
        return;
      }
      setParsed(out);
    } catch (err) {
      setError(err.message);
    }
  }

  async function handleImport() {
    if (!parsed) return;
    setBusy(true); setError(null); setResult(null);
    try {
      const data = await apiRequest('/api/customers/import', {
        method: 'POST', slug: session.slug, token: session.token,
        body: { rows: parsed.rows },
      });
      setResult(data);
      onDone();
    } catch (err) { setError(err.message); }
    finally { setBusy(false); }
  }

  return (
    <div>
      <div className="page-header"><h2>Import {terms.customersLower} from CSV</h2></div>
      {error && <div className="error">{error}</div>}
      {result && (
        <div className="error" style={{ background: '#e8f1ec', color: '#1f6f4a' }}>
          Imported {result.inserted_count} {terms.customersLower} ({result.skipped_count} skipped — no name).
        </div>
      )}
      <div className="form-card">
        <label>CSV <span className="hint">(first row must be a header; allowed columns: {[...VALID_COLS].join(', ')})</span></label>
        <textarea
          rows={10}
          value={text}
          onChange={(e) => setText(e.target.value)}
          placeholder={SAMPLE}
          style={{ fontFamily: 'ui-monospace, Menlo, monospace', fontSize: 13 }}
        />
        <div className="form-actions">
          <button type="button" className="secondary" onClick={handleParse} disabled={busy || !text.trim()}>Preview</button>
          {parsed && (
            <button type="button" className="primary" onClick={handleImport} disabled={busy}>
              {busy ? 'Importing...' : `Import ${parsed.rows.length} ${parsed.rows.length === 1 ? terms.customerLower : terms.customersLower}`}
            </button>
          )}
          <button type="button" className="secondary" onClick={onCancel} disabled={busy}>Back</button>
        </div>
      </div>

      {parsed && (
        <>
          <div className="section-heading">Preview ({parsed.rows.length} {parsed.rows.length === 1 ? 'row' : 'rows'})</div>
          <div className="form-card">
            <div className="csv-preview-wrap">
              <table className="csv-preview-table">
                <thead>
                  <tr>{parsed.headers.map((h) => <th key={h}>{h}</th>)}</tr>
                </thead>
                <tbody>
                  {parsed.rows.slice(0, 50).map((row, i) => (
                    <tr key={i}>{parsed.headers.map((h) => <td key={h}>{row[h] || '—'}</td>)}</tr>
                  ))}
                </tbody>
              </table>
            </div>
            {parsed.rows.length > 50 && <p className="hint">Showing first 50 rows. All {parsed.rows.length} will be imported.</p>}
          </div>
        </>
      )}
    </div>
  );
}

function CustomerForm({ initial, onSubmit, onCancel, busy, customers = [] }) {
  const terms = useTerms();
  const [first_name, setFirst] = useState(initial?.first_name || '');
  const [last_name, setLast] = useState(initial?.last_name || '');
  const [business_name, setBusiness] = useState(initial?.business_name || '');
  const [phone, setPhone] = useState(initial?.phone || '');
  const [email, setEmail] = useState(initial?.email || '');
  const [address, setAddress] = useState(initial?.address || '');
  const [notes, setNotes] = useState(initial?.notes || '');
  const [autoInvoiceExcluded, setAutoInvoiceExcluded] = useState(!!initial?.auto_invoice_excluded);
  const [referredBy, setReferredBy] = useState(initial?.referred_by_customer_id || '');
  // Anyone but themselves, by name — the list arrives newest first.
  const referrers = useMemo(() => customers
    .filter((c) => !initial || c.id !== initial.id)
    .map((c) => ({ id: c.id, name: customerDisplayName(c) }))
    .sort((a, b) => a.name.localeCompare(b.name)), [customers, initial]);

  function submit(e) {
    e.preventDefault();
    onSubmit({ first_name, last_name, business_name, phone, email, address, notes, auto_invoice_excluded: autoInvoiceExcluded, referred_by_customer_id: referredBy || null });
  }

  return (
    <form onSubmit={submit}>
      <div className="form-grid">
        <div>
          <label>First name</label>
          <input value={first_name} onChange={(e) => setFirst(e.target.value)} />
        </div>
        <div>
          <label>Last name</label>
          <input value={last_name} onChange={(e) => setLast(e.target.value)} />
        </div>
        <div className="full">
          <label>Business name <span className="hint">(optional)</span></label>
          <input value={business_name} onChange={(e) => setBusiness(e.target.value)} />
        </div>
        <div>
          <label>Phone</label>
          <input value={phone} onChange={(e) => setPhone(e.target.value)} />
        </div>
        <div>
          <label>Email</label>
          <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} />
        </div>
        <div className="full">
          <label>Address</label>
          <textarea value={address} onChange={(e) => setAddress(e.target.value)} />
        </div>
        <div className="full">
          <label>Notes</label>
          <textarea value={notes} onChange={(e) => setNotes(e.target.value)} />
        </div>
        {referrers.length > 0 && (
          <div className="full">
            <label>Referred by <span className="hint">(optional)</span></label>
            <select value={referredBy} onChange={(e) => setReferredBy(e.target.value)}>
              <option value="">Nobody</option>
              {referrers.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <span className="hint" style={{ display: 'block', marginTop: 4 }}>
              With referral rewards on, this {terms.customerLower} earns credit each time you complete a {terms.jobLower} here.
            </span>
          </div>
        )}
        <div className="full">
          <label style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}>
            <input
              type="checkbox"
              checked={autoInvoiceExcluded}
              onChange={(e) => setAutoInvoiceExcluded(e.target.checked)}
            />
            <span>Exclude from auto-invoicing</span>
          </label>
          <span className="hint" style={{ display: 'block', marginTop: 4 }}>
            When checked, this {terms.customerLower} won't be included in the scheduled auto-invoice rollup. Use for {terms.customersLower} who prefer manual or per-visit billing.
          </span>
        </div>
      </div>
      <div className="form-actions">
        <button type="submit" className="primary" disabled={busy}>
          {busy ? 'Saving...' : (initial ? 'Save changes' : `Create ${terms.customerLower}`)}
        </button>
        <button type="button" className="secondary" onClick={onCancel} disabled={busy}>Cancel</button>
      </div>
    </form>
  );
}

function DeleteCustomerDialog({ customer, onConfirm, onCancel }) {
  const terms = useTerms();
  const name = customerDisplayName(customer);
  const [typed, setTyped] = useState('');
  const [busy, setBusy] = useState(false);
  // Forgiving about case and stray spaces — the point is intent, not a typing test.
  const norm = (v) => v.trim().replace(/\s+/g, ' ').toLowerCase();
  const matches = norm(typed) === norm(name);
  const owed = parseFloat(customer.outstanding_balance) || 0;
  const credit = parseFloat(customer.credit_balance) || 0;
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onCancel(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onCancel]);
  async function submit(e) {
    e.preventDefault();
    if (!matches || busy) return;
    setBusy(true);
    await onConfirm();
  }
  return (
    <div className="modal-overlay modal-overlay--typing" onClick={onCancel}>
      <form className="modal-card" style={{ maxWidth: 440 }} onClick={(e) => e.stopPropagation()} onSubmit={submit}>
        <div className="modal-head" style={{ marginBottom: 12 }}>
          <h3 style={{ margin: 0 }}>Delete {name}?</h3>
          <button type="button" className="modal-close" onClick={onCancel} aria-label="Close">×</button>
        </div>
        <p className="hint" style={{ marginTop: 0 }}>
          This removes the {terms.customerLower} from your lists and cannot be undone from the app.
          {(owed > 0 || credit > 0) && (
            <> They currently {owed > 0 && <>owe <strong style={{ color: 'var(--text)' }}>{formatPrice(owed)}</strong></>}{owed > 0 && credit > 0 && ' and '}{credit > 0 && <>have <strong style={{ color: 'var(--text)' }}>{formatPrice(credit)}</strong> in credit</>}.</>
          )}
        </p>
        <label htmlFor="delete-customer-confirm">Type <strong>{name}</strong> to confirm</label>
        <input
          id="delete-customer-confirm" autoFocus autoComplete="off" spellCheck={false}
          value={typed} onChange={(e) => setTyped(e.target.value)} placeholder={name}
        />
        <div className="form-actions">
          <button type="submit" className="danger" disabled={!matches || busy}>
            {busy ? 'Deleting...' : `Delete ${terms.customerLower}`}
          </button>
          <button type="button" className="secondary" onClick={onCancel} disabled={busy}>Cancel</button>
        </div>
      </form>
    </div>
  );
}

function CustomersView({ session, planContext, features = {} }) {
  const terms = useTerms();
  // Declared with the other hooks: this view returns early for its form modes,
  // and a hook below one of those changes the hook order between renders.
  const wideToolbar = useMediaQuery('(min-width: 681px)');
  const atCap = planContext && planContext.atCap;
  const [customers, setCustomers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [mode, setMode] = useState('list');
  const [editing, setEditing] = useState(null);
  const [viewing, setViewing] = useState(null);
  const [search, setSearch] = useState('');
  const [sort, setSort] = useState('name');
  const [busy, setBusy] = useState(false);

  const canMutate = ['admin', 'lead'].includes(session.user.role);

  function exportCustomers() {
    const headers = ['first_name', 'last_name', 'business_name', 'phone', 'email', 'address', 'notes'];
    const rows = customers.map((c) => headers.map((h) => c[h]));
    downloadCSV(`customers-${formatYMD(new Date())}.csv`, headers, rows);
  }

  const refresh = useCallback(async () => {
    setLoading(true);
    setError(null);
    try {
      const data = await apiRequest('/api/customers', { slug: session.slug, token: session.token });
      setCustomers(data);
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  }, [session.slug, session.token]);

  useEffect(() => { refresh(); }, [refresh]);

  // Jump straight to one customer's page — from a row on their referrer's
  // Referrals tab, or from /customers?open=<id> (the Referrals screen).
  const openCustomer = useCallback((id) => {
    const c = customers.find((x) => x.id === id);
    if (!c) return;
    setError(null); setViewing(c); setMode('detail');
    window.scrollTo(0, 0);
  }, [customers]);
  // Onboarding hands off to /customers?new=1 or ?import=1.
  useEffect(() => {
    const q = new URLSearchParams(window.location.search);
    const want = q.get('new') ? 'create' : q.get('import') ? 'import' : null;
    if (!want) return;
    window.history.replaceState(null, '', window.location.pathname);
    setError(null); setMode(want);
  }, []);
  useEffect(() => {
    if (customers.length === 0) return;
    const id = new URLSearchParams(window.location.search).get('open');
    if (!id) return;
    window.history.replaceState(null, '', window.location.pathname);
    openCustomer(id);
  }, [customers, openCustomer]);

  async function createCustomer(values) {
    setBusy(true); setError(null);
    try {
      await apiRequest('/api/customers', {
        method: 'POST', slug: session.slug, token: session.token, body: values,
      });
      setMode('list');
      await refresh();
    } catch (err) { setError(err); }
    finally { setBusy(false); }
  }

  async function updateCustomer(values) {
    setBusy(true); setError(null);
    try {
      await apiRequest(`/api/customers/${editing.id}`, {
        method: 'PUT', slug: session.slug, token: session.token, body: values,
      });
      setEditing(null);
      setMode('list');
      await refresh();
    } catch (err) { setError(err); }
    finally { setBusy(false); }
  }

  // Deleting asks for the name to be typed. A confirm() is one reflexive tap
  // away from the row's other menu items; this is not.
  const [deleting, setDeleting] = useState(null);
  async function deleteCustomer(id) {
    setError(null);
    try {
      await apiRequest(`/api/customers/${id}`, {
        method: 'DELETE', slug: session.slug, token: session.token,
      });
      setDeleting(null);
      await refresh();
    } catch (err) { setDeleting(null); setError(err); }
  }

  if (mode === 'create') {
    return (
      <div>
        <BackLink onClick={() => { setError(null); setMode('list'); }}>All {terms.customersLower}</BackLink>
        <div className="page-header"><h2>New {terms.customerLower}</h2></div>
        <PlanError error={error} session={session} />
        <div className="form-card">
          <CustomerForm customers={features.referrals ? customers : []} onSubmit={createCustomer} onCancel={() => { setError(null); setMode('list'); }} busy={busy} />
        </div>
      </div>
    );
  }

  if (mode === 'edit' && editing) {
    return (
      <div>
        <BackLink onClick={() => { setError(null); setEditing(null); setMode('list'); }}>All {terms.customersLower}</BackLink>
        <div className="page-header"><h2>Edit {terms.customerLower}</h2></div>
        <PlanError error={error} session={session} />
        <div className="form-card">
          <CustomerForm
            initial={editing}
            customers={features.referrals ? customers : []}
            onSubmit={updateCustomer}
            onCancel={() => { setError(null); setEditing(null); setMode('list'); }}
            busy={busy}
          />
        </div>
      </div>
    );
  }

  if (mode === 'detail' && viewing) {
    return (
      <CustomerDetailView
        key={viewing.id}
        session={session}
        customer={viewing}
        canMutate={canMutate}
        showReferrals={!!features.referrals}
        onOpenCustomer={openCustomer}
        onBack={() => { setViewing(null); setMode('list'); }}
        onEdit={(c) => { setEditing(c); setMode('edit'); }}
      />
    );
  }

  if (mode === 'import') {
    return (
      <CsvImportView
        session={session}
        onDone={async () => { await refresh(); }}
        onCancel={() => { setError(null); setMode('list'); }}
      />
    );
  }

  const filtered = customers.filter((c) => searchMatches(
    search,
    c.first_name, c.last_name, c.business_name, c.phone, c.email, c.address
  ));
  const sortKey = sort === 'name'
    ? (c) => (c.business_name || `${c.last_name || ''} ${c.first_name || ''}`).toLowerCase()
    : 'created_at';
  const sorted = sortBy(filtered, sortKey, sort === 'oldest' ? 'asc' : sort === 'name' ? 'asc' : 'desc');
  const owedTotal = customers.reduce((sum, c) => sum + (parseFloat(c.outstanding_balance) || 0), 0);

  return (
    <div>
      {deleting && (
        <DeleteCustomerDialog
          customer={deleting}
          onConfirm={() => deleteCustomer(deleting.id)}
          onCancel={() => setDeleting(null)}
        />
      )}
      <div className="toolbar">
        <span className="tb-title">
          <h2>{terms.customers}</h2>
          <span className="tb-count">
            {customers.length} total{owedTotal > 0 && <> &middot; <b>{formatPrice(owedTotal)}</b> owed</>}
          </span>
        </span>
        <span className="tb-gap"></span>
        <input
          type="search"
          className="tb-search"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder={`Search name, phone, email...`}
        />
        {wideToolbar && (
          <select value={sort} onChange={(e) => setSort(e.target.value)} aria-label={`Sort ${terms.customersLower}`}>
            <option value="name">Name</option>
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
          </select>
        )}
        {/* The button and its overflow menu wrap as one item. Left loose they
            broke apart, stranding the menu alone on the next line at the far
            left — where a right-anchored panel opens off the side. */}
        <span className="tb-actions">
          {canMutate && (
            <button className="primary" onClick={() => { setError(null); setMode('create'); }} disabled={atCap}>
              +<span className="btn-label"> New<span className="hide-on-mobile"> {terms.customerLower}</span></span>
            </button>
          )}
          {/* Import and export are things you do to the list once in a while,
              not every visit — they don't need to sit in front of it. */}
          <RowMenu
            label={`More ${terms.customerLower} actions`}
            items={[
              ...(canMutate && !atCap ? [{ label: 'Import from CSV', onClick: () => { setError(null); setMode('import'); } }] : []),
              ...(customers.length > 0 ? [{ label: 'Export all as CSV', onClick: exportCustomers }] : []),
              ...(wideToolbar ? [] : sortMenuItems(sort, setSort, [
                { value: 'name', label: 'Name' },
                { value: 'newest', label: 'Newest' },
                { value: 'oldest', label: 'Oldest' },
              ])),
            ]}
          />
        </span>
      </div>
      {planContext && planContext.isFree && planContext.atCap && (
        <UpgradePrompt session={session} used={planContext.used} limit={planContext.limit} resource={terms.customersLower} />
      )}
      <PlanError error={error} session={session} />
      <div className="dtable">
        {!loading && sorted.length > 0 && (
          <div className="dtable-row dtable-head cust-row" aria-hidden="true">
            <span>Name</span><span className="c-where">Address</span>
            <span className="c-phone">Phone</span><span className="c-email">Email</span>
            <span style={{ textAlign: 'right' }}>Balance</span><span></span>
          </div>
        )}
        {loading ? (
          <div className="list-empty">Loading...</div>
        ) : sorted.length === 0 ? (
          customers.length === 0 ? (
            <EmptyState
              icon="customers"
              title={`Add your first ${terms.customerLower}`}
              body={canMutate
                ? `Bring people in by hand, paste a CSV, or accept a booking request. Once you've got at least one, you can schedule ${terms.jobsLower} and send invoices.`
                : `Ask an admin to add ${terms.customersLower} so you can start working.`
              }
              action={canMutate && (
                <>
                  <button className="primary" disabled={atCap} onClick={() => { setError(null); setMode('create'); }}>+ New {terms.customerLower}</button>
                  <button className="secondary" disabled={atCap} onClick={() => { setError(null); setMode('import'); }}>Import CSV</button>
                </>
              )}
            />
          ) : (
            <div className="list-empty">No {terms.customersLower} match this search.</div>
          )
        ) : (
          sorted.map((c) => {
            const balance = parseFloat(c.outstanding_balance) || 0;
            return (
              <div
                key={c.id}
                className="dtable-row cust-row is-clickable"
                role="button"
                tabIndex={0}
                onClick={() => { setViewing(c); setMode('detail'); }}
                onKeyDown={(e) => {
                  if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    setViewing(c); setMode('detail');
                  }
                }}
              >
                <span className="c-main">
                  <div className="t">{customerDisplayName(c)}</div>
                </span>
                <span className="c-when c-where" title={c.address || undefined}>
                  {c.address ? addressLines(c.address)[0] : '—'}
                </span>
                <span className="c-when c-phone">{c.phone || '—'}</span>
                <span className="c-when c-email" style={{ overflow: 'hidden', textOverflow: 'ellipsis' }}>{c.email || '—'}</span>
                <span className={`c-amt${balance > 0 ? ' c-owes' : ''}`}>
                  {balance > 0 ? formatPrice(balance) : ''}
                </span>
                {/* The row opens the customer, so View is gone — it would be a
                    button that does what clicking anywhere already does. The
                    rest are things the row click is not. */}

function JobForm({ initial, customers, users, onSubmit, onCancel, busy }) {
  const terms = useTerms();
  const [customer_id, setCustomerId] = useState(initial?.customer_id || (customers[0]?.id || ''));
  const [title, setTitle] = useState(initial?.title || '');
  const [description, setDescription] = useState(initial?.description || '');
  const [type, setType] = useState(initial?.type || 'single');
  const [date, setDate] = useState(initial?.date || '');
  const [start_date, setStartDate] = useState(initial?.start_date || '');
  const [end_date, setEndDate] = useState(initial?.end_date || '');
  const [recurrence_pattern, setPattern] = useState(initial?.recurrence_pattern || 'weekly');
  const [default_price, setPrice] = useState(initial?.default_price ?? '');
  const [assigned_to, setAssigned] = useState(initial?.assigned_to || []);
  const [start_time, setStartTime] = useState((initial?.start_time || '').slice(0, 5));
  const [duration_minutes, setDuration] = useState(initial?.duration_minutes ?? '');

  function toggleAssigned(userId) {
    setAssigned((a) => a.includes(userId) ? a.filter((x) => x !== userId) : [...a, userId]);
  }

  function submit(e) {
    e.preventDefault();
    const payload = {
      customer_id,
      title,
      description: description || null,
      type,
      default_price: default_price === '' ? null : Number(default_price),
      assigned_to,
      start_time: start_time || null,
      duration_minutes: duration_minutes === '' ? null : parseInt(duration_minutes, 10) || null,
    };
    if (type === 'single') {
      payload.date = date;
    } else {
      payload.start_date = start_date;
      payload.end_date = end_date || null;
      payload.recurrence_pattern = recurrence_pattern;
    }
    onSubmit(payload);
  }

  return (
    <form onSubmit={submit}>
      <div className="form-grid">
        <div className="full">
          <label>{terms.customer}</label>
          <select value={customer_id} onChange={(e) => setCustomerId(e.target.value)} required>
            {customers.length === 0 && <option value="">No {terms.customersLower} yet — add one first</option>}
            {customers.map((c) => (
              <option key={c.id} value={c.id}>{customerDisplayName(c)}</option>
            ))}
          </select>
        </div>
        <div className="full">
          <label>Title</label>
          <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Weekly mow, deep clean, etc." required />
        </div>
        <div className="full">
          <label>Description <span className="hint">(optional)</span></label>
          <textarea value={description} onChange={(e) => setDescription(e.target.value)} />
        </div>
        <div className="full">
          <label>Schedule</label>
          <div className="toggle-group">
            <button type="button" className={type === 'single' ? 'active' : ''} onClick={() => setType('single')}>One-time</button>
            <button type="button" className={type === 'recurring' ? 'active' : ''} onClick={() => setType('recurring')}>Recurring</button>
          </div>
        </div>
        {type === 'single' ? (
          <div className="full">
            <label>Date</label>
            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} required />
          </div>
        ) : (
          <>
            <div>
              <label>Repeats</label>
              <select value={recurrence_pattern} onChange={(e) => setPattern(e.target.value)}>
                <option value="weekly">Weekly</option>
                <option value="biweekly">Bi-weekly (every 2 weeks)</option>
                <option value="monthly">Monthly</option>
              </select>
            </div>
            <div></div>
            <div>
              <label>Start date</label>
              <input type="date" value={start_date} onChange={(e) => setStartDate(e.target.value)} required />
            </div>
            <div>
              <label>End date <span className="hint">(optional)</span></label>
              <input type="date" value={end_date} onChange={(e) => setEndDate(e.target.value)} />
            </div>
          </>
        )}
        <div>
          <label>Start time <span className="hint">(optional)</span></label>
          <input type="time" value={start_time} onChange={(e) => setStartTime(e.target.value)} />
        </div>
        <div>
          <label>Duration <span className="hint">(minutes, optional)</span></label>
          <input
            type="number" min="0" step="15"
            value={duration_minutes}
            onChange={(e) => setDuration(e.target.value)}
            placeholder="e.g. 60"
            disabled={!start_time}
          />
          {start_time && duration_minutes && (
            <div className="hint" style={{ marginTop: 4 }}>
              {formatTimeRange(start_time, duration_minutes)} ({formatDuration(duration_minutes)})
            </div>
          )}
        </div>
        <div>
          <label>Default price <span className="hint">(optional)</span></label>
          <input type="number" step="0.01" min="0" value={default_price} onChange={(e) => setPrice(e.target.value)} placeholder="0.00" />
        </div>
        <div className="full">
          <label>Assigned to <span className="hint">(optional)</span></label>
          <div className="check-list">
            {users.length === 0 && <span className="hint">No teammates to assign yet.</span>}
            {users.map((u) => (
              <label key={u.id} className={assigned_to.includes(u.id) ? 'checked' : ''}>
                <input
                  type="checkbox"
                  checked={assigned_to.includes(u.id)}
                  onChange={() => toggleAssigned(u.id)}

            ))}
          </div>
        </div>
      </div>
      <div className="form-actions">
        <button type="submit" className="primary" disabled={busy}>
          {busy ? 'Saving...' : (initial ? 'Save changes' : `Create ${terms.jobLower}`)}
        </button>
        <button type="button" className="secondary" onClick={onCancel} disabled={busy}>Cancel</button>
      </div>
    </form>
  );
}

function RequestsView({ session }) {
  const terms = useTerms();
  const [requests, setRequests] = useState([]);
  const [filter, setFilter] = useState('pending');
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);
  const [decliningId, setDecliningId] = useState(null);
  const [declineReason, setDeclineReason] = useState('');
  const [showQr, setShowQr] = useState(false);
  const [showEmbed, setShowEmbed] = useState(false);

  const canMutate = ['admin', 'lead'].includes(session.user.role);

  const refresh = useCallback(async () => {
    setLoading(true); setError(null);
    try {
      const data = await apiRequest(`/api/booking-requests?status=${filter}`, {
        slug: session.slug, token: session.token,
      });
      setRequests(data);
    } catch (err) { setError(err.message); }
    finally { setLoading(false); }
  }, [session.slug, session.token, filter]);

  useEffect(() => { refresh(); }, [refresh]);

  async function accept(id) {
    if (!confirm(`Accept this request? This will create a draft quote with the prospect's info — you can convert them to a ${terms.customerLower} later.`)) return;
    setBusy(true); setError(null);
    try {
      await apiRequest(`/api/booking-requests/${id}/accept`, {

      });
      await refresh();
    } catch (err) { setError(err); }
    finally { setBusy(false); }
